# Regression scenarios reconstructed from a REAL recorded Ranked match (tools/eval_real.py).
#
# Source: data/calibration/2026-11-06_005400/auto (353 frames, 3440x1440, named HHMMSS_NNNN).
# Chalet, Ranked, won 4-1. Player: dmhost88. Rounds 1-3 attack, role swap, rounds 4-5 defense.
#
# How this was built: every frame was replayed through r6coach.hud.HudReader (timer, score,
# room, banners, BOMBS FOUND site, N VS M, killfeed). Then each fact below was checked by eye
# on contact sheets and crops: operator cards on the READY tab, ban icons under the top bar,
# the BOMB SITES list on the ban screen, the kill-cam cards (killer operator and weapon) and the
# enemy operator icons on the top bar. Operator icons that could not be identified with
# confidence are left out rather than guessed. Fields the HUD did not read exactly (the timer at
# the round 5 death fell between two frames) are marked "approx".
#
# Rounds hold the ground truth. Scenarios are the decision points: the GameState at that moment,
# which coach method runs, and which frame is attached as the screenshot (ban, pick and death
# attach one, exactly where the live coach would). Match history for a scenario is built from the
# rounds before it (for between_rounds, including the round that just ended), replayed into
# MatchMemory as bus events.

