map: lair
briefs:
  # ---------------------------------------------------------------- 2F Master Office / R6 Room
  - id: lair-master-team-walls
    site: master_office_r6_room
    side: defense
    operators: []
    title: "Reinforce all four Mask walls"
    text: >-
      Reinforce both inner and both outer Mask Room walls; older guides left one soft, current setups don't. Then the
      left Operations panel, both Bathroom walls toward Main Stairs and the right R6 Room to Storage panel. Keep the
      Display to Server rotate open.
    placements:
      - kind: reinforce
        floor: 2F
        between: [Mask Room, Master Office]
        nudge: [-1.0, 0]
        note: "Inner Mask walls, both"
      - kind: reinforce
        floor: 2F
        between: [Operations, Mask Room]
        note: "Outer Mask walls, both"
      - kind: reinforce
        floor: 2F
        room: Bathroom
        note: "Both walls toward Main Stairs"
      - kind: reinforce
        floor: 2F
        between: [R6 Room, Storage]
        note: "Right panel"
      - kind: open
        floor: 2F
        between: [Display, Server]
        note: "Display to Server rotate"
  - id: lair-master-bandit-masks
    site: master_office_r6_room
    side: defense
    operators: [Bandit]
    title: "Batteries on the inner Mask walls"
    text: >-
      Put batteries on both inner Mask Room walls into Master Office and C4 Operations. Re-check after a Thatcher EMP;
      batteries are back about 15 seconds later.
    placements:
      - kind: bandit
        floor: 2F
        between: [Mask Room, Master Office]
        nudge: [-1.2, 0]
        note: "Inner Mask wall 1"
      - kind: bandit
        floor: 2F
        between: [Mask Room, Master Office]
        nudge: [1.2, 0]
        note: "Inner Mask wall 2"
  - id: lair-master-mira-masks
    site: master_office_r6_room
    side: defense
    operators: [Mira]
    title: "Mira windows on Masks"
    text: >-
      Mira window on the reinforced Operations to Masks wall so the anchor watches Mask Room without peeking. A second
      window on the Server to Display wall is also common.
    placements:
      - kind: mira
        floor: 2F
        between: [Operations, Mask Room]
        nudge: [0, 1.0]
        note: "Operations-Masks wall"
      - kind: mira
        floor: 2F
        between: [Server, Display]
        note: "Server-Display wall (often)"
  # Attack briefs on this map follow Garfieldisdoc, "How to Attack EVERY Bombsite in Rainbow Six Siege
  # (2026)", https://www.youtube.com/watch?v=1qCEYZwQzes (Lair from 2:53:30).
  - id: lair-master-attack-masks
    site: master_office_r6_room
    side: attack
    operators: [Thermite, Thatcher, Gridlock, Brava]
    title: "Default: Skybridge entry, main wall, Operational push"
    text: >-
      Put a drone on Skybridge in prep and have the entry sit on it; Gridlock can Trax the stairs, Green stairs and
      Skybridge. The hard breach and Thatcher work the main wall from Mezzanine while one or two push Operational,
      clear its utility and push top Mez and the Operational double door back; open the second wall only if they
      reinforce the double. Plant in Master Office, and send one player down to Range to stop the C4 and pinch top Mez.
    placements:
      - kind: drone
        floor: 2F
        at: [61.5, 50.5]
        name: "Skybridge"
        note: "Pre-placed drone; the entry sits on it"
      - kind: thermite
        floor: 2F
        between: [Mezzanine, Master Office]
        note: "The main wall; Thatcher clears it first"
      - kind: entry
        floor: 2F
        room: Operations
        note: "Push top Mez and the Operational double door back"
      - kind: plant
        floor: 2F
        room: Master Office
        note: "Right inside the breach"
      - kind: entry
        floor: 1F
        room: Range
        note: "Take Range so nobody C4s from Weapons below"
  - id: lair-master-attack-ace
    site: master_office_r6_room
    side: attack
    operators: [Gridlock, Ace]
    title: "Flip to R6 Room and the Storage wall"
    text: >-
      If the breacher dies or Operational still has head holes, flip the push. The Gridlock watching the windows
      drones R6 Room and, if it's a gap with little utility, crouch-walks up to pick the people on site. Open the
      Storage wall to cut every line of sight and fight your way to a plant in R6 Room.
    placements:
      - kind: drone
        floor: 2F
        room: R6 Room
        note: "Check for a gap with little utility"
      - kind: ace
        floor: 2F
        between: [R6 Room, Storage]
        note: "Storage wall: cuts the lines of sight"
      - kind: plant
        floor: 2F
        room: R6 Room
        note: "Fight through for an easy plant"
  # ---------------------------------------------------------------- 1F Bunks / Briefing
  - id: lair-bunks-team-walls
    site: bunks_briefing
    side: defense
    operators: []
    title: "Shut Security Terrace, keep the R6 hatch open"
    text: >-
      Reinforce the Security Terrace outside wall and the Briefing wall at the bottom of Yellow. Keep the high
      Bunks/Briefing rotate and the R6 Room hatch open so the players on 2F can deny every plant from above.
    placements:
      - kind: reinforce
        floor: 1F
        between: [Security Terrace, exterior]
        edge: left
        note: "Security Terrace outside wall"
      - kind: open
        floor: 1F
        between: [Briefing, Bunks]
        note: "High crouch rotate with head holes"
      - kind: open
        floor: 2F
        at: [55.9, 58.6]
        name: "R6 Room hatch"
        note: "Keep it open for the vert players"
      - kind: anchor
        floor: 2F
        room: R6 Room
        note: "Deny plants through the floor"
  - id: lair-bunks-kaid-terrace
    site: bunks_briefing
    side: defense
    operators: [Kaid]
    title: "Claw the terrace breach"
    text: >-
      Claw the Security Terrace outside wall and the Briefing side, then anchor the rotate between Bunks and Briefing.
    placements:
      - kind: kaid
        floor: 1F
        between: [Security Terrace, exterior]
        edge: left
        nudge: [0.8, -1.0]
      - kind: kaid
        floor: 1F
        between: [Security Terrace, Briefing]
        note: "Briefing side (usually)"
      - kind: anchor
        floor: 1F
        between: [Briefing, Bunks]
        nudge: [0, 1.5]
  - id: lair-bunks-attack-topdown
    site: bunks_briefing
    side: attack
    operators: [Buck, Sledge, Nomad]
    title: "Top-down clear: R6 balcony, Display, Operational"
    text: >-
      When they make vertical from above, collapse on them. Open the Green window early for phantom pressure; one player
      comes over to the R6 Room balcony to drone and work vertical, one pushes the Display window to hold crosses, and
      two push from Operational to clear Master Office and Masks. Then open the hatch, play the vertical with the main
      wall open, and jump the Green window to collapse on site.
    placements:
      - kind: entry
        floor: 2F
        at: [51.0, 47.0]
        name: "R6 Room balcony"
        note: "Drone it out, then work vertical"
      - kind: entry
        floor: 2F
        room: Display
        note: "Display window: hold anyone leaving or rotating"
      - kind: entry
        floor: 2F
        room: Operations
        note: "Two push here to clear Master Office and Masks"
      - kind: breach
        floor: 2F
        at: [55.9, 58.6]
        name: "R6 Room hatch"
        note: "Open it, then play vertical on site"
      - kind: entry
        floor: 1F
        between: [Bunks, exterior]
        edge: right
        note: "Green window: opened early, jump in late"
  - id: lair-bunks-attack-terrace
    site: bunks_briefing
    side: attack
    operators: [Thermite, Thatcher]
    title: "Main Briefing wall, take Security and top Yellow"
    text: >-
      Work the main Briefing wall from Security Terrace. They extend a lot, so take Security and clear top Yellow with a
      teammate pushing Lobby to pinch whoever plays Security or Yellow back onto site. If needed, open the Security wall
      as well to collapse on anyone rotating between the rooms, then plant.
    placements:
      - kind: thermite
        floor: 1F
        between: [Security Terrace, exterior]
        edge: left
        note: "The main Briefing wall"
      - kind: entry
        floor: 1F
        room: Lobby
        note: "Pinch Security and top Yellow"
      - kind: breach
        floor: 1F
        between: [Security, Bunks]
        note: "Security wall, if you need to collapse on the rotate"
      - kind: plant
        floor: 1F
        room: Briefing
        note: "Inside the main breach"
  # ---------------------------------------------------------------- 1F Armory / Weapon Maintenance
  - id: lair-armory-team-walls
    site: armory_weapon_maintenance
    side: defense
    operators: []
    title: "Middle triple-wall panel and the Operations hatch"
    text: >-
      Reinforce the middle panel of the Armory/Weapon Maintenance triple wall and cut head holes in the left one.
      Reinforce the Operations hatch, one Range Exit panel and the left Medical panel.
    placements:
      - kind: reinforce
        floor: 1F
        between: [Armory, Weapon Maintenance]
        note: "Middle panel; head holes in the left one"
      - kind: hatch
        floor: 2F
        at: [61.9, 58.4]
        name: "Operations hatch"
      - kind: reinforce
        floor: 1F
        room: Range
        nudge: [0, -8.0]
        note: "Range Exit wall, one panel"
      - kind: reinforce
        floor: 1F
        between: [Medical, Armory Hall]
        note: "Medical wall, left panel"
  - id: lair-armory-above
    site: armory_weapon_maintenance
    side: defense
    operators: [Azami, Denari]
    title: "Two above in Operations and Mezzanine"
    text: >-
      Two players deny plants from Operations and Mezzanine through floor holes while three crossfire Range below.
      Denari tripwires the Rocket side.
    placements:
      - kind: anchor
        floor: 2F
        room: Operations
      - kind: anchor
        floor: 2F
        room: Mezzanine
      - kind: trap
        floor: 2F
        room: Mezzanine
        nudge: [2.0, 0]
        note: "Tripwires on the Rocket stairs side"
  - id: lair-armory-attack-range
    site: armory_weapon_maintenance
    side: attack
    operators: [Thermite, Gridlock, Ying]
    title: "Range Booth entry, Range Exit wall, tucked plant"
    text: >-
      Enter through Range Booth with a cam pre-placed, and open the Range Exit wall. Plant tucked on the hard wall, in
      front of the breach, or vault onto the table; don't plant by the rotate, they will cut you off, so smoke it. One
      player comes down Missile stairs and Gridlocks the flanks while one plays vertical.
    placements:
      - kind: entry
        floor: 1F
        room: Range
        note: "Through Range Booth with a pre-placed cam"
      - kind: thermite
        floor: 1F
        room: Range
        nudge: [0, -8.0]
        note: "The Range Exit wall"
      - kind: anchor
        floor: 1F
        room: Lobby
        note: "Missile stairs: Gridlock off the flanks and watch"
      - kind: plant
        floor: 1F
        room: Weapon Maintenance
        nudge: [1.0, 0]
        note: "Tucked on the hard wall, or on the table"
  - id: lair-armory-attack-hibana
    site: armory_weapon_maintenance
    side: attack
    operators: [Buck, Fuse, Gridlock, Nomad]
    title: "Vertical control from OP and Mask"
    text: >-
      Get vertical control: someone goes through OP and someone opens up the Mask area to fight the top Mez player, with
      cut-off cams for anyone coming upstairs. Open the hatch and make vertical on the site door. Trax the hallway and
      take top Missile to cut off Lobby, or Nomad airjabs the top Yellow door to cut the rotate.
    placements:
      - kind: entry
        floor: 2F
        room: Operations
        note: "Through OP; fight top Mez"
      - kind: breach
        floor: 2F
        at: [61.9, 58.4]
        name: "Operations hatch"
        note: "Open it, then vertical on the site door"
      - kind: anchor
        floor: 2F
        room: Mezzanine
        note: "Gridlock the hallway, take top Missile"
      - kind: plant
        floor: 1F
        room: Weapon Maintenance
        note: "Behind smokes once the vertical cuts them off"
  # ---------------------------------------------------------------- B Lab / Lab Support
  - id: lair-lab-team-walls
    site: lab_lab_support
    side: defense
    operators: []
    title: "Lab/Lockers wall, Missile wall, 1F hatches"
    text: >-
      Reinforce the Lab/Lockers site wall, the Missile wall, one Lab Exit panel and the Lockers-door panel. Reinforce
      the hatches above the Lab from 1F; the Lab Exit rotate stays open.
    placements:
      - kind: reinforce
        floor: B
        between: [Lab, Lockers]
      - kind: reinforce
        floor: B
        between: [Missile, Electrical]
        note: "Missile wall"
      - kind: reinforce
        floor: B
        between: [Lab Exit, Lab]
        nudge: [-1.0, 0]
        note: "One panel"
      - kind: open
        floor: B
        between: [Lab Exit, Lab]
        nudge: [1.0, 0]
        note: "Lab Exit rotate"
      - kind: hatch
        floor: 1F
        at: [58.2, 61.8]
        name: "Armory hatch"
      - kind: hatch
        floor: 1F
        at: [55.9, 56.2]
        name: "1F hatch into B"
        note: "Reception or Lobby hatch (name not verified)"
  - id: lair-lab-kaid-missile
    site: lab_lab_support
    side: defense
    operators: [Kaid]
    title: "Claw the Missile wall"
    text: >-
      Claw the Missile wall so Thermite needs a Kali lance first, then play long Lockers angles.
    placements:
      - kind: kaid
        floor: B
        between: [Missile, Electrical]
        nudge: [-1.0, 0]
      - kind: anchor
        floor: B
        room: Lockers
  - id: lair-lab-attack-filtration
    site: lab_lab_support
    side: attack
    operators: [Striker, Zofia, Ram]
    title: "Vertical Filtration take"
    text: >-
      Pre-place a cam in Range and sit on it to take that space; a five-stack also puts a cut-off cam upstairs in the
      90. Bring hard breach that can make vertical and open the Armory hatch and the main Lobby hatch; skip the
      vulnerable Reception hatch. Make all the vertical you can to cut the rotate, the site door and the main rotate,
      open the Filtration wall for a line on Closet if you're five, then plant from Filtration.
    placements:
      - kind: drone
        floor: 1F
        room: Range
        note: "Pre-placed cam; take this space"
      - kind: breach
        floor: 1F
        at: [58.2, 61.8]
        name: "Armory hatch"
        note: "Open it for vertical"
      - kind: breach
        floor: 1F
        at: [55.9, 56.2]
        name: "Main Lobby hatch"
        note: "Open it; avoid the Reception hatch"
      - kind: breach
        floor: B
        at: [66.0, 63.0]
        name: "Filtration wall"
        note: "Five-man only: a line on Closet while you plant"
      - kind: plant
        floor: B
        room: Lab Support
        note: "From Filtration once the vertical has them cut off"
  - id: lair-lab-attack-missile
    site: lab_lab_support
    side: attack
    operators: [Thermite, Gridlock, Nomad]
    title: "Warehouse take: Missile door, Lockers wall"
    text: >-
      Start Barrels or Lockers, try to bang someone through the Barrels window and drone the area. The team opens the
      Warehouse wall, drones from the single door, then opens the single Missile wall to push the hallway player back to
      site; Gridlock or Nomad covers the staircase. Thermite opens the Lockers wall so you walk in and plant in front
      of the breach, and a top-floor player bangs the long angle onto the Lockers door from Storage.
    placements:
      - kind: entry
        floor: B
        room: Garage
        note: "Barrels window: bang through, drone the area"
      - kind: breach
        floor: B
        room: Warehouse
        note: "Warehouse wall, then drone from the single door"
      - kind: breach
        floor: B
        between: [Missile, Electrical]
        note: "Single Missile wall: push the hallway back"
      - kind: thermite
        floor: B
        between: [Lab, Lockers]
        note: "The Lockers wall; big hole, no vault noise"
      - kind: plant
        floor: B
        room: Lab
        nudge: [0, 3.0]
        note: "In front of the breach"
      - kind: anchor
        floor: 2F
        room: Storage
        note: "Bang the long angle onto the Lockers door"
