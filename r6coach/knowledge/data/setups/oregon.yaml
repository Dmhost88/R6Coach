# Standard setup briefs for Oregon. See README.md in this folder for the format.
# Positions: room boxes from layout/oregon.yaml where they fit; `at` points read off Ubisoft's
# blueprints (data/maps/oregon/, which date from 2020). Where the layout can't pin a named wall,
# the icon sits in the room it belongs to and the note names the wall. "Usually" in a note marks a
# common spot not verified on the current (2026) map version.
map: oregon
briefs:
  # ---------------------------------------------------------------- 2F Kids' Dorms / Dorms Main Hall
  - id: oregon-dorms-team-reinforcements
    site: kids_dorms_dorms_main_hall
    side: defense
    operators: []
    title: "Dorms: deny Master and Attic"
    text: >-
      Reinforce both halves of the Master breach wall, the left side of the Armory wall, both Attic
      walls facing Big Tower and the Master/Attic wall. Keep the Kids' Dorms rotate and its feet
      holes toward Big Window.
    placements:
      - kind: reinforce
        floor: 2F
        room: Master Bedroom
        note: "Master breach wall into Dorms, both halves"
      - kind: reinforce
        floor: 2F
        between: [Armory, Dorms Main Hall]
        note: "Armory wall, left side"
      - kind: reinforce
        floor: 2F
        room: Attic
        nudge: [0, -6.0]
        note: "Both Attic walls facing Big Tower"
      - kind: open
        floor: 2F
        between: [Kids' Dorms, Trophy Room]
        note: "Kids' Dorms rotate and feet holes"
      - kind: hatch
        floor: 2F
        at: [40.9, 54.2]
        name: "Kids hatch"
        note: "Team call: reinforce it, or leave it soft as a drop"
  - id: oregon-dorms-kaid-master
    site: kids_dorms_dorms_main_hall
    side: defense
    operators: [Kaid, Bandit]
    title: "Claw the Master breach wall"
    text: >-
      Claws on the Master breach wall, then the Attic walls. If they bring Thatcher or Kali, re-claw
      or switch to Bandit batteries after the disruptor.
    placements:
      - kind: kaid
        floor: 2F
        room: Master Bedroom
        nudge: [1.2, 0]
        note: "Master breach wall, low"
      - kind: kaid
        floor: 2F
        room: Attic
        nudge: [1.2, -6.0]
        note: "Attic walls"
  - id: oregon-dorms-mira-azami
    site: kids_dorms_dorms_main_hall
    side: defense
    operators: [Mira, Azami, Thorn]
    title: "Window onto the plant, close Big Window"
    text: >-
      Mira on the Dorms Main Hall wall facing Kids' Dorms watches the default plant. Azami closes the
      Kids-Trophy and Big Window lines, and Thorn blooms Big Window, White Stairs and the Trophy door.
    placements:
      - kind: mira
        floor: 2F
        between: [Kids' Dorms, Dorms Main Hall]
        note: "Dorms Main Hall side"
      - kind: deployable
        floor: 2F
        between: [Kids' Dorms, exterior]
        edge: left
        note: "Azami barrier on the Big Window line"
      - kind: trap
        floor: 2F
        between: [Kids' Dorms, Trophy Room]
        nudge: [0, 2.0]
        note: "Thorn bloom by the Trophy door"
  # Attack briefs on this map follow Garfieldisdoc, "How to Attack EVERY Bombsite in Rainbow Six Siege
  # (2026)", https://www.youtube.com/watch?v=1qCEYZwQzes (Oregon from 3:24:49).
  - id: oregon-dorms-attack-big-tower-master
    site: kids_dorms_dorms_main_hall
    side: attack
    operators: [Thermite, Ying, Gridlock]
    title: "Attic and Master split"
    text: >-
      Split Attic and Master. Get a cut-off cam on Tower, make sure it's empty, and open the Attic wall from
      Tower. Master needs two: one rappels Armory and clears extenders up to the head hole, the hard breacher
      opens the main Master wall from the Master balcony. Nade or Ying the drop and Bolo on the dresser, hold the
      cut-off, then the main-breach player flashes in and runs to default.
    placements:
      - kind: breach
        floor: 2F
        between: [Small Tower, Attic]
        note: "Attic wall from Tower after the cut-off cam (the HUD calls this tower Big Tower)"
      - kind: entry
        floor: 2F
        between: [Armory, exterior]
        edge: bottom
        note: "Armory rappel: clear extenders, mind the head hole"
      - kind: thermite
        floor: 2F
        room: Master Bedroom
        nudge: [-2.0, 0]
        note: "Main Master wall, from the Master balcony"
      - kind: plant
        floor: 2F
        at: [54.0, 59.0]
        name: "Game Room default"
        note: "On the gen; the HUD names this room Game Room (position approximate)"
  - id: oregon-dorms-attack-late-window
    site: kids_dorms_dorms_main_hall
    side: attack
    operators: [Hibana, Ace]
    title: "Late Kids or Big window, plant Dorm Main Hall"
    text: >-
      Late in the round, not early: open Big Window or Kids window and play the cut-offs on close, the
      chassis, the White bookshelf and White stairs. Then plant on the gen, or walk in and plant in Dorm Main
      Hall, which has less risk from the White head holes. After that watch the pixel and the rotate from Trophy
      or the deep Armory hole.
    placements:
      - kind: entry
        floor: 2F
        between: [Kids' Dorms, exterior]
        edge: left
        nudge: [-1.0, 0]
        note: "Late round: open Kids or Big window and play the cut-offs"
      - kind: plant
        floor: 2F
        room: Dorms Main Hall
        note: "Less risk from the White head holes"
      - kind: anchor
        floor: 2F
        room: Trophy Room
        note: "Watch the pixel and the rotate, or play the deep Armory hole"
  # ---------------------------------------------------------------- 1F Kitchen / Dining Hall
  - id: oregon-dining-team-reinforcements
    site: kitchen_dining_hall
    side: defense
    operators: []
    title: "Kitchen / Dining: Small Tower side"
    text: >-
      Reinforce both Small Tower wall panels, both Meeting-side back wall panels and the right half of
      the Showers wall, plus the Kids hatch above Kitchen. Keep the two Security rotates and the
      Showers rotate with its left foot hole open.
    placements:
      - kind: reinforce
        floor: 1F
        between: [Dining Hall, Small Tower]
        note: "Small Tower wall, both panels"
      - kind: reinforce
        floor: 1F
        between: [Kitchen, Meeting Hall]
        note: "Meeting-side back wall"
      - kind: reinforce
        floor: 1F
        between: [Dining Hall, Showers]
        note: "Showers wall, right half"
      - kind: hatch
        floor: 2F
        at: [40.9, 54.2]
        name: "Kids hatch"
        note: "Reinforce so nobody drops onto site"
      - kind: open
        floor: 1F
        between: [Security, Dining Hall]
        note: "Two Security rotates"
  - id: oregon-dining-kaid-small-tower
    site: kitchen_dining_hall
    side: defense
    operators: [Kaid, Bandit]
    title: "Claw the Small Tower wall"
    text: >-
      Claws on the Small Tower wall, the first thing attackers hit from Street. Bandit is the backup
      if there's no Kaid.
    placements:
      - kind: kaid
        floor: 1F
        between: [Dining Hall, Small Tower]
        nudge: [-1.2, 0]
        note: "Dining side"
  - id: oregon-dining-castle-freezer
    site: kitchen_dining_hall
    side: defense
    operators: [Castle, Pulse]
    title: "Close Freezer, play the floor above"
    text: >-
      Castle barricades the Freezer door so the basement lurk can't walk in. Pulse plays 2F above the
      Dining wall and shoots the Thermite through the floor around 1:30.
    placements:
      - kind: castle
        floor: B
        room: Freezer Stairs
        note: "Freezer door; usually barricaded at the stairs, with wire on Z"
      - kind: anchor
        floor: 2F
        room: Attic
        nudge: [0, 4.0]
        note: "Above Dining"
  - id: oregon-dining-attack-meeting-take
    site: kitchen_dining_hall
    side: attack
    operators: [Gridlock, Nomad]
    title: "Garage control, then a Meeting take"
    text: >-
      Skip the usual Small Tower thermite onto Dining. Take Garage, then enter Meeting while one player
      Gridlocks or Airjabs the Lobby flank, as long as the hatch isn't popped. Two push Meeting side and clear
      Rear Stage, then hold the green hallway and push it to contest anyone back site. They're focused on Small
      Tower and rarely play vertical, so plant once you've won the fights.
    placements:
      - kind: entry
        floor: 1F
        room: Garage
        note: "Take Garage control first"
      - kind: anchor
        floor: 1F
        room: Lobby
        note: "Gridlock or Airjab the Lobby flank"
      - kind: entry
        floor: 1F
        room: Meeting Hall
        note: "Two push Meeting side and clear Rear Stage"
      - kind: anchor
        floor: 1F
        between: [Meeting Hall, Kitchen]
        note: "Hold the green hallway, push it to contest back site"
      - kind: plant
        floor: 1F
        room: Kitchen
        nudge: [-2.0, 2.0]
        note: "Usually you're a man up by now"
  - id: oregon-dining-attack-small-tower-dining
    site: kitchen_dining_hall
    side: attack
    operators: [Thermite, Thatcher]
    title: "Small Tower thermite (the common take)"
    text: >-
      The take most teams run: come over from Small Tower, thermite the Dining wall and plant in the open. It
      works, but it leaves a lot of annoying angles to clear, so run it only when the Meeting take is shut down.
    placements:
      - kind: entry
        floor: 1F
        room: Small Tower
        note: "Come over from Small Tower"
      - kind: thermite
        floor: 1F
        between: [Dining Hall, exterior]
        edge: right
        note: "Dining wall"
      - kind: plant
        floor: 1F
        room: Dining Hall
        note: "In the open; clear the angles first"
  # ---------------------------------------------------------------- 1F Meeting Hall / Kitchen
  - id: oregon-meeting-team-reinforcements
    site: meeting_hall_kitchen
    side: defense
    operators: []
    title: "Meeting: shut Stage and Split"
    text: >-
      Reinforce two Stage wall panels, both Split walls, the Meeting Garage wall and the Kitchen-side Z
      wall. Keep the box-side Kitchen/Meeting crouch rotate and the Meeting hatch open for the
      upstairs player.
    placements:
      - kind: reinforce
        floor: 1F
        between: [Rear Stage, Meeting Hall]
        note: "Stage wall, two panels"
      - kind: reinforce
        floor: 1F
        between: [Meeting Hall, Garage]
        note: "Meeting Garage wall"
      - kind: reinforce
        floor: 1F
        room: Kitchen
        nudge: [0, 3.0]
        note: "Z corridor wall, Kitchen side (exact panel not marked)"
      - kind: open
        floor: 1F
        between: [Kitchen, Meeting Hall]
        note: "Box-side crouch rotate"
  - id: oregon-meeting-bandit-stage
    site: meeting_hall_kitchen
    side: defense
    operators: [Bandit]
    title: "Batteries on the Stage wall"
    text: >-
      Bandit batteries on the two Stage panels, then play the box-side rotate. Trick when the
      Thermite or Hibana goes up.
    placements:
      - kind: bandit
        floor: 1F
        between: [Rear Stage, Meeting Hall]
        nudge: [1.2, 0]
        note: "Both Stage panels"
      - kind: anchor
        floor: 1F
        between: [Kitchen, Meeting Hall]
        nudge: [0, 2.0]
        note: "Box-side rotate"
  - id: oregon-meeting-castle-kaid
    site: meeting_hall_kitchen
    side: defense
    operators: [Castle, Kaid]
    title: "Castle Split, Kaid on the Meeting hatch"
    text: >-
      Castle barricades the Split door and Garage-side doors. Kaid claws the Attic walls and holds the
      Meeting hatch from upstairs.
    placements:
      - kind: castle
        floor: 1F
        between: [Meeting Hall, Garage]
        nudge: [0, -2.0]
        note: "Garage double doors; Split door too"
      - kind: kaid
        floor: 2F
        room: Attic
        nudge: [-1.2, -6.0]
        note: "Attic walls"
  - id: oregon-meeting-attack-garage
    site: meeting_hall_kitchen
    side: attack
    operators: [Montagne, Gridlock, Thermite]
    title: "Garage and Lobby, Monty through the castle"
    text: >-
      Same premise as Dining: take Garage, then Lobby, and make sure nobody walks or plays Zulu side (Gridlock
      it or fight them). The job is the single wall; the double door is usually Castled, so bring Montagne.
      Once the barricade is broken he walks in and you plant behind him.
    placements:
      - kind: entry
        floor: 1F
        room: Garage
        note: "Garage control"
      - kind: anchor
        floor: 1F
        room: Lobby
        note: "Lobby control; Gridlock Zulu side"
      - kind: breach
        floor: 1F
        between: [Meeting Hall, Garage]
        nudge: [0, -2.0]
        note: "The single wall, then break the Castle on the double door"
      - kind: plant
        floor: 1F
        room: Meeting Hall
        note: "Behind Montagne"
  - id: oregon-meeting-attack-over
    site: meeting_hall_kitchen
    side: attack
    operators: [Gridlock, Thermite, Hibana]
    title: "Meeting over from the tower"
    text: >-
      Against good players go Meeting over. Pre-place a cam on the pillar downstairs and take Rear Stage and the
      back stairs: one walks up Blue Bunker side and Gridlocks the bottom-to-mid staircase, while others take T2
      and open the Attic wall so nobody can walk up through an open hatch. Hold the hatch angle while a
      teammate opens the main Meeting wall and the green Castle, then smoke the left rotate and plant in
      Meeting, or plant on the green door with a teammate covering.
    placements:
      - kind: drone
        floor: B
        at: [53.5, 50.0]
        name: "Pillar downstairs"
        note: "Pre-placed cam (HUD: Boiler Room; position approximate)"
      - kind: entry
        floor: 1F
        room: Rear Stage
        note: "Rear Stage and back stairs control"
      - kind: breach
        floor: 2F
        between: [Small Tower, Attic]
        note: "T2 opens the Attic wall; hold the hatch angle"
      - kind: thermite
        floor: 1F
        between: [Rear Stage, Meeting Hall]
        nudge: [-1.2, 0]
        note: "Main Meeting wall and the green Castle"
      - kind: plant
        floor: 1F
        room: Meeting Hall
        nudge: [-2.0, 0]
        note: "Smoke the left rotate"
  # ---------------------------------------------------------------- B Laundry Room / Supply Room
  - id: oregon-laundry-team-reinforcements
    site: laundry_room_supply_room
    side: defense
    operators: []
    title: "Laundry / Supply: deny every hatch"
    text: >-
      Reinforce the Freezer, Electrical and Laundry hatches, the right half of the Electrical wall
      facing Blue Bunker, the right half of the Supply wall and both Pillar panels. Keep the Elbow
      rotate open.
    placements:
      - kind: hatch
        floor: 1F
        at: [46.3, 62.7]
        name: "Showers hatch"
        note: "Reinforce; which guide name (Freezer, Laundry, Electrical) fits each 1F hatch is not verified"
      - kind: hatch
        floor: 1F
        at: [55.8, 41.0]
        name: "Dining Hall hatch"
        note: "Reinforce"
      - kind: hatch
        floor: 1F
        at: [55.5, 67.5]
        name: "Lobby hatch"
        note: "Reinforce"
      - kind: reinforce
        floor: B
        between: [Electric Room, Blue Bunker]
        nudge: [1.0, 0]
        note: "Right half"
      - kind: reinforce
        floor: B
        between: [Supply Room, Freezer]
        note: "Supply wall, right half"
      - kind: open
        floor: B
        between: [Laundry Room, Supply Room]
        note: "Elbow rotate"
  - id: oregon-laundry-mira-bunker
    site: laundry_room_supply_room
    side: defense
    operators: [Mira, Jager]
    title: "Mirror Blue Bunker"
    text: >-
      Mira on the right half of the Electrical wall watches Blue Bunker. Jager ADS on the Blue door
      keeps the grenades off it.
    placements:
      - kind: mira
        floor: B
        between: [Electric Room, Blue Bunker]
        nudge: [1.0, 1.0]
        note: "Right half, Electrical side"
      - kind: anchor
        floor: B
        room: Blue Bunker
        nudge: [0, 2.0]
        note: "Jager ADS by the Blue door"
  - id: oregon-laundry-kaid-hatches
    site: laundry_room_supply_room
    side: defense
    operators: [Kaid, Smoke]
    title: "Claw the hatches, hold Pillar and Elbow"
    text: >-
      Kaid claws the Electrical and Freezer hatches and holds Pillar in Supply. Smoke holds Elbow and
      saves gas for the plant.
    placements:
      - kind: kaid
        floor: B
        room: Electric Room
        note: "Under the Electrical hatch"
      - kind: anchor
        floor: B
        room: Supply Room
        note: "Pillar"
  - id: oregon-laundry-attack-bunker
    site: laundry_room_supply_room
    side: attack
    operators: [Flores, Hibana, Nomad]
    title: "Bunker split and the Meeting hatch"
    text: >-
      If they put a Mira on the front wall, go Bunker split: open Bunker early and work your utility to get
      inside. The hard breacher takes T2 with a pre-place, Nomad Airjabs Dining and drones Meeting, and you open
      the Meeting hatch (EMPs for Kaid or Tubarao) to pop the Mira. Then push back stairs for pillar and the head
      holes, Hibana off close, and from pillar cut Laundry and Long Hall while one plants and one watches the
      Freezer swing.
    placements:
      - kind: entry
        floor: B
        room: Blue Bunker
        note: "Open Bunker early, work utility to get in"
      - kind: hibana
        floor: 1F
        at: [37.0, 57.0]
        name: "Meeting hatch"
        note: "Open it to pop the Mira (position approximate)"
      - kind: entry
        floor: 1F
        room: Rear Stage
        note: "Push back stairs once the Mira is gone"
      - kind: anchor
        floor: B
        at: [53.5, 50.0]
        name: "Pillar"
        note: "Cuts Laundry and Long Hall (position approximate)"
      - kind: plant
        floor: B
        room: Supply Room
        note: "Someone else watches the Freezer swing"
  - id: oregon-laundry-attack-stairs-split
    site: laundry_room_supply_room
    side: attack
    operators: [Flores, Hibana, Thatcher]
    title: "High-elo Laundry split with a Freezer take"
    text: >-
      In high elo skip Bunker. Pre-place for Garage and Showers, take 1F and open the Freezer hatch, the
      Laundry hatch if it's reinforced, and the Meeting hatch. Flores clears the Mira and the Laundry shield while
      a teammate peeks off the drone. Another walks down Freezer and clears it (watch the lockers jump-up, close,
      the hallway and Laundry), then plant on the hard wall or tucked in the corner.
    placements:
      - kind: hibana
        floor: 1F
        at: [44.5, 62.0]
        name: "Freezer hatch"
        note: "Plus the Laundry and Meeting hatches (position approximate)"
      - kind: entry
        floor: B
        room: Freezer Stairs
        note: "Walk down Freezer; watch lockers jump-up, close and Laundry"
      - kind: plant
        floor: B
        room: Laundry Room
        note: "On the hard wall or tucked in the corner"
