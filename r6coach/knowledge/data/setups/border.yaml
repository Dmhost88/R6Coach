map: border
briefs:
  # ------------------------------------------------------------------ 2F Armory Lockers / 2F Archives
  - id: border-armory-team-reinforce
    site: armory_lockers_archives
    side: defense
    operators: []
    title: "Balcony walls, Fountain wall, rotate open"
    text: >-
      Reinforce both Armory-West Balcony walls and both Archives-Fountain panels, then the Armory to Security Room
      corridor. Keep Armory Lockers to Archives open and save up to three flex walls until you've droned.
    placements:
      - kind: reinforce
        floor: 2F
        between: [Armory Lockers, exterior]
        edge: left
        nudge: [0, -2.5]
        note: "Both West Balcony walls"
      - kind: reinforce
        floor: 2F
        at: [53.5, 35.5]
        name: "Archives-Fountain wall"
        note: "Both panels"
      - kind: rotate
        floor: 2F
        between: [Armory Lockers, Archives]
        note: "Armory to Archives stays open"
  - id: border-armory-mute-balcony
    site: armory_lockers_archives
    side: defense
    operators: [Mute, Maestro]
    title: "Jam the West Balcony walls"
    text: >-
      Mute jams both Armory-West Balcony walls and the Fountain door so Thatcher and Ace can't open them cleanly.
      Maestro puts an Evil Eye on the balcony walls and anchors Armory Desk for the crossfire.
    placements:
      - kind: trap
        floor: 2F
        between: [Armory Lockers, exterior]
        edge: left
        nudge: [1.5, -1.5]
        note: "Mute jammer on the balcony walls"
      - kind: camera
        floor: 2F
        between: [Armory Lockers, exterior]
        edge: left
        nudge: [3.0, 2.0]
        note: "Evil Eye on the walls"
      - kind: anchor
        floor: 2F
        room: Armory Lockers
        nudge: [4.0, 0]
        note: "Armory Desk crossfire"
  - id: border-armory-break-room
    site: armory_lockers_archives
    side: defense
    operators: []
    title: "Hold Break Room for the East Stairs rotate"
    text: >-
      One player holds Break Room and the interior balcony so East Balcony and the East Stairs rotate aren't free.
      Smoke from back Archives gasses the East Balcony doors.
    placements:
      - kind: anchor
        floor: 2F
        room: Break Room
        note: "Interior balcony, stop the East Stairs rotate"
      - kind: deployable
        floor: 2F
        at: [64.0, 19.5]
        name: "East Balcony doors"
        note: "Gas or shield here"
  # Attack briefs on this map follow Garfieldisdoc, "How to Attack EVERY Bombsite in Rainbow Six Siege
  # (2026)", https://www.youtube.com/watch?v=1qCEYZwQzes (Border from 21:32).
  - id: border-armory-attack-east
    site: armory_lockers_archives
    side: attack
    operators: [Hibana, Nomad, Gridlock]
    title: "Take East, pinch Fountain, plant Archives"
    call: "Take East, Hibana opens the East wall, pinch Fountain, plant default in Archives."
    text: >-
      Take East first: Hibana opens the East wall to cut rotates, and Nomad's Airjabs or Gridlock's Trax
      cover the balcony and the double door behind you. Drone Offices, or drop a roof drone in the skylight,
      push the Offices player back to Fountain, then open the single wall and pinch him. A late player on the
      AC window cuts Beepers and Small Office while you plant default on the chassis in Archives.
    counters: >-
      East wall denied by a Bandit or Kaid: Hibana takes the single wall instead, or bring Thatcher.
      Fountain holds: plant from Offices side and play the AC window for the defuse.
    placements:
      - kind: hibana
        by: Hibana
        floor: 2F
        room: East Stairs
        note: "Open the East wall; Airjab or Trax the balcony and double door"
      - kind: drone
        floor: 2F
        room: Offices
        note: "Drone Offices, or a roof drone through the skylight"
      - kind: breach
        floor: 2F
        at: [50.0, 45.0]
        name: "Fountain single wall"
        note: "Open it and pinch the Fountain player"
      - kind: entry
        floor: 2F
        at: [61.5, 30.0]
        name: "AC window"
        note: "Late: cut Beepers and Small Office"
      - kind: plant
        floor: 2F
        room: Archives
        note: "Default, on the chassis"
  - id: border-armory-attack-break-room
    site: armory_lockers_archives
    side: attack
    operators: [Montagne, Ace, Buck]
    title: "Break Room take, Armory Lockers wall"
    text: >-
      Bring a shield and take Break Room: if nobody plays the Security box or behind the hard wall, take it
      and hold that angle. If the half wall and Lockers angles are too strong, make vertical from Small
      Office so he has to fight the players outside the main wall. Open the Armory Lockers wall from West
      Balcony, clear the half wall and plant on the hard wall while the breacher watches the crawl angle.
    placements:
      - kind: anchor
        floor: 2F
        room: Security Room
        note: "Take the Security box and hold the angle"
      - kind: breach
        floor: 2F
        between: [Armory Lockers, exterior]
        edge: left
        note: "Main wall from West Balcony, if it's soft"
      - kind: anchor
        floor: 2F
        room: West Balcony
        note: "Stay outside the breach and watch the crawl angle"
      - kind: plant
        floor: 2F
        room: Armory Lockers
        note: "On the hard wall"

  # ------------------------------------------------------------------ 1F Workshop / 1F Ventilation Room
  - id: border-workshop-kaid-wall
    site: workshop_ventilation
    side: defense
    operators: [Kaid]
    title: "Claw the Workshop wall and hatch"
    text: >-
      Reinforce the main Workshop exterior panel and the second one, claw the main panel, then reinforce and claw
      the hatch over Workshop. Check the main breach panel in a custom game if you're unsure.
    placements:
      - kind: reinforce
        floor: 1F
        between: [Workshop, exterior]
        edge: top
        nudge: [-2.0, 0]
        note: "Main panel and the second panel"
      - kind: kaid
        floor: 1F
        between: [Workshop, exterior]
        edge: top
        nudge: [1.0, 1.5]
        note: "Main panel"
      - kind: hatch
        floor: 2F
        at: [53.8, 27.5]
        name: "Workshop hatch"
        note: "Reinforce and claw (the hatch over Workshop)"
  - id: border-workshop-team-reinforce
    site: workshop_ventilation
    side: defense
    operators: []
    title: "Detention wall, vault rotate open"
    text: >-
      Reinforce both Detention panels and the site wall facing the Tellers door. Keep the Workshop-Vents vault rotate
      open and cut head holes above the Workshop wall so you can C4 the plant.
    placements:
      - kind: reinforce
        floor: 1F
        between: [Passport Check, Detention]
        note: "Detention wall, both panels"
      - kind: rotate
        floor: 1F
        between: [Workshop, Ventilation Room]
        note: "Vault rotate stays open"
      - kind: open
        floor: 1F
        between: [Workshop, exterior]
        edge: top
        nudge: [3.0, 1.0]
        note: "Head holes above the wall"
  - id: border-workshop-castle-stairs
    site: workshop_ventilation
    side: defense
    operators: [Castle]
    title: "Panel the Metal Stairs door"
    text: >-
      Castle the Metal Stairs door so 2F can't flood down onto site; Noor or Warden play 2F over the plant
      through holes.
    placements:
      - kind: castle
        floor: 1F
        at: [42.0, 47.5]
        name: "Metal Stairs door"
        note: "Bottom of the central stairs (usually)"
      - kind: anchor
        floor: 2F
        at: [47.0, 30.0]
        name: "2F over Workshop"
        note: "Vertical over the plant"
  - id: border-workshop-attack-vertical
    site: workshop_ventilation
    side: attack
    operators: [Ace, Buck, Sledge]
    title: "Win upstairs, open the hatch, plant tucked"
    text: >-
      Get upstairs control: a hard breacher opens the main Armory Lockers wall and clears the half wall, with
      two players Lockers side and one through Offices or on the AC window. Hold the front door so nobody
      rotates West Main and watch the Metal stairs flank. The vertical player opens lines over site and
      the hatch, then the planter walks in and plants tucked on the door.
    placements:
      - kind: breach
        floor: 2F
        between: [Armory Lockers, exterior]
        edge: left
        note: "Main Armory Lockers wall; clear the half wall"
      - kind: anchor
        floor: 1F
        at: [30.0, 30.0]
        name: "Outside the front door"
        note: "Hold it so nobody rotates West Main"
      - kind: breach
        floor: 2F
        at: [48.0, 28.0]
        name: "Hatch and floor over site"
        note: "Vertical lines, then open the hatch; cuts Blue single"
      - kind: plant
        floor: 1F
        room: Ventilation Room
        note: "Tucked on the door; play it from the vertical"

  - id: border-workshop-attack-tellers
    site: workshop_ventilation
    side: attack
    operators: [Gridlock, Nomad, Hibana]
    title: "Tellers, Passport and East Stairs take"
    text: >-
      When the vertical is too much, take Tellers, Passport and East Stairs. Gridlock or Nomad the East
      balcony and double door, shoot the barricade for the Blue desk line and hold Blue. Open the back wall
      or the single to cut every line, and plant on the bench for an off angle; if they play the Archives
      hatch open, smoke deep from the single first.
    placements:
      - kind: anchor
        floor: 2F
        room: East Stairs
        note: "Airjab or Trax the balcony and the double door"
      - kind: breach
        floor: 1F
        at: [57.0, 55.0]
        name: "Back wall from Main Lobby"
        note: "Or open the single to cut all lines of sight"
      - kind: plant
        floor: 1F
        room: Workshop
        note: "Off plant, up on the bench"

  # ------------------------------------------------------------------ 1F Customs Inspection / 1F Supply Room
  - id: border-customs-bandit-passport
    site: customs_supply
    side: defense
    operators: [Bandit]
    title: "Trick the Passport wall"
    text: >-
      Reinforce both Passport-Customs panels and trick them. Thermite and Thatcher come here together, so hold a
      battery to replace after the EMP.
    placements:
      - kind: reinforce
        floor: 1F
        between: [Passport Check, Customs Inspection]
        nudge: [-1.5, 0]
        note: "Both panels"
      - kind: bandit
        floor: 1F
        between: [Passport Check, Customs Inspection]
        nudge: [1.0, 1.5]
        note: "Customs side"
  - id: border-customs-team-cc
    site: customs_supply
    side: defense
    operators: [Castle, Valkyrie]
    title: "Panels on windows, hold CC over open hatches"
    text: >-
      Reinforce the Detention wall and the Security Room (CC) wall, Castle the windows and the double door. Keep
      both CC hatches open and hold CC above with cams; if nobody plays CC, reinforce them instead.
    placements:
      - kind: reinforce
        floor: 1F
        between: [Detention, Customs Inspection]
        note: "Detention wall, both panels"
      - kind: open
        floor: 2F
        at: [43.3, 72.5]
        name: "CC hatch (south)"
        note: "Open for vertical"
      - kind: open
        floor: 2F
        at: [43.3, 52.5]
        name: "CC hatch (north)"
        note: "Open for vertical"
      - kind: castle
        floor: 1F
        between: [Customs Inspection, exterior]
        edge: left
        note: "Windows"
  - id: border-customs-attack-passport
    site: customs_supply
    side: attack
    operators: [Thermite, Thatcher, Rauora, Gridlock]
    title: "Passport wall with Tellers control"
    text: >-
      Get Passport and Tellers control: open the Passport wall while one or two come in from Tellers, make
      sure nobody's East and cut off site, bottom Metal and Workshop. The Tellers player holds and never lets
      them reach the double door; the breacher plants right at the Passport wall, watching Small Office as
      he passes. If they play vertical on Passport, open the barricade, or Rauora or Gridlock the double door late.
    placements:
      - kind: anchor
        floor: 1F
        room: Tellers
        note: "Hold: don't let them reach the double door"
      - kind: thermite
        floor: 1F
        between: [Passport Check, Customs Inspection]
        nudge: [0, -1.5]
        note: "The Passport wall"
      - kind: plant
        floor: 1F
        between: [Passport Check, Customs Inspection]
        nudge: [0, 3.0]
        note: "Right at the breach; watch Small Office"

  - id: border-customs-attack-detention
    site: customs_supply
    side: attack
    operators: [Ying, Capitao, Hibana]
    title: "Detention wall and Supply window, smoke the plant"
    text: >-
      Drone how many are on site; often they just run around. Open the Detention wall and the Supply window
      for phantom pressure, and against heavy vertical bring smokes and Ying to take site control for a rush
      plant. You can also clear from East: come Break Room and the balcony, take East or bang it if it isn't
      reinforced.
    placements:
      - kind: hibana
        by: Hibana
        floor: 1F
        between: [Detention, Customs Inspection]
        note: "The Detention wall"
      - kind: entry
        floor: 1F
        between: [Supply Room, exterior]
        edge: left
        note: "Open the Supply window for phantom pressure"
      - kind: anchor
        floor: 2F
        room: East Stairs
        note: "Clear from East: Break Room, balcony, East"
      - kind: plant
        floor: 1F
        room: Customs Inspection
        note: "Rush plant under smoke"

  # ------------------------------------------------------------------ 1F Tellers / 1F Bathroom
  - id: border-tellers-team-reinforce
    site: tellers_bathroom
    side: defense
    operators: []
    title: "Tellers walls, rotate shield"
    text: >-
      Reinforce the Tellers wall facing Detention, the long-angle Tellers wall and both Bathroom panels. Keep the
      Tellers-Bathroom vault rotate and put a shield on it.
    placements:
      - kind: reinforce
        floor: 1F
        between: [Tellers, Main Lobby]
        note: "Tellers wall toward Detention / Lobby"
      - kind: reinforce
        floor: 1F
        between: [Bathroom, Waiting Room]
        note: "Bathroom wall, both panels"
      - kind: deployable
        floor: 1F
        between: [Tellers, Bathroom]
        note: "Shield on the vault rotate (Smoke)"
  - id: border-tellers-kaid-hatch
    site: tellers_bathroom
    side: defense
    operators: [Kaid]
    title: "Kaid vertical over Bathroom"
    text: >-
      Claw the 2F hatch toward Bathroom and play above it; some teams leave the Bathroom hatch open on purpose for
      the retake. Watch for Fuze under the hatch.
    placements:
      - kind: kaid
        floor: 2F
        at: [64.3, 34.5]
        name: "Bathroom hatch"
        note: "Claw it, or leave it open for the retake"
      - kind: anchor
        floor: 2F
        at: [61.0, 30.0]
        name: "2F over Bathroom"
        note: "Vertical over the shower plant"
  - id: border-tellers-attack-hatch
    site: tellers_bathroom
    side: attack
    operators: [Buck, Sledge, Hibana]
    title: "East and Offices vertical, drop the hatch"
    text: >-
      Pre-place a cam in Break Room, take upstairs East and cut anyone coming up Metal or rotating from
      Armory Lockers. Then take Offices, make lots of vertical and open the hatch, which is usually
      reinforced. Drop in and plant tucked while they sit back Workshop; from upstairs you can vert Archives
      too.
    placements:
      - kind: drone
        floor: 2F
        room: Break Room
        note: "Pre-place a cam at the start of the round"
      - kind: anchor
        floor: 2F
        room: East Stairs
        note: "Cut Metal stairs and the Armory Lockers rotate"
      - kind: breach
        floor: 2F
        room: Offices
        note: "Lots of vertical"
      - kind: hibana
        floor: 2F
        at: [64.3, 34.5]
        name: "Hatch over site"
        note: "Usually reinforced; open it, then drop"
      - kind: plant
        floor: 1F
        room: Bathroom
        note: "Tucked, under the hatch"
  - id: border-tellers-attack-single
    site: tellers_bathroom
    side: attack
    operators: [Nomad, Gridlock, Ace]
    title: "Bottom East and Passport, open the Tellers single"
    text: >-
      Open the Tellers window at the start for phantom pressure. Put a flank watch on South Balcony and hold
      East or the Office double, while the rest take Passport and bottom East. Smoke off the double and open
      the Tellers single wall, then plant there: the extenders upstairs have to drop the hatch and flood site.
    placements:
      - kind: entry
        floor: 1F
        between: [Tellers, exterior]
        edge: right
        note: "Open the Tellers window at the start"
      - kind: anchor
        floor: 2F
        at: [60.0, 80.0]
        name: "South Balcony"
        note: "Airjab, Trax or a drone for the late flank"
      - kind: breach
        floor: 1F
        between: [Tellers, Passport Check]
        note: "The Tellers single wall"
      - kind: plant
        floor: 1F
        room: Tellers
        note: "Right off the single"
