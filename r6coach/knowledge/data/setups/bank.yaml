map: bank
briefs:
  # ------------------------------------------------------------------ 2F CEO Office / 2F Executive Lounge
  - id: bank-ceo-team-reinforce
    site: ceo_executive_lounge
    side: defense
    operators: []
    title: "Top Square wall, Lounge walls, Janitor hatch open"
    text: >-
      Reinforce both CEO-Top Square panels first, then Lounge to Front Desk and the CEO-Janitor wall. Keep the
      Janitor hatch open with murder holes so a player below can gas or shoot up, and keep the Lounge to
      Conference hallway open for the swing onto CEO.
    placements:
      - kind: reinforce
        floor: 2F
        between: [CEO Office, Skylight Stairwell]
        nudge: [0, -2.0]
        note: "Both panels; the main hard breach"
      - kind: reinforce
        floor: 2F
        between: [Executive Lounge, Front Desk]
        note: "Both panels"
      - kind: reinforce
        floor: 2F
        between: [CEO Office, Janitor Closet]
        nudge: [-1.5, 0]
        note: "CEO wall to Janitor"
      - kind: open
        floor: 2F
        at: [57.5, 59.0]
        name: "Janitor hatch"
        note: "Open, with murder holes for play from 1F Admin"
      - kind: rotate
        floor: 2F
        between: [Conference Room, Meeting Hallway]
        note: "Lounge-Conference hallway stays open"
  - id: bank-ceo-kaid-top-square
    site: ceo_executive_lounge
    side: defense
    operators: [Kaid]
    title: "Claw the Top Square wall"
    text: >-
      Claw the CEO-Top Square wall low from the CEO side, then put the second claw on the Janitor hatch area or
      the CEO-Janitor wall. Don't stand behind the Top Square wall when Ace or Thermite blows it; fight from Janitor.
    placements:
      - kind: kaid
        floor: 2F
        between: [CEO Office, Skylight Stairwell]
        nudge: [-1.2, 1.5]
        note: "Low, CEO side"
      - kind: kaid
        floor: 2F
        between: [CEO Office, Janitor Closet]
        nudge: [1.5, -1.0]
        note: "Second claw, Janitor side wall"
      - kind: anchor
        floor: 2F
        room: Janitor Closet
        note: "Contest the breacher from Janitor, not behind the wall"
  - id: bank-ceo-mira-lounge
    site: ceo_executive_lounge
    side: defense
    operators: [Mira]
    title: "Mira from Lounge into CEO"
    text: >-
      Reinforce the Lounge-CEO wall and window it so the Lounge anchor sees the CEO bookshelf plant. A second
      window on the Conference south wall to the hallway is optional.
    placements:
      - kind: reinforce
        floor: 2F
        between: [CEO Office, Executive Lounge]
        nudge: [0, -2.5]
        note: "Both panels"
      - kind: mira
        floor: 2F
        between: [CEO Office, Executive Lounge]
        nudge: [-0.8, 2.0]
        note: "Face it into CEO"
      - kind: mira
        floor: 2F
        between: [Conference Room, Meeting Hallway]
        nudge: [1.5, 0]
        note: "Optional, Conference south wall"
      - kind: anchor
        floor: 2F
        room: Executive Lounge
        note: "Behind the Mira"
  # Attack briefs on this map follow Garfieldisdoc, "How to Attack EVERY Bombsite in Rainbow Six Siege
  # (2026)", https://www.youtube.com/watch?v=1qCEYZwQzes (Bank from 0:30).
  - id: bank-ceo-attack-top-square
    site: ceo_executive_lounge
    side: attack
    operators: [Ace, Buck, Sledge]
    title: "Win Stock and Top Square, open the far Square wall"
    text: >-
      Two players fight Stock and kill the zombie behind the trading table while one walks up Top Square and
      one jumps in Stock window. Too much utility? Pre-place a cam in Open Area, clear Beepers and make
      vertical up on him. Rappel the CEO window to cut Janitor and Double Door, then open the far right Top
      Square wall and plant on the bookshelf.
    placements:
      - kind: entry
        floor: 2F
        at: [61.5, 76.0]
        name: "Stock window"
        note: "Jump in while Top Square pushes the Stock player back"
      - kind: breach
        floor: 1F
        room: Open Area
        note: "Safer route: pre-place here, shoot up through the Stock floor"
      - kind: entry
        floor: 2F
        at: [58.5, 36.5]
        name: "CEO window"
        note: "Rappel; cut Janitor and Double Door, one player watches the Lobby swing"
      - kind: ace
        floor: 2F
        between: [CEO Office, Skylight Stairwell]
        nudge: [1.2, 2.0]
        note: "Far right Top Square wall (or run the soft wall)"
      - kind: plant
        floor: 2F
        room: CEO Office
        nudge: [2.5, -3.0]
        note: "On the bookshelf; play the defuse from Top Square"
  - id: bank-ceo-attack-lobby-e3
    site: ceo_executive_lounge
    side: attack
    operators: [Hibana, Twitch]
    title: "Hibana opens E3, take Lobby stairs"
    text: >-
      Hibana rappels and opens E3, without the bomb, to cut the Janitor, Long Hallway and Stock rotates. The
      rest drone up Lobby stairs, clear the wall utility, pre-place a cam on E2 and fight up for Front Desk
      while a teammate pushes Beepers. Keep one or two on Stock and Stock window for phantom pressure.
    placements:
      - kind: hibana
        floor: 2F
        room: Elevators
        note: "E3 from the rappel; leave the bomb with someone else"
      - kind: drone
        floor: 1F
        room: Main Stairs
        note: "Drone up Lobby stairs; pre-place a cam on E2"
      - kind: anchor
        floor: 2F
        room: Front Desk
        note: "Fight for Front Desk, not the hallway (Hibana has it)"
      - kind: entry
        floor: 2F
        at: [61.5, 76.0]
        name: "Stock window"
        note: "Phantom pressure on Stock"

  # ------------------------------------------------------------------ 1F Open Area / 1F Staff Room
  - id: bank-staff-team-reinforce
    site: open_area_staff_room
    side: defense
    operators: []
    title: "Hatches first, then the Square wall"
    text: >-
      Prep is short: reinforce the Stock hatch and the Janitor hatch on 2F first. Then three of the four Square
      wall panels, the Staff wall facing Electrical and the Printer panel in line with the window.
    placements:
      - kind: hatch
        floor: 2F
        at: [52.5, 77.0]
        name: "Stock hatch"
        note: "First thing in prep"
      - kind: hatch
        floor: 2F
        at: [57.5, 59.0]
        name: "Janitor hatch"
        note: "Second"
      - kind: reinforce
        floor: 1F
        at: [66.0, 55.0]
        name: "Square wall"
        note: "Panels 1-3"
      - kind: reinforce
        floor: 1F
        between: [Staff Room, Electrical Room]
        note: "Staff wall facing Electrical"
      - kind: reinforce
        floor: 1F
        between: [Staff Room, Printer Room]
        note: "Printer panel in line with the window"
      - kind: rotate
        floor: 1F
        between: [Open Area, Staff Room]
        note: "Crouch rotate Open Area-Staff"
  - id: bank-staff-kaid-square
    site: open_area_staff_room
    side: defense
    operators: [Kaid]
    title: "Claw Square wall panel 1"
    text: >-
      Claw the first Square wall panel and keep the second claw for whichever hatch they go for. Head holes above
      the Square wall let you C4 or gas the breacher.
    placements:
      - kind: kaid
        floor: 1F
        at: [64.0, 55.5]
        name: "Square wall, panel 1"
        note: "Low, Staff side"
      - kind: open
        floor: 1F
        at: [68.0, 55.0]
        name: "Square wall head holes"
        note: "Above the reinforced panels"
  - id: bank-staff-mira-rotate
    site: open_area_staff_room
    side: defense
    operators: [Mira]
    title: "Mira the rotate and Printer panels"
    text: >-
      Window the Open Area-Staff panel beside the rotate and the Printer panel so the Staff Room anchor behind the
      counter sees both Open Area and the Printer window hop.
    placements:
      - kind: mira
        floor: 1F
        between: [Open Area, Staff Room]
        nudge: [0, -2.5]
        note: "Beside the rotate"
      - kind: mira
        floor: 1F
        between: [Staff Room, Printer Room]
        nudge: [1.5, 0]
        note: "In line with the Printer window"
      - kind: anchor
        floor: 1F
        room: Staff Room
        note: "Behind the kitchen counter"
  - id: bank-staff-attack-vertical
    site: open_area_staff_room
    side: attack
    operators: [Buck, Sledge, Gridlock, Nomad]
    title: "Win upstairs, vertical through the Stock floor"
    text: >-
      Pre-place cams upstairs for Top Square and the CEO rappel, then clear Stock door, Back Elevator and
      Conference. Gridlock or Nomad the Lobby and Marble flanks, make vertical on the Stock floor over the
      Mira and open the Stock hatch to drop. If someone plays Archives, the vertical player moves to CEO.
    placements:
      - kind: drone
        floor: 2F
        room: Skylight Stairwell
        note: "Pre-place cams for Top Square and the CEO rappel"
      - kind: breach
        floor: 2F
        room: Stock Trading Room
        note: "Vertical on the Stock floor; cut off the Mira"
      - kind: breach
        floor: 2F
        at: [52.5, 77.0]
        name: "Stock hatch"
        note: "Open it so you can drop when needed"
      - kind: breach
        floor: 2F
        room: CEO Office
        note: "Vertical onto Archives if someone plays there"
  - id: bank-staff-attack-square-wall
    site: open_area_staff_room
    side: attack
    operators: [Ace, Thatcher, Hibana]
    title: "Open Bottom Square wall, or drop the hatch from E2"
    text: >-
      Open the Printer window at the start for phantom pressure. With the vertical played, open the Bottom
      Square wall and watch the Bottom Blue drop. No wall? Keep the vertical, work the E2 side past the
      Tellers' Office feet holes, hold mid plat and plant by the hatch after the drop.
    placements:
      - kind: entry
        floor: 1F
        at: [68.0, 76.5]
        name: "Printer window"
        note: "Open it early; a late player plays here"
      - kind: ace
        floor: 1F
        at: [66.0, 54.5]
        name: "Bottom Square wall"
        note: "After the vertical; watch the Bottom Blue drop"
      - kind: anchor
        floor: 1F
        room: Office Hallway
        nudge: [0, -3.0]
        note: "E2 side: hold mid plat and stop the door rotate"
      - kind: plant
        floor: 1F
        room: Open Area
        note: "Around the hatch after the drop"

  # ------------------------------------------------------------------ 1F Tellers' Office / 1F Archives
  - id: bank-tellers-team-reinforce
    site: tellers_archives
    side: defense
    operators: []
    title: "Archives Square wall and the hatches"
    text: >-
      Reinforce both Archives-Square panels and the Tellers' Office walls, plus the Janitor hatch above Admin.
      Keep the Archives-Admin-Open Area rotate open and the Lobby hatch watched rather than reinforced.
    placements:
      - kind: reinforce
        floor: 1F
        between: [Archives, Skylight Stairwell]
        note: "Both panels"
      - kind: reinforce
        floor: 1F
        between: [Tellers' Office, Tellers]
        note: "Tellers' Office wall toward Lobby"
      - kind: hatch
        floor: 2F
        at: [57.5, 59.0]
        name: "Janitor hatch"
        note: "Over Admin"
      - kind: rotate
        floor: 1F
        between: [Archives, Admin Office]
        note: "Archives-Admin-Open Area stays open"
  - id: bank-tellers-kaid-archives
    site: tellers_archives
    side: defense
    operators: [Kaid]
    title: "Claw the Archives Square wall"
    text: >-
      Claw the Archives-Square wall from the Archives side; anchor off the shelves. Castle or Noor in the
      Executive Lounge above holds vertical.
    placements:
      - kind: kaid
        floor: 1F
        between: [Archives, Skylight Stairwell]
        nudge: [-1.2, 1.5]
        note: "Archives side"
      - kind: anchor
        floor: 1F
        room: Archives
        note: "Off the shelves"
      - kind: anchor
        floor: 2F
        room: Executive Lounge
        note: "Vertical over site"
  - id: bank-tellers-attack-lobby
    site: tellers_archives
    side: attack
    operators: [Thermite, Sens, Capitao]
    title: "Old school: ATMs and the Lobby desk wall"
    text: >-
      Get ATM control, then take Tellers and open the Lobby desk wall; the player on the E2 or Marble
      staircase is the problem. Work up to Money Bag and open the Loan Office walls to cut rotates, then
      smoke off site and go for an off plant.
    placements:
      - kind: anchor
        floor: 1F
        room: ATMs
        note: "Win ATMs first"
      - kind: breach
        floor: 1F
        between: [Tellers' Office, Tellers]
        nudge: [-1.0, 0]
        note: "The Lobby desk wall"
      - kind: breach
        floor: 1F
        room: Loan Office
        note: "Loan Office walls; cut the rotates"
      - kind: plant
        floor: 1F
        room: Tellers' Office
        note: "Off plant under smoke"
  - id: bank-tellers-attack-archives
    site: tellers_archives
    side: attack
    operators: [Hibana, Buck, Gridlock]
    title: "Open Area control, then the Admin walls"
    text: >-
      Open the Electrical closet and the Printer window for phantom pressure and drone how they hold it; a
      teammate upstairs plays vertical to push the back Open Area player out. Then go through Admin Office
      and open the main Archives wall while someone holds Top Square, the only flank besides Bottom Blue.
      Play the closet and run the plant in.
    placements:
      - kind: breach
        floor: 1F
        room: Electrical Room
        note: "Open the closet for phantom pressure"
      - kind: entry
        floor: 1F
        at: [68.0, 76.5]
        name: "Printer window"
        note: "Open it and drone Open Area"
      - kind: hibana
        floor: 1F
        between: [Archives, Admin Office]
        note: "Main wall from Admin; often only the last panel is reinforced"
      - kind: anchor
        floor: 2F
        room: Skylight Stairwell
        note: "Hold Top Square: the flank"
      - kind: plant
        floor: 1F
        room: Archives
        note: "Run in from the closet after the wall"

  # ------------------------------------------------------------------ B CCTV Room / B Lockers
  - id: bank-basement-kaid-server-wall
    site: cctv_lockers
    side: defense
    operators: [Kaid]
    title: "Claw the Server wall and Admin hatch"
    text: >-
      Reinforce both CCTV-Server panels and claw them from CCTV, then claw the Admin hatch above. Re-claw after
      Thatcher's EMP if you can.
    placements:
      - kind: reinforce
        floor: B
        between: [CCTV Room, Server Room]
        nudge: [-1.5, 0]
        note: "Both panels"
      - kind: kaid
        floor: B
        between: [CCTV Room, Server Room]
        nudge: [-1.0, 1.5]
        note: "CCTV side"
      - kind: kaid
        floor: 1F
        at: [59.0, 57.5]
        name: "Admin hatch"
        note: "Reinforce and claw"
  - id: bank-basement-mira-red-hallway
    site: cctv_lockers
    side: defense
    operators: [Mira]
    title: "Mira on Red Hallway"
    text: >-
      Window the Red Hallway panel on the CCTV side so the CCTV anchor sees the rotate and the Lockers door; a
      second window on the Lockers side or the Lockers south wall is common.
    placements:
      - kind: reinforce
        floor: B
        between: [Red Hallway, CCTV Room]
        note: "CCTV side"
      - kind: mira
        floor: B
        between: [Red Hallway, CCTV Room]
        nudge: [0, 2.0]
        note: "Face it into Red Hallway"
      - kind: mira
        floor: B
        between: [Red Hallway, Lockers]
        note: "Optional, Lockers side"
  - id: bank-basement-team-hatches
    site: cctv_lockers
    side: defense
    operators: []
    title: "Hatches, Vault walls, Lobby hatch watched"
    text: >-
      Reinforce the Admin hatch, the Open Area hatch and the Elevator hatch, both Lockers-Vault Entrance panels
      and the Loading Dock to Lockers Hallway wall. Keep Red Hallway open and watch the Lobby hatch into Vault.
    placements:
      - kind: hatch
        floor: 1F
        at: [59.0, 57.5]
        name: "Admin hatch"
      - kind: hatch
        floor: 1F
        at: [44.5, 70.5]
        name: "Elevator hatch"
      - kind: reinforce
        floor: B
        between: [Lockers, Vault Entrance]
        note: "Two panels"
      - kind: reinforce
        floor: B
        between: [Garage, Lockers Hallway]
        note: "Loading Dock wall"
      - kind: rotate
        floor: B
        room: Red Hallway
        note: "Lockers to CCTV stays open"
      - kind: camera
        floor: 1F
        at: [44.0, 38.5]
        name: "Lobby hatch"
        note: "Left open, watched"
  - id: bank-basement-attack-server
    site: cctv_lockers
    side: attack
    operators: [Thermite, Thatcher, Montagne, Hibana]
    title: "Server control, open the walls, bait the plant"
    text: >-
      Take Server with a shield player and a hard breacher, then open both Server walls into CCTV. Against a
      Mira, Goyo or smoke, plant, get off, plant again until the utility is burnt. At the same time Hibana and
      a teammate take Printer, drone it clear, EMP and open the Admin hatch and the Open Area hatch for the
      red angles; drop the hatch if the Mira or the Garage head-hole player is too strong.
    placements:
      - kind: entry
        floor: B
        at: [75.5, 14.5]
        name: "Sewer manhole"
        note: "From spawn, shoot the Lobby and Top Square cams before you drop"
      - kind: thermite
        floor: B
        between: [CCTV Room, Server Room]
        nudge: [1.2, 0]
        note: "Open both Server walls"
      - kind: hibana
        floor: 1F
        at: [59.0, 57.5]
        name: "Admin hatch"
        note: "EMP it, then Hibana; red angles onto site"
      - kind: hibana
        floor: 1F
        at: [57.0, 66.0]
        name: "Open Area hatch"
        note: "Drop it to frag the Mira or the Garage head-hole player"
      - kind: plant
        floor: B
        room: CCTV Room
        nudge: [1.5, -2.5]
        note: "Plant, get off, plant again to bait the utility"
  - id: bank-basement-attack-garage
    site: cctv_lockers
    side: attack
    operators: [Twitch, Nomad]
    title: "Shoot every cam, late Twitch on Garage"
    text: >-
      Shoot every cam early, not just Garage: rappel up to E2 to shoot the E2 cam and hit Lobby and Top Square
      from the Sewer spawn. Twitch drones pop the Mira and Goyo first and she pushes Garage late, once the
      Garage defender gives it up. With man advantage, walk someone down Marble stairs to cut the rotates.
    placements:
      - kind: entry
        floor: 1F
        at: [42.0, 70.0]
        name: "E2 window rappel"
        note: "Shoot the E2 cam from the rappel"
      - kind: drone
        floor: B
        room: Garage
        note: "Twitch drones pop the utility before the push"
      - kind: anchor
        floor: B
        at: [44.0, 46.0]
        name: "Marble stairs"
        note: "With man advantage, walk down and cut rotates"
