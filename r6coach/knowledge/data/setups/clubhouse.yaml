# Standard setup briefs for Clubhouse. See README.md in this folder for the format.
# Positions: room boxes from layout/clubhouse.yaml where they fit; `at` points read off Ubisoft's
# blueprints (data/maps/clubhouse/). Spots marked "usually" in a note are common but not verified
# on the current map version.
map: clubhouse
briefs:
  # ---------------------------------------------------------------- 2F Gym / Bedroom
  - id: clubhouse-gym-team-reinforcements
    site: gym_bedroom
    side: defense
    operators: []
    title: "Gym / Bedroom: walls and feet holes"
    text: >-
      Reinforce the Jacuzzi walls, the Construction panel and the Logistic Office single, plus the Gym
      panel by the rotate. Open feet holes on the Bedroom-Gym wall and the mid-wall vault rotate so
      Bedroom and Gym can crossfire the half-wall plant.
    placements:
      - kind: reinforce
        floor: 2F
        at: [40.2, 30.0]
        name: "Jacuzzi wall"
        note: "Both Jacuzzi exterior walls; usually the outer wall on the terrace side"
      - kind: reinforce
        floor: 2F
        between: [Logistic Office, exterior]
        edge: left
        note: "Logistic Office single"
      - kind: reinforce
        floor: 2F
        between: [Cash Room, Construction]
        note: "Construction panel right of the rotate"
      - kind: open
        floor: 2F
        between: [Gym, Bedroom]
        note: "Feet holes and the mid-wall vault rotate"
      - kind: hatch
        floor: ROOF
        at: [57.9, 12.8]
        name: "Roof hatch"
        note: "Guides call it the Logistic hatch; contest it or reinforce it if nobody holds Logistic"
  - id: clubhouse-gym-kaid-jacuzzi
    site: gym_bedroom
    side: defense
    operators: [Kaid]
    title: "Claw the Jacuzzi walls"
    text: >-
      Claws go low on both reinforced Jacuzzi walls, then hold Logistic Office with C4. Re-claw after
      a Thatcher EMP, because Ace stacks on Jacuzzi once the claws are gone.
    placements:
      - kind: kaid
        floor: 2F
        at: [40.2, 30.0]
        name: "Jacuzzi wall"
        nudge: [1.2, 0]
        note: "Low, room side; usually two claws to cover both walls"
      - kind: anchor
        floor: 2F
        room: Logistic Office
        note: "Hold with C4"
  - id: clubhouse-gym-mira-construction
    site: gym_bedroom
    side: defense
    operators: [Mira]
    title: "Mira the Construction panel"
    text: >-
      Put the Black Mirror on the reinforced Construction panel right of the rotate, so the site sees
      Construction and Main stairs pushes without peeking.
    placements:
      - kind: mira
        floor: 2F
        between: [Cash Room, Construction]
        nudge: [1.2, 0]
        note: "Head height, Gym side of the panel"
  - id: clubhouse-gym-castle-tubarao
    site: gym_bedroom
    side: defense
    operators: [Castle, Tubarao]
    title: "Shoot feet through the holes"
    text: >-
      Castle shoots feet from Bedroom through the Gym holes and blocks the main door. Tubarao plays
      Bedroom from the Construction-side rotate.
    placements:
      - kind: castle
        floor: 2F
        room: Bedroom
        note: "Bedroom main door"
      - kind: anchor
        floor: 2F
        between: [Gym, Bedroom]
        nudge: [0, -1.2]
        note: "Bedroom side of the feet holes"
  # Attack briefs on this map follow Garfieldisdoc, "How to Attack EVERY Bombsite in Rainbow Six Siege
  # (2026)", https://www.youtube.com/watch?v=1qCEYZwQzes (Clubhouse from 1:13:42).
  - id: clubhouse-gym-attack-logi-jacuzzi
    site: gym_bedroom
    side: attack
    operators: [Thermite, Montagne, Blackbeard]
    title: "Jacuzzi-Logistic split: open everything"
    text: >-
      Open everything: Thermite takes the main Jacuzzi wall, pop the Logistic hatch, open the Construction
      single and the Server wall. While he burns, the rest take Garage with a pre-placed cam, shields push up
      to the Garage window and you drone Red stairs before working toward Gym.
    placements:
      - kind: thermite
        floor: 2F
        at: [40.2, 30.0]
        name: "Jacuzzi wall"
        nudge: [-1.2, 0]
        note: "Main Jacuzzi wall; clear the utility on it first"
      - kind: breach
        floor: ROOF
        at: [57.9, 12.8]
        name: "Logistic hatch"
        note: "Pop the Logistic hatch"
      - kind: breach
        floor: 2F
        room: Construction
        note: "Open the Construction single if you can"
      - kind: breach
        floor: 2F
        room: Server Room
        note: "Open the Server wall too"
      - kind: entry
        floor: 2F
        room: Garage (Rafters)
        note: "Shields push Garage up to the window; drone Red stairs"
  - id: clubhouse-gym-attack-highway-plant
    site: gym_bedroom
    side: attack
    operators: [Hibana, Grim, Sledge]
    title: "Highway windows, Grim the hatch, plant the half wall"
    text: >-
      Put a player outside the Highway windows to cut the Bedroom angles; Hibana rappels the far angle and puts
      two pellets on each castle, then claymore the windows for jump-outs. Grim on the Logistic hatch pushes
      them out of Main Hall into Gold; flash and pinch Gold, then jump in and plant on the half wall or the
      half mattress.
    placements:
      - kind: anchor
        floor: 2F
        at: [55.5, 9.0]
        name: "Highway windows"
        note: "Outside on the Central sub-roof; cut off every Bedroom angle"
      - kind: hibana
        floor: 2F
        at: [55.5, 9.0]
        name: "Bedroom window castles"
        nudge: [1.5, 0]
        note: "Rappel the far angle, two pellets on each castle; claymore the windows"
      - kind: anchor
        floor: ROOF
        at: [57.9, 12.8]
        name: "Logistic hatch"
        nudge: [1.5, 0]
        note: "Grim from the hatch pushes them out of Main Hall into Gold"
      - kind: plant
        floor: 2F
        room: Bedroom
        note: "Half wall or the half mattress; Gym weights also work"
  # ---------------------------------------------------------------- 2F CCTV / Cash
  - id: clubhouse-cctv-team-reinforcements
    site: cctv_cash_room
    side: defense
    operators: []
    title: "CCTV / Cash: walls to reinforce"
    text: >-
      Reinforce the two CCTV exterior panels, both Cash to Construction Connector panels, the Server
      panel facing Garage Rafters and the two Server roof panels. Keep the two crouch rotations
      between CCTV and Cash open.
    placements:
      - kind: reinforce
        floor: 2F
        between: [CCTV Room, exterior]
        edge: right
        note: "Two CCTV exterior panels"
      - kind: reinforce
        floor: 2F
        between: [Cash Room, Construction]
        note: "Cash to Construction Connector, both panels"
      - kind: reinforce
        floor: 2F
        room: Server Room
        note: "Server panel facing Rafters and the two Server roof panels"
      - kind: open
        floor: 2F
        between: [CCTV Room, Cash Room]
        note: "Two crouch rotations"
  - id: clubhouse-cctv-garage-door-panels
    site: cctv_cash_room
    side: defense
    operators: []
    title: "Reinforce the Garage door panels"
    text: >-
      All four Garage door panels go down so attackers can't clear Garage from outside. Garage
      Rafters is the zombie spot that holds Garage stairs.
    placements:
      - kind: reinforce
        floor: 1F
        between: [Garage, exterior]
        edge: bottom
        note: "All four Garage door panels"
      - kind: anchor
        floor: 2F
        room: Garage (Rafters)
        note: "Rafters zombie (Jager) on Garage stairs"
  - id: clubhouse-cctv-bandit-trick
    site: cctv_cash_room
    side: defense
    operators: [Bandit]
    title: "Trick the CCTV exterior"
    text: >-
      Batteries on the two CCTV exterior panels, then trick them when the Thermite starts. Keep one
      back for the main Cash wall if they go there instead.
    placements:
      - kind: bandit
        floor: 2F
        between: [CCTV Room, exterior]
        edge: right
        nudge: [-1.2, 0]
        note: "Both panels, trick on the charge"
  - id: clubhouse-cctv-mira-stairs
    site: cctv_cash_room
    side: defense
    operators: [Mira]
    title: "Mira on Eastern Stairs"
    text: >-
      Window on the Eastern Stairs side so CCTV sees the stairs push; Lesion mines both stairs below
      it.
    placements:
      - kind: mira
        floor: 2F
        at: [70.0, 38.0]
        name: "Eastern Stairs wall"
        note: "Usually the CCTV wall facing the stairs"
  - id: clubhouse-cctv-attack-garage-main-wall
    site: cctv_cash_room
    side: attack
    operators: [Thermite, Capitao, Zofia, Montagne]
    title: "Main Cash wall, clear bottom Garage, Montagne up Rafters"
    call: "Thermite opens main Cash wall, clear bottom Garage, Montagne leads up Rafters."
    text: >-
      Thermite opens the main Cash wall. Capitao and Zofia clear bottom Garage: Zofia opens the front door and
      impacts the Castle barricade, then they kill or push out the player tucked downstairs. Once he's gone,
      Montagne walks up Rafters calling where defenders are and Capitao fire-bolts them out; watch the
      jump-up angles on Cash.
    counters: >-
      Bandit or Kaid on the Cash wall: Thatcher or Kali for it, or skip the wall and play Rafters with the
      shield. Castle and a deployable shield on Garage: Zofia's impacts take the barricade.
    placements:
      - kind: thermite
        by: Thermite
        floor: 2F
        between: [Cash Room, exterior]
        edge: bottom
        note: "Main Cash wall; it cuts off anyone rotating while you take Rafters"
      - kind: entry
        by: Zofia
        floor: 1F
        room: Garage
        note: "Open the front door, impact the Castle, clear the tucked player with Capitao"
      - kind: entry
        by: Montagne
        floor: 2F
        room: Garage (Rafters)
        note: "Walk up and call; Capitao fire-bolts off the call (bounce it off the roof)"
  - id: clubhouse-cctv-attack-plants
    site: cctv_cash_room
    side: attack
    operators: [Thermite]
    title: "Tucked plant by the breach, Highway cuts the flank"
    text: >-
      Open the soft wall and walk in, or if Thermite has the bomb, plant tucked by the flat breach while a
      teammate stays downstairs in Lounge for the C4. Someone works the Highway window to cut flanks and tucked
      angles; watch the Construction window and nade a Bandit on the main wall.
    placements:
      - kind: plant
        floor: 2F
        room: CCTV Room
        nudge: [0, 4.0]
        note: "Tucked by the flat breach"
      - kind: anchor
        floor: 1F
        room: Lounge
        note: "Stay downstairs for the C4 on the plant"
      - kind: anchor
        floor: 2F
        at: [70.0, 45.0]
        name: "Highway window"
        note: "Cut flanks and tucked angles; watch the Construction window"
  # ---------------------------------------------------------------- 1F Bar / Stock Room
  - id: clubhouse-bar-team-reinforcements
    site: bar_stock_room
    side: defense
    operators: []
    title: "Bar / Stock: walls and the Gym lid"
    text: >-
      Reinforce the two outer Strip Club walls, the two Kitchen-hallway walls, both Stage walls and
      the main Stock exterior wall. Keep the Strip to site rotate and Bar head holes open.
    placements:
      - kind: reinforce
        floor: 1F
        between: [Stock Room, exterior]
        edge: bottom
        note: "Main Stock exterior wall"
      - kind: reinforce
        floor: 1F
        between: [Kitchen, Bar]
        note: "Two Kitchen-hallway walls"
      - kind: reinforce
        floor: 1F
        between: [Stage, exterior]
        edge: left
        note: "Both Stage walls"
      - kind: reinforce
        floor: 1F
        between: [Strip Club, exterior]
        edge: top
        note: "Two outer Strip Club walls"
      - kind: open
        floor: 1F
        between: [Strip Club, Bar]
        note: "Strip to site rotate"
  - id: clubhouse-bar-kaid-stock
    site: bar_stock_room
    side: defense
    operators: [Kaid]
    title: "Claw the Stock wall"
    text: >-
      Claw the main Stock exterior wall low on the inside. Hibana is the usual threat there, so watch
      for Thatcher first.
    placements:
      - kind: kaid
        floor: 1F
        between: [Stock Room, exterior]
        edge: bottom
        nudge: [1.2, 0]
        note: "Low, inside"
  - id: clubhouse-bar-castle-pulse
    site: bar_stock_room
    side: defense
    operators: [Castle, Pulse]
    title: "Castle the Kitchen hallway, Pulse in Gym"
    text: >-
      Castle panels the Kitchen hallway doors. Pulse plays Gym above over the open Gym-side hatch and
      C4s the plant from above.
    placements:
      - kind: castle
        floor: 1F
        between: [Kitchen, Bar]
        nudge: [1.2, 0]
        note: "Kitchen hallway doors"
      - kind: anchor
        floor: 2F
        room: Gym
        note: "Vertical over Bar"
  - id: clubhouse-bar-attack-stock-wall
    site: bar_stock_room
    side: attack
    operators: [Thermite, Hibana]
    title: "Garage and Lounge cams, then Stock wall and Lounge double"
    text: >-
      Pre-place a drone in Garage and a cam inside Lounge so you take Stock and Garage control early. Make
      lines of sight on the Lounge wall, open the Lounge double and the main Stock wall, then rotate a body
      into Kitchen, drone it out and contest from there.
    placements:
      - kind: drone
        floor: 1F
        room: Garage
        note: "Pre-placed drone for Garage control"
      - kind: drone
        floor: 1F
        room: Lounge
        note: "Cam inside Lounge for Stock control"
      - kind: breach
        floor: 1F
        between: [Lounge, Bar]
        note: "Lounge double, after lines of sight on the wall"
      - kind: breach
        floor: 1F
        between: [Stock Room, exterior]
        edge: bottom
        note: "Main Stock wall"
      - kind: entry
        floor: 1F
        room: Kitchen
        note: "Rotate a body in, drone it out, contest"
  - id: clubhouse-bar-attack-plant
    site: bar_stock_room
    side: attack
    operators: []
    title: "Smoke off and plant on the bar machine"
    text: >-
      As long as the hatch isn't open and nobody plays above, smoke off and plant on the bar machine. If they
      play the Con window or Con hatch, send someone upstairs to the Con window to cut it off; if it stalls,
      backstab strip side and flip the take into Bar.
    placements:
      - kind: plant
        floor: 1F
        room: Bar
        note: "On the bar machine, under smoke"
      - kind: anchor
        floor: 2F
        room: Construction
        note: "Con window: cut off the Con window and hatch player"
      - kind: entry
        floor: 1F
        room: Strip Club
        note: "Backstab strip side if the main take stalls"
  # ---------------------------------------------------------------- B Church / Arsenal Room
  - id: clubhouse-church-team-reinforcements
    site: church_arsenal_room
    side: defense
    operators: []
    title: "Church / Arsenal: walls and hatches"
    text: >-
      Reinforce all three Church to Memorial panels, both Escape Tunnel panels and the Kitchen, Bar
      and Stock Room hatches. Leave the Moto hatch open and keep the Church feet holes.
    placements:
      - kind: reinforce
        floor: B
        between: [Church, Memorial]
        note: "All three panels"
      - kind: reinforce
        floor: B
        between: [Church, Escape Tunnel]
        nudge: [0, 1.5]
        note: "Escape Tunnel, both panels"
      - kind: hatch
        floor: 1F
        at: [56.6, 18.3]
        name: "Kitchen hatch"
        note: "Reinforce"
      - kind: hatch
        floor: 1F
        at: [47.5, 45.9]
        name: "Bar hatch"
        note: "Reinforce"
      - kind: open
        floor: B
        between: [Church, Arsenal Room]
        note: "Church to Arsenal door stays a rotate"
  - id: clubhouse-church-kaid-memorial
    site: church_arsenal_room
    side: defense
    operators: [Kaid]
    title: "Claw the Memorial wall"
    text: >-
      Claws on the Church to Memorial wall; it is the default Ace and Thermite target. Save one claw
      for the Kitchen hatch if the team runs short.
    placements:
      - kind: kaid
        floor: B
        between: [Church, Memorial]
        nudge: [-1.2, 0]
        note: "Low, Church side"
  - id: clubhouse-church-mira-smoke
    site: church_arsenal_room
    side: defense
    operators: [Mira, Smoke]
    title: "Mira the Church wall, gas the Kitchen hatch"
    text: >-
      Mira window on the Church wall so the table sees Memorial. Smoke saves gas for the Kitchen
      hatch and the table plant.
    placements:
      - kind: mira
        floor: B
        between: [Church, Memorial]
        nudge: [-1.2, -2.0]
        note: "Usually the middle panel"
      - kind: anchor
        floor: B
        room: Arsenal Room
        note: "Smoke under the Kitchen hatch"
  - id: clubhouse-church-attack-dirt-kitchen
    site: church_arsenal_room
    side: attack
    operators: [Hibana, Buck, Sledge, Montagne]
    title: "Dirt-Kitchen take: open Dirt, Hibana the hatch, vert"
    text: >-
      Take Main Hallway and drone it all out, then hard breach opens Dirt from the Construction Site side so
      the main stairs window can't peek you. Hibana opens the Kitchen hatch from inside Kitchen, never the
      upside-down rappel, while Buck or Sledge cuts lines of sight with vert; a shield clears Dirt, nade the
      Mira, then drop the hatch and plant safe in Arsenal.
    placements:
      - kind: entry
        floor: 1F
        at: [52.0, 30.0]
        name: "Main Hallway"
        note: "Get control and drone everything out first"
      - kind: breach
        floor: B
        at: [44.0, 22.0]
        name: "Dirt wall (Container)"
        note: "Open it from the Construction Site side, not under the main stairs window"
      - kind: hibana
        floor: 1F
        at: [56.6, 18.3]
        name: "Kitchen hatch"
        nudge: [1.2, 0]
        note: "From inside Kitchen; pellet beside the cade to kill the claw"
      - kind: breach
        floor: 1F
        room: Kitchen
        note: "Buck or Sledge vert onto Arsenal; it still works through their reinforcement"
      - kind: plant
        floor: B
        room: Arsenal Room
        note: "Drop the hatch and plant safe by the crates"
  - id: clubhouse-church-attack-moto-main
    site: church_arsenal_room
    side: attack
    operators: [Nomad, Buck, Thermite]
    title: "Kitchen-Moto split into the Memorial wall"
    text: >-
      Clear Bar and strip side with a cut-off cam; Nomad jabs the Lounge double and the top of main stairs.
      Open the Moto hatch and the Kitchen hatch, walk someone down main stairs, make vert right above the
      triple-wall Mira and bank a nade off it, then open the main Memorial wall and plant on the blue box.
    placements:
      - kind: drone
        floor: 1F
        room: Strip Club
        note: "Cut-off cam strip side at the start"
      - kind: breach
        floor: 1F
        at: [47.5, 45.9]
        name: "Moto hatch"
        note: "Open it once Bar and strip are clear"
      - kind: breach
        floor: 1F
        at: [52.0, 30.0]
        name: "Main Hallway floor"
        note: "Vert right above the triple-wall Mira; bank a nade off it"
      - kind: thermite
        floor: B
        between: [Church, Memorial]
        nudge: [1.2, 0]
        note: "Main Memorial wall, usually Mira'd"
      - kind: plant
        floor: B
        room: Church
        note: "On the blue box"
