map: fortress
# Post-rework layout (Y10S4 Tenfold Pursuit). Room boxes are rough; walls are named the way the guides name them.
briefs:
  # ---------------------------------------------------------------- 2F Commander's Office / Bathroom
  - id: fortress-commanders-team-walls
    site: commanders_office_bathroom
    side: defense
    operators: []
    title: "Bathroom-Briefing wall, Museum panel, Dorms walls"
    text: >-
      Reinforce the left and right Bathroom to Briefing panels, the left Commander's to Museum panel and Briefing to
      Dormitory walls 1 and 2. Commander's back wall goes on late; keep the Central stairs floor holes open.
    placements:
      - kind: reinforce
        floor: 2F
        between: [Bathroom, Briefing Room]
        nudge: [0, -1.0]
        note: "Left and right panels"
      - kind: reinforce
        floor: 2F
        between: [Commander's Office, Museum]
        note: "Left panel"
      - kind: reinforce
        floor: 2F
        between: [Briefing Room, Dormitory]
        note: "Walls 1 and 2"
      - kind: open
        floor: 2F
        between: [Bathroom, Briefing Room]
        nudge: [0, 1.0]
        note: "Top Bathroom-Briefing panel left soft (one deck)"
  - id: fortress-commanders-bandit-bathroom
    site: commanders_office_bathroom
    side: defense
    operators: [Bandit]
    title: "Batteries on the Bathroom-Briefing wall"
    text: >-
      Batteries on both reinforced Bathroom to Briefing panels; the far-right one is the usual Thermite spot. Then
      anchor the Bathroom corner by the tub and re-check after Thatcher's EMP.
    placements:
      - kind: bandit
        floor: 2F
        between: [Bathroom, Briefing Room]
        nudge: [-1.2, 0]
      - kind: bandit
        floor: 2F
        between: [Bathroom, Briefing Room]
        nudge: [1.2, 0]
        note: "Far-right panel"
      - kind: anchor
        floor: 2F
        room: Bathroom
        nudge: [-0.8, 1.0]
        note: "Corner by the tub"
  - id: fortress-commanders-castle
    site: commanders_office_bathroom
    side: defense
    operators: [Castle]
    title: "Barricade the Commander's hallways"
    text: >-
      Castle barricades the hallway doors into Commander's so the fold-back from the towers has cover, then plays the
      black boxes in Commander's.
    placements:
      - kind: castle
        floor: 2F
        between: [Commander's Office, Museum]
        nudge: [0, 1.5]
        note: "Museum-side door (usually)"
      - kind: castle
        floor: 2F
        between: [Commander's Office, Bathroom]
        note: "Bathroom-side door (usually)"
      - kind: anchor
        floor: 2F
        room: Commander's Office
        note: "Black boxes"
  # Attack briefs on this map follow Garfieldisdoc, "How to Attack EVERY Bombsite in Rainbow Six Siege
  # (2026)", https://www.youtube.com/watch?v=1qCEYZwQzes (Fortress from 2:06:41).
  - id: fortress-commanders-attack-white-split
    site: commanders_office_bathroom
    side: attack
    operators: [Thermite, Nomad]
    title: "White stairs split: the main Commander's wall"
    text: >-
      Pre-place a cam in Lobby (or Nomad jabs the double) so nobody flanks bottom White. Take top White, drone
      out the tower and open the main Tower Hallway wall if they give it up; then open the main Commander's
      wall. A player outside Museum cuts off site, and starts the round shooting down the Horse door for
      phantom pressure on the White and Horse rotates.
    placements:
      - kind: drone
        floor: 2F
        at: [57.0, 40.0]
        name: "Lobby (1F)"
        note: "Pre-placed cam or Nomad jab: stop the bottom White flank"
      - kind: entry
        floor: 2F
        at: [59.0, 46.5]
        name: "Top White stairs"
        note: "Take top White, drone out the tower"
      - kind: thermite
        floor: 2F
        between: [Commander's Office, Old Tower]
        note: "Main Commander's wall from Tower Hallway"
      - kind: anchor
        floor: 2F
        room: Museum
        nudge: [-3.0, 0]
        note: "Outside Museum: cut off site; shoot down the Horse door"
  - id: fortress-commanders-attack-tower-drop
    site: commanders_office_bathroom
    side: attack
    operators: [Thermite, Ace, Flores]
    title: "Tower drop: Briefing wall, Courtyard Hall windows, pinch Horse"
    text: >-
      Cam the tower side, open the outside wall from Shisha and the White hallway window for phantom pressure.
      A teammate comes up from Laundry by the Old Tower stairs while the tower player drops; drone Games and
      open the main Briefing wall, rotate one to the Courtyard Hall windows if Briefing is contested, then work
      the Bathroom walls while a lurker pinches Horse.
    placements:
      - kind: breach
        floor: 2F
        room: Old Tower
        nudge: [-2.0, -2.0]
        note: "Hard breach from Shisha; White hallway window too"
      - kind: entry
        floor: 2F
        room: Old Tower
        nudge: [1.5, 1.5]
        note: "Laundry up the Old Tower stairs while the tower drops"
      - kind: thermite
        floor: 2F
        between: [Briefing Room, Courtyard Corridor]
        note: "Main Briefing wall"
      - kind: entry
        floor: 2F
        room: Courtyard Corridor
        nudge: [2.0, 0]
        note: "Courtyard Hall windows if Briefing contests you"
      - kind: breach
        floor: 2F
        between: [Bathroom, Briefing Room]
        note: "Bathroom walls; a lurker pinches Horse"
  # ---------------------------------------------------------------- 2F Dormitory / Games Room
  - id: fortress-dorms-team-walls
    site: dormitory_games_room
    side: defense
    operators: []
    title: "Shut the Dorms breach, close the Bathroom wall"
    text: >-
      Reinforce the Dorms breach toward Vending and cut feet holes, reinforce the Games outside walls and the lower
      Bathroom to Briefing panels. Leave the top panel open as a rotate.
    placements:
      - kind: reinforce
        floor: 2F
        between: [Dormitory, exterior]
        edge: right
        note: "Dorms breach, window side (usually)"
      - kind: reinforce
        floor: 2F
        between: [Games Room, exterior]
        edge: right
        note: "Games outside walls"
      - kind: reinforce
        floor: 2F
        between: [Bathroom, Briefing Room]
        note: "Lower panels 1 and 2"
      - kind: open
        floor: 2F
        between: [Briefing Room, Dormitory]
        note: "Hole to Briefing; sources split on this wall"
  - id: fortress-dorms-kaid-games
    site: dormitory_games_room
    side: defense
    operators: [Kaid]
    title: "Claw the Games outside walls"
    text: >-
      Claw the reinforced Games outside walls, then hold Games from inside the clawed corner.
    placements:
      - kind: kaid
        floor: 2F
        between: [Games Room, exterior]
        edge: right
        nudge: [-0.8, -1.0]
      - kind: kaid
        floor: 2F
        between: [Games Room, exterior]
        edge: right
        nudge: [-0.8, 1.0]
      - kind: anchor
        floor: 2F
        room: Games Room
  - id: fortress-dorms-attack-thermite
    site: dormitory_games_room
    side: attack
    operators: [Montagne, Zofia, Thermite]
    title: "Tower side and Laundry stairs into the single wall"
    text: >-
      Open the Horse door and the White window, keep one player lurking Horse late. A shield takes the tower
      side; Zofia's stuns and impacts clear the shield and wire on the drop. At the same time someone comes up
      from Laundry to the staircase, then open the single wall and the double wall if it's reinforced, and take
      linear fights off the breach and the Horse-side player's crosses.
    placements:
      - kind: entry
        floor: 2F
        room: Museum
        note: "Horse door and White window open early; lurk Horse late"
      - kind: entry
        floor: 2F
        room: Old Tower
        note: "Shield takes the tower; Zofia clears the shield and wire"
      - kind: entry
        floor: 2F
        room: Old Tower
        nudge: [1.5, 2.0]
        note: "From Laundry up the staircase (crouch-walk, not the window)"
      - kind: thermite
        floor: 2F
        between: [Games Room, Old Tower]
        note: "Single wall, then the double if it's reinforced"
  - id: fortress-dorms-attack-flank
    site: dormitory_games_room
    side: attack
    operators: [Thermite, Flores]
    title: "Bathroom wall, the triple wall, backstab from back tower"
    text: >-
      Start one player on the Horse door for the roamer and one in the main balcony window to cut the area.
      Open the single, collapse into the Bathroom hallway and Courtyard hallway and watch the swing, then open
      the main triple wall. When they fall back, a Flores works back tower late and backstabs.
    placements:
      - kind: anchor
        floor: 2F
        room: Museum
        nudge: [-2.0, 2.0]
        note: "Horse door: cut off the Bathroom-side roamer"
      - kind: anchor
        floor: 2F
        room: Courtyard Corridor
        nudge: [3.0, 0]
        note: "Main balcony window"
      - kind: breach
        floor: 2F
        room: Bathroom
        note: "Open the single, take the Bathroom hallway"
      - kind: thermite
        floor: 2F
        between: [Dormitory, Courtyard Corridor]
        note: "Main triple wall"
      - kind: entry
        floor: 2F
        room: Old Tower
        note: "Flores late from back tower: the backstab"
  # ---------------------------------------------------------------- 1F Waiting Room / Cafeteria
  - id: fortress-cafe-team-walls
    site: waiting_room_cafeteria
    side: defense
    operators: []
    title: "Seal Oven, keep the Briefing hatch open"
    text: >-
      Reinforce all three Oven (Kitchen) triple-wall panels, both Hammam-side panels and the Cafeteria to main hallway
      wall, plus the left and middle Bathroom-Briefing panels on 2F. Keep the Kitchen to Waiting crouch rotate and the
      Briefing hatch open.
    placements:
      - kind: reinforce
        floor: 1F
        room: Kitchen
        note: "Oven triple wall, all three panels"
      - kind: reinforce
        floor: 2F
        between: [Bathroom, Briefing Room]
        note: "Left and middle panels (over the site)"
      - kind: open
        floor: 1F
        between: [Cafeteria, Infirmary]
        note: "Cafeteria/Infirmary gap with head holes"
      - kind: open
        floor: 2F
        at: [64.2, 63.4]
        name: "Briefing hatch"
        note: "Left open; Melusi holds it over Waiting"
  - id: fortress-cafe-kaid-oven
    site: waiting_room_cafeteria
    side: defense
    operators: [Kaid]
    title: "Claw the Oven wall"
    text: >-
      Claw two of the three Oven wall panels, then play the Cafeteria power spot. Don't stand behind the wall itself;
      Thermite and Hibana target it.
    placements:
      - kind: kaid
        floor: 1F
        room: Kitchen
        nudge: [-0.8, 0]
      - kind: kaid
        floor: 1F
        room: Kitchen
        nudge: [0.8, 0]
      - kind: anchor
        floor: 1F
        room: Cafeteria
        note: "Power spot"
  - id: fortress-cafe-attack-dining-wall
    site: waiting_room_cafeteria
    side: attack
    operators: [Thermite, Gridlock, Nomad]
    title: "Lobby side: open the main wall from Dining"
    text: >-
      Don't fight Laundry. Split in two: one group takes Courtyard Hall and Lobby with pre-placed cut-off cams
      and Gridlock or Nomad on the staircase, the other pushes from Hammam and Sitting. Get to White stairs, put
      a player in Gun Room for the flank, then open the main wall from Dining; you can't plant at the breach,
      so take control and get deep into Cafeteria.
    placements:
      - kind: drone
        floor: 1F
        room: Dining Room
        note: "Pre-placed cut-off cam"
      - kind: entry
        floor: 1F
        room: Courtyard
        note: "Courtyard Hall and Lobby; Trax or jabs on the staircase"
      - kind: anchor
        floor: 1F
        room: Gun Room
        note: "Cut off the flank"
      - kind: thermite
        floor: 1F
        between: [Kitchen, Dining Room]
        note: "Main wall from the Dining side"
      - kind: plant
        floor: 1F
        room: Cafeteria
        note: "Deep: the plant spot is awkward"
  - id: fortress-cafe-attack-briefing
    site: waiting_room_cafeteria
    side: attack
    operators: [Nomad, Gridlock]
    title: "Flip to Infirmary, or open the Briefing hatch"
    text: >-
      If they reinforce Infirmary off and give it up, open the Courtyard door and everybody pushes Infirmary
      while someone takes Laundry for the flank. Go for the one wall, flash out the stove, double up on the
      planter and plant in Waiting. For a split, rappel into Briefing, open the hatch and cut the door, the
      Infirmary wall and the stove rotate from above.
    placements:
      - kind: entry
        floor: 1F
        room: Infirmary
        note: "Push Infirmary through the Courtyard door"
      - kind: breach
        floor: 1F
        between: [Infirmary, Waiting Room]
        note: "The one wall; flash the stove"
      - kind: plant
        floor: 1F
        room: Waiting Room
        note: "Double up on the planter"
      - kind: breach
        floor: 2F
        at: [64.2, 63.4]
        name: "Briefing hatch"
        note: "Rappel into Briefing, open the hatch, cut every angle"
  # ---------------------------------------------------------------- 1F Hammam / Sitting Room
  - id: fortress-hammam-team-walls
    site: hammam_sitting_room
    side: defense
    operators: []
    title: "Keep the Sitting wall shut"
    text: >-
      Reinforce both Sitting Room outside wall panels and both Showers to Hammam panels. Never reinforce the Gun Room
      rotate, and keep the hallway rotate beside the outside wall open.
    placements:
      - kind: reinforce
        floor: 1F
        between: [Sitting Room, exterior]
        edge: right
        note: "Both panels"
      - kind: reinforce
        floor: 1F
        between: [Showers, Hammam]
        note: "Both panels"
      - kind: open
        floor: 1F
        between: [Gun Room, Hammam]
        note: "Gun Room rotate, never reinforced"
      - kind: hatch
        floor: 2F
        at: [62.2, 54.0]
        name: "2F hatch over Sitting Room"
        note: "Guides reinforce the Horse hatch; which hatch that is is not verified"
  - id: fortress-hammam-traps
    site: hammam_sitting_room
    side: defense
    operators: [Frost, Thorn]
    title: "Trap Showers, Hammam windows and Gun Room"
    text: >-
      Thorn traps the Showers and Hammam windows; Frost mats Gun Room and holds it behind a shield.
    placements:
      - kind: trap
        floor: 1F
        room: Showers
        note: "Showers windows"
      - kind: trap
        floor: 1F
        between: [Hammam, exterior]
        edge: left
        note: "Hammam windows"
      - kind: trap
        floor: 1F
        room: Gun Room
        note: "Frost mats"
  - id: fortress-hammam-attack-thermite
    site: hammam_sitting_room
    side: attack
    operators: [Thermite, Montagne, Glaz]
    title: "Open the main Sitting wall, jump the window"
    text: >-
      Simply go for the Sitting wall: open the main wall, and jump in the window next to it to take Gun Room and
      their crosses. Bring smokes (Montagne or Glaz help), smoke off the double and close, then jump in and
      plant on the little half wall; watch for vertical.
    placements:
      - kind: thermite
        floor: 1F
        between: [Sitting Room, exterior]
        edge: right
        note: "Main Sitting wall"
      - kind: entry
        floor: 1F
        between: [Sitting Room, exterior]
        edge: right
        nudge: [0, 1.5]
        note: "Jump in the window"
      - kind: anchor
        floor: 1F
        room: Gun Room
        note: "Gun Room control: their crosses"
      - kind: plant
        floor: 1F
        room: Sitting Room
        note: "On the little half wall, smoke the double and close"
  - id: fortress-hammam-attack-window
    site: hammam_sitting_room
    side: attack
    operators: []
    title: "If they play vert: phantom windows, tower drop, Museum hatch"
    text: >-
      If they play vertical, open the main hallway window and the Horse door for phantom pressure and play
      outside Horse instead of walking in. Teammates drop the tower and one comes Lobby, take the space up to
      Museum and open the hatch: it cuts every line of sight in site and forces them to flank up White, so
      hold a gun there with claymores while the planter walks in and plants tucked.
    placements:
      - kind: anchor
        floor: 2F
        room: Museum
        nudge: [-3.0, 0]
        note: "Outside the Horse door; open the hallway window too"
      - kind: entry
        floor: 2F
        room: Old Tower
        note: "Drop the tower; one more comes Lobby"
      - kind: breach
        floor: 2F
        room: Museum
        nudge: [0, 3.0]
        note: "Museum hatch: cuts every line of sight in site"
      - kind: plant
        floor: 1F
        room: Sitting Room
        nudge: [0, 2.0]
        note: "Tucked"
