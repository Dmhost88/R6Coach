map: calypso_casino
# Standard setups for Calypso Casino (launched June 2026). Built 2026-11-06 from maps/calypso_casino.yaml,
# callouts/calypso_casino.yaml and the blueprints. New map: room names come from guides, not Ubisoft, and
# setups are still settling, so treat these as the common starting point rather than the meta.
briefs:
  # ---------------------------------------------------------------- 2F Cigar Room / 2F Pool
  - id: calypso-cigar-pool-team-walls
    site: cigar_room_pool
    side: defense
    operators: []
    title: "Kitchen wall, Lobby walls, Barista half"
    text: >-
      Reinforce both Kitchen outside wall panels and both Pool walls to Lobby first. Then the Pool-bar half
      of the Barista/Pool wall, one half of the Cigar/Pool wall and the Humidor hatch. Keep the small
      Barista/Pool rotate, the Cigar/Pool high holes and the Kitchen/Cigar low holes.
    placements:
      - kind: reinforce
        floor: 2F
        between: [Kitchen, exterior]
        edge: left
        nudge: [0, -1.2]
        note: "Kitchen outside wall, panel 1"
      - kind: reinforce
        floor: 2F
        between: [Kitchen, exterior]
        edge: left
        nudge: [0, 1.2]
        note: "Panel 2"
      - kind: reinforce
        floor: 2F
        between: [Pool, Lobby]
        nudge: [0, -1.2]
        note: "Lobby wall 1"
      - kind: reinforce
        floor: 2F
        between: [Pool, Lobby]
        nudge: [0, 1.2]
        note: "Lobby wall 2"
      - kind: reinforce
        floor: 2F
        between: [Barista, Pool]
        nudge: [1.0, 0]
        note: "Pool-bar half"
      - kind: rotate
        floor: 2F
        between: [Barista, Pool]
        nudge: [-1.0, 0]
        note: "Small Barista/Pool rotate"
      - kind: reinforce
        floor: 2F
        between: [Cigar Room, Pool]
        nudge: [0, 1.2]
        note: "One half"
      - kind: open
        floor: 2F
        between: [Cigar Room, Pool]
        nudge: [0, -1.2]
        note: "Rotate and high holes"
      - kind: open
        floor: 2F
        between: [Kitchen, Cigar Room]
        note: "Low holes for the Cigar desk"
      - kind: hatch
        floor: 2F
        at: [60.2, 56.7]
        name: "Humidor hatch"
  - id: calypso-cigar-pool-kaid-kitchen
    site: cigar_room_pool
    side: defense
    operators: [Kaid, Mute]
    title: "Claw the Kitchen wall, hold from the Cigar desk"
    text: >-
      Kaid claws the Kitchen outside wall and holds it from the Cigar desk through the low holes, not from
      the wall itself: Thermite hits hard through it. Mute can jam the wall instead if Kaid is banned.
    placements:
      - kind: kaid
        floor: 2F
        between: [Kitchen, exterior]
        edge: left
        nudge: [1.0, -1.2]
        note: "Panel 1, low"
      - kind: kaid
        floor: 2F
        between: [Kitchen, exterior]
        edge: left
        nudge: [1.0, 1.2]
        note: "Panel 2, low"
      - kind: anchor
        floor: 2F
        room: Cigar Room
        note: "Cigar desk"
  - id: calypso-cigar-pool-mira-lobby
    site: cigar_room_pool
    side: defense
    operators: [Mira]
    title: "Mira on the Lobby-facing Pool wall"
    text: >-
      The Lobby-facing Pool wall is the usual Mira spot; put it on a reinforced Lobby panel to watch the
      Lobby side. Guides disagree on how high, so test the angle in a custom.
    placements:
      - kind: mira
        floor: 2F
        between: [Pool, Lobby]
        nudge: [-1.0, 0]
        note: "On a reinforced Lobby panel"
      - kind: anchor
        floor: 2F
        room: Pool
        note: "Pool bar"
  # Attack briefs on this map follow Garfieldisdoc, "How to Attack EVERY Bombsite in Rainbow Six Siege
  # (2026)", https://www.youtube.com/watch?v=1qCEYZwQzes (Calypso Casino from 36:55).
  - id: calypso-cigar-pool-thermite-kitchen
    site: cigar_room_pool
    side: attack
    operators: [Thermite, Ace, Ying]
    title: "Tequila cam, Kitchen breach, push Barista, open the bar"
    text: >-
      Pre-place a cam on the Tequila stairs in prep for the C4 roamer and take the staircase early. Open the
      Kitchen wall with any hard breach and keep a player on it to cut the Barista rotate, then push Barista
      in steps off the windows, shooting the Mez barricade for phantom pressure. End goal: open the bar wall
      and plant on the bar.
    placements:
      - kind: drone
        floor: 2F
        at: [60.0, 30.0]
        name: "Tequila stairs"
        note: "Pre-place a cam in prep; watch for the C4 roamer"
      - kind: thermite
        floor: 2F
        between: [Kitchen, exterior]
        edge: left
        nudge: [-0.8, 0]
        note: "Open it; hold the breach to cut the Barista rotate"
      - kind: entry
        floor: 2F
        room: Barista
        note: "Push in steps; mind the shield and the Mira"
      - kind: ace
        floor: 2F
        between: [Barista, Pool]
        nudge: [0, -1.0]
        note: "Open the bar wall"
      - kind: plant
        floor: 2F
        room: Pool
        nudge: [0, -2.5]
        note: "On the bar"
  - id: calypso-cigar-pool-vertical-aqua
    site: cigar_room_pool
    side: attack
    operators: [Buck, Sledge, Gridlock]
    title: "Vertical from below, or take Aqua"
    text: >-
      Vertical is underrated here: from the 1F Bathroom and Roulette, shoot up under the bar to cut the 90
      and the Aqua rotate. Without vertical, take Aqua hall with one player on the Cigar Balcony window to
      cut the box and the swing around site, then 3-2-1 the push and clear utility as you go.
    placements:
      - kind: breach
        floor: 1F
        room: Roulette
        note: "Shoot up under the bar and the 90"
      - kind: entry
        floor: 2F
        at: [57.4, 49.0]
        name: "Cigar Balcony window"
        note: "Cut the box and the swing around site"
      - kind: anchor
        floor: 2F
        room: Aqua
        note: "Take Aqua hall, then push in together"
      - kind: plant
        floor: 2F
        room: Pool
        nudge: [0, -2.5]
        note: "On the bar"
  # ---------------------------------------------------------------- 1F Blackjack / 1F Poker
  - id: calypso-blackjack-poker-team-walls
    site: blackjack_poker
    side: defense
    operators: []
    title: "Blackjack exterior, Bathroom and Roulette walls"
    text: >-
      Reinforce both halves of the Blackjack exterior wall, the Bathroom north double wall, the right side
      of the Roulette/Bathroom wall and one half of Blackjack/Secret. Leave the Humidor hatch open and play
      it from above, and keep Blackjack to Poker open.
    placements:
      - kind: reinforce
        floor: 1F
        between: [Blackjack, exterior]
        edge: bottom
        nudge: [-1.0, 0]
        note: "Left half"
      - kind: reinforce
        floor: 1F
        between: [Blackjack, exterior]
        edge: bottom
        nudge: [1.0, 0]
        note: "Right half"
      - kind: reinforce
        floor: 1F
        at: [54.0, 51.1]
        name: "Bathroom north wall"
        note: "Both, position approximate"
      - kind: reinforce
        floor: 1F
        between: [Roulette, Bathroom]
        note: "Right side"
      - kind: reinforce
        floor: 1F
        between: [Blackjack, Secret]
        note: "One half; rotate into Secret"
      - kind: open
        floor: 2F
        at: [60.2, 56.7]
        name: "Humidor hatch"
        note: "Held open from above"
      - kind: rotate
        floor: 1F
        between: [Blackjack, Poker]
  - id: calypso-blackjack-poker-kaid-blackjack
    site: blackjack_poker
    side: defense
    operators: [Kaid, Bandit, Mute]
    title: "Deny the Blackjack exterior"
    text: >-
      The Blackjack exterior is the Thermite wall; put claws or batteries low on both halves, or Mute
      jammers if Ace is expected. Kaid usually then plays Roulette and Poker.
    placements:
      - kind: kaid
        floor: 1F
        between: [Blackjack, exterior]
        edge: bottom
        nudge: [-1.0, -1.2]
      - kind: bandit
        floor: 1F
        between: [Blackjack, exterior]
        edge: bottom
        nudge: [1.0, -1.2]
        note: "If Bandit instead"
      - kind: anchor
        floor: 1F
        room: Roulette
        note: "Kaid after the claws"
  - id: calypso-blackjack-poker-thermite
    site: blackjack_poker
    side: attack
    operators: [Thermite, Ying, Capitao]
    title: "Secret control, the Crane wall, plant deep on the table"
    text: >-
      Drone Secret first; with little utility, force into it, and if they reinforced it off, hard breach it.
      Open the main Crane wall, keep someone on the rappel angles and push Lobby (Registration) to keep the
      Vending player's eyes off the breach. Smoke off the breach and plant deep on the Blackjack table.
    placements:
      - kind: anchor
        floor: 1F
        room: Secret
        note: "Take it; breach it if they reinforced it off"
      - kind: thermite
        floor: 1F
        between: [Blackjack, exterior]
        edge: bottom
        nudge: [-1.0, 0.8]
        note: "The main Crane wall"
      - kind: entry
        floor: 1F
        at: [59.5, 66.0]
        name: "Crane rappel"
        note: "Rappel angles make the retake very hard"
      - kind: anchor
        floor: 1F
        room: Lobby
        note: "Registration: make noise, pressure the Aqua side"
      - kind: plant
        floor: 1F
        room: Blackjack
        nudge: [0, 4.0]
        note: "Deep on the table, under smoke"
  - id: calypso-blackjack-poker-vertical
    site: blackjack_poker
    side: attack
    operators: [Buck, Sledge, Nomad]
    title: "Pool Ruins balcony and vertical over site"
    text: >-
      No hard breach? Come up on Pool Ruins, take the balcony to Lobby and the Aqua window, and drone out the
      hatch players. From above you can open half the site: behind the bar, the Bathroom rotate, the hatch,
      Vending and the Vending door; the vent drone hole sees anyone tucked behind the bar.
    placements:
      - kind: entry
        floor: 2F
        at: [66.0, 53.0]
        name: "Pool Ruins balcony"
        note: "Take the balcony to Lobby"
      - kind: entry
        floor: 2F
        at: [54.0, 61.7]
        name: "Aqua window"
        note: "Cut whoever plays the hatch"
      - kind: breach
        floor: 2F
        room: Cigar Room
        note: "Vertical behind the bar and on the Bathroom rotate"
      - kind: breach
        floor: 2F
        room: Humidor
        note: "Vertical on Vending and the hatch side"
      - kind: plant
        floor: 1F
        room: Blackjack
        nudge: [-1.0, 1.5]
  # ---------------------------------------------------------------- 1F Bar / 1F Betting
  - id: calypso-bar-betting-team-walls
    site: bar_betting
    side: defense
    operators: []
    title: "Janitor wall, the floor above, Bathroom wall"
    text: >-
      Reinforce both Bar/Janitor panels, the hatch over Bar on 2F and both Bathroom/Blackjack panels. Keep
      the Bar/Betting counter rotate and the Betting to Roulette head holes. Nobody stands on the Janitor
      wall: Thermite and Hibana go through it.
    placements:
      - kind: reinforce
        floor: 1F
        between: [Bar, Janitor]
        nudge: [0, -1.2]
        note: "Panel 1"
      - kind: reinforce
        floor: 1F
        between: [Bar, Janitor]
        nudge: [0, 1.2]
        note: "Panel 2"
      - kind: hatch
        floor: 2F
        at: [63.4, 33.4]
        name: "Barista hatch (over Bar)"
        note: "Guides call it the Kitchen-floor hatch"
      - kind: reinforce
        floor: 1F
        between: [Bathroom, Blackjack]
        note: "Both panels"
      - kind: rotate
        floor: 1F
        between: [Bar, Betting]
        note: "Counter rotate"
      - kind: open
        floor: 1F
        between: [Betting, Roulette]
        note: "Rotate with head holes"
  - id: calypso-bar-betting-kaid-janitor
    site: bar_betting
    side: defense
    operators: [Kaid]
    title: "Claw the Janitor wall"
    text: >-
      Kaid claws both Janitor panels and plays the thick Bar pillar, off the wall. Expect Kali to lance the
      claws from Garden Ruins before Hibana.
    placements:
      - kind: kaid
        floor: 1F
        between: [Bar, Janitor]
        nudge: [-1.0, -1.2]
      - kind: kaid
        floor: 1F
        between: [Bar, Janitor]
        nudge: [-1.0, 1.2]
      - kind: anchor
        floor: 1F
        room: Bar
        note: "Bar pillar"
  - id: calypso-bar-betting-mira-bathroom
    site: bar_betting
    side: defense
    operators: [Mira, Castle]
    title: "Mira on Bathroom/Blackjack, Castle on Roulette"
    text: >-
      The late anchor falls to Bathroom by about 1:45 with a Mira on the Bathroom/Blackjack wall. Castle
      panels the Roulette doors for the crossfire.
    placements:
      - kind: mira
        floor: 1F
        between: [Bathroom, Blackjack]
        nudge: [-1.0, 0]
      - kind: castle
        floor: 1F
        between: [Roulette, Bathroom]
        nudge: [0, -1.2]
        note: "Roulette door, approximate"
  - id: calypso-bar-betting-vertical
    site: bar_betting
    side: attack
    operators: [Buck, Sledge]
    title: "Vertical from Kitchen and Barista"
    text: >-
      Start with vertical: Buck or Sledge in Kitchen and Barista open lines on the site so a Mira and most of
      site are cut off, and work for the small hatch in the middle of site. With the hatch open and players
      above, the defenders have so many angles to watch that the plant below is easy.
    placements:
      - kind: breach
        floor: 2F
        room: Kitchen
        note: "Vertical over Bar; cut the Mira"
      - kind: breach
        floor: 2F
        room: Barista
        note: "More vertical over site"
      - kind: breach
        floor: 2F
        at: [59.5, 36.5]
        name: "Hatch over the middle of site"
        note: "Open it to cut every rotate"
  - id: calypso-bar-betting-roulette-side
    site: bar_betting
    side: attack
    operators: [Ace, Hibana, Gridlock]
    title: "Red Register take, plant in front of the breach"
    text: >-
      While vertical is going, work toward Red Register: drone Bathroom and Roulette clear, then open the
      Betting wall to cut the rotates and plant right in front of the breach. Teammates on Tequila stairs
      cut the rotate; a second hard breach opens the Bathroom wall to play off the vertical.
    placements:
      - kind: drone
        floor: 1F
        room: Roulette
        note: "Make sure Bathroom and Roulette are clear"
      - kind: ace
        floor: 1F
        between: [Betting, Roulette]
        nudge: [0, 1.0]
        note: "The Betting wall"
      - kind: anchor
        floor: 1F
        at: [61.0, 22.5]
        name: "Tequila stairs"
        note: "Cut the rotate"
      - kind: hibana
        floor: 1F
        between: [Bathroom, Roulette]
        note: "Second breach: the Bathroom wall"
      - kind: plant
        floor: 1F
        room: Betting
        note: "Right in front of the breach"
  # ---------------------------------------------------------------- B CCTV / B Vault Checkpoint
  - id: calypso-cctv-vc-team-walls
    site: cctv_vault_checkpoint
    side: defense
    operators: []
    title: "Vault wall, Manager's Office, the Cash side"
    text: >-
      Reinforce both halves of the Vault exterior wall and both halves of the Manager's Office wall, then the
      site wall to Cash Counting. Keep the Cash Counting to site path open until late.
    placements:
      - kind: reinforce
        floor: B
        at: [68.7, 46.6]
        name: "Vault exterior wall"
        note: "Both halves; position approximate"
      - kind: reinforce
        floor: B
        between: [Lockers, Manager's Office]
        note: "Manager's Office wall, both halves"
      - kind: reinforce
        floor: B
        between: [Cash Counting, Vault Checkpoint]
        note: "Late, beside the site desk"
  - id: calypso-cctv-vc-kaid-vault
    site: cctv_vault_checkpoint
    side: defense
    operators: [Kaid]
    title: "Claw the Vault wall"
    text: >-
      Kaid claws the Vault exterior wall, then boosts to watch Lockers. Flores drones go for the claws, so
      shoot them on sight.
    placements:
      - kind: kaid
        floor: B
        at: [68.7, 46.6]
        name: "Vault exterior wall"
        nudge: [-1.0, -1.2]
      - kind: kaid
        floor: B
        at: [68.7, 46.6]
        name: "Vault exterior wall"
        nudge: [1.0, -1.2]
      - kind: anchor
        floor: B
        room: Vault Checkpoint
        note: "Boost, watching Lockers"
  - id: calypso-cctv-vc-castle-manager
    site: cctv_vault_checkpoint
    side: defense
    operators: [Castle, Azami]
    title: "Block the Manager's window"
    text: >-
      Castle (or Azami with a Kiba) blocks the Manager's window and plays Cash Counting behind it.
    placements:
      - kind: castle
        floor: B
        between: [Manager's Office, Cash Counting]
        note: "Manager's window, approximate"
      - kind: anchor
        floor: B
        room: Cash Counting
  - id: calypso-cctv-vc-green-cash
    site: cctv_vault_checkpoint
    side: attack
    operators: [Zofia, Buck, Thermite]
    title: "Green side: vertical on the trick, down Green stairs"
    text: >-
      Two players push Green side, by the big Casino sign and the façade rappel, working toward Weapon Cache.
      If they Bandit-trick the wall, go above and pop the hatch or make vertical on the trickster, then
      work down Green (Bar) stairs. Drone out, look toward Weapon Cache, open the wall into site and it's
      usually a free plant; vertical from Roulette and the Bathroom hatch cuts the rest.
    placements:
      - kind: entry
        floor: 1F
        at: [74.0, 40.0]
        name: "Façade rappel by the Casino sign"
        note: "Green side way in"
      - kind: breach
        floor: 1F
        room: Bar
        note: "Pop the hatch or vertical on the wall trickster"
      - kind: anchor
        floor: B
        at: [69.0, 36.0]
        name: "Green (Bar) stairs"
        note: "Work down, then look toward Weapon Cache"
      - kind: thermite
        floor: B
        between: [Cash Counting, Vault Checkpoint]
        nudge: [0, -0.8]
        note: "Open the site wall"
      - kind: plant
        floor: B
        room: Vault Checkpoint
        nudge: [0, -2.5]
        note: "Usually a free plant"
  - id: calypso-cctv-vc-stairs
    site: cctv_vault_checkpoint
    side: attack
    operators: [Buck, Sledge, Gridlock]
    title: "Yellow take with Lobby vertical"
    text: >-
      Skip the Vault wall if they Bandit-trick it. Three players take Yellow: one fights the Yellow player
      through the window while a vertical operator goes up into Lobby and makes vertical on him so he can't
      swing. Hold an angle and refrag, with a teammate outside the hallway to collapse on Elevator or the
      rotate.
    placements:
      - kind: entry
        floor: B
        at: [60.0, 47.0]
        name: "Yellow window"
        note: "Fight the Yellow player from here"
      - kind: breach
        floor: 1F
        room: Lobby
        note: "Vertical on the Yellow player"
      - kind: anchor
        floor: B
        at: [61.7, 52.8]
        name: "Outside the Yellow hallway"
        note: "Collapse on Elevator or the rotate"
      - kind: plant
        floor: B
        room: CCTV
