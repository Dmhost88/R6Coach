# Standard setup briefs for Kafe Dostoyevsky. See README.md in this folder for the format.
# Positions: room boxes from layout/kafe_dostoyevsky.yaml where they fit; `at` points read off
# Ubisoft's blueprints (data/maps/kafe_dostoyevsky/). The building is drawn small and the room boxes
# are rough, so where the layout can't pin a named wall the icon sits in the room it belongs to and
# the note names the wall. Slang rooms (Piano, Pillar, VIP, Small Bake, Bar Storage) have no box.
map: kafe_dostoyevsky
briefs:
  # ---------------------------------------------------------------- 3F Cocktail Lounge / Bar
  - id: kafe-cocktail-team-reinforcements
    site: cocktail_lounge_bar
    side: defense
    operators: []
    title: "Cocktail / Bar: Piano and Freezer walls"
    text: >-
      Reinforce both halves of the Piano wall facing Top Red, both Freezer / Bar Storage walls, the
      left half of the Cocktail wall facing Top White and the Cocktail wall on the Trash side. The Bar
      to Cocktail doorway is the rotate; don't open extra holes toward Cigar.
    placements:
      - kind: reinforce
        floor: 3F
        room: Bar Freezer
        note: "Both Freezer / Bar Storage walls"
      - kind: reinforce
        floor: 3F
        room: Red Stairs
        note: "Piano wall facing Top Red, both halves"
      - kind: reinforce
        floor: 3F
        between: [Cocktail Lounge, White Stairs]
        note: "Cocktail wall facing Top White, left half"
      - kind: rotate
        floor: 3F
        between: [Bar, Cocktail Lounge]
        note: "Main rotate, keep it clean"
  - id: kafe-cocktail-kaid-freezer
    site: cocktail_lounge_bar
    side: defense
    operators: [Kaid, Bandit, Clash]
    title: "Deny the Freezer walls"
    text: >-
      Claws or batteries on both Freezer / Bar Storage walls; they are the main hard-breach lane into
      Bar. Clash can wait in Freezer to stall the Bar entry.
    placements:
      - kind: kaid
        floor: 3F
        room: Bar Freezer
        nudge: [1.2, 0]
        note: "Both panels, low"
      - kind: anchor
        floor: 3F
        room: Bar Freezer
        nudge: [-1.2, 0]
        note: "Clash or Smoke"
  - id: kafe-cocktail-azami-piano
    site: cocktail_lounge_bar
    side: defense
    operators: [Azami, Thorn, Mute]
    title: "Lock Piano, trap the hatches"
    text: >-
      Azami barriers close the Piano lines and hold Top Red. Thorn blooms go on the hatches and the
      Cocktail door, and Mute jams the drone hole and hatch.
    placements:
      - kind: deployable
        floor: 3F
        room: Red Stairs
        nudge: [0, 2.0]
        note: "Azami barriers on Piano lines"
      - kind: trap
        floor: 3F
        at: [63.6, 52.1]
        name: "3F hatch by Top Red"
        note: "Thorn bloom"
      - kind: trap
        floor: ROOF
        room: Skylight
        note: "Watch the Skylight take with a trap or cam"
  # Attack briefs on this map follow Garfieldisdoc, "How to Attack EVERY Bombsite in Rainbow Six Siege
  # (2026)", https://www.youtube.com/watch?v=1qCEYZwQzes (Kafe from 2:23:05).
  - id: kafe-cocktail-attack-cigar-bar
    site: cocktail_lounge_bar
    side: attack
    operators: [Thermite, Brava, Nomad]
    title: "Cigar Shop over: hatches, Cigar windows, Freezer wall"
    text: >-
      Pop the roof hatches, open the main wall and the Cigar windows at the start and pressure whoever
      contests Cigar Shop; Brava is strong against all the utility. Rappel Cigar side, shoot the default
      camera and have a teammate watch the bottom White window, then Thermite the Freezer wall with
      someone on White flank and plant on the trash bags or default.
    placements:
      - kind: breach
        floor: ROOF
        at: [61.3, 52.0]
        name: "Roof hatch over Top Red"
        note: "Pop the hatches at the start"
      - kind: entry
        floor: 3F
        room: Cigar Balcony
        note: "Cigar-side rappel: open the windows, shoot the default camera"
      - kind: anchor
        floor: 2F
        at: [72.5, 59.8]
        name: "Bottom White window (Terrace)"
        note: "Teammate watches it to cut anyone running down to the rappel"
      - kind: thermite
        floor: 3F
        room: Bar Freezer
        nudge: [0, 2.0]
        note: "Freezer wall; someone watches White flank"
      - kind: plant
        floor: 3F
        room: Bar
        note: "On the trash bags if the wall gives space, else default"
  - id: kafe-cocktail-attack-skylight
    site: cocktail_lounge_bar
    side: attack
    operators: [Ying, Nomad, Buck]
    title: "Cocktail over: Skylight rappels and the White window"
    text: >-
      Put people on the Skylight rappels and claymore or open the bottom White window, with one player
      on it to cut the stairs. Someone gets in below on the Reading side to play vertical while another
      walks up White behind the window cut-off. The Skylight player watches the Freezer, Trash and Cigar
      Shop doors; rappel in and plant for the window across from you.
    placements:
      - kind: entry
        floor: ROOF
        room: Skylight
        note: "Rappel here; swap between the Freezer, Trash and CS doors"
      - kind: anchor
        floor: 2F
        at: [72.5, 59.8]
        name: "Bottom White window (Terrace)"
        note: "Open it and claymore it to cut the staircase"
      - kind: entry
        floor: 2F
        room: Reading Room
        note: "Get in below and play vertical"
      - kind: entry
        floor: 3F
        room: White Stairs
        note: "Walk up White once the window has them cut off"
      - kind: plant
        floor: 3F
        room: Cocktail Lounge
        note: "Plant for the window across from you"
  # ---------------------------------------------------------------- 2F Fireplace Hall / Mining Room
  - id: kafe-mining-team-reinforcements
    site: fireplace_hall_mining_room
    side: defense
    operators: []
    title: "Mining: back walls and the White double wall"
    text: >-
      Reinforce both Mining back walls, both White double wall panels, the big window wall and the
      wall left of the rotate toward bottom Red. Keep the vault rotate left of the window and the
      feet holes toward Train Museum.
    placements:
      - kind: reinforce
        floor: 2F
        between: [Mining Room, exterior]
        edge: bottom
        note: "Both Mining back walls"
      - kind: reinforce
        floor: 2F
        between: [Mining Room, White Stairs]
        note: "White double wall, both panels"
      - kind: open
        floor: 2F
        between: [Fireplace Hall, Train Museum]
        note: "Feet holes toward Train Museum"
  - id: kafe-mining-mute-melusi
    site: fireplace_hall_mining_room
    side: defense
    operators: [Mute, Melusi]
    title: "Double door denial"
    text: >-
      Mute jammers and Melusi Banshees on the Train Museum double door; Melusi saves one for Red.
      Mute anchors the tight window rotate in Mining.
    placements:
      - kind: trap
        floor: 2F
        between: [Fireplace Hall, Train Museum]
        nudge: [1.2, 0]
        note: "Banshee and jammer on the double door"
      - kind: anchor
        floor: 2F
        room: Mining Room
        note: "Window rotate"
  - id: kafe-mining-kaid
    site: fireplace_hall_mining_room
    side: defense
    operators: [Kaid]
    title: "Claw the Mining walls"
    text: >-
      Claws on the White double wall and the Mining back walls, with holes kept so the claws don't
      blind the site.
    placements:
      - kind: kaid
        floor: 2F
        between: [Mining Room, White Stairs]
        nudge: [-1.0, 0]
        note: "White double wall"
      - kind: kaid
        floor: 2F
        between: [Mining Room, exterior]
        edge: bottom
        nudge: [1.2, 0]
        note: "Back walls"
  - id: kafe-mining-attack-vertical
    site: fireplace_hall_mining_room
    side: attack
    operators: [Sledge, Buck, Montagne]
    title: "Top down: hatch, Red wall, Cigar vertical"
    text: >-
      Open the roof hatch and work the Red wall; if it's soft with key holes, just open it. Pre-place a
      cut-off cam in the drone phase to hear anyone coming down Brown or Red, then walk up Red. Once you
      have Cigar control, make vertical on B site and Train, and if you see a gap, Sledge, Buck or a
      Montagne goes in to plant; smoke off the vertical if it's strong.
    placements:
      - kind: breach
        floor: ROOF
        at: [61.3, 52.0]
        name: "Roof hatch over Top Red"
        note: "Open it at the start"
      - kind: breach
        floor: 2F
        at: [69.3, 56.5]
        name: "Red wall"
        note: "Open it if it's soft; they may reinforce it or play phantom there"
      - kind: entry
        floor: 1F
        room: Red Stairs
        note: "Walk up Red behind the cut-off cam"
      - kind: breach
        floor: 3F
        room: Cigar Lounge
        note: "Cigar control: vertical on site and Train"
      - kind: plant
        floor: 2F
        room: Mining Room
        note: "On the hard side, or behind smokes at an off angle"
  - id: kafe-mining-attack-pillar
    site: fireplace_hall_mining_room
    side: attack
    operators: [Buck, Sledge]
    title: "Window info, then vertical on Pillar"
    text: >-
      Put people on the main windows early for information and an early AC-window angle on the White
      hallway to pinch the upstairs defenders. With all of upstairs cleared, make vertical on the Pillar
      rotate door and the dark spot from 3F Bar, take Pillar control, and walk in to plant while the
      window players fight the rotators.
    placements:
      - kind: entry
        floor: 2F
        between: [Mining Room, exterior]
        edge: bottom
        note: "Main windows: info first, fight rotators later"
      - kind: anchor
        floor: 3F
        room: White Stairs
        note: "AC window angle on the White hallway"
      - kind: breach
        floor: 3F
        room: Bar
        note: "Vertical on the Pillar rotate door and the dark spot"
      - kind: anchor
        floor: 2F
        at: [69.0, 56.0]
        name: "Pillar"
        note: "Pillar control usually wins the round"
      - kind: plant
        floor: 2F
        room: Fireplace Hall
        note: "Walk in from Pillar"
  # ---------------------------------------------------------------- 2F Reading Room / Fireplace Hall
  - id: kafe-reading-team-reinforcements
    site: reading_room_fireplace_hall
    side: defense
    operators: []
    title: "Reading: Pillar wall and the 3F lid"
    text: >-
      Reinforce both halves of the Reading to Pillar wall and the Reading / Laundry wall half away
      from the cabinet. Upstairs, reinforce both 3F Freezer / Bar Storage walls and the Cocktail wall
      facing Top White.
    placements:
      - kind: reinforce
        floor: 2F
        room: Reading Room
        note: "Reading to Pillar wall, both halves"
      - kind: reinforce
        floor: 2F
        room: Laundry Room
        note: "Reading / Laundry wall, away from the cabinet"
      - kind: reinforce
        floor: 3F
        room: Bar Freezer
        note: "3F Freezer / Bar Storage walls"
      - kind: reinforce
        floor: 3F
        between: [Cocktail Lounge, White Stairs]
        note: "Cocktail wall facing Top White"
  - id: kafe-reading-castle-tachanka
    site: reading_room_fireplace_hall
    side: defense
    operators: [Castle, Tachanka]
    title: "Castle the doors, Tachanka on the vert"
    text: >-
      Castle barricades the Reading, Cocktail and Pixel doors. Tachanka plays 3F Cocktail over the vert
      and shoots through the Fireplace foot holes.
    placements:
      - kind: castle
        floor: 2F
        room: Reading Room
        nudge: [0, 2.0]
        note: "Reading door; Pixel door too"
      - kind: anchor
        floor: 3F
        room: Cocktail Lounge
        note: "Hold the vert"
  - id: kafe-reading-kaid-melusi
    site: reading_room_fireplace_hall
    side: defense
    operators: [Kaid, Melusi]
    title: "Claw Reading, Banshee White"
    text: >-
      Kaid claws the Reading and Pillar walls and anchors Laundry. Melusi puts Banshees on White Stairs
      and Pillar.
    placements:
      - kind: kaid
        floor: 2F
        room: Reading Room
        nudge: [1.2, 0]
        note: "Reading to Pillar wall"
      - kind: trap
        floor: 2F
        room: White Stairs
        note: "Banshee"
  - id: kafe-reading-attack-cocktail
    site: reading_room_fireplace_hall
    side: attack
    operators: [Buck, Sledge]
    title: "Top down: clear 3F, then vertical on Reading"
    text: >-
      Open the hatches and drone all of 3F with cut-off cams: Cigar Shop, under Skylight, Piano. Push the
      upstairs defenders off, keep one player on Red flank and one on White flank, then make vertical
      on site until they fall back to 90 and Pillar. Plant on the Reading bookshelf; it's bangable, so
      keep the vert players covering it.
    placements:
      - kind: breach
        floor: ROOF
        at: [61.3, 52.0]
        name: "Roof hatches"
        note: "Open them, then drone out 3F"
      - kind: drone
        floor: 3F
        room: Cigar Lounge
        note: "Cut-off cams: Cigar Shop, under Skylight, Piano"
      - kind: breach
        floor: 3F
        room: Cocktail Lounge
        note: "Vertical onto site once 3F is yours"
      - kind: plant
        floor: 2F
        room: Reading Room
        note: "On the bookshelf (it's bangable)"
  - id: kafe-reading-attack-pinch
    site: reading_room_fireplace_hall
    side: attack
    operators: []
    title: "Snow window cut-off and late Brown"
    text: >-
      Open the Reception double and the Dining window at the start for phantom pressure. While the vert
      player works, teammates outside the Snow window cut anyone rotating to Pillar, and one walks up
      Brown late through the open barricade to crouch in behind them. Plant on the bookshelf with every
      line covered.
    placements:
      - kind: entry
        floor: 1F
        room: Reception
        note: "Open the double (and the Dining window) at the start"
      - kind: anchor
        floor: 2F
        at: [69.0, 56.0]
        name: "Snow window (Pillar side)"
        note: "Cut off rotations to Pillar"
      - kind: plant
        floor: 2F
        room: Reading Room
        nudge: [0, 2.0]
        note: "On the bookshelf"
  # ---------------------------------------------------------------- 1F Kitchen Service / Kitchen Cooking
  - id: kafe-kitchen-team-reinforcements
    site: kitchen_service_kitchen_cooking
    side: defense
    operators: []
    title: "Kitchen: Bakery side and the hatches"
    text: >-
      Reinforce the Prep wall facing Bakery, the Small Bake single wall, the Kitchen wall facing
      Bakery, dark walls 1 and 2, the Freezer wall behind VIP and the outer Garage wall. Reinforce the
      hatch above site and the Freezer hatch; leave the Red Hall walls open.
    placements:
      - kind: reinforce
        floor: 1F
        between: [Bakery, Kitchen Cooking]
        note: "Kitchen wall facing Bakery"
      - kind: reinforce
        floor: 1F
        room: Prep Room
        note: "Prep wall facing Bakery"
      - kind: reinforce
        floor: 1F
        room: Freezer
        note: "Freezer wall behind VIP"
      - kind: reinforce
        floor: 1F
        between: [Garage, exterior]
        edge: bottom
        note: "Outer Garage wall only"
      - kind: hatch
        floor: 2F
        at: [67.1, 63.2]
        name: "2F hatch over the Freezer side"
        note: "Reinforce"
  - id: kafe-kitchen-kaid-swap
    site: kitchen_service_kitchen_cooking
    side: defense
    operators: [Kaid]
    title: "Claw Prep and Small Bake, then swap"
    text: >-
      Claws on Prep and Small Bake first. If there's no Bakery pressure by about 45 seconds, swap them
      to the dark walls and the Freezer hatch.
    placements:
      - kind: kaid
        floor: 1F
        room: Prep Room
        nudge: [-1.2, 0]
        note: "Prep wall"
      - kind: kaid
        floor: 1F
        between: [Bakery, Kitchen Cooking]
        nudge: [0, 3.0]
        note: "Small Bake single wall"
  - id: kafe-kitchen-smoke-tubarao
    site: kitchen_service_kitchen_cooking
    side: defense
    operators: [Smoke, Tubarao, Aruni]
    title: "Bakery counter and VIP feet holes"
    text: >-
      Smoke holds the Bakery counter and gasses the push. Tubarao freezes the Freezer drop from the VIP
      feet holes, and Aruni holds bottom Red and Coat Check.
    placements:
      - kind: anchor
        floor: 1F
        room: Bakery
        note: "Bakery counter"
      - kind: anchor
        floor: 1F
        room: Freezer
        nudge: [0, 1.5]
        note: "VIP feet holes"
      - kind: anchor
        floor: 1F
        room: Coat Check
        note: "Aruni at bottom Red"
  - id: kafe-kitchen-attack-bakery
    site: kitchen_service_kitchen_cooking
    side: attack
    operators: [Nomad, Fuse, Buck]
    title: "Bakery push with Small and vertical from Mining"
    text: >-
      Open Reception early for late phantom pressure. Nomad or Aruni starts in Small Bakery and airjabs
      the double door while the team opens the Bakery barricade, clears the area and opens the Bakery
      wall. A Fuse or Buck with a drone in R90 opens the Mining hatch and makes vertical on the chassis,
      the coffee machine and the sinks; if Bakery stalls, flip the take and drop the hatch. Plant on the
      chassis or behind the sinks.
    placements:
      - kind: entry
        floor: 1F
        at: [58.5, 57.0]
        name: "Small Bakery window"
        note: "Nomad or Aruni: airjab or gadget the double door"
      - kind: breach
        floor: 1F
        between: [Bakery, Kitchen Cooking]
        note: "Bakery wall once the area is clear"
      - kind: breach
        floor: 2F
        at: [67.1, 63.2]
        name: "Mining hatch over Kitchen"
        note: "Open it; drop it if you flip the take"
      - kind: anchor
        floor: 2F
        room: Mining Room
        note: "Vertical on the chassis, coffee machine prone spot and sinks"
      - kind: plant
        floor: 1F
        room: Kitchen Service
        note: "On the chassis or behind the sinks"
  - id: kafe-kitchen-attack-red-hall
    site: kitchen_service_kitchen_cooking
    side: attack
    operators: [Ying, Ace]
    title: "White take: cut Coat Check, open the Freezer walls"
    text: >-
      Take VIP, Dining and Reception control and open White. Cut the Coat Check player off: a teammate on
      the window while you throw a Candela from the Reception hallway, then pre-fire both head holes.
      Open the Freezer walls but leave the hatch soft so a flank can't drop on you, watch Red, and plant.
    placements:
      - kind: anchor
        floor: 1F
        room: Reception
        note: "Candela down the hallway toward Coat Check"
      - kind: anchor
        floor: 1F
        room: Coat Check
        note: "Pre-fire both head holes, then hold the rotate"
      - kind: breach
        floor: 1F
        room: Freezer
        note: "Open the Freezer walls; leave the hatch above soft"
      - kind: plant
        floor: 1F
        room: Kitchen Cooking
        note: "Once Coat Check is yours; watch Red"
