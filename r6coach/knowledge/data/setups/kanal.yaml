map: kanal
briefs:
  # ---------------------------------------------------------------- 2F Server Room / Radar Room
  - id: kanal-server-team-walls
    site: server_room_radar_room
    side: defense
    operators: []
    title: "Double-deny the outside Server wall"
    text: >-
      Reinforce both halves of the outside Server wall first; it is the main breach. Then close the walls facing the
      90 windows and the contest-hole wall facing the Red door, and keep feet holes onto Skybridge.
    placements:
      - kind: reinforce
        floor: 2F
        between: [Server Room, exterior]
        edge: left
        nudge: [0, -1.2]
        note: "Outside Server wall, upper half"
      - kind: reinforce
        floor: 2F
        between: [Server Room, exterior]
        edge: left
        nudge: [0, 1.2]
        note: "Outside Server wall, lower half"
      - kind: open
        floor: 2F
        between: [Skybridge, Radar Room]
        note: "Feet holes watching Skybridge (Wamai, Kaid)"
      - kind: anchor
        floor: 2F
        room: Server Room
        nudge: [1.0, 0]
        note: "Left side of site, behind the Mira"
  - id: kanal-server-kaid-main-wall
    site: server_room_radar_room
    side: defense
    operators: [Kaid]
    title: "Claw the main wall"
    text: >-
      Claw both halves of the outside Server wall from inside so Thermite or Maverick can't open it. If Thatcher or Ace
      hits it, re-claw straight away; the E.G.S. only disables claws for about 15 seconds.
    placements:
      - kind: kaid
        floor: 2F
        between: [Server Room, exterior]
        edge: left
        nudge: [1.0, -1.2]
        note: "Upper half, low on the inside"
      - kind: kaid
        floor: 2F
        between: [Server Room, exterior]
        edge: left
        nudge: [1.0, 1.2]
        note: "Lower half"
  # Attack briefs on this map follow Garfieldisdoc, "How to Attack EVERY Bombsite in Rainbow Six Siege
  # (2026)", https://www.youtube.com/watch?v=1qCEYZwQzes (Kanal from 2:39:22).
  - id: kanal-server-attack-burn
    site: server_room_radar_room
    side: attack
    operators: [Nomad, Maverick, Ying]
    title: "Main breach with a Red pinch"
    text: >-
      Nomad goes off top White and shoots down the Printer window for a late collapse, airjabs the door, and the team
      opens the main wall and the pill door, Maverick if it has to be made soft. Send one player through Museum or
      bottom Red to pinch the Red plat with the breach, bank a nade for tuck left, and take top Red. Once they fall back
      into Server, smoke the rotate and the mirror, Ying candelas Skybridge for the teammate walking it, and plant.
    placements:
      - kind: anchor
        floor: 2F
        at: [59.3, 46.0]
        name: "Coast Guard roof (top White)"
        note: "Nomad: shoot down the Printer window, airjab the door"
      - kind: maverick
        floor: 2F
        between: [Server Room, exterior]
        edge: left
        note: "Main wall and the pill door; any hard breach works"
      - kind: entry
        floor: 1F
        room: Map Room
        note: "Museum / bottom Red to pinch the player on the Red plat"
      - kind: entry
        floor: 2F
        room: Skybridge
        note: "Walk it behind Ying's candelas"
      - kind: plant
        floor: 2F
        room: Radar Room
        note: "Once they're held back in Server"
  - id: kanal-server-attack-ace
    site: server_room_radar_room
    side: attack
    operators: [Ace, Ying, Montagne, Gridlock]
    title: "90 and Green split"
    text: >-
      Pre-place a cut-off cam in Map Room in the drone phase; if nobody comes down to Museum, Montagne pushes up Green
      with a teammate behind. Ying candelas 90 and Red while Ace opens both Server walls and the Red angle to cut off the
      whole site, then airjab Green late or Gridlock the hallways and play the 90 wall. Capitao can smoke the rotate
      through the floor from the window below.
    placements:
      - kind: drone
        floor: 1F
        room: Map Room
        note: "Cut-off cam: nobody comes down to Museum"
      - kind: entry
        floor: 2F
        at: [69.4, 58.5]
        name: "Green stairs (top)"
        note: "Montagne leads, one player behind"
      - kind: ace
        floor: 2F
        room: Server Room
        note: "Both Server walls, then the Red angle"
      - kind: plant
        floor: 2F
        room: Server Room
        nudge: [1.5, 1.0]
        note: "Run in once everyone coming off site is dead"
  # ---------------------------------------------------------------- 1F Security Room / Map Room
  - id: kanal-security-team-hatches
    site: security_room_map_room
    side: defense
    operators: []
    title: "Close the three 2F hatches"
    text: >-
      Reinforce the Radar, Killbox and Kitchen hatches on 2F and both Killbox outside wall panels. Keep the Security/Maps
      head hole and crouch rotate open so you can swing between the rooms.
    placements:
      - kind: hatch
        floor: 2F
        at: [66.5, 47.3]
        name: "Radar site hatch"
      - kind: hatch
        floor: 2F
        at: [71.4, 47.3]
        name: "Killbox site hatch"
      - kind: hatch
        floor: 2F
        at: [65.5, 56.9]
        name: "Kitchen hatch"
      - kind: reinforce
        floor: 2F
        at: [72.8, 49.5]
        name: "Killbox outside wall"
        note: "Both panels"
      - kind: open
        floor: 1F
        between: [Map Room, Security Room]
        note: "Head hole and crouch rotate"
  - id: kanal-security-bandit-killbox
    site: security_room_map_room
    side: defense
    operators: [Bandit]
    title: "Batteries on the Killbox wall"
    text: >-
      Put your batteries on the reinforced Killbox outside wall, then help hold 2F until about 1:30 and fold to Model
      and Maps. Re-check the batteries after a Thatcher EMP.
    placements:
      - kind: bandit
        floor: 2F
        at: [72.8, 48.5]
        name: "Killbox outside wall, panel 1"
      - kind: bandit
        floor: 2F
        at: [72.8, 50.8]
        name: "Killbox outside wall, panel 2"
  - id: kanal-security-attack-top-take
    site: security_room_map_room
    side: attack
    operators: [Nomad, Gridlock, Maverick]
    title: "Attack it like upstairs: main wall, 90 windows, flank watch"
    text: >-
      Defenders extend above, so open the main wall and the pill door, put one or two players on the 90 windows, and
      shoot open bottom Green and bottom Red for late phantom pressure. Drone where they play and clear from Skybridge
      plus the breach or a 90 window. Airjab the staircase and keep one player passively on Red and one on Green
      watching Museum.
    placements:
      - kind: breach
        floor: 2F
        between: [Server Room, exterior]
        edge: left
        note: "Main wall and the pill door"
      - kind: entry
        floor: 2F
        between: [Control Room, exterior]
        edge: right
        note: "90 windows: one or two players"
      - kind: anchor
        floor: 2F
        room: Radar Room
        note: "Airjab the staircase door; passive holds on Red and Green"
  - id: kanal-security-attack-hatches
    site: security_room_map_room
    side: attack
    operators: [Sledge, Buck, Hibana]
    title: "Pop all three hatches, drop Kitchen and plant"
    text: >-
      Bring a vertical player and someone with a secondary for hatches: open both site hatches and the Kitchen hatch,
      and make vertical in Kitchen too so nobody retakes from the tables. That forces them out to Model, the front of
      site, bottom Red and Museum; drop the Kitchen hatch and plant while a teammate drops the other hatch, watches the
      rotate and doubles up on you.
    placements:
      - kind: breach
        floor: 2F
        at: [66.5, 47.3]
        name: "Radar site hatch"
        note: "Open it"
      - kind: breach
        floor: 2F
        at: [71.4, 47.3]
        name: "Other site hatch"
        note: "Open it; a teammate drops here to watch the rotate"
      - kind: breach
        floor: 2F
        at: [65.5, 56.9]
        name: "Kitchen hatch"
        note: "Open it, vert the Kitchen tables, then drop"
      - kind: anchor
        floor: 2F
        room: Server Room
        note: "Vertical over the whole site"
      - kind: plant
        floor: 1F
        room: Map Room
        nudge: [-1.5, 1.5]
        note: "Right after the Kitchen drop; they have to swing wide to retake"
  # ---------------------------------------------------------------- 1F Coast Guard Meeting Room / Lounge
  - id: kanal-coastguard-team-walls
    site: coast_guard_meeting_lounge
    side: defense
    operators: []
    title: "Seal Printer and Radio, reinforce the Coast Guard hatch"
    text: >-
      Reinforce both Coast Guard to Printer panels and both Radio Room wall panels, and the Coast Guard floor hatch.
      Leave the Lounge hatch soft so a basement player can play under the site.
    placements:
      - kind: reinforce
        floor: 1F
        between: [Coast Guard Meeting Room, Printer Hallway]
        nudge: [0, -1.2]
        note: "Panel 1"
      - kind: reinforce
        floor: 1F
        between: [Coast Guard Meeting Room, Printer Hallway]
        nudge: [0, 1.2]
        note: "Panel 2"
      - kind: reinforce
        floor: 1F
        between: [Radio Room, Coast Guard Meeting Room]
        nudge: [-1.0, 0]
        note: "Radio Room wall, both panels"
      - kind: hatch
        floor: 1F
        at: [53.1, 57.6]
        name: "Coast Guard hatch"
      - kind: open
        floor: 1F
        at: [59.9, 52.0]
        name: "Lounge hatch"
        note: "Keep soft for the player below"
  - id: kanal-coastguard-castle-lounge
    site: coast_guard_meeting_lounge
    side: defense
    operators: [Castle]
    title: "Panel the Lounge windows"
    text: >-
      Castle panels the Lounge windows so attackers can't swing long Lounge from outside, then anchors the Coast Guard
      corner.
    placements:
      - kind: castle
        floor: 1F
        between: [Lounge, exterior]
        edge: right
        nudge: [0, -1.0]
        note: "Lounge window"
      - kind: castle
        floor: 1F
        between: [Lounge, exterior]
        edge: right
        nudge: [0, 1.0]
        note: "Second Lounge window"
      - kind: anchor
        floor: 1F
        room: Coast Guard Meeting Room
        nudge: [-1.0, 1.5]
        note: "Coast Guard corner"
  - id: kanal-coastguard-attack-radio
    site: coast_guard_meeting_lounge
    side: attack
    operators: [Buck, Sledge, Nomad]
    title: "Radio take: Scuba below, Skybridge above"
    text: >-
      Open the Radio window and put someone on that rappel. Jump into the basement Scuba side, drone out Scuba and
      Lockers and take it if it's empty, while another player takes Skybridge control or jumps the Printer window if
      there's no vertical on it. Pinch the Harry Potter player and cut off whoever plays inside Radio by playing
      vertical from below.
    placements:
      - kind: entry
        floor: 1F
        between: [Radio Room, exterior]
        edge: left
        note: "Open the Radio window; one player on the rappel"
      - kind: entry
        floor: B
        room: Diving Room
        note: "Scuba side: drone Scuba and Lockers, then take it"
      - kind: anchor
        floor: B
        room: Diving Room
        nudge: [0, 2.0]
        note: "Vertical from below to clear Radio"
      - kind: entry
        floor: 2F
        room: Skybridge
        note: "Skybridge control, or jump the Printer window"
  - id: kanal-coastguard-attack-back-wall
    site: coast_guard_meeting_lounge
    side: attack
    operators: [Ace, Thermite]
    title: "Collapse on B: back wall and the chassis plant"
    text: >-
      Once Radio is cut off, collapse on B site by opening the back wall from Blue Stairs, whatever head holes or
      reinforcements they left. Plant on the chassis right behind the breach: they can only see it through the open
      hatch or a long C4 lob from Lockers. A teammate on the site rappel watches the bridge and banks utility at the
      defuser.
    placements:
      - kind: breach
        floor: 1F
        at: [59.3, 56.0]
        name: "Back wall from Blue Stairs"
        note: "Open it, whatever they reinforced"
      - kind: plant
        floor: 1F
        room: Lounge
        note: "On the chassis right behind the breach"
      - kind: anchor
        floor: 1F
        between: [Lounge, exterior]
        edge: right
        note: "Site rappel: watch the bridge, bank utility at the defuser"
  # ---------------------------------------------------------------- B Kayaks / Supply Room
  - id: kanal-kayaks-team-hatches
    site: kayaks_supply_room
    side: defense
    operators: []
    title: "Hatches first, then the middle wall"
    text: >-
      Prep is short: reinforce the Coast Guard and Lounge hatches first. Then one middle Kayaks/Supply panel with the
      crouch rotate beside it, and the stairs-side half of the Diving wall.
    placements:
      - kind: hatch
        floor: 1F
        at: [53.1, 57.6]
        name: "Coast Guard hatch"
      - kind: hatch
        floor: 1F
        at: [59.9, 52.0]
        name: "Lounge hatch"
      - kind: reinforce
        floor: B
        between: [Kayaks, Supply Room]
        nudge: [-1.0, 0]
        note: "One middle panel"
      - kind: open
        floor: B
        between: [Kayaks, Supply Room]
        nudge: [1.0, 0]
        note: "Crouch rotate"
      - kind: reinforce
        floor: B
        between: [Diving Room, Kayaks]
        nudge: [-1.0, 0]
        note: "Stairs-side half; the other half stays soft for head holes"
  - id: kanal-kayaks-frost-diving
    site: kayaks_supply_room
    side: defense
    operators: [Frost]
    title: "Mat the Diving and Lockers windows"
    text: >-
      Frost mats the Diving windows and the Lockers window, then anchors Diving. Mute keeps jammers on the Pipes and
      Diving walls.
    placements:
      - kind: trap
        floor: B
        between: [Diving Room, exterior]
        edge: left
        note: "Diving window (usually)"
      - kind: trap
        floor: B
        between: [Lockers, exterior]
        edge: right
        note: "Lockers window (usually)"
      - kind: anchor
        floor: B
        room: Diving Room
  - id: kanal-kayaks-attack-trench
    site: kayaks_supply_room
    side: attack
    operators: [Buck, Sledge, Nomad]
    title: "Vertical split from Reception, Trench push"
    text: >-
      Start at Reception, mind the far spawn-peek angle, open the Trench door and drone Reception and Archives. If
      they're free, work the main hatch while a teammate rappels Lounge or comes down top White and airjabs the Main
      Stairs swing. Open both hatches, work vertical on Harry Potter and the stalls, rotate one or two to Trench, and
      plant under the open hatch with an angle on the double door.
    placements:
      - kind: entry
        floor: 1F
        room: Reception
        note: "Drone out Reception and Archives first"
      - kind: breach
        floor: 1F
        at: [53.1, 57.6]
        name: "Main hatch (Coast Guard)"
        note: "Open it once 1F is yours"
      - kind: breach
        floor: 1F
        at: [59.9, 52.0]
        name: "Lounge hatch"
        note: "Open both, then work vertical"
      - kind: entry
        floor: B
        at: [52.0, 60.0]
        name: "Trench door"
        note: "Opened at the start; one or two rotate here"
      - kind: plant
        floor: B
        room: Supply Room
        note: "Under the open hatch, angle on the double door"
  - id: kanal-kayaks-attack-split
    site: kayaks_supply_room
    side: attack
    operators: [Capitao, Buck]
    title: "Yellow push and the chassis plant"
    text: >-
      Make vertical on everything and come down Yellow; make sure Scuba is clear, and someone can jump the Scuba window
      late. Defenders end up by the door, Closet or Main Stairs, so smoke off the double and the Lockers door (Capitao's smoke bolt or smoke grenades) and plant
      the cheeky spot on the bomb chassis: retaking it means jumping up to defuse at an awkward angle.
    placements:
      - kind: entry
        floor: B
        room: Diving Room
        note: "Down Yellow, clear Scuba"
      - kind: entry
        floor: B
        between: [Diving Room, exterior]
        edge: left
        nudge: [0, 1.5]
        note: "Scuba window, late"
      - kind: plant
        floor: B
        room: Kayaks
        nudge: [-1.0, -1.0]
        note: "On the bomb chassis; smoke the double and Lockers door"
