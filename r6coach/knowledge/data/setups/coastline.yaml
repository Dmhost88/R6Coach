map: coastline
# Positions use the layout's room boxes (confidence 0.25-0.5). Walls the callout data names by slang
# (Pink Bar quad wall, Back Barrels, the 90) sit on the room they belong to, with the wall in the note.
briefs:
  # ------------------------------------------------------------------ 2F Hookah Lounge / 2F Billiards Room
  - id: coastline-hookah-team-reinforce
    site: hookah_billiards
    side: defense
    operators: []
    title: "Quad wall, Hookah door wall, keep the rotate"
    text: >-
      Reinforce all four Pink Bar quad wall panels, both halves of the Hookah door wall, the Billiards section
      of the Hookah triple wall and both VIP walls. On the Hookah to Billiards wall, reinforce only the half
      that isn't the rotate, and cut foot holes onto Aqua.
    placements:
      - kind: reinforce
        floor: 2F
        room: Billiards Room
        nudge: [0, 3.0]
        note: "Pink Bar quad wall, all four panels"
      - kind: reinforce
        floor: 2F
        room: Hookah Lounge
        nudge: [-2.0, -3.0]
        note: "Hookah door wall, both halves"
      - kind: reinforce
        floor: 2F
        between: [Hookah Lounge, Billiards Room]
        nudge: [-1.5, 0]
        note: "The half that is not the rotate"
      - kind: open
        floor: 2F
        between: [Hookah Lounge, Billiards Room]
        nudge: [1.5, 0]
        note: "Hookah to Billiards rotate"
      - kind: reinforce
        floor: 2F
        between: [VIP Lounge, Hookah Lounge]
        note: "Both VIP walls"
      - kind: open
        floor: 2F
        room: Aquarium
        note: "Foot holes onto Aqua"
  - id: coastline-hookah-kaid-mute
    site: hookah_billiards
    side: defense
    operators: [Kaid, Mute]
    title: "Claw the quad wall, jam VIP"
    text: >-
      Kaid claws the Pink Bar quad wall and the Hookah door wall, so Ace from the roof can't open them. Mute
      jams the VIP doors and wall and holds VIP behind his jammers.
    placements:
      - kind: kaid
        floor: 2F
        room: Billiards Room
        nudge: [1.2, 3.0]
        note: "Pink Bar quad wall"
      - kind: kaid
        floor: 2F
        room: Hookah Lounge
        nudge: [-0.8, -3.0]
        note: "Hookah door wall"
      - kind: trap
        floor: 2F
        between: [VIP Lounge, Hookah Lounge]
        nudge: [0, 1.5]
        note: "Mute jammers on the VIP doors and wall"
      - kind: anchor
        floor: 2F
        room: VIP Lounge
        note: "Hold VIP behind the jammers"
  - id: coastline-hookah-azami
    site: hookah_billiards
    side: defense
    operators: [Azami, Jager]
    title: "Kiba the window and Aqua, ADS on the door"
    text: >-
      Azami barriers the Hookah window and the Aqua side so the rappel and the Aqua push are slowed. Jager puts
      ADS on the Hookah door and Aqua, then roams shallow on Aqua. Kibas can be shot, so don't rely on them for
      cover.
    placements:
      - kind: deployable
        floor: 2F
        between: [Hookah Lounge, exterior]
        edge: top
        note: "Kiba on the Hookah window"
      - kind: deployable
        floor: 2F
        room: Aquarium
        nudge: [2.0, 0]
        note: "Kiba on the Aqua side"
      - kind: trap
        floor: 2F
        room: Hookah Lounge
        nudge: [-2.0, 0]
        note: "Jager ADS on the Hookah door"
  # Attack briefs on this map follow Garfieldisdoc, "How to Attack EVERY Bombsite in Rainbow Six Siege
  # (2026)", https://www.youtube.com/watch?v=1qCEYZwQzes (Coastline from 1:25:10).
  - id: coastline-hookah-attack-aqua-nomad
    site: hookah_billiards
    side: attack
    operators: [Nomad]
    title: "Aqua take: Nomad jabs, roof nade, main window late"
    text: >-
      Nomad pre-places a cam watching Sunrise, takes Sunrise control and jabs the Sunrise double door, then
      rappels the inner rappel and jabs the Hookah door; her job late is the main window, cutting everything
      off. Someone on the roof nades down the hatch to force the Aqua player to rotate, and you take Aqua
      control, clear barriers and shields, and plant.
    placements:
      - kind: drone
        floor: 1F
        room: Sunrise Bar
        note: "Pre-placed cam watching Sunrise; air jab the double door"
      - kind: entry
        floor: 2F
        between: [Hookah Lounge, exterior]
        edge: top
        note: "Inner rappel; air jab off the Hookah door"
      - kind: anchor
        floor: 2F
        room: Hookah Lounge
        nudge: [3.0, 0]
        note: "Main window late: cut everything off"
      - kind: breach
        floor: ROOF
        at: [58.0, 37.0]
        name: "Roof hatch and vent"
        note: "Nade down the hatch so the Aqua player rotates; pre-fire him"
      - kind: plant
        floor: 2F
        room: Billiards Room
        note: "Once Aqua is yours and the utility is cleared"
  - id: coastline-hookah-attack-triple
    site: hookah_billiards
    side: attack
    operators: [Hibana, Ace]
    title: "Open the far angles from the roof, Blue window early"
    text: >-
      At the start, Hibana or Ace rappels and opens the far right angle, the left angle and as much of the wall
      as you can: it cuts off Vase, Pink Bar and anyone rotating Hookah. Play it from there or from Luggage
      (watch bottom Courtyard). Open the Blue Bar window early so a defender who crosses to C4 gets peeked from
      the window or the rappel.
    placements:
      - kind: hibana
        floor: 2F
        room: Hookah Lounge
        nudge: [0, 4.0]
        note: "Far right angle, left angle and the wall from the rappel"
      - kind: anchor
        floor: 2F
        room: Aquarium
        note: "Luggage: hold the angles; bottom Courtyard can peek you"
      - kind: entry
        floor: 1F
        room: Blue Bar
        note: "Open the Blue Bar window early for phantom pressure"

  # ------------------------------------------------------------------ 2F Theater / 2F Penthouse
  - id: coastline-theater-team-reinforce
    site: theater_penthouse
    side: defense
    operators: []
    title: "VIP walls first, then the stairs and corridor"
    text: >-
      The VIP walls matter most: reinforce both, plus the VIP side wall toward Billiards. Then the Theater to top
      Main Stairs wall, right half, both outer corridor panels and Penthouse wall panels 1 and 2. Keep the back
      of Theater rotate and the VIP hallway head holes.
    placements:
      - kind: reinforce
        floor: 2F
        between: [VIP Lounge, exterior]
        edge: top
        note: "Both VIP outer walls"
      - kind: reinforce
        floor: 2F
        between: [Penthouse, VIP Lounge]
        note: "Penthouse to VIP middle wall"
      - kind: reinforce
        floor: 2F
        room: Theater
        nudge: [3.0, -2.0]
        note: "Theater to top Main Stairs, right half"
      - kind: reinforce
        floor: 2F
        room: Penthouse
        nudge: [-2.0, 0]
        note: "Penthouse wall, panels 1 and 2"
      - kind: open
        floor: 2F
        room: Theater
        nudge: [0, 6.0]
        note: "Back of Theater rotate to the 90"
  - id: coastline-theater-castle-kaid
    site: theater_penthouse
    side: defense
    operators: [Castle, Kaid]
    title: "Castle the doors, claw VIP"
    text: >-
      Castle panels the Bathroom door and the top doors, then plays Penthouse. Kaid claws the VIP walls and the
      Main Stairs wall so Thermite can't open VIP.
    placements:
      - kind: castle
        floor: 2F
        between: [Penthouse Bathroom, Penthouse]
        note: "Bathroom door"
      - kind: castle
        floor: 2F
        room: Hall of Fame
        note: "Top doors"
      - kind: kaid
        floor: 2F
        between: [VIP Lounge, exterior]
        edge: top
        nudge: [1.2, 0]
        note: "VIP walls"
      - kind: kaid
        floor: 2F
        room: Theater
        nudge: [3.0, -0.8]
        note: "Main Stairs wall"
  - id: coastline-theater-melusi-mira
    site: theater_penthouse
    side: defense
    operators: [Melusi, Mira]
    title: "Banshee the walk-in, Mira into VIP"
    text: >-
      Melusi puts a Banshee on the corridor walk-in and plays the 90 crossfire. Mira puts a window into VIP so
      the site can watch the VIP breach without peeking.
    placements:
      - kind: trap
        floor: 2F
        room: Hall of Fame
        nudge: [-2.0, 0]
        note: "Banshee on the corridor walk-in"
      - kind: mira
        floor: 2F
        between: [Penthouse, VIP Lounge]
        nudge: [0, 2.0]
        note: "Window into VIP"
      - kind: anchor
        floor: 2F
        room: Theater
        note: "The 90 crossfire"
  - id: coastline-theater-attack-vip
    site: theater_penthouse
    side: attack
    operators: [Thermite, Thatcher, Buck, Sledge]
    title: "Main wall, then vert from Kitchen below"
    text: >-
      Thatcher and Thermite open the main wall and hold an angle until the team has the map. Someone goes below
      into Kitchen and Service and makes vert on every cutoff spot: by the wall, the DJ booth, the rotate and
      the bookshelf. Collapse off the breach, push them off books and plant on the bed.
    placements:
      - kind: thermite
        floor: 2F
        between: [Penthouse, VIP Lounge]
        note: "Main wall; hold an angle off it until you have map control"
      - kind: breach
        floor: 1F
        room: Kitchen
        note: "Vert up into Penthouse on the cutoff spots: DJ booth, rotate, bookshelf"
      - kind: breach
        floor: 1F
        room: Service Entrance
        note: "The main vert if you only make one"
      - kind: plant
        floor: 2F
        room: Penthouse
        note: "Jump in on the bed"
  - id: coastline-theater-attack-window
    site: theater_penthouse
    side: attack
    operators: [Blackbeard, Nomad]
    title: "Hookah-side hallway, Aqua shield, Nomad on the windows"
    text: >-
      While the main wall goes, two players come Hookah side, drone each other in and win the hallway so nobody
      rotates out. Another goes Aqua and Luggage with a shield like Blackbeard to push top White back, and a
      rappeller (Nomad) jabs the Lobby door and the front Service door and works the windows for picks.
    placements:
      - kind: entry
        floor: 2F
        room: Hookah Lounge
        note: "Two players, drone each other in, win the hallway"
      - kind: entry
        floor: 2F
        room: Aquarium
        note: "Aqua and Luggage with a shield; contest top White"
      - kind: anchor
        floor: 2F
        room: Theater
        nudge: [-4.0, 0]
        note: "Nomad: jab Lobby and Service doors, work the windows"

  # ------------------------------------------------------------------ 1F Kitchen / 1F Service Entrance
  - id: coastline-kitchen-team-reinforce
    site: kitchen_service_entrance
    side: defense
    operators: []
    title: "Kitchen exterior walls and Back Barrels"
    text: >-
      Reinforce both Kitchen exterior walls, both back Barrels walls and the Kitchen-Service half wall, keeping
      the rotate. Upstairs, reinforce the VIP outer walls and the Penthouse-VIP middle wall so attackers can't
      take the floor above.
    placements:
      - kind: reinforce
        floor: 1F
        between: [Kitchen, exterior]
        edge: top
        note: "Both Kitchen exterior walls"
      - kind: reinforce
        floor: 1F
        room: Service Entrance
        nudge: [3.0, 0]
        note: "Both back Barrels walls"
      - kind: reinforce
        floor: 1F
        between: [Kitchen, Service Entrance]
        nudge: [0, -2.0]
        note: "Half by the rotate"
      - kind: open
        floor: 1F
        between: [Kitchen, Service Entrance]
        nudge: [0, 2.5]
        note: "Service to Kitchen rotate"
      - kind: reinforce
        floor: 2F
        between: [Penthouse, VIP Lounge]
        note: "Penthouse-VIP middle wall"
  - id: coastline-kitchen-goyo-aruni
    site: kitchen_service_entrance
    side: defense
    operators: [Goyo, Aruni, Kaid]
    title: "Volcans on the plants, gates on the doors"
    text: >-
      Goyo plays behind the bomb with Volcans on both plant spots. Aruni gates the Kitchen and Service doors,
      and Kaid claws the Barrels walls then holds VIP above.
    placements:
      - kind: deployable
        floor: 1F
        room: Kitchen
        note: "Volcan on the Kitchen plant"
      - kind: deployable
        floor: 1F
        room: Service Entrance
        note: "Volcan on the Service plant"
      - kind: trap
        floor: 1F
        between: [Kitchen, exterior]
        edge: top
        nudge: [-2.0, 0.5]
        note: "Aruni gate on the Kitchen door"
      - kind: kaid
        floor: 1F
        room: Service Entrance
        nudge: [4.2, 0]
        note: "Barrels walls"
  - id: coastline-kitchen-attack-barrels
    site: kitchen_service_entrance
    side: attack
    operators: [Ace, Hibana]
    title: "Open Kegs to cut every rotate, then walk in Service"
    text: >-
      Open the Lobby and Service barricades at the start for phantom pressure and feel out the map from the
      Service door with drones. Ace or Hibana opens the Kegs wall: it cuts off every rotate in site, so the
      Service-side player only worries about far angles like the Kitchen door. Someone works the Kitchen
      window; plant once Bathroom is clear.
    placements:
      - kind: entry
        floor: 1F
        room: Service Entrance
        nudge: [3.0, 2.0]
        note: "Open the Service door early; drone and find the gap"
      - kind: ace
        floor: 1F
        between: [Kitchen, Service Entrance]
        note: "Kegs wall: cuts every rotate in site"
      - kind: entry
        floor: 1F
        room: Kitchen
        nudge: [-3.0, 0]
        note: "Kitchen window; flip to a Kitchen plant if Service is too heavy"
      - kind: plant
        floor: 1F
        room: Service Entrance
        note: "Walk in Service side once Bathroom is clear"
  - id: coastline-kitchen-attack-hibana
    site: kitchen_service_entrance
    side: attack
    operators: [Fuze, Buck, Sledge]
    title: "Fuze the soft wall, vert the whole site from above"
    text: >-
      If the Kitchen soft wall isn't reinforced, Fuze it twice to clear the Kitchen utility, then open it. From
      upstairs make vert on default, the Bathroom rotate, the far toilet stalls, the tucked corner, Kegs and the
      Lobby desk; shoot the Mira and pop the hatch while the team pushes in off your vert.
    placements:
      - kind: breach
        floor: 1F
        room: Kitchen
        note: "Fuze the soft wall twice, then open it"
      - kind: breach
        floor: 2F
        room: VIP Lounge
        note: "Vert onto default; shoot the Mira"
      - kind: breach
        floor: 2F
        room: Penthouse
        note: "Vert on the Bathroom rotate and the tucked corner"
      - kind: breach
        floor: 2F
        room: Theater
        note: "Vert on the Lobby desk player"

  # ------------------------------------------------------------------ 1F Blue Bar / 1F Sunrise Bar
  - id: coastline-blue-team-reinforce
    site: blue_bar_sunrise_bar
    side: defense
    operators: []
    title: "Blue main wall, keep the Hookah hatch open"
    text: >-
      Reinforce the Blue Bar main wall, the Sunrise to Blue wall half that isn't the rotate and the couch-corner
      wall. Upstairs, reinforce Hookah to Billiards and leave the Hookah hatch open to watch the Sunrise door.
    placements:
      - kind: reinforce
        floor: 1F
        room: Blue Bar
        nudge: [0, -2.0]
        note: "Blue Bar main wall"
      - kind: reinforce
        floor: 1F
        between: [Sunrise Bar, Blue Bar]
        nudge: [-1.5, 0]
        note: "Non-rotate half"
      - kind: open
        floor: 1F
        between: [Sunrise Bar, Blue Bar]
        nudge: [1.5, 0]
        note: "Sunrise to Blue rotate"
      - kind: reinforce
        floor: 2F
        between: [Hookah Lounge, Billiards Room]
        note: "Hookah to Billiards upstairs"
      - kind: open
        floor: 2F
        at: [36.5, 44.0]
        name: "Hookah hatch"
        note: "Keep open; watch the Sunrise door from above (hatch position on the layout is usually this one)"
  - id: coastline-blue-smoke-kaid-castle
    site: blue_bar_sunrise_bar
    side: defense
    operators: [Smoke, Kaid, Castle]
    title: "Smoke behind the Sunrise bar"
    text: >-
      Smoke shields behind the Sunrise bar and gasses the plants. Kaid claws the Blue main wall and holds
      Kitchen with C4; Castle panels the Blue window and the Office door.
    placements:
      - kind: deployable
        floor: 1F
        room: Sunrise Bar
        note: "Shield behind the bar"
      - kind: kaid
        floor: 1F
        room: Blue Bar
        nudge: [1.2, -2.0]
        note: "Blue main wall"
      - kind: castle
        floor: 1F
        between: [Blue Bar, exterior]
        edge: bottom
        note: "Blue window"
  - id: coastline-blue-attack-floor
    site: blue_bar_sunrise_bar
    side: attack
    operators: [Thermite, Montagne, Blackbeard]
    title: "Main wall with a shield, then win Hookah above"
    text: >-
      Thermite opens the main wall and a shield (Montagne, Blackbeard) deals with the Sunrise Bar player. That
      alone won't do it, so get Hookah control too: drone upstairs, check behind the couches and work for the
      hatch while a teammate watches Cool Vibes from around the plat. Then walk in off your breach and plant on
      the couches.
    placements:
      - kind: thermite
        floor: 1F
        room: Sunrise Bar
        nudge: [-4.0, 0]
        note: "Main wall; shield first in"
      - kind: drone
        floor: 2F
        room: Hookah Lounge
        note: "Drone upstairs, check behind the couches"
      - kind: breach
        floor: 2F
        room: Hookah Lounge
        nudge: [0, 3.0]
        note: "Open the hatch; a teammate watches Cool Vibes meanwhile"
      - kind: plant
        floor: 1F
        room: Sunrise Bar
        nudge: [0, 3.0]
        note: "On the couches"
  - id: coastline-blue-attack-window
    site: blue_bar_sunrise_bar
    side: attack
    operators: [Buck, Sledge]
    title: "Vert the bar from Hookah, a player outside Sunrise"
    text: >-
      With the hatch open, make vert from Hookah on the bar, the rotate and the hallway to the double door; if
      someone sits behind Sunrise Bar, vert the bar and the back couches too. Put a teammate outside the
      Sunrise window so nobody tucks there and plays safe, then collapse in off the breach.
    placements:
      - kind: breach
        floor: 2F
        room: Hookah Lounge
        nudge: [-3.0, 0]
        note: "Vert on the bar, the rotate and the double-door hallway"
      - kind: anchor
        floor: 1F
        between: [Sunrise Bar, exterior]
        edge: left
        note: "Outside the Sunrise window: nobody tucks there"
      - kind: plant
        floor: 1F
        room: Sunrise Bar
        note: "Walk in off the breach once the bar is cleared"
