map: villa
# Positions use the layout's room boxes (confidence 0.25-0.45). 1F has no room boxes yet, so 1F
# placements are points read off the blueprint (at:) and say so; slang walls (Main, Bar, Memo, China,
# triple wall) sit on the room they belong to, with the wall in the note.
briefs:
  # ------------------------------------------------------------------ 2F Aviator Room / 2F Games Room
  - id: villa-aviator-team-reinforce
    site: aviator_room_games_room
    side: defense
    operators: []
    title: "Double Main and Bar, keep the rotates"
    text: >-
      Double the Main wall with foot holes left open and double the Bar wall, then the wall facing the 90
      rappel window and the right side of Aviator to Games. Leave the Study wall soft with head holes, and keep
      the vault and crouch rotates between Aviator and Games.
    placements:
      - kind: reinforce
        floor: 2F
        room: Games Room
        nudge: [0, -4.0]
        note: "Main wall, doubled, foot holes open"
      - kind: reinforce
        floor: 2F
        room: Aviator Room
        nudge: [0, 3.5]
        note: "Bar wall, doubled"
      - kind: reinforce
        floor: 2F
        room: Aviator Room
        nudge: [-2.0, -2.0]
        note: "Wall facing the 90 rappel window"
      - kind: reinforce
        floor: 2F
        between: [Aviator Room, Games Room]
        nudge: [0, 2.5]
        note: "Aviator to Games, right side"
      - kind: open
        floor: 2F
        between: [Aviator Room, Games Room]
        nudge: [0, -2.0]
        note: "Vault and crouch rotates"
      - kind: open
        floor: 2F
        room: Games Room
        nudge: [2.0, 2.0]
        note: "Study wall soft, head holes to deny Study"
  - id: villa-aviator-kaid-smoke
    site: aviator_room_games_room
    side: defense
    operators: [Kaid, Smoke]
    title: "Claw Main, shield Top Main"
    text: >-
      Kaid claws the Main wall and watches the Study head holes from Games. Smoke puts his shield at Top Main and
      gasses the stairs and door when they push.
    placements:
      - kind: kaid
        floor: 2F
        room: Games Room
        nudge: [1.2, -4.0]
        note: "Main wall"
      - kind: deployable
        floor: 2F
        between: [Trophy Room, Games Room]
        note: "Smoke shield at Top Main (usually here)"
      - kind: anchor
        floor: 2F
        room: Games Room
        note: "Games, watching the Study holes"
  - id: villa-aviator-melusi-maestro
    site: aviator_room_games_room
    side: defense
    operators: [Melusi, Maestro]
    title: "Banshee on the 90, Evil Eyes on Study"
    text: >-
      Melusi puts a Banshee on the 90 door to slow the Red flank. Maestro puts Evil Eyes covering Study and
      Games and plays Bar.
    placements:
      - kind: trap
        floor: 2F
        room: Aviator Room
        nudge: [-2.0, -4.0]
        note: "Banshee on the 90 door"
      - kind: camera
        floor: 2F
        room: Games Room
        nudge: [2.0, 4.0]
        note: "Evil Eye on Study"
      - kind: camera
        floor: 2F
        room: Aviator Room
        nudge: [1.5, 1.5]
        note: "Evil Eye on Games"
  # Attack briefs on this map follow Garfieldisdoc, "How to Attack EVERY Bombsite in Rainbow Six Siege
  # (2026)", https://www.youtube.com/watch?v=1qCEYZwQzes (Villa from 4:18:55). The video has no Basement
  # chapter, so the Art Storage / Old Office attack briefs are not from it.
  - id: villa-aviator-attack-horizontal
    site: aviator_room_games_room
    side: attack
    operators: [Gridlock, Thatcher]
    title: "90 side over: Astro, Statue and Deer"
    text: >-
      Don't sit on Study and the balcony. The team goes 90 side over horizontally: pre-place drones in Astro
      in the drone phase (the skylight works), rappel Astro early and Gridlock the flank. Work up to Statue and
      Deer, then call it with the 90-window player and take the 90 space while someone watches Skull and Red.
      One player shoots the Study barricade and both default cams early for phantom pressure, then you walk in
      and plant.
    placements:
      - kind: drone
        floor: 2F
        room: Astronomy Room
        note: "Pre-place in Astro; the skylight works"
      - kind: entry
        floor: 2F
        room: Trophy Room
        note: "Statue control, then Deer"
      - kind: anchor
        floor: 2F
        room: Classical Hall
        note: "Take the 90 space; watch Skull and Red for flanks"
      - kind: anchor
        floor: 2F
        room: Study
        note: "Shoot the Study barricade and both default cams early"
      - kind: plant
        floor: 2F
        room: Aviator Room
        nudge: [2.0, -3.0]
        note: "Walk in once you have the map control"
  - id: villa-aviator-attack-bar
    site: aviator_room_games_room
    side: attack
    operators: [Hibana, Ace]
    title: "90 rappel, open the 90 wall and the Bar wall"
    text: >-
      The hard breacher (Hibana or Ace) works the 90 rappel, holding anyone playing 90 and the cut-off from
      Trophy side so 90 hall stays clear. Once the team has 90 control, open the 90 wall and the Bar wall: those
      angles cut the Vault and Bar rotates so the team can end on the half Vault wall. Pushed-back defenders end
      up playing Study, so keep one late flank on Study.
    placements:
      - kind: entry
        floor: 2F
        room: Aviator Room
        nudge: [-2.0, 0]
        note: "90 rappel window; hold 90 and the Trophy cut-off"
      - kind: hibana
        floor: 2F
        room: Aviator Room
        nudge: [0, 3.5]
        note: "90 wall and Bar wall, once 90 is yours"
      - kind: plant
        floor: 2F
        room: Aviator Room
        nudge: [-1.0, -2.0]
        note: "On the half Vault wall"

  # ------------------------------------------------------------------ 2F Trophy Room / 2F Statuary Room
  - id: villa-trophy-team-reinforce
    site: trophy_room_statuary_room
    side: defense
    operators: []
    title: "Triple wall, Closet walls, Bathroom to Master"
    text: >-
      Reinforce the right and middle panels of the triple wall, both Closet walls doubled, and the Bathroom to
      Master wall. Leave the triple wall's left panel for head holes and open the Astro rotate mid-round.
    placements:
      - kind: reinforce
        floor: 2F
        between: [Statuary Room, Classical Hall]
        note: "Triple wall, right and middle panels (wall position usually here)"
      - kind: reinforce
        floor: 2F
        room: Master Bedroom
        nudge: [-1.0, 2.5]
        note: "Both Closet walls, doubled"
      - kind: reinforce
        floor: 2F
        between: [Bathroom, Master Bedroom]
        note: "Bathroom to Master"
      - kind: open
        floor: 2F
        between: [Astronomy Room, Statuary Room]
        note: "Astro rotate, open it mid-round"
      - kind: open
        floor: 2F
        between: [Statuary Room, Classical Hall]
        nudge: [-1.5, 0]
        note: "Triple wall left head holes"
  - id: villa-trophy-kaid-warden
    site: trophy_room_statuary_room
    side: defense
    operators: [Kaid, Warden, Jager]
    title: "Claw the triple wall, shield Closet"
    text: >-
      Kaid claws the triple wall and plays Bricks. Warden puts his shield in Closet, and Jager plays Bathroom
      with ADS so grenades through the Bathroom hole get eaten.
    placements:
      - kind: kaid
        floor: 2F
        between: [Statuary Room, Classical Hall]
        nudge: [1.2, 0]
        note: "Triple wall claw"
      - kind: deployable
        floor: 2F
        room: Master Bedroom
        nudge: [0, 3.0]
        note: "Warden shield in Closet"
      - kind: trap
        floor: 2F
        room: Bathroom
        note: "Jager ADS in Bathroom"
  - id: villa-trophy-mira
    site: trophy_room_statuary_room
    side: defense
    operators: [Mira, Melusi]
    title: "Mira on Master and Astro, Banshee the stairs"
    text: >-
      Instead of Warden, Mira windows the Master or Closet wall and the Astro wall. Melusi puts a Banshee on the
      Astro stairs.
    placements:
      - kind: mira
        floor: 2F
        between: [Bathroom, Master Bedroom]
        nudge: [0, 2.0]
        note: "Window onto Master and Closet"
      - kind: mira
        floor: 2F
        between: [Astronomy Room, Statuary Room]
        nudge: [1.5, 0]
        note: "Window onto Astro"
      - kind: trap
        floor: 2F
        room: Astronomy Room
        note: "Banshee on the Astro stairs"
  - id: villa-trophy-attack-study-over
    site: trophy_room_statuary_room
    side: attack
    operators: [Gridlock, Nomad]
    title: "Study side over, skylight pick on Bricks"
    text: >-
      Cut-off cam on top Main, take Study and clear Maps with a player on the Skull window peeking the Skull
      swing. Work up to Landing and 90 (rappel in) and Airjab or claymore the stairs. Open the Master window at
      the start and come back late to pinch whoever plays Triple or Bricks. For the Bricks shield, have the team
      make noise Master side, then rappel down the skylight, shoot him and rappel back up.
    placements:
      - kind: anchor
        floor: 2F
        room: Study
        note: "Skull window: peek the Skull swing, cut Maps"
      - kind: entry
        floor: 2F
        room: Classical Hall
        note: "Take Landing and 90; claymore the stairs"
      - kind: entry
        floor: 2F
        between: [Master Bedroom, exterior]
        edge: right
        note: "Open the Master window early, pinch from it late"
      - kind: entry
        floor: 2F
        room: Statuary Room
        nudge: [1.5, -2.0]
        note: "Skylight: rappel down, shoot Bricks, rappel back up"
      - kind: plant
        floor: 2F
        room: Statuary Room
        nudge: [-1.5, 0]
        note: "Bricks side once it's clear"
  - id: villa-trophy-attack-astro
    site: trophy_room_statuary_room
    side: attack
    operators: [Thatcher, Flores, Hibana, Buck]
    title: "Astro window, clear Closet, open both Trophy walls"
    text: >-
      Play the Astro window to cut rotators. If they extend into Closet with a shield, Warden or ADS, bring burn
      utility: Thatcher EMPs above them and a banked nade kills the shield, pushing them out of Walk-in and Master.
      Airjab the Master door and take Bathroom fast; the Astro rappel cuts anyone rotating through it. Then hard
      breach both Trophy walls, make vertical under Astro, and plant tucked Deer, on the A chassis or on Bricks.
    placements:
      - kind: entry
        floor: 2F
        room: Astronomy Room
        note: "Astro window rappel cuts the Bathroom rotate"
      - kind: drone
        floor: 2F
        room: Master Bedroom
        nudge: [-1.0, 2.5]
        note: "Closet extender: EMP from above, nade the shield"
      - kind: hibana
        floor: 2F
        between: [Trophy Room, Aviator Room]
        note: "Both Trophy walls"
      - kind: plant
        floor: 2F
        room: Trophy Room
        nudge: [2.0, 0]
        note: "Tucked Deer, or the A chassis or Bricks"

  # ------------------------------------------------------------------ 1F Dining Room / 1F Kitchen
  - id: villa-dining-team-reinforce
    site: dining_room_kitchen
    side: defense
    operators: []
    title: "Pantry and Memo walls, Laundry hatch open"
    text: >-
      Reinforce the Pantry to Kitchen wall, both Memo walls doubled, the left side of the Laundry wall and the
      Middle China wall. Upstairs, reinforce both Bathroom walls and both Trophy walls. Never reinforce the
      Laundry hatch.
    placements:
      - kind: reinforce
        floor: 1F
        at: [68.0, 28.5]
        name: "Pantry to Kitchen wall"
        note: "Pantry sits under the 2F Bathroom; wall position is approximate"
      - kind: reinforce
        floor: 2F
        between: [Bathroom, Master Bedroom]
        nudge: [0, -2.0]
        note: "Upstairs Bathroom walls"
      - kind: reinforce
        floor: 2F
        between: [Trophy Room, Aviator Room]
        note: "Upstairs Trophy walls"
      - kind: open
        floor: 1F
        at: [64.8, 37.5]
        name: "1F hatch"
        note: "Never reinforce the Laundry hatch; which hatch is Laundry is not verified"
  - id: villa-dining-kaid-mira
    site: dining_room_kitchen
    side: defense
    operators: [Kaid, Mira, Aruni]
    title: "Claw Pantry and Memo, Mira on China"
    text: >-
      Kaid claws the Pantry and Memo walls and holds Dining. Mira puts her window facing China so Kitchen can
      watch it, and Aruni gates three doors on the Laundry side.
    placements:
      - kind: kaid
        floor: 1F
        at: [68.0, 28.5]
        name: "Pantry to Kitchen wall"
        nudge: [0, 1.2]
        note: "Pantry claw"
      - kind: mira
        floor: 1F
        at: [69.8, 33.5]
        name: "Mira wall facing China"
        note: "Approximate; the wall facing China"
  - id: villa-dining-pulse-upstairs
    site: dining_room_kitchen
    side: defense
    operators: [Pulse, Oryx]
    title: "Two upstairs over the site"
    text: >-
      Pulse plays the 2F Bathroom above Pantry and denies the vertical. Oryx holds the 2F windows and drops the
      Laundry hatch late to flank.
    placements:
      - kind: anchor
        floor: 2F
        room: Bathroom
        note: "Pulse above Pantry"
      - kind: anchor
        floor: 2F
        room: Trophy Room
        note: "Oryx, then a late Laundry hatch drop"
  - id: villa-dining-attack-pantry
    site: dining_room_kitchen
    side: attack
    operators: [Thermite, Thatcher]
    title: "Pantry wall with the Master and Closet windows open"
    text: >-
      Shoot the defaults, watch the Art door and open the Laundry door early for phantom pressure. Get basement
      and Astro control, walk up and open the Pantry wall. Someone opens the Master wall or window and the Closet
      window, because everything above is vertical play: fight them off the Pantry single. Then walk in and plant;
      a shield can sit in front while you plant behind it.
    placements:
      - kind: thermite
        floor: 1F
        at: [68.0, 28.5]
        name: "Pantry to Kitchen wall"
        note: "After basement and Astro control"
      - kind: entry
        floor: 2F
        between: [Master Bedroom, exterior]
        edge: right
        note: "Open the Master and Closet windows against the vertical"
      - kind: plant
        floor: 1F
        at: [67.0, 29.0]
        name: "Kitchen by the Pantry wall"
        note: "Behind a shield (position approximate)"
  - id: villa-dining-attack-vertical
    site: dining_room_kitchen
    side: attack
    operators: [Buck, Hibana]
    title: "Vertical from upstairs and the Laundry hatch"
    text: >-
      For the vertical take, get Statue, Astro, Deer and Trophy control and make vertical on Memo, the Island,
      the B chassis and the tucked spot behind it. The same player opens the Laundry hatch; with the Pantry wall
      open the team walks in and plants. If you lose bodies, he walks down bottom Astro (if there's no Castle)
      to fight the China player. Without vertical, go Laundry over to the Dining door and Memo and plant on the
      Dining door or the single.
    placements:
      - kind: breach
        floor: 2F
        room: Bathroom
        note: "Vertical on Memo, the Island and the B chassis"
      - kind: hibana
        floor: 1F
        at: [64.8, 37.5]
        name: "Laundry hatch"
        note: "Which hatch is Laundry is not verified"
      - kind: plant
        floor: 1F
        at: [67.5, 31.0]
        name: "Kitchen"
        note: "Covered by the vertical (position approximate)"

  # ------------------------------------------------------------------ B Art Storage / B Old Office
  - id: villa-basement-team-reinforce
    site: art_storage_old_office
    side: defense
    operators: []
    title: "Shut the hatches, double the Garage walls"
    text: >-
      Reinforce the Red Hall, Reading Room and Pantry hatches, both Garage exterior walls and both Old Office
      walls facing Garage. Keep the Art Storage to Old Office connection open; it is the whole site.
    placements:
      - kind: hatch
        floor: 1F
        at: [64.8, 37.5]
        name: "Hallway hatch"
        note: "Red Hall hatch, usually"
      - kind: hatch
        floor: 1F
        at: [72.2, 23.7]
        name: "North-east hatch"
        note: "Pantry or Reading Room hatch; name not verified"
      - kind: reinforce
        floor: B
        between: [Garage, exterior]
        edge: right
        note: "Both Garage exterior walls"
      - kind: reinforce
        floor: B
        at: [72.3, 31.0]
        name: "Old Office walls facing Garage"
        note: "Both panels; position approximate"
      - kind: open
        floor: B
        between: [Art Storage, Old Office]
        note: "Keep the connection"
  - id: villa-basement-kaid-mira
    site: art_storage_old_office
    side: defense
    operators: [Kaid, Mira]
    title: "Claw the hatches, Mira on Garage"
    text: >-
      Kaid claws the Red Hall and Pantry hatches against Hibana. Mira puts her window on the Old Office wall
      facing Garage, and the anchor plays between the rooms.
    placements:
      - kind: kaid
        floor: 1F
        at: [64.8, 37.5]
        name: "Hallway hatch"
        nudge: [1.2, 0]
        note: "Red Hall hatch claw"
      - kind: kaid
        floor: 1F
        at: [72.2, 23.7]
        name: "North-east hatch"
        nudge: [1.2, 0]
        note: "Pantry hatch claw"
      - kind: mira
        floor: B
        at: [72.3, 31.0]
        name: "Old Office wall facing Garage"
        nudge: [0, 1.5]
        note: "Window into Garage"
  - id: villa-basement-attack-garage
    site: art_storage_old_office
    side: attack
    operators: []
    title: "Clear Garage, then a hatch"
    text: >-
      Treat Garage as a room to clear, not an entry: drone it first, then take it. Hibana opens a hatch from 1F
      so the site gets hit from two sides; plant in Art Storage or Old Office.
    placements:
      - kind: drone
        floor: B
        room: Garage
        note: "Drone Garage first"
      - kind: entry
        floor: B
        at: [77.6, 31.5]
        name: "Garage door"
        note: "Garage from outside"
      - kind: hibana
        floor: 1F
        at: [64.8, 37.5]
        name: "Hallway hatch"
        note: "Burn the reinforced hatch"
      - kind: plant
        floor: B
        room: Art Storage
  - id: villa-basement-attack-west
    site: art_storage_old_office
    side: attack
    operators: [Thermite, Thatcher]
    title: "Wine Cellar and Crypt split"
    text: >-
      Split one through Wine Cellar and Crypt on the west while the rest hold Garage. Thatcher kills the Mira and
      claws, Thermite opens the Old Office wall; plant in Old Office.
    placements:
      - kind: drone
        floor: B
        room: Crypt
        note: "Drone Wine Cellar and Crypt"
      - kind: thermite
        floor: B
        at: [72.3, 31.0]
        name: "Old Office wall facing Garage"
        note: "After Thatcher; position approximate"
      - kind: plant
        floor: B
        room: Old Office
