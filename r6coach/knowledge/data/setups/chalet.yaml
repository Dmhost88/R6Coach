map: chalet
briefs:
  # ------------------------------------------------------------------ 2F Master Bedroom / 2F Office
  - id: chalet-office-team-reinforce
    site: master_bedroom_office
    side: defense
    operators: []
    title: "Double the Library wall, keep the Library hatch open"
    text: >-
      Reinforce both Office-Library panels first, then the Closet walls facing the Bathroom windows and the
      Ivy hallway panel next to the head holes. Leave the Library hatch open and the Ivy holes soft for
      rotates and vertical on Library.
    placements:
      - kind: reinforce
        floor: 2F
        between: [Office, Library]
        nudge: [0, -2.5]
        note: "Both panels; this is the wall attackers want"
      - kind: reinforce
        floor: 2F
        between: [Master Bathroom, Office]
        note: "Closet walls facing the Bathroom windows (usually two)"
      - kind: reinforce
        floor: 2F
        between: [Bedroom Hallway, Master Bedroom]
        nudge: [-3.0, 0]
        note: "Ivy hallway panel beside the head holes"
      - kind: open
        floor: 2F
        at: [35.3, 77.5]
        name: "Library hatch"
        note: "Leave open: vertical onto Gaming and a fast drop out of Library"
      - kind: open
        floor: 2F
        between: [Bedroom Hallway, Master Bedroom]
        nudge: [1.5, 0]
        note: "Ivy head holes for the hallway crossfire"
  - id: chalet-office-kaid-library-wall
    site: master_bedroom_office
    side: defense
    operators: [Kaid]
    title: "Claw the Office-Library wall"
    text: >-
      Once both Office-Library panels are up, claw the lower one from the Office side so Thermite or Hibana
      can't open it. Then play the Half Wall in Master and keep your second claw for a hatch or the Closet wall.
    placements:
      - kind: reinforce
        floor: 2F
        between: [Office, Library]
        nudge: [0, -2.5]
        note: "Both panels"
      - kind: kaid
        floor: 2F
        between: [Office, Library]
        nudge: [1.2, 1.5]
        note: "Low on the Office side"
      - kind: anchor
        floor: 2F
        between: [Office, Master Bedroom]
        note: "Half Wall: hold Office and the breach"
  - id: chalet-office-library-contest
    site: master_bedroom_office
    side: defense
    operators: []
    title: "Contest Library, leave by 1:15"
    text: >-
      One roamer contests Library early and gets out through Piano by about 1:15-1:30, sealing it behind with
      utility; the anchor holds Office behind the desk and lances Library through the wall when it opens.
    placements:
      - kind: anchor
        floor: 2F
        room: Library
        note: "Early contest, out by 1:15-1:30"
      - kind: anchor
        floor: 2F
        room: Office
        nudge: [0, 4.0]
        note: "Behind the desk, watching the Library wall"
      - kind: trap
        floor: 2F
        at: [33.8, 80.0]
        name: "Library windows"
        note: "Lasers or traps on the rappel windows (Denari, Thorn)"
  # Attack briefs on this map follow Garfieldisdoc, "How to Attack EVERY Bombsite in Rainbow Six Siege
  # (2026)", https://www.youtube.com/watch?v=1qCEYZwQzes (Chalet from 51:16).
  - id: chalet-office-attack-library-wall
    site: master_bedroom_office
    side: attack
    operators: [Ace, Zofia, Gridlock, Nomad]
    title: "Library and Mez split into the main Office wall"
    call: "Split Library and Mezzanine, Gridlock off Library, Ace opens Office, plant half wall."
    text: >-
      Split Library and Mezzanine (Mez) with pre-placed cams; one player rappels at the Front Yard windows
      (the video's "Highway" windows) to cut top Mez. Push the Library player back down Library Stairs with
      frags or Zofia's concussions, Gridlock lays Trax off Library, then Ace opens the main Office wall and
      you plant on the half wall while Ace watches Piano and Bathroom.
    counters: >-
      Bandit or Kaid on the Office wall: Nomad or Zofia clears it first, or bring Thatcher. A Mira on the
      wall: Ace still opens it, then plant from Library through the opening.
    placements:
      - kind: anchor
        floor: 2F
        at: [32.6, 72.0]
        name: "Front Yard window rappel"
        note: "Cuts anyone going top Mez or extending into Library"
      - kind: entry
        floor: 2F
        at: [33.8, 80.0]
        name: "Library windows"
        note: "Double or single window once Library Stairs is pushed back"
      - kind: ace
        by: Ace
        floor: 2F
        between: [Office, Library]
        nudge: [-1.2, 0]
        note: "The main wall; watch the swing from Piano"
      - kind: plant
        floor: 2F
        room: Office
        nudge: [0, 3.0]
        note: "On the half wall"
  - id: chalet-office-attack-solarium
    site: master_bedroom_office
    side: attack
    operators: [Kali, Gridlock, Hibana, Nomad]
    title: "Trophy and Solarium take into Master"
    text: >-
      When the Library extend is too strong, take Trophy up to the Kitchen hallway with a pre-placed cam
      in Trophy, keep one player outside the Highway windows to claymore the Bathroom and Piano jump-outs,
      bolt or vert the Owl player, then open the Solarium wall and plant tucked in the Master corner.
    placements:
      - kind: drone
        floor: 1F
        at: [66.0, 62.0]
        name: "Trophy Room"
        note: "Pre-place a cam here in the drone phase"
      - kind: anchor
        floor: 2F
        between: [Master Bathroom, exterior]
        edge: top
        note: "Outside the Highway windows; claymore Bathroom and Piano jump-outs"
      - kind: breach
        floor: 2F
        between: [Master Bedroom, Bedroom Hallway]
        note: "Solarium wall, then fight into Bathroom"
      - kind: plant
        floor: 2F
        room: Master Bedroom
        nudge: [2.0, 4.0]
        note: "Tucked in the corner, or on the bed"

  # ------------------------------------------------------------------ 1F Bar / 1F Gaming Room
  - id: chalet-bar-team-reinforce
    site: bar_gaming_room
    side: defense
    operators: []
    title: "Seal both hatches and the Gaming wall"
    text: >-
      Reinforce the Library hatch over Gaming and the Bathroom hatch over Bar, then both Gaming exterior
      panels and the Bar to Fireplace wall. Keep the Bar to Gaming door open as your rotate.
    placements:
      - kind: hatch
        floor: 2F
        at: [35.3, 77.5]
        name: "Library hatch"
        note: "Over Gaming; Buck and Hibana play it"
      - kind: hatch
        floor: 2F
        at: [45.5, 70.5]
        name: "Bathroom hatch"
        note: "Over Bar"
      - kind: reinforce
        floor: 1F
        between: [Gaming Room, exterior]
        edge: left
        note: "Both Gaming exterior panels"
      - kind: reinforce
        floor: 1F
        between: [Bar, Fireplace]
        note: "Both panels"
      - kind: rotate
        floor: 1F
        between: [Gaming Room, Bar]
        note: "Bar to Gaming stays open"
  - id: chalet-bar-mira-gaming
    site: bar_gaming_room
    side: defense
    operators: [Mira]
    title: "Mira from Bar onto Gaming"
    text: >-
      Reinforce the Bar to Gaming wall and put a Mira in it so the Bar anchor can see Gaming and the deep
      corner plant. Expect Hibana to spend pellets on it from the Library side.
    placements:
      - kind: reinforce
        floor: 1F
        between: [Gaming Room, Bar]
        nudge: [0, -3.0]
        note: "Usually the panel next to the door"
      - kind: mira
        floor: 1F
        between: [Gaming Room, Bar]
        nudge: [0.8, 3.0]
        note: "Face it into Gaming"
      - kind: anchor
        floor: 1F
        room: Bar
        nudge: [1.5, 3.0]
        note: "Deep Bar behind the counter"
  - id: chalet-bar-castle-hallway
    site: bar_gaming_room
    side: defense
    operators: [Castle, Mute]
    title: "Block the hallway doors"
    text: >-
      Castle the Bar door off the Gaming hallway and the Gaming window side doors so attackers have to break
      utility to walk in; Mute or Goyo cover the two Gaming entries.
    placements:
      - kind: castle
        floor: 1F
        between: [Gaming Room Hallway, Bar]
        note: "Bar door from the hallway"
      - kind: castle
        floor: 1F
        between: [Gaming Room Hallway, Gaming Room]
        nudge: [0, 3.0]
        note: "Usually the hallway door toward Gaming"
      - kind: trap
        floor: 1F
        room: Gaming Room
        note: "Jammer or Volcan covering the window entry"
  - id: chalet-bar-attack-gaming-wall
    site: bar_gaming_room
    side: attack
    operators: [Hibana, Flores, Gridlock]
    title: "Piano and Office control, then the Library hall wall"
    text: >-
      Hibana starts on the Library side and spends two pellets on the soft wall to pop the Mira. The rest
      take Piano and Office with cut-off cams at Piano and bottom Trophy and a player on the window slant
      shooting top Mez, then open the Library hall wall from Office and clear the top-Library shield.
    placements:
      - kind: hibana
        floor: 2F
        at: [33.8, 80.0]
        name: "Library side"
        note: "Two pellets on the soft wall to pop the Mira"
      - kind: drone
        floor: 2F
        room: Master Bathroom
        note: "Cut-off cams at Piano and bottom Trophy stairs"
      - kind: breach
        floor: 2F
        between: [Office, Library]
        nudge: [1.2, 0]
        note: "Library hall wall from Office; Flores or frags on the top-Library shield"
  - id: chalet-bar-attack-vertical
    site: bar_gaming_room
    side: attack
    operators: [Buck, Hibana, Sledge]
    title: "Phantom pressure, vertical and the Gaming wall plant"
    text: >-
      Open the front Lobby door, the Mudroom window and the main window early so nobody plays tucked. Once
      top Mez is clear, open the hatch and play vertical from Library onto Bar, then plant on the Gaming
      wall or take bottom Fireplace and run in.
    placements:
      - kind: entry
        floor: 1F
        at: [34.2, 70.0]
        name: "Main and Mudroom windows"
        note: "Open them at the start for phantom pressure"
      - kind: breach
        floor: 2F
        room: Mezzanine
        note: "Open the hatch so rotations are cut"
      - kind: anchor
        floor: 2F
        room: Library
        note: "Vertical spot: you can see the Mira player from above"
      - kind: plant
        floor: 1F
        between: [Gaming Room, Bar]
        nudge: [-2.0, 0]
        note: "Gaming wall plant"

  # ------------------------------------------------------------------ 1F Kitchen / 1F Dining Room
  - id: chalet-kitchen-bandit-fireplace
    site: kitchen_dining_room
    side: defense
    operators: [Bandit]
    title: "Trick the Dining-Fireplace wall"
    text: >-
      Reinforce both Dining-Fireplace panels and trick them with batteries. Kali will lance batteries before
      Hibana opens it, so keep one battery in hand to replace them late.
    placements:
      - kind: reinforce
        floor: 1F
        between: [Dining Room, Fireplace]
        nudge: [-1.5, 0]
        note: "Both panels"
      - kind: bandit
        floor: 1F
        between: [Dining Room, Fireplace]
        nudge: [1.0, -1.5]
        note: "Batteries on both panels, from the Dining side"
  - id: chalet-kitchen-team-reinforce
    site: kitchen_dining_room
    side: defense
    operators: []
    title: "Fireplace wall, Trophy wall, Kitchen hatch soft"
    text: >-
      Reinforce the Dining-Fireplace panels, the third wall in the row and the Trophy wall, and leave head
      holes on them. Keep the Kitchen hatch soft and never open it early; play 2F Office for vertical.
    placements:
      - kind: reinforce
        floor: 1F
        between: [Dining Room, Fireplace]
        nudge: [-1.5, 0]
        note: "Panels one and two"
      - kind: reinforce
        floor: 1F
        between: [Kitchen, Dining Room]
        note: "Kitchen-Dining wall (usually one of the 'two Dining walls')"
      - kind: open
        floor: 1F
        between: [Dining Room, Fireplace]
        nudge: [2.0, 0]
        note: "Feet and head holes on the soft panel"
      - kind: anchor
        floor: 2F
        room: Piano Room
        note: "Play above for vertical on the dining-table plant"
  - id: chalet-kitchen-smoke-rotate
    site: kitchen_dining_room
    side: defense
    operators: [Smoke]
    title: "Shield the second rotate, gas late"
    text: >-
      Put your shield on the second rotate into Kitchen and gas the dining-table plant late from there. Don't
      burn gas early on the Fireplace wall.
    placements:
      - kind: deployable
        floor: 1F
        between: [Kitchen, Dining Room]
        nudge: [1.5, 0.5]
        note: "Second rotate"
      - kind: anchor
        floor: 1F
        room: Kitchen
        note: "Kitchen counters"
  - id: chalet-kitchen-attack-fireplace-wall
    site: kitchen_dining_room
    side: attack
    operators: [Hibana, Gridlock, Sledge]
    title: "Lobby control, then the Fireplace wall"
    text: >-
      Take Lobby with cut-off drones or Gridlock on the staircases; a Sledge can come up from Snowmobile
      or through Stock. Once nobody is on that side of the map, open the Fireplace wall and plant on
      default.
    placements:
      - kind: drone
        floor: 1F
        room: Fireplace
        note: "Cut off Fireplace stairs and Trophy"
      - kind: hibana
        floor: 1F
        between: [Dining Room, Fireplace]
        nudge: [0, 1.5]
        note: "Fireplace wall, last"
      - kind: plant
        floor: 1F
        room: Dining Room
        note: "Default plant"
  - id: chalet-kitchen-attack-hatch
    site: kitchen_dining_room
    side: attack
    operators: [Ace, Buck, Gridlock]
    title: "Win upstairs and play vertical"
    text: >-
      Drone Library, pre-place a cam there and take Library and top Mez; watch the Library Stairs flank and
      45. Work the Highway windows to cut Piano and Bathroom, open the main wall upstairs and the hatch if
      it isn't open, and play vertical onto site while someone holds Trophy and Solarium stairs.
    placements:
      - kind: entry
        floor: 2F
        at: [33.8, 80.0]
        name: "Library windows"
        note: "Pre-place a cam in Library first"
      - kind: ace
        floor: 2F
        at: [65.5, 37.5]
        name: "Kitchen hatch"
        note: "Open it if it isn't open; then vertical"
      - kind: plant
        floor: 1F
        room: Kitchen
        note: "Kitchen plant after the drop"

  # ------------------------------------------------------------------ B Wine Cellar / B Snowmobile Garage
  - id: chalet-basement-bandit-snowmobile
    site: wine_cellar_snowmobile_garage
    side: defense
    operators: [Bandit]
    title: "Trick the Snowmobile exterior wall"
    text: >-
      Reinforce both Snowmobile exterior panels and trick them. Thatcher and Thermite come together here, so
      wait for the EMP and reset batteries if you can.
    placements:
      - kind: reinforce
        floor: B
        between: [Snowmobile Garage, exterior]
        edge: bottom
        note: "Both panels"
      - kind: bandit
        floor: B
        between: [Snowmobile Garage, exterior]
        edge: bottom
        nudge: [1.5, -1.5]
        note: "From inside the garage"
  - id: chalet-basement-mira-wine
    site: wine_cellar_snowmobile_garage
    side: defense
    operators: [Mira]
    title: "Mira the Wine-Snowmobile wall"
    text: >-
      Reinforce both Wine-Snowmobile panels and window one so the Wine Cellar anchor can shoot the
      Snowmobile planter. A second window toward Main Stairs or Blue is optional.
    placements:
      - kind: reinforce
        floor: B
        between: [Wine Cellar, Snowmobile Garage]
        nudge: [0, -1.5]
        note: "Both panels"
      - kind: mira
        floor: B
        between: [Wine Cellar, Snowmobile Garage]
        nudge: [0.8, 1.5]
        note: "Facing into Snowmobile"
      - kind: anchor
        floor: B
        room: Wine Cellar
        note: "Behind the Mira window"
  - id: chalet-basement-team-reinforce
    site: wine_cellar_snowmobile_garage
    side: defense
    operators: []
    title: "Hatch, Snowmobile walls, one door open"
    text: >-
      Reinforce the hatch over the basement next to Snowmobile, both Snowmobile walls and the Stock wall at the
      bottom of the Main Stairs. Leave one basement corridor door and the Wine to Wine Stock path open to rotate.
    placements:
      - kind: hatch
        floor: 1F
        at: [59.9, 85.3]
        name: "Fireplace hatch"
        note: "Over the basement; guides also reinforce the Dining and Connector hatches"
      - kind: reinforce
        floor: B
        between: [Snowmobile Garage, exterior]
        edge: bottom
        nudge: [-2.0, 0]
        note: "Exterior wall"
      - kind: reinforce
        floor: B
        between: [Wine Cellar, Snowmobile Garage]
        nudge: [0, -1.5]
        note: "Wine side"
      - kind: rotate
        floor: B
        between: [Wine Cellar, Wine Stock]
        note: "Keep this path open"
  - id: chalet-basement-attack-snowmobile-wall
    site: wine_cellar_snowmobile_garage
    side: attack
    operators: [Thermite, Maverick, Buck, Nomad]
    title: "Lobby take: open the main breach"
    text: >-
      Counter-pick the main breach to what they bring: Maverick if it has to be made soft, otherwise
      Thermite with Twitch drones.
      Buck plays vertical from upstairs while Nomad airjabs the Dining single and holds Snowmobile stairs;
      a second hard breach opens the hatch. Cut off Connector, the single and Pillar, then plant on the
      front breach.
    placements:
      - kind: thermite
        floor: B
        between: [Snowmobile Garage, exterior]
        edge: bottom
        nudge: [1.5, 0]
        note: "The main breach"
      - kind: hibana
        floor: 1F
        at: [59.9, 85.3]
        name: "Fireplace hatch"
        note: "Second hard breach opens the hatch"
      - kind: plant
        floor: B
        room: Snowmobile Garage
        nudge: [0, 4.0]
        note: "On the front breach"
  - id: chalet-basement-attack-vertical
    site: wine_cellar_snowmobile_garage
    side: attack
    operators: [Ace, Hibana, Nomad]
    title: "Boiler take"
    text: >-
      Still open the front breach for phantom pressure. Nomad takes West Main and airjabs Dining with a
      pre-placed cam near Trophy; Hibana opens the long angle onto Connector while Ace drones out and opens
      the Boiler wall. Dump utility on the Pillar shield, then plant if nobody is roaming Dining.
    placements:
      - kind: hibana
        floor: B
        at: [55.0, 48.0]
        name: "Long angle on Connector"
        note: "Mind the feet hole while you place it"
      - kind: ace
        floor: B
        at: [53.0, 63.0]
        name: "Boiler wall"
        note: "Drone it out, gun up for the door, then open it"
      - kind: plant
        floor: B
        room: Wine Cellar
        note: "Once the Pillar shield's utility is gone"
