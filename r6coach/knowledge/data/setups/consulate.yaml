map: consulate
# Positions use the layout's room boxes, which are rough on Consulate (confidence 0.2-0.45). Where the
# two rooms of a named wall are not neighbours in the layout, the icon sits on the room it belongs to
# (room:) or on a point read off the blueprint (at:), and the note says which wall is meant.
briefs:
  # ------------------------------------------------------------------ 2F Meeting Room / 2F Consul Office
  - id: consulate-meeting-team-reinforce
    site: meeting_room_consul_office
    side: defense
    operators: []
    title: "Lock Break-Admin and the Meeting breach wall"
    text: >-
      Reinforce the Break-Admin walls and the wall protecting Coffin with the hatch under it, then the Meeting
      outside breach wall and the Consul Office window wall. Keep the Admin to Balcony rotate open so you can
      extend and shoot Files and Coffin rappels.
    placements:
      - kind: reinforce
        floor: 2F
        between: [Break Room, Administration Office]
        nudge: [-1.2, 0]
        note: "Break-Admin walls 1 and 2"
      - kind: hatch
        floor: 2F
        at: [51.2, 62.0]
        name: "Hatch under Coffin"
        note: "Reinforce it with the Break wall protecting Coffin"
      - kind: reinforce
        floor: 2F
        between: [Meeting Room, Balcony]
        note: "Meeting outside breach wall (usually the balcony side)"
      - kind: reinforce
        floor: 2F
        between: [Consul Office, exterior]
        edge: right
        note: "CO window wall"
      - kind: reinforce
        floor: 2F
        between: [Consul Office, Meeting Room]
        note: "Consul to Meeting wall, Connector-window half"
      - kind: open
        floor: 2F
        between: [Administration Office, Balcony]
        note: "Admin to Balcony rotate for the extension"
  - id: consulate-meeting-castle-bandit
    site: meeting_room_consul_office
    side: defense
    operators: [Castle, Bandit]
    title: "Pre-hit Coffin barricade, batteries on Meeting"
    text: >-
      Castle puts a barricade on Coffin and pre-hits it to about 8 of 10 hits, so the Coffin player has an
      escape. Bandit puts batteries on the Meeting breach wall and tricks it when the Thermite or Hibana goes up.
    placements:
      - kind: castle
        floor: 2F
        between: [Break Room, Administration Office]
        nudge: [1.2, 0]
        note: "Coffin barricade, pre-hit to 8 of 10"
      - kind: bandit
        floor: 2F
        between: [Meeting Room, Balcony]
        nudge: [-1.2, -1.0]
        note: "Batteries on the Meeting breach wall"
      - kind: anchor
        floor: 2F
        room: Meeting Room
        note: "Meeting power spot; Vending shield covers the doors"
  - id: consulate-meeting-kaid-goyo
    site: meeting_room_consul_office
    side: defense
    operators: [Kaid, Goyo]
    title: "Claw off Admin, Volcan on the CO window"
    text: >-
      Kaid claws the Break-Admin wall from the Break side, so Ace and Thermite can't open Break from Admin.
      Goyo puts a Volcan by the CO window to burn a hook or rappel plant.
    placements:
      - kind: kaid
        floor: 2F
        between: [Break Room, Administration Office]
        nudge: [0, -1.0]
        note: "Low on the Break side"
      - kind: deployable
        floor: 2F
        between: [Consul Office, exterior]
        edge: right
        nudge: [-1.2, 0]
        note: "Goyo Volcan on the CO window"
  # Attack briefs on this map follow Garfieldisdoc, "How to Attack EVERY Bombsite in Rainbow Six Siege
  # (2026)", https://www.youtube.com/watch?v=1qCEYZwQzes (Consulate from 1:37:02).
  - id: consulate-meeting-attack-admin-over
    site: meeting_room_consul_office
    side: attack
    operators: [Thermite, Flores, Buck]
    title: "Admin over: catering wall, Break wall, push to Long Desk"
    text: >-
      Hard breach opens the catering wall from East Front Yard for phantom pressure while you drone Admin; if
      it's stacked, drone a teammate into bottom Visa and vert above the Mira to cut Break. With Admin yours,
      a second hard breach opens the Break wall for the Long Desk angle, Flores drones out the Vending shield
      and Whiteboard, a teammate takes Spiral to hold the cross, then plant default in Consul Office.
    placements:
      - kind: breach
        floor: 2F
        between: [Administration Office, exterior]
        edge: bottom
        note: "Catering wall from East Front Yard: phantom pressure"
      - kind: drone
        floor: 2F
        room: Administration Office
        note: "Drone Admin; get control before you push"
      - kind: breach
        floor: 2F
        between: [Break Room, Administration Office]
        note: "Break hard wall: angle on the Long Desk rotate"
      - kind: anchor
        floor: 2F
        room: Spiral Stairs
        note: "Rotate Spiral, hold the Long Desk cross"
      - kind: plant
        floor: 2F
        room: Consul Office
        note: "Default, once Whiteboard is cleared"
  - id: consulate-meeting-attack-consul-window
    site: meeting_room_consul_office
    side: attack
    operators: [Buck, Nomad]
    title: "Consul flip: Yellow, the connector, rappel the CO window"
    call: "Take Yellow, hold Bathroom, win the connector, rappel the Consul window, plant."
    counters: >-
      Melusi or Thorn on Yellow: drone and shoot them before you walk up. The connector holds: Buck verts
      the jump-up player from below.
    text: >-
      If Admin is too strong, flip to Consul: take Yellow stairs and clear the Melusi and Thorn utility while
      one player cuts off Bathroom and Secretary. Win the connector (vert the jump-up player from below if you
      must), then rappel in the Consul window and plant; Buck verts the door and desk players.
    placements:
      - kind: entry
        floor: 2F
        room: Yellow Stairs
        note: "Take Yellow; clear Melusi and Thorn utility"
      - kind: anchor
        floor: 2F
        room: Bathroom
        note: "Hold the Bathroom doorway to cut Secretary"
      - kind: entry
        floor: 2F
        at: [66.0, 63.0]
        name: "Connector (Consul Side Room)"
        note: "Win the connector; vert the jump-up player"
      - kind: entry
        floor: 2F
        between: [Consul Office, exterior]
        edge: right
        note: "Rappel in the Consul window"
      - kind: plant
        floor: 2F
        room: Consul Office
        nudge: [0, 2.0]
        note: "Plant once connector and Secretary are yours"

  # ------------------------------------------------------------------ 1F Piano Room / 1F Exposition Room
  - id: consulate-expo-team-reinforce
    site: piano_room_exposition_room
    side: defense
    operators: []
    title: "Double walls, Piano wall, keep the vertical"
    text: >-
      Reinforce the Expo-Lounge and Lounge-Visa double walls, the Piano wall up to Top Yellow and the Expo left
      wall up to the Benches window. Upstairs, reinforce the CO wall and the balcony single wall so 2F stays
      yours. Leave the Piano hatch soft and closed.
    placements:
      - kind: reinforce
        floor: 1F
        room: Exposition Room
        nudge: [-1.5, 0]
        note: "Expo-Lounge double wall"
      - kind: reinforce
        floor: 1F
        between: [Lounge, Visa Office]
        note: "Lounge-Visa double wall"
      - kind: reinforce
        floor: 1F
        room: Piano Room
        nudge: [-1.0, 0]
        note: "Piano wall to Top Yellow and the closet wall outside Piano"
      - kind: reinforce
        floor: 2F
        between: [Consul Office, Meeting Room]
        note: "2F CO wall and the balcony single wall"
      - kind: open
        floor: 1F
        at: [68.3, 57.3]
        name: "Piano hatch"
        note: "Soft and closed, not reinforced (sources disagree; usually left soft)"
  - id: consulate-expo-kaid-mira
    site: piano_room_exposition_room
    side: defense
    operators: [Kaid, Mira]
    title: "Claw both double walls, Mira the Lounge wall"
    text: >-
      Kaid claws both double walls and holds the Expo corner. Mira puts her windows on the Lounge wall and the
      Piano wall so Piano can watch the breach without taking a peek.
    placements:
      - kind: kaid
        floor: 1F
        room: Exposition Room
        nudge: [-1.5, 1.2]
        note: "Expo-Lounge double wall claw"
      - kind: kaid
        floor: 1F
        between: [Lounge, Visa Office]
        nudge: [1.2, 0]
        note: "Lounge-Visa double wall claw"
      - kind: mira
        floor: 1F
        room: Exposition Room
        nudge: [-1.5, -1.2]
        note: "Window on the Lounge wall"
      - kind: mira
        floor: 1F
        room: Piano Room
        nudge: [1.0, 0]
        note: "Window on the Piano wall"
      - kind: anchor
        floor: 1F
        room: Exposition Room
        nudge: [2.0, 3.0]
        note: "Expo corner"
  - id: consulate-expo-castle-2f
    site: piano_room_exposition_room
    side: defense
    operators: [Castle]
    title: "Castle the 2F doors over Piano"
    text: >-
      Castle panels the 2F doors and plays Consul Office and Meeting above Piano, so attackers can't take 2F
      for the vertical. Shoot down through holes when they plant.
    placements:
      - kind: castle
        floor: 2F
        between: [Consul Office, Meeting Room]
        nudge: [0, -2.0]
        note: "2F doors into CO and Meeting"
      - kind: anchor
        floor: 2F
        room: Consul Office
        note: "Hold 2F above Piano for the vertical"
  - id: consulate-expo-attack-lounge-wall
    site: piano_room_exposition_room
    side: attack
    operators: [Thermite, Gridlock, Nomad]
    title: "Visa over: lock Visa, open the wall, take Spiral"
    text: >-
      If they aren't holding vert from above, get one or two players into Visa and lock it down so you aren't
      flanked: Gridlock Trax and an air jab for sound. Open the wall toward Lounge, take Spiral stairs so
      nobody flanks Benches, then open the Expo wall and plant, smoking off the rotate or yourself.
    placements:
      - kind: entry
        floor: 1F
        room: Visa Office
        note: "Lock Visa down; Trax and a jab for sound"
      - kind: breach
        floor: 1F
        room: Lounge
        note: "Open the wall and take Lounge control"
      - kind: anchor
        floor: 1F
        room: Spiral Stairs
        note: "Spiral control: stops the Benches flank"
      - kind: plant
        floor: 1F
        room: Exposition Room
        nudge: [-1.0, 2.0]
        note: "Off the wall, smoke the rotate"
  - id: consulate-expo-attack-hibana
    site: piano_room_exposition_room
    side: attack
    operators: [Montagne, Gridlock, Buck]
    title: "Vs vertical: bottom-up Yellow to the single wall"
    text: >-
      When they play vert from above, open the closet and the Yellow window early for phantom pressure, then
      go bottom-up with a shield through all of Yellow, Trax on the stairs. Work the single wall from West
      Corridor with a player outside the hallway window for the Benches flank; or go Admin over, clear 2F,
      open the Piano hatch and drop a teammate to plant behind the piano.
    placements:
      - kind: entry
        floor: 1F
        room: Yellow Stairs
        note: "Open the Yellow window early; shield takes all of Yellow"
      - kind: breach
        floor: 1F
        at: [56.0, 66.0]
        name: "West Corridor single wall"
        note: "Your breach once Yellow is yours"
      - kind: anchor
        floor: 1F
        at: [50.5, 60.0]
        name: "Outside the hallway window"
        note: "Sit out here for the Benches flank"
      - kind: plant
        floor: 1F
        room: Piano Room
        note: "Behind the piano (drop through the hatch late)"

  # ------------------------------------------------------------------ 1F Tellers / B Servers
  - id: consulate-tellers-team-reinforce
    site: tellers_servers
    side: defense
    operators: []
    title: "Secret wall first, two Visa hatches open"
    text: >-
      Reinforce the Secret single wall first, then both Construction to Cafe walls, the Storage wall and the top
      of Server Stairs. Upstairs, reinforce both back-of-Tellers walls and one Visa hatch, and leave the other
      two hatches open for rotates.
    placements:
      - kind: reinforce
        floor: B
        between: [Electrical Room, Servers]
        note: "Electrical wall into Servers"
      - kind: reinforce
        floor: B
        room: Construction
        note: "Both Construction to Cafe end walls"
      - kind: reinforce
        floor: B
        room: Storage
        note: "Storage to Cafe hallway wall"
      - kind: reinforce
        floor: B
        room: Server Stairs
        note: "Top of Server Stairs wall"
      - kind: reinforce
        floor: 1F
        between: [Lobby, Tellers]
        note: "Back-of-Tellers walls (both)"
      - kind: hatch
        floor: 1F
        at: [53.3, 63.6]
        name: "Visa hatch"
        note: "The corner one; attackers plant under it"
      - kind: open
        floor: 1F
        at: [62.8, 57.3]
        name: "Tellers hatch"
        note: "Leave open for the rotate"
  - id: consulate-tellers-mute-pulse
    site: tellers_servers
    side: defense
    operators: [Mute, Pulse]
    title: "Jam Secret and the stairs, Pulse under the desk"
    text: >-
      Mute jams Secret and Server Stairs so the Electrical wall and the stairs can't be droned or EMP'd. Pulse
      bunkers in Servers under the desk holes and scans up to Tellers.
    placements:
      - kind: trap
        floor: B
        between: [Electrical Room, Servers]
        nudge: [0, 1.2]
        note: "Mute jammer on the Electrical side"
      - kind: trap
        floor: B
        room: Server Stairs
        nudge: [0, 2.0]
        note: "Mute jammer at the stairs"
      - kind: anchor
        floor: B
        room: Servers
        note: "Pulse under the Tellers desk holes"
  - id: consulate-tellers-attack-squeeze
    site: tellers_servers
    side: attack
    operators: [Thermite, Ace]
    title: "Basement pinch: Dirt, bottom Yellow, the Electrical wall"
    text: >-
      Open Dirt into Construction and have one player slowly take that space while the rest take bottom Yellow
      and Garage with a pre-placed cam. Drone Construction through the outside drone hole, open the single
      wall and hold it while you clear Lockers and Coffee; then the Electrical player opens the Electrical wall
      and the bomb carrier plants under the hatch, watching the stairs and the Visa hatch flank.
    placements:
      - kind: entry
        floor: B
        room: Construction
        note: "Open Dirt; one player slowly takes the space"
      - kind: entry
        floor: B
        room: Garage
        note: "Bottom Yellow and Garage with a pre-placed cam"
      - kind: breach
        floor: B
        room: Construction
        nudge: [2.0, 2.0]
        note: "Single wall; hold it while you clear Construction utility"
      - kind: thermite
        floor: B
        between: [Electrical Room, Servers]
        note: "Electrical wall for the line of sight"
      - kind: plant
        floor: B
        room: Servers
        note: "Under the hatch; watch the stairs and the Visa hatch"
  - id: consulate-tellers-attack-lobby
    site: tellers_servers
    side: attack
    operators: [Thermite, Montagne]
    title: "Lobby take: Lounge double, staircase wall, Spiral"
    text: >-
      If they don't play proper vert, take Main Entrance, drone out Lobby and the hallway and work the Lounge
      double. Clear the bottom Visa stairs shield or open the Visa window and hold the cross, open the Lobby
      wall to the staircase to cut the flank, push Spiral and its Castle, and plant on the Tellers desk or
      the middle pillar.
    placements:
      - kind: entry
        floor: 1F
        room: Lobby
        note: "Main Entrance; drone out for random vert"
      - kind: entry
        floor: 1F
        room: Visa Office
        note: "Open the Visa window and hold the cross"
      - kind: breach
        floor: 1F
        at: [60.0, 61.0]
        name: "Lobby wall to the staircase"
        note: "Cuts off anyone trying to flank"
      - kind: entry
        floor: 1F
        room: Spiral Stairs
        note: "Push Spiral, clear the Castle"
      - kind: plant
        floor: 1F
        room: Tellers
        note: "On the desk or the middle pillar; watch the window"

  # ------------------------------------------------------------------ B Cafeteria / B Garage
  - id: consulate-garage-team-reinforce
    site: cafeteria_garage
    side: defense
    operators: []
    title: "Garage panels and the site hatch"
    text: >-
      Reinforce Garage breach panels 1 and 2, the site hatch, the Security wall left half and the wall behind
      Pillar, plus the Storage wall to outside Cafeteria. Keep the foot holes by the site hatch soft against
      Thermite from above.
    placements:
      - kind: reinforce
        floor: B
        between: [Garage, exterior]
        edge: left
        note: "Garage breach panels 1 and 2"
      - kind: hatch
        floor: 1F
        at: [67.2, 69.0]
        name: "Site hatch"
        note: "Reinforce; which of the 1F hatches is 'the' site hatch is not verified"
      - kind: reinforce
        floor: B
        room: Security Room
        note: "Security wall, left half"
      - kind: reinforce
        floor: B
        room: Storage
        nudge: [0, 2.0]
        note: "Storage to outside Cafeteria wall"
      - kind: reinforce
        floor: 1F
        room: Tellers
        note: "1F top Electrical wall"
  - id: consulate-garage-kaid-mira
    site: cafeteria_garage
    side: defense
    operators: [Kaid, Mira]
    title: "Claw Garage, Mira Cafeteria"
    text: >-
      Kaid claws the Garage breach panels and the site hatch. Mira puts windows on Cafeteria walls 1 and 2 and
      the anchor holds Pillar behind them.
    placements:
      - kind: kaid
        floor: B
        between: [Garage, exterior]
        edge: left
        nudge: [1.2, 0]
        note: "Garage breach panels"
      - kind: kaid
        floor: 1F
        at: [67.2, 69.0]
        name: "Site hatch"
        nudge: [1.2, 0]
        note: "Claw the site hatch"
      - kind: mira
        floor: B
        between: [Kitchen, Cafeteria]
        note: "Cafeteria wall 1"
      - kind: mira
        floor: B
        room: Cafeteria
        nudge: [0, -3.0]
        note: "Cafeteria wall 2"
      - kind: anchor
        floor: B
        at: [54.5, 63.8]
        name: "Pillar"
        note: "Pillar anchor"
  - id: consulate-garage-attack-thermite
    site: cafeteria_garage
    side: attack
    operators: [Thermite]
    title: "Main Garage breach once the vert is yours"
    text: >-
      Work for the main Garage wall, but if they Tubarao or Bandit trick it, wait for your teammates to get
      vertical control first. Open the main breach, let the vert player pop any Mira, push Yellow with one or
      two and walk in to plant. It's a gunfight site and the round runs long, so expect to play it out.
    placements:
      - kind: thermite
        floor: B
        between: [Garage, exterior]
        edge: left
        note: "Main Garage wall; wait for vert if it's tricked"
      - kind: entry
        floor: B
        at: [55.0, 58.0]
        name: "Bottom Yellow"
        note: "One or two push Yellow and cut lines of sight"
      - kind: plant
        floor: B
        room: Garage
        note: "Walk in once you have control"
  - id: consulate-garage-attack-vertical
    site: cafeteria_garage
    side: attack
    operators: [Hibana, Buck]
    title: "Top-down from Yellow: hatch and vert from Expo"
    text: >-
      If you need to go top-down, drone your teammates in from top Yellow, destroy the utility and get the
      hatch. Play the hatch and make vert from Expo onto back site, pop the Mira and cut off anyone playing
      back site while the main breach opens.
    placements:
      - kind: drone
        floor: 1F
        room: Yellow Stairs
        note: "Drone teammates in from top Yellow"
      - kind: hibana
        floor: 1F
        at: [67.2, 69.0]
        name: "Site hatch"
        note: "Open the hatch and play it"
      - kind: breach
        floor: 1F
        room: Exposition Room
        note: "Vert onto back site; pop the Mira"
