map: nighthaven_labs
# Standard setups for Nighthaven Labs. Built 2026-11-06 from maps/nighthaven_labs.yaml,
# callouts/nighthaven_labs.yaml and the blueprints. Room names on this map vary between guides (Command
# Center / Servers and Tank / Assembly may be swapped in some), so wall spots are read off the blueprint.
briefs:
  # ---------------------------------------------------------------- 2F Command Center / 2F Servers
  - id: nighthaven-cc-servers-team-walls
    site: command_center_servers
    side: defense
    operators: []
    title: "Battle for IT: deny IT, layer Rafters and Connector"
    text: >-
      Reinforce both IT wall panels first, they're the main breach. Then the left and middle Rafters
      panels, both Servers/Connector panels, one Connector outer wall and the Aqua hallway wall. Leave the
      third Rafters panel soft as the rotate, and keep the Servers hatch open as a roam route.
    placements:
      - kind: reinforce
        floor: 2F
        at: [53.8, 58.6]
        name: "IT wall"
        nudge: [-1.0, 0]
        note: "Panel 1"
      - kind: reinforce
        floor: 2F
        at: [53.8, 58.6]
        name: "IT wall"
        nudge: [1.0, 0]
        note: "Panel 2"
      - kind: reinforce
        floor: 2F
        at: [63.8, 44.5]
        name: "Rafters triple wall"
        nudge: [0, -1.2]
        note: "Left and middle panels"
      - kind: rotate
        floor: 2F
        at: [63.8, 44.5]
        name: "Rafters triple wall"
        nudge: [0, 1.2]
        note: "Third panel stays soft"
      - kind: reinforce
        floor: 2F
        between: [Servers, Connector]
        note: "Both panels"
      - kind: reinforce
        floor: 2F
        at: [60.4, 43.4]
        name: "Connector outer wall"
      - kind: reinforce
        floor: 2F
        between: [Aqua hallway, Command Center]
        note: "Aqua hallway wall, keep feet holes"
      - kind: open
        floor: 2F
        at: [56.4, 48.4]
        name: "Servers hatch"
        note: "Roam route down"
  - id: nighthaven-cc-servers-bandit-it
    site: command_center_servers
    side: defense
    operators: [Bandit, Kaid]
    title: "Batteries on the IT wall"
    text: >-
      Bandit puts batteries on both IT panels from the site side and re-tricks after each Thatcher; an EMP
      only stops batteries for about 15 seconds. Watch for Zofia or Kali clearing them from 1F below.
    placements:
      - kind: bandit
        floor: 2F
        at: [53.8, 58.6]
        name: "IT wall"
        nudge: [-1.0, -1.2]
        note: "Panel 1"
      - kind: bandit
        floor: 2F
        at: [53.8, 58.6]
        name: "IT wall"
        nudge: [1.0, -1.2]
        note: "Panel 2"
      - kind: anchor
        floor: 2F
        room: Command Center
        note: "Close to the wall for re-tricks"
  - id: nighthaven-cc-servers-roles
    site: command_center_servers
    side: defense
    operators: [Azami, Mute, Mozzie]
    title: "Rafters, E-box and Meeting jobs"
    text: >-
      Azami stalls Rafters and seals the rotate with a Kiba when she leaves, Mute holds the E-box door,
      and Mozzie plays Meeting to steal drones before falling back to Connector.
    placements:
      - kind: anchor
        floor: 2F
        room: Rafters
        note: "Azami, Kiba on the rotate"
      - kind: anchor
        floor: 2F
        room: Electrical
        note: "Mute, E-box door"
      - kind: anchor
        floor: 2F
        room: Meeting
        note: "Mozzie, pests on drones"
  # Attack briefs on this map follow Garfieldisdoc, "How to Attack EVERY Bombsite in Rainbow Six Siege
  # (2026)", https://www.youtube.com/watch?v=1qCEYZwQzes (Nighthaven Labs from 3:11:24).
  - id: nighthaven-cc-servers-thermite-it
    site: command_center_servers
    side: attack
    operators: [Thermite, Montagne, Thatcher, Zofia]
    title: "Open the IT wall, plant on the rotate"
    text: >-
      The whole round is the IT wall: if it doesn't open you lose, so bring Thermite and Thatcher and a shield.
      Montagne walks up bottom Warehouse for intel while it burns, and if they Bandit or Tubarao trick it someone
      rappels the Warehouse window and bangs it. Keep a charge for the single they reinforce last, frag the
      A-chassis player with Monty pushing Blue, and plant on the rotate.
    placements:
      - kind: thermite
        floor: 2F
        at: [53.8, 58.6]
        name: "IT wall"
        nudge: [0, 1.0]
        note: "The main breach; it has to open"
      - kind: anchor
        floor: 2F
        at: [47.5, 52.0]
        name: "Warehouse window"
        note: "Rappel here and bang the wall if they Bandit or Tubarao trick it (position approximate)"
      - kind: plant
        floor: 2F
        room: Command Center
        note: "On the rotate, beside the last reinforced single"
  - id: nighthaven-cc-servers-connector-split
    site: command_center_servers
    side: attack
    operators: [Thermite, Hibana, Gridlock]
    title: "Connector wall, then the Electrical split"
    text: >-
      Once IT is open, Thermite comes over and opens the Connector wall for phantom pressure while one player
      walks Meeting side through Connector. If the IT take stalls, flip to the Electrical split: same two walls,
      sandwich Electrical and Connector, open the Servers wall from Connector and plant on the server. Bring
      flashes and smokes; the head holes, door and pillar all need clearing.
    placements:
      - kind: thermite
        floor: 2F
        between: [Servers, Connector]
        nudge: [0, -3.0]
        note: "Connector wall, after IT is open"
      - kind: entry
        floor: 2F
        room: Meeting
        note: "One player walks Meeting side into Connector"
      - kind: breach
        floor: 2F
        between: [Servers, Connector]
        nudge: [0, 2.0]
        note: "Open the Servers wall from Connector"
      - kind: plant
        floor: 2F
        room: Servers
        nudge: [1.5, 0]
        note: "Up on the server once Electrical is cleared"
  # ---------------------------------------------------------------- 1F Kitchen / 1F Cafeteria
  - id: nighthaven-kitchen-caf-team-walls
    site: kitchen_cafeteria
    side: defense
    operators: []
    title: "Lobby wall, Games wall, outside hatch late"
    text: >-
      Both Lobby wall panels are the main breach. Add the Games wall to Storage and the Connector walls on
      2F, then reinforce the outside hatch on the east walkway (usually called the Freezer hatch) at the end
      of prep. Keep the Freezer knee holes and Cafeteria head holes for crossfires.
    placements:
      - kind: reinforce
        floor: 1F
        at: [61.3, 48.5]
        name: "Lobby wall"
        nudge: [0, -1.2]
        note: "Panel 1"
      - kind: reinforce
        floor: 1F
        at: [61.3, 48.5]
        name: "Lobby wall"
        nudge: [0, 1.2]
        note: "Panel 2"
      - kind: reinforce
        floor: 1F
        between: [Games, Storage]
      - kind: reinforce
        floor: 2F
        between: [Servers, Connector]
        note: "Connector walls"
      - kind: hatch
        floor: 2F
        at: [67.2, 52.2]
        name: "Outside hatch"
        note: "Usually called the Freezer hatch; end of prep"
      - kind: open
        floor: 1F
        room: Freezer
        note: "Knee holes in the Freezer wall"
  - id: nighthaven-kitchen-caf-kaid-lobby
    site: kitchen_cafeteria
    side: defense
    operators: [Kaid, Bandit]
    title: "Claw the Lobby wall"
    text: >-
      Since Y10S4 Mute only jams remote devices, so Thermite on the Lobby wall needs Kaid or Bandit. Claw
      both panels low and hold the Kitchen corner off the wall.
    placements:
      - kind: kaid
        floor: 1F
        at: [61.3, 48.5]
        name: "Lobby wall"
        nudge: [1.0, -1.2]
        note: "Panel 1, low"
      - kind: kaid
        floor: 1F
        at: [61.3, 48.5]
        name: "Lobby wall"
        nudge: [1.0, 1.2]
        note: "Panel 2, low"
      - kind: anchor
        floor: 1F
        room: Kitchen
        note: "Kitchen corner"
  - id: nighthaven-kitchen-caf-castle-games
    site: kitchen_cafeteria
    side: defense
    operators: [Castle]
    title: "Castle the Games side"
    text: >-
      Castle barricades the Games side doors so Games stays a rotate for you, not an entry for them. Clash
      holds the top of the Lobby stairs.
    placements:
      - kind: castle
        floor: 1F
        between: [Games, Lobby]
        note: "Games door to Lobby"
      - kind: castle
        floor: 1F
        between: [Games, Fork]
        note: "Usually the Fork side door"
  - id: nighthaven-kitchen-caf-thermite-lobby
    site: kitchen_cafeteria
    side: attack
    operators: [Thermite, Thatcher, Ash]
    title: "Lobby wall with a player on the Kitchen window"
    text: >-
      The primary hard breacher comes up Lobby, clears the area and nades the shield or Clash on the 90,
      then opens the Lobby wall. One player sits outside the Kitchen window: anyone on or behind the B chassis
      has to rotate into him or past the main-breach head holes. Watch Vending for the rotate and plant on
      the main breach.
    placements:
      - kind: thermite
        floor: 1F
        at: [61.3, 48.5]
        name: "Lobby wall"
        nudge: [-1.0, 0]
        note: "Clear Lobby and the 90 shield first"
      - kind: anchor
        floor: 1F
        at: [70.1, 46.0]
        name: "Kitchen window"
        note: "Outside the window, cutting the B-chassis player"
      - kind: plant
        floor: 1F
        room: Cafeteria
        note: "On the main breach"
  - id: nighthaven-kitchen-caf-outside-hatch
    site: kitchen_cafeteria
    side: attack
    operators: [Hibana, Gridlock, Buck]
    title: "Freezer hatch and Connector from above"
    text: >-
      While the main breach works Lobby, the second hard breacher opens the Freezer hatch from the Electrical
      Side roof (it's usually reinforced) and someone opens the 2F Connector wall to cut off roamers. Gridlock
      Connector and Electrical, then make vertical on everything over site.
    placements:
      - kind: hibana
        floor: 2F
        at: [67.2, 52.2]
        name: "Freezer hatch"
        nudge: [1.0, 0]
        note: "From the Electrical Side roof; usually reinforced"
      - kind: breach
        floor: 2F
        at: [60.4, 43.4]
        name: "Connector outer wall"
        nudge: [0, -1.0]
        note: "From the Connector terrace, to cut off roamers"
      - kind: anchor
        floor: 2F
        room: Connector
        note: "Gridlock Connector and Electrical, then play vertical"
  # ---------------------------------------------------------------- 1F Control Room / 1F Storage
  - id: nighthaven-control-storage-team-walls
    site: control_room_storage
    side: defense
    operators: []
    title: "Hold 2F like Servers, then drop"
    text: >-
      Reinforce both Garage outside walls, both IT panels and the Rafters panels upstairs, and both
      Servers/Connector panels. Keep the Control/Storage rotate open. Play 2F until about 1:30, then drop
      into a Storage/Control crossfire.
    placements:
      - kind: reinforce
        floor: 1F
        at: [52.0, 66.3]
        name: "Garage outside walls"
        note: "Both"
      - kind: reinforce
        floor: 2F
        at: [53.8, 58.6]
        name: "IT wall"
        note: "Both panels"
      - kind: reinforce
        floor: 2F
        at: [63.8, 44.5]
        name: "Rafters triple wall"
        note: "Third panel stays the rotate"
      - kind: reinforce
        floor: 2F
        between: [Servers, Connector]
      - kind: rotate
        floor: 1F
        at: [54.7, 57.2]
        name: "Control/Storage rotate"
  - id: nighthaven-control-storage-kaid-it
    site: control_room_storage
    side: defense
    operators: [Kaid, Castle]
    title: "Claw IT, barricade the Mud door"
    text: >-
      Kaid claws the IT wall and plays the E-box. Castle barricades the Mud door so the north side is slow.
    placements:
      - kind: kaid
        floor: 2F
        at: [53.8, 58.6]
        name: "IT wall"
        nudge: [0, -1.2]
      - kind: castle
        floor: 1F
        between: [Mud, Freezer]
        note: "Mud door, position approximate"
      - kind: anchor
        floor: 1F
        room: Storage
        note: "Warden on the Storage window late"
  - id: nighthaven-control-storage-servers-window
    site: control_room_storage
    side: attack
    operators: [Thermite, Buck, Sledge]
    title: "Win 2F, play vertical, window plant on the pillar"
    text: >-
      They make vertical and play above, so feed into it: take 2F. One player opens IT to cut off anyone
      playing vertical on the window, the rest push Meeting side or top Lobby and open the Connector wall to
      cut off Electrical. Clear Rafters and Blue, make vertical on back site and the rotate while someone
      watches Blue stairs, then jump in the Storage window and plant on the pillar.
    placements:
      - kind: thermite
        floor: 2F
        at: [53.8, 58.6]
        name: "IT wall"
        nudge: [0, 1.0]
        note: "Cuts off anyone playing vertical on the window"
      - kind: breach
        floor: 2F
        between: [Servers, Connector]
        nudge: [0, -3.0]
        note: "Connector wall; cut off the Electrical player"
      - kind: breach
        floor: 2F
        room: Command Center
        note: "Vertical on back site and the rotate; watch Blue stairs"
      - kind: entry
        floor: 1F
        at: [57.5, 66.0]
        name: "Storage window"
        note: "Jump in once the vertical is made (position approximate)"
      - kind: plant
        floor: 1F
        room: Storage
        note: "On the pillar"
  - id: nighthaven-control-storage-below-pressure
    site: control_room_storage
    side: attack
    operators: [Ace, Zofia, Nomad]
    title: "Early walls and a cam below for the C4 player"
    text: >-
      Open the bottom Warehouse wall and the Storage window early for phantom pressure later in the round.
      If you know they have a Pulse, Valkyrie or C4 player downstairs, send one attacker down with a pre-placed
      cam to bang him, or just open the lines from the Delivery Area to scare him off. That player is the only
      gap once you're on the window plant.
    placements:
      - kind: entry
        floor: 1F
        at: [57.5, 66.0]
        name: "Storage window"
        note: "Open it early for phantom pressure"
      - kind: drone
        floor: B
        room: Assembly
        note: "Pre-placed cam on the player below site"
      - kind: breach
        floor: B
        at: [55.0, 67.5]
        name: "Delivery Area wall"
        note: "Open lines on the player below (position approximate)"
      - kind: plant
        floor: 1F
        room: Storage
        note: "On the pillar"
  # ---------------------------------------------------------------- B Tank / B Assembly
  - id: nighthaven-tank-assembly-team-walls
    site: tank_assembly
    side: defense
    operators: []
    title: "Three outside walls, three hatches"
    text: >-
      Reinforce both outside walls (Animus and Assembly), the left Nano hallway panel and the left Exo wall,
      then the Exo, Animus and Games hatches from 1F. Keep feet holes into Animus and the right half of Nano
      soft for C4 lobs.
    placements:
      - kind: reinforce
        floor: B
        at: [52.4, 66.6]
        name: "Animus outside wall"
      - kind: reinforce
        floor: B
        at: [57.0, 66.6]
        name: "Assembly outside wall"
      - kind: reinforce
        floor: B
        at: [53.2, 51.3]
        name: "Nano hallway wall"
        note: "Left panel"
      - kind: reinforce
        floor: B
        at: [59.4, 52.0]
        name: "Left Exo wall"
        note: "Head holes"
      - kind: hatch
        floor: 1F
        at: [61.6, 54.4]
        name: "Exo hatch"
      - kind: hatch
        floor: 1F
        at: [51.9, 62.0]
        name: "Animus hatch"
        note: "In Garage"
      - kind: hatch
        floor: 1F
        at: [51.5, 47.2]
        name: "Games hatch"
        note: "Usually the Cargo hatch"
      - kind: open
        floor: B
        between: [Tank, Animus]
        note: "Feet holes"
  - id: nighthaven-tank-assembly-kaid-outside
    site: tank_assembly
    side: defense
    operators: [Kaid]
    title: "Claw the outside walls"
    text: >-
      Kaid claws both outside walls and anchors site, lobbing C4 through Nano on a plant.
    placements:
      - kind: kaid
        floor: B
        at: [52.4, 66.6]
        name: "Animus outside wall"
        nudge: [0, -1.2]
      - kind: kaid
        floor: B
        at: [57.0, 66.6]
        name: "Assembly outside wall"
        nudge: [0, -1.2]
      - kind: anchor
        floor: B
        room: Assembly
  - id: nighthaven-tank-assembly-hatch-vert
    site: tank_assembly
    side: attack
    operators: [Buck, Gridlock, Zofia, Hibana]
    title: "Take 1F, pop Cargo, vertical, plant behind the pillar"
    text: >-
      Pre-place a cut-off cam in Rafters, open the soft IT wall and Zofia the player contesting the Storage
      window. Drone Warehouse entrance and Cargo, Gridlock the Cargo stairs and pop the Cargo hatch so nobody can
      retake. Make vertical from Control Room on the single pillar, the door and the default corner, then open
      the hatch over the weaker site (usually Animus) and plant behind the pillar.
    placements:
      - kind: drone
        floor: 2F
        room: Rafters
        note: "Pre-placed cut-off cam for roamers"
      - kind: breach
        floor: 1F
        at: [51.5, 47.2]
        name: "Cargo hatch"
        note: "Gridlock the Cargo stairs, then pop it"
      - kind: breach
        floor: 1F
        room: Control Room
        note: "Vertical on the single pillar, the door and the jump-up"
      - kind: breach
        floor: 1F
        room: Storage
        note: "Vertical on the default corner plant"
      - kind: hibana
        floor: 1F
        at: [51.9, 62.0]
        name: "Animus hatch"
        nudge: [1.0, 0]
        note: "Open the hatch over the weaker site"
      - kind: plant
        floor: B
        room: Animus
        note: "Behind the pillar"
  - id: nighthaven-tank-assembly-main-wall
    site: tank_assembly
    side: attack
    operators: [Thermite, Thatcher, Buck]
    title: "Main wall, Exo hatch and Vending stairs"
    text: >-
      For the main wall, make vertical first, then open it with a teammate covering the breacher. Drone Exo
      and the Vending area, open the Exo hatch and push down Vending stairs to cut everyone back. Walk up to the
      Assembly door and plant; if someone holds the main breach, smoke the head holes and far door.
    placements:
      - kind: thermite
        floor: B
        at: [53.2, 51.3]
        name: "Main wall (Nano hallway)"
        note: "Open it after the vertical; which panel is approximate"
      - kind: drone
        floor: B
        room: Exo
        note: "Drone Exo and the Vending area"
      - kind: breach
        floor: 1F
        at: [61.6, 54.4]
        name: "Exo hatch"
        note: "Then push down Vending stairs"
      - kind: plant
        floor: B
        room: Assembly
        note: "At the door; smoke the head holes and far door"
