map: outback
# Standard setups for Outback (post-2021 rework layout). Built 2026-11-06 from maps/outback.yaml,
# callouts/outback.yaml and the blueprints. Wall spots read off the blueprint where room boxes are rough.
briefs:
  # ---------------------------------------------------------------- 2F Piano Room / 2F Laundry Room
  - id: outback-piano-laundry-team-walls
    site: piano_room_laundry_room
    side: defense
    operators: []
    title: "Lock Dorms and the Showers side, keep the middle rotate"
    text: >-
      Reinforce both Dorms breach walls first, then the Laundry wall to Showers and the Piano wall beside
      the bomb. Cut the small middle rotate between Laundry and Piano, and leave the Piano hatch open as a
      drop. Last two go on the Games and Bull walls so Bull can't be peeked from Games.
    placements:
      - kind: reinforce
        floor: 2F
        at: [38.5, 43.9]
        name: "Dorms breach"
        nudge: [-1.0, 0]
        note: "Panel 1"
      - kind: reinforce
        floor: 2F
        at: [38.5, 43.9]
        name: "Dorms breach"
        nudge: [1.0, 0]
        note: "Panel 2"
      - kind: reinforce
        floor: 2F
        at: [43.8, 28.0]
        name: "Laundry wall to Showers"
        note: "The bomb-side single wall"
      - kind: reinforce
        floor: 2F
        at: [46.8, 31.5]
        name: "Piano wall to Showers"
        note: "Beside the Piano bomb"
      - kind: reinforce
        floor: 2F
        between: [Games Room, Mechanical Bull]
        note: "Both Games-Bull panels"
      - kind: rotate
        floor: 2F
        between: [Laundry, Piano Room]
        note: "Small middle rotate, crouch height"
      - kind: open
        floor: 2F
        at: [52.0, 25.5]
        name: "Piano hatch"
        note: "Leave open as a drop to Closet"
  - id: outback-piano-laundry-kaid-dorms
    site: piano_room_laundry_room
    side: defense
    operators: [Kaid, Bandit]
    title: "Electrify the Dorms breach"
    text: >-
      Dorms is the hard breach for this site, so put Kaid claws or Bandit batteries on both Dorms walls once
      they're reinforced. Place them low and away from the balcony side so they can't be shot from outside.
    placements:
      - kind: kaid
        floor: 2F
        at: [38.5, 43.9]
        name: "Dorms breach"
        nudge: [-1.0, -1.2]
        note: "Wall 1, low"
      - kind: bandit
        floor: 2F
        at: [38.5, 43.9]
        name: "Dorms breach"
        nudge: [1.0, -1.2]
        note: "Wall 2, if Bandit instead"
      - kind: anchor
        floor: 2F
        room: Laundry
        note: "Hold the washer, watch the Dorms door"
  # Attack briefs on this map follow Garfieldisdoc, "How to Attack EVERY Bombsite in Rainbow Six Siege
  # (2026)", https://www.youtube.com/watch?v=1qCEYZwQzes (Outback from 3:37:35; reworked Outback).
  - id: outback-piano-laundry-thermite-dorms
    site: piano_room_laundry_room
    side: attack
    operators: [Thermite, Thatcher, Nomad]
    title: "Main wall from the Motel Balcony, then win yellow"
    text: >-
      Bring a hard breacher plus pocket EMPs or someone to go below, and open the main wall from the Motel
      Balcony. Have a teammate spawn Garage side and claymore the jump-out window. After the wall, put someone
      on the Dorms window for a free pick, then collapse on whoever holds yellow stairs from the window and the
      breach. Win that pinch point and feed in from the breach to cut off Laundry; plant far back or right
      beside the reinforcement.
    placements:
      - kind: thermite
        floor: 2F
        at: [38.5, 43.9]
        name: "Main wall (Motel Balcony)"
        note: "Watch the jump-out window while it burns"
      - kind: anchor
        floor: 2F
        between: [Dorms, exterior]
        edge: left
        note: "Dorms window: free pick, then util onto yellow"
      - kind: anchor
        floor: 2F
        room: Motel Hallway
        note: "Win yellow stairs (HUD: Back Stairs)"
      - kind: plant
        floor: 2F
        room: Laundry
        note: "Far back or right beside the reinforcement"
  - id: outback-piano-laundry-buck-vert
    site: piano_room_laundry_room
    side: attack
    operators: [Buck, Gridlock]
    title: "Buck vertical from the bedrooms below"
    text: >-
      Time it with a teammate pushing Picnic: go below and Buck under the double-door rotate, the chassis and
      the piano, and make vertical on the stalls for the Bathroom rotate. Gridlock the staircase, Motel and
      Reptile hallway, because the yellow player will come down for you. With even numbers, go back up yellow
      and hold across so the team can plant; plant in the open and keep playing vertical if you want.
    placements:
      - kind: breach
        floor: 1F
        room: Green Bedroom
        note: "Vertical on the double door, the chassis and the piano"
      - kind: breach
        floor: 1F
        room: Red Bedroom
        note: "Vertical on the stalls for the Bathroom rotate"
      - kind: anchor
        floor: 1F
        room: Reptile Hallway
        note: "Gridlock the staircase, Motel and Reptile hallway"
      - kind: plant
        floor: 2F
        room: Laundry
        nudge: [2.0, 0]
        note: "In the open, covered by the vertical"
  # ---------------------------------------------------------------- 2F Party Room / 2F Office
  - id: outback-party-office-team-walls
    site: party_room_office
    side: defense
    operators: []
    title: "Ten-wall Garage lock"
    text: >-
      Both Office Supplies breach walls, the Supply wall to Garage Lounge and the two Office walls to Garage
      Lounge come first. Then the middle two Party walls to Bull, one Party/Office wall and both Bull walls
      to Games. Leave the outer Party walls soft for Bull peeks.
    placements:
      - kind: reinforce
        floor: 2F
        between: [Office Supplies, exterior]
        edge: right
        nudge: [0, -1.2]
        note: "Supply breach, panel 1"
      - kind: reinforce
        floor: 2F
        between: [Office Supplies, exterior]
        edge: right
        nudge: [0, 1.2]
        note: "Supply breach, panel 2"
      - kind: reinforce
        floor: 2F
        between: [Office Supplies, Garage Lounge]
        note: "Right wall to Garage Lounge"
      - kind: reinforce
        floor: 2F
        at: [55.0, 60.9]
        name: "Office to Garage Lounge"
        note: "Usually called the lower Garage walls; both"
      - kind: reinforce
        floor: 2F
        between: [Mechanical Bull, Party Room]
        note: "Middle two only"
      - kind: reinforce
        floor: 2F
        between: [Party Room, Office]
        note: "One wall of the quad"
      - kind: reinforce
        floor: 2F
        between: [Games Room, Mechanical Bull]
        note: "Both"
  - id: outback-party-office-kaid-supply
    site: party_room_office
    side: defense
    operators: [Kaid, Bandit]
    title: "Claw the Office Supplies breach"
    text: >-
      Office Supplies is the Thermite wall. Claw both panels from inside Supply, low, and play the Supply
      corner so you can re-claw after a Thatcher. Since Y11S3.1 Thermite kills anyone standing on the wall,
      so don't hug it.
    placements:
      - kind: kaid
        floor: 2F
        between: [Office Supplies, exterior]
        edge: right
        nudge: [-1.0, -1.2]
        note: "Panel 1, low"
      - kind: kaid
        floor: 2F
        between: [Office Supplies, exterior]
        edge: right
        nudge: [-1.0, 1.2]
        note: "Panel 2, low"
      - kind: anchor
        floor: 2F
        room: Office
        nudge: [3.0, 0]
        note: "Off the wall, watching the breach"
  - id: outback-party-office-thermite-supply
    site: party_room_office
    side: attack
    operators: [Thermite, Buck, Gridlock]
    title: "Main wall, Garage control and the sidewall"
    text: >-
      Open the main breach and, unless they play vertical, go below and make vert on the players tricking the
      main wall. Send one player down to jump in near Motel to hold the flank. Cam Garage and find the gap: if
      the staircase is clear, a teammate jumps in a Garage window while you clear bottom Garage and walk up once
      the utility is gone. Then open the sidewall so nobody can play there and fight Party and Bull side.
    placements:
      - kind: thermite
        floor: 2F
        between: [Office Supplies, exterior]
        edge: right
        nudge: [0.8, 0]
        note: "The main breach"
      - kind: breach
        floor: 1F
        room: Waiting Room
        note: "Vert on the main-wall tricker from below"
      - kind: drone
        floor: 2F
        room: Garage Lounge
        note: "Cam Garage, look for the gap"
      - kind: entry
        floor: 2F
        room: Garage Lounge
        nudge: [3.0, 3.0]
        note: "Jump in a Garage window once the stairs are clear"
      - kind: breach
        floor: 2F
        between: [Office, Garage Lounge]
        note: "Open the sidewall so nobody plays there"
      - kind: plant
        floor: 2F
        room: Office
        nudge: [3.0, 0]
        note: "Near the main breach"
  - id: outback-party-office-bull-pinch
    site: party_room_office
    side: attack
    operators: [Hibana, Ace, Gridlock]
    title: "Games take: Games wall, then Party wall"
    text: >-
      The less common take. Set up for Dorms and bottom yellow: drone it out with a pre-place around Dorms
      while teammates push bottom yellow and take yellow, with one outside Picnic for rotators. Then work all the
      way up and open the Games wall and the Party wall, take up to Party Hall and plant behind it.
    placements:
      - kind: drone
        floor: 2F
        room: Dorms
        note: "Pre-place around Dorms; others push bottom yellow"
      - kind: breach
        floor: 2F
        between: [Games Room, Mechanical Bull]
        note: "Open the Games wall"
      - kind: hibana
        floor: 2F
        between: [Mechanical Bull, Party Room]
        nudge: [-0.8, 0]
        note: "Then the Party wall"
      - kind: plant
        floor: 2F
        room: Party Room
        nudge: [-1.5, 0]
        note: "Behind the wall, from Party Hall"
  # ---------------------------------------------------------------- 1F Green Bedroom / 1F Red Bedroom
  - id: outback-bedrooms-team-walls
    site: green_bedroom_red_bedroom
    side: defense
    operators: []
    title: "Reptile and Yellow walls, own the floor above"
    text: >-
      Reinforce both Closet walls and both Red Bedroom walls to Reptile Hallway, then both Red Bedroom walls
      to Yellow Stairs. Upstairs, reinforce the Dorms breach so attackers can't take vertical for free, and
      keep the Piano hatch open as the way up.
    placements:
      - kind: reinforce
        floor: 1F
        at: [51.3, 30.0]
        name: "Closet to Reptile Hallway"
        note: "Both walls"
      - kind: reinforce
        floor: 1F
        between: [Red Bedroom, Reptile Hallway]
        note: "Both"
      - kind: reinforce
        floor: 1F
        at: [37.6, 30.5]
        name: "Red Bedroom to Yellow Stairs"
        note: "Both"
      - kind: reinforce
        floor: 2F
        at: [38.5, 43.9]
        name: "Dorms breach"
        note: "Both upstairs outer walls"
      - kind: open
        floor: 2F
        at: [52.0, 25.5]
        name: "Piano hatch"
        note: "Escape up from Closet"
  - id: outback-bedrooms-bandit-closet
    site: green_bedroom_red_bedroom
    side: defense
    operators: [Bandit]
    title: "Bandit batteries on the Closet walls"
    text: >-
      Bandit anchors Closet and puts batteries on the Closet walls to Reptile Hallway. Place them low on the
      inside; attackers who take Dorms can shoot devices from above, so check after the drone phase.
    placements:
      - kind: bandit
        floor: 1F
        at: [51.3, 30.0]
        name: "Closet to Reptile Hallway"
        nudge: [-1.0, -1.2]
        note: "Wall 1"
      - kind: bandit
        floor: 1F
        at: [51.3, 30.0]
        name: "Closet to Reptile Hallway"
        nudge: [1.0, -1.2]
        note: "Wall 2"
      - kind: anchor
        floor: 1F
        room: Closet
  - id: outback-bedrooms-castle-upstairs
    site: green_bedroom_red_bedroom
    side: defense
    operators: [Castle]
    title: "Castle barricades upstairs"
    text: >-
      Castle slows the take of the floor above: usually the Dorms door to Motel Hallway and the Laundry door
      into Dorms. That buys time for the Pulse or vertical player over site.
    placements:
      - kind: castle
        floor: 2F
        between: [Dorms, Motel Hallway]
        note: "Dorms door"
      - kind: castle
        floor: 2F
        between: [Laundry, Dorms]
        note: "Laundry door, usually"
  - id: outback-bedrooms-thermite-reptile
    site: green_bedroom_red_bedroom
    side: attack
    operators: [Thermite, Ash, Buck]
    title: "Open the main wall, run in and plant"
    text: >-
      Expect Mira on Reptile, Castles on the window, double door and Reptile side, and the main wall reinforced.
      If the Castle is up, wait for the players above to make vertical: they cover the swing and can pop the
      hatch. Then open the main wall, run in and plant, with vertical right above, someone on the staircase and
      counter angles all round.
    placements:
      - kind: drone
        floor: 1F
        room: Reptile Hallway
        note: "Find the Miras and Castles"
      - kind: thermite
        floor: 1F
        between: [Red Bedroom, Reptile Hallway]
        nudge: [0, 0.8]
        note: "The main wall; wait for the vertical if it's Castled"
      - kind: plant
        floor: 1F
        room: Red Bedroom
        nudge: [0, 4.0]
        note: "Run in and plant; vertical covers it from above"
  - id: outback-bedrooms-vertical-above
    site: green_bedroom_red_bedroom
    side: attack
    operators: [Thermite, Buck, Gridlock]
    title: "Take Dorms and Piano, vertical on everything"
    text: >-
      Thermite opens the upstairs Dorms wall for the vertical players and you drone them in with a pre-place
      around there. Take everything up to Piano and Picnic, with a Gridlock, Nomad or Bull flank on Shark. Pop
      the hatch and make vertical on yellow, the side door, the A chassis and the Bathroom door; only Reptile has
      almost no vertical.
    placements:
      - kind: thermite
        floor: 2F
        at: [38.5, 43.9]
        name: "Dorms wall (Motel Balcony)"
        note: "Opens the way for the vertical players"
      - kind: anchor
        floor: 2F
        room: Piano Room
        note: "Hold Piano and Picnic; Gridlock or Nomad the Shark flank"
      - kind: breach
        floor: 2F
        room: Dorms
        note: "Pop the hatch, vert on yellow, side door, A chassis, Bathroom door"
  # ---------------------------------------------------------------- 1F Mechanic Shop / 1F Kitchen
  - id: outback-mechanic-kitchen-team-walls
    site: mechanic_shop_kitchen
    side: defense
    operators: []
    title: "Waiting walls, middle Mechanic wall, Office lid"
    text: >-
      Reinforce both Mechanic Shop walls to Waiting, the middle of the Mechanic/Kitchen wall and the
      Restaurant wall behind the bar. Keep the Kitchen to Waiting crouch rotate and the Bull hatch over
      Kitchen open. Upstairs, the Office Supplies breach gets both walls so Office stays yours.
    placements:
      - kind: reinforce
        floor: 1F
        between: [Mechanic Shop, Waiting Room]
        nudge: [0, -1.2]
        note: "Wall 1"
      - kind: reinforce
        floor: 1F
        between: [Mechanic Shop, Waiting Room]
        nudge: [0, 1.2]
        note: "Wall 2"
      - kind: reinforce
        floor: 1F
        between: [Kitchen, Mechanic Shop]
        note: "Middle only"
      - kind: reinforce
        floor: 1F
        at: [59.1, 39.2]
        name: "Restaurant wall behind the bar"
      - kind: rotate
        floor: 1F
        at: [52.9, 45.8]
        name: "Kitchen to Waiting crouch rotate"
      - kind: open
        floor: 2F
        at: [56.3, 51.5]
        name: "Bull hatch"
        note: "Hatch above site, the way down"
      - kind: reinforce
        floor: 2F
        between: [Office Supplies, exterior]
        edge: right
        note: "Both Supply walls"
  - id: outback-mechanic-kitchen-kaid-waiting
    site: mechanic_shop_kitchen
    side: defense
    operators: [Kaid]
    title: "Claw the Waiting walls"
    text: >-
      Kaid claws both Mechanic Shop walls to Waiting and holds the Mechanic Shop desk. Jäger behind the bar
      covers grenades; two players hold Office above for vertical.
    placements:
      - kind: kaid
        floor: 1F
        between: [Mechanic Shop, Waiting Room]
        nudge: [1.0, -1.2]
        note: "Wall 1, low"
      - kind: kaid
        floor: 1F
        between: [Mechanic Shop, Waiting Room]
        nudge: [1.0, 1.2]
        note: "Wall 2, low"
      - kind: anchor
        floor: 1F
        room: Mechanic Shop
        note: "Desk"
      - kind: anchor
        floor: 2F
        room: Office
        note: "Two players above site"
  - id: outback-mechanic-kitchen-thermite-waiting
    site: mechanic_shop_kitchen
    side: attack
    operators: [Thermite, Thatcher, Gridlock]
    title: "Reptile side, burn the Kitchen wall"
    text: >-
      Pre-place a cam Reptile side so nobody runs Reptile hall, takes bottom yellow or walks Green, then take
      the area fast with one player in Motel Reception and one outside the window for the swing. Thermite opens
      the Kitchen wall; take Reptile hallway for anyone trying to retake or C4. If it's soft, open the line of
      sight with a shotgun to cut the rotate and the door, and plant if they aren't playing vertical.
    placements:
      - kind: drone
        floor: 1F
        room: Reptile Hallway
        note: "Pre-placed cam Reptile side"
      - kind: anchor
        floor: 1F
        room: Waiting Room
        note: "Take Motel Reception (HUD name); one outside the window"
      - kind: thermite
        floor: 1F
        between: [Kitchen, Waiting Room]
        nudge: [0, -2.0]
        note: "The Kitchen wall"
      - kind: breach
        floor: 1F
        room: Reptile Hallway
        nudge: [3.0, 0]
        note: "Shotgun the soft wall to cut the rotate and door"
      - kind: plant
        floor: 1F
        room: Kitchen
        note: "Only if they aren't playing vertical"
  - id: outback-mechanic-kitchen-bull-window
    site: mechanic_shop_kitchen
    side: attack
    operators: [Buck, Ash]
    title: "Clear their vertical from the Bull window"
    text: >-
      They'll usually play vertical over Kitchen, and their spot is right in front of the Bull window. Open
      the Bull window and fight or Buck them off it; if they hold the far angle, take Games as well. Once the
      vertical is gone, plant Kitchen off the open wall.
    placements:
      - kind: entry
        floor: 2F
        room: Mechanical Bull
        note: "Open the Bull window; their vertical sits right in front"
      - kind: entry
        floor: 2F
        room: Games Room
        note: "Take Games for the far angle"
      - kind: plant
        floor: 1F
        room: Kitchen
        nudge: [0, 3.0]
        note: "After the vertical player is cleared"
