# Callouts for Border. Grounds exact location names for the coach.
# Built 2026-11-06 (Y11S3). Walls/hatches are listed only when a source names them;
# where a source names the wall/hatch but not both rooms, it is under `uncertain` instead.
map: border
version_note: "Layout of the Y6S1 (Operation Crimson Heist, 2021) rework: Bathroom extended along Tellers (shared wall between the two sites), Supply Room moved, Passport Check -> Customs Inspection soft walls cut from four to two, Archives extended into Offices, interior balcony joining Break Room and East Stairs. No basement. Wall/hatch names checked against Y11S3 guides; two siegestrats strats are marked 'old layout'."
rooms:
  1F:
    - "Main Lobby"
    - "Customs Desk"
    - "Customs Inspection"
    - "Passport Check"
    - "Supply Room"
    - "Waiting Room"
    - "Tellers"
    - "Bathroom"
    - "Workshop"
    - "Ventilation Room"
    - "Detention"
  2F:
    - "Armory Lockers"
    - "Archives"
    - "Offices"
    - "Security Room"
    - "Break Room"
    - "East Stairs"
  EXT:
    - "West Balcony"
    - "East Balcony"
walls:
  - between: ["Passport Check", "Customs Inspection"]
    floor: 1F
    notes: "'Passport wall -> Customs', two panels; Bandit batteries them for Customs/Supply. The rework cut this line from four soft walls to two."
  - between: ["Tellers", "Bathroom"]
    floor: 1F
    notes: "Shared wall created by the rework (Bathroom extended along Tellers). Guides keep a 'Tellers/Bathroom vault rotate' in it."
  - between: ["Tellers", "Detention"]
    floor: 1F
    notes: "'Tellers wall facing Detention'; reinforced in Tellers/Bathroom setups."
  - between: ["Workshop", "Ventilation Room"]
    floor: 1F
    notes: "Kept open as the 'Workshop/Ventilation vault rotate'."
  - between: ["Workshop", "exterior"]
    floor: 1F
    notes: "'Workshop exterior wall', main panel and second panel; Kaid claws the main one. Guides note the main breach panel should be checked in a custom game."
  - between: ["Armory Lockers", "West Balcony"]
    floor: 2F
    notes: "'Armory -> West Balcony walls, both'; Mute jams them and Maestro Evil Eyes cover them."
  - between: ["Archives", "Fountain"]
    floor: 2F
    notes: "'Archives -> Fountain, two panels'. 'Fountain' is the guides' name for the 2F area next to Archives; that it is the exact in-game callout is not verified."
hatches:
  - in: "Security Room"
    above: "Customs Inspection"
    notes: "One of the two 'CC hatches' (Security Room = CC). Valkyrie opens both and holds CC over them in a Customs/Supply strat; reinforce them if nobody plays CC."
  - in: "Security Room"
    above: "Customs Desk"
    notes: "The second CC hatch. siegestrats callouts: Customs Desk has a 'hatch from 2F Security Room above'."
stairs:
  - name: "East Stairs"
    connects: ["1F", "2F (interior balcony to Break Room after the rework)"]
  - name: "West Stairs"
    connects: ["1F", "2F"]
  - name: "Metal Stairs"
    connects: ["1F (bottom rotate into Customs/Supply)", "2F"]
windows_and_doors:
  - name: "Site window"
    room: "Tellers"
    faces: "exterior; Bandit tricks the wall around it"
  - name: "Offices double door"
    room: "Offices"
    faces: "interior"
  - name: "Metal Stairs door"
    room: "Workshop side (1F), not verified"
    faces: "interior; Castle panels it for Workshop/Ventilation"
  - name: "Fountain door"
    room: "Fountain (2F)"
    faces: "interior; Mute jams it for Armory/Archives"
  - name: "East Balcony doors"
    room: "East Balcony"
    faces: "exterior to 2F; Smoke gasses them from back Archives"
