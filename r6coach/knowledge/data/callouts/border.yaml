uncertain:
  - "Hatches named without both rooms: 'Workshop hatch' (above Workshop; 2F room it sits in not named; guides reinforce it for ranked), 'Archives hatch' (in Archives; Kaid claws it to 'vert over Bathroom', room below not stated), '2F Bathroom hatch' (above Bathroom; 2F room not named; may be the same as the Archives hatch). r6prep: 'Hatches drop from 2F straight into the 1F sites'. The wiki counts 5 hatches."
  - "Walls named without both rooms: 'Detention wall' (two panels, in both Workshop and Customs setups; source says where Detention meets site needs checking), 'Security Room (CC) wall' (two panels, Customs setup), 'Armory -> Security corridor', 'Fountain west walls', 'Triple wall' (2F Armory, 'the aggressive seat'), 'Break walls', 'Closet wall in site' (Customs), 'Back Archives wall', 'Bathroom wall' (two panels), 'Luggage-side wall', 'Long-angle Tellers wall (quad)', '2F Armory wall', '1F Tellers stairs wall', 'Customs wall, site side', 'Site wall facing Tellers door', 'Vents outer walls'. Many strats use compass labels (north-west, middle) from slides, not room names."
  - "Room names not confirmed as in-game text: 'Fountain' (2F), 'West Stairs', 'Metal Stairs' and 'Central stairs' (may be names for the same flight), 'Detention', 'Armory Desk' (spot in Armory Lockers), 'Luggage', 'Rafters', 'Offices' vs 'Office' (the wiki uses both)."
  - "Slang spots used by guides (not in-game callouts): CC (= Security Room), Vents (= Ventilation Room), Customs, West, East, Break, Pipe, Holes over Vents, Half wall, Triple wall, quad wall, AC window, sandwich window."
  - "The siegestrats strat 'The Sky is Falling' is tagged 'Old layout'; nothing from it was used. Most other Border strats use slide compass labels, so few of their walls could be tied to rooms."
