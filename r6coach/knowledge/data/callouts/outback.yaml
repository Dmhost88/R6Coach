uncertain:
  - "Bomb sites: 2F Piano Room / 2F Laundry, 2F Party Room / 2F Office, 1F Green Bedroom / 1F Red Bedroom, 1F Mechanic Shop / 1F Kitchen (wiki, siegestrats and r6prep agree)."
  - "Hatches named without both rooms: the 'hatch above site' for Mechanic / Kitchen (the 'Office lid' strat holds 2F Office above the site with this hatch open as the way down; room above it is implied as Office but not stated), Valkyrie's 'hatch pipes' cam (Party / Office), the bedroom 'site hatch' (probably the Piano hatch into Closet, not confirmed). Wiki counts 3 hatches."
  - "Walls named without both rooms: 'Restaurant wall behind the bar', 'Lower Garage walls 1/2' (1F under Party / Office), 'Laundry bomb-side single wall', 'Piano wall beside the bomb', 'Bathroom right side' (2F), 'Picnic walls 1/2', 'Games vault wall' and 'Games second wall', 'Bull long-angle wall', 'Both upstairs Dorms outer walls', r6prep's 'Both Electrical walls' (Electrical Room was removed in the rework per the wiki, so this probably means Office Supplies), 'two reinforcements in Bunks', the bedrooms 'main wall' / 'bottom wall'. Wiki also says soft walls look over the 1F Restaurant Stairs and the internal Terrace links Mezzanine, Piano Room and Games Room via destructible walls; not tied to a specific pair."
  - "Siegestrats lists '1F Convenience Store', but the wiki's rework notes say Convenience Store, Compressor Room, Gear Store and Beer Fridge were merged into Bike Repair and Mechanic Shop in 2021; treated as outdated and left out of rooms."
  - "Exact in-game spellings not confirmed for: 'Waiting Room' (guides: Waiting), 'Shark', 'Reptile Hallway', 'Back Entrance', 'Bathroom' (1F and 2F), 'Closet', 'Showers', 'Motel Hallway', 'Yellow Stairs' vs 'Motel Stairs' vs 'Laundry Stairs', 'Shark Stairs' vs 'Restaurant Stairs'. 'Green Bedroom' / 'Red Bedroom' were previously Nature Room / Bushranger Room (wiki)."
  - "Slang spots used by guides (not in-game callouts): Bull (Mechanical Bull), Supply (Office Supplies), Picnic, Connector, Bunks, Reptile wall, Party/Office quad, Office lid."
  - "Liquipedia not used (rate-limited and asked not to proceed)."
