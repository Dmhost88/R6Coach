walls:
  - between: ["Mechanic Shop", "Kitchen"]
    floor: 1F
    notes: "The shared site wall; 'Mechanic/Kitchen wall: middle only' reinforced, crouch rotates cut at both ends."
  - between: ["Mechanic Shop", "Waiting Room"]
    floor: 1F
    notes: "'Mechanic Shop to Waiting', walls 1 and 2; clawed (Kaid) in Mechanic / Kitchen holds. Guides say 'Waiting'; in-game spelling not confirmed."
  - between: ["Kitchen", "Waiting Room"]
    floor: 1F
    notes: "'Kitchen to Waiting crouch rotate' (kept open as a rotate rather than reinforced)."
  - between: ["Red Bedroom", "Green Bedroom"]
    floor: 1F
    notes: "Wiki: since the rework the wall connecting the bedrooms is entirely destructible; r6prep: 'A rotation links the two sites'."
  - between: ["Red Bedroom", "Yellow Stairs"]
    floor: 1F
    notes: "'Red Bedroom to Yellow Stairs: both' reinforced in bedroom holds."
  - between: ["Red Bedroom", "Reptile Hallway"]
    floor: 1F
    notes: "'Red Bedroom to Reptile Hallway: both' reinforced. Attackers burn the 'Reptile wall' (Thermite) after taking Dorms vertical; Bandit/Kaid devices on it get shot from above."
  - between: ["Closet", "Reptile Hallway"]
    floor: 1F
    notes: "'Closet to Reptile Hallway: both walls' reinforced (Bandit). Closet is the new closet under the Piano hatch, in Green Bedroom."
  - between: ["Laundry", "Piano Room"]
    floor: 2F
    notes: "The shared site wall; 'small middle rotate Laundry to Piano' cut in the middle of it (r6prep: rotation on the right, covered from Bull and Shark stairs)."
  - between: ["Party Room", "Mechanical Bull"]
    floor: 2F
    notes: "'Party to Bull: middle two walls' reinforced; outer Party walls left soft for Bull peeks."
  - between: ["Party Room", "Office"]
    floor: 2F
    notes: "'Party/Office quad: one wall' reinforced; rotate between sites. Wiki: the old door was removed and the walls are now wood."
  - between: ["Mechanical Bull", "Games Room"]
    floor: 2F
    notes: "'Bull to Games Room: both walls' reinforced in Party / Office holds."
  - between: ["Office Supplies", "Garage Lounge"]
    floor: 2F
    notes: "'Supply to Garage Lounge: right wall' reinforced; wiki lists it as one of Office Supplies' two soft walls."
  - between: ["Office Supplies", "exterior"]
    floor: 2F
    notes: "The 'Office Supplies breach' (both walls reinforced, Kaid). Wiki: Office Supplies has a soft wall facing outside. Attackers burn Supply; since Y11S3.1 Thermite's charge kills anyone behind the Supply wall."
  - between: ["Office", "Garage Stairs"]
    floor: 2F
    notes: "Wiki: boxes on the 2F Garage Stairs lead onto the Office soft walls facing the stairs."
  - between: ["Dorms", "exterior"]
    floor: 2F
    notes: "The 'Dorms breach' (walls 1 and 2): wiki says Dorms has a destructible wall to the outside on the south. Attackers burn it (Thermite/Kali) for Piano / Laundry and to take vertical over the bedrooms."
hatches:
  - in: "Piano Room"
    above: "Closet"
    notes: "The 'Piano hatch'. Wiki: the old Piano stairs were replaced by a new Closet (in 1F Green Bedroom) and a hatch from 2F Piano Room into it. Kept open as a drop/escape in Piano holds and bedroom holds; r6prep reinforces it and the two walls under it."
stairs:
  - name: "Garage Stairs"
    connects: ["1F Garage", "2F (Office / Garage Lounge side)"]
  - name: "Shark Stairs (Restaurant Stairs)"
    connects: ["1F Restaurant / Shark", "2F Mezzanine / Bull side"]
  - name: "Yellow Stairs (Motel Stairs, Laundry Stairs)"
    connects: ["1F Motel (by Red Bedroom)", "2F (by Laundry)"]
  - name: "Garage ladder"
    connects: ["1F Garage", "2F Garage Lounge"]
