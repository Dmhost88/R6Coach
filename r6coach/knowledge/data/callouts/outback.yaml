# Callouts for Outback. Grounds exact location names for the coach.
# Built 2026-11-06 (Y11S3). Walls/hatches are listed only when a source names them;
# where a source names the wall/hatch but not both rooms, it is under `uncertain` instead.
map: outback
version_note: "Layout of the Y6S4 (Nov 2021, High Calibre) rework: Garage side rebuilt into 1F Bike Repair / Mechanic Shop, 1F Mechanic Shop shares a site with 1F Kitchen, Terrace made internal, Piano Room site replaces Games Room, Piano hatch into the new Closet. No newer structural rework found; Y11S3.1 changed Thermite damage only."
