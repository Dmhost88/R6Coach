    room: "Bathroom (1F, between the bedrooms)"
    faces: "exterior; Banshee/alarm spot in bedroom holds"
  - name: "Games Room windows"
    room: "Games Room"
    faces: "south exterior window, plus a north window/balcony over Motel Hallway (wiki)"
  - name: "Garage windows"
    room: "Garage side (2F)"
    faces: "exterior; attackers claymore them"
  - name: "Bull windows"
    room: "Mechanical Bull"
    faces: "exterior"
  - name: "Dorms balcony"
    room: "Dorms"
    faces: "south exterior; attacker staging for the bedroom vertical"
  - name: "Vending/Coffee door"
    room: "not verified"
    faces: "not verified"
