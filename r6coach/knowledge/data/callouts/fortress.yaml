uncertain:
  - "The task brief assumed Fortress was unchanged; it was fully reworked in Y10S4 (Tenfold Pursuit, December 2025). Room list is from post-rework guides and Ubisoft patch-note names (Courtyard Corridor, Old Roof); several names may have changed from the 2018 map and were not checked against an in-game list."
  - "Hatches named without both rooms: 'Bathroom hatch' (2F Bathroom, drops into 'Star', a deck nickname on the 1F Waiting/Cafeteria site), 'Meeting hatch' (drops into 'Flu'; may be the Briefing hatch), 'Horse hatch' (in Museum, 'vertical over Music'; 1F room below not verified), 'Old Tower hatch', 'Laundry hatch', 'Star hatch' and 'Flu hatch' (1F-side names of the Bathroom/Meeting hatches)."
  - "Walls named without both rooms: 'Commander's back wall', 'Master Bedroom wall' (Commander's setup), 'Dormitory breach' (two panels), 'Games -> Vending wall', 'Single wall facing Old Tower', 'Oven triple wall' (Oven = Kitchen slang; three panels, Waiting/Cafeteria), 'Hammam wall (Fountain/Oven)' (two panels), 'Dining wall' (three panels, Cafeteria setups), 'Cafeteria -> main hallway wall', 'Site/Lobby-side wall' and 'Hallway wall with long plant angle' (Hammam), 'Single wall -> main hallway', 'Office wall' / r6prep 'Meeting wall stays soft'."
  - "Room names not confirmed as in-game text or floor: 'Briefing Room' vs 'Briefing' vs 'Meeting', 'Museum' (guides: Horse), 'Music Room' (floor not verified), 'Lobby', 'Prep', 'Old Tower' vs 'Old Tower stairs', 'Showers', 'Gun Room', 'Laundry'. siegestrats lists 'Hammam (Fountain)', i.e. some guides call Hammam 'Fountain'; the 'Main Gate' and 'Parking' spawns are from a pre-rework list."
  - "Slang spots used by guides (not in-game callouts): Horse (Museum), Eagle (Central stairs), Oven (Kitchen), Cafe, Med, Mint, Star, Flu, Limbo, Shrine, Paper, Green, Vending / Vending hallway, Twin, Tub, Flag, Meeting, Books, Glow, Radio, Tiles, Bunks, Fire, Closet, Clock, Douche, Top White, Top Main, 90 hall, Dagger, Sandwich."
  - "Stairs: guides use Central stairs (White), Eagle stairs (Central / Lobby stairs), Main stairs, Laundry stairs, Old Tower and New Tower (Renovation stairs); some may be the same flight. Exact top/bottom rooms not verified."
