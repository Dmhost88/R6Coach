# Callouts for Fortress. Grounds exact location names for the coach.
# Built 2026-11-06 (Y11S3). Walls/hatches are listed only when a source names them;
# where a source names the wall/hatch but not both rooms, it is under `uncertain` instead.
map: fortress
version_note: "Layout of the Y10S4 (Operation Tenfold Pursuit, December 2025) full rework: Courtyard is now an exterior zone (defenders are detected there), shorter corridors, extra entries into sites; Bedroom no longer plantable. Sites: 2F Commander's Office / Bathroom, 2F Dormitory / Games Room, 1F Waiting Room / Cafeteria, 1F Hammam / Sitting Room. All walls/hatches below come from post-rework guides checked on Y11S3.2. Pre-rework (2018) prose, including the fandom wiki, was not used for walls."
rooms:
  1F:
    - "Hammam"
    - "Sitting Room"
    - "Waiting Room"
    - "Cafeteria"
    - "Kitchen"
    - "Infirmary"
    - "Dining Room"
    - "Showers"
    - "Gun Room"
    - "Laundry"
  2F:
    - "Commander's Office"
    - "Bathroom"
    - "Dormitory"
    - "Games Room"
    - "Briefing Room"
    - "Master Bedroom"
    - "Museum"
    - "Old Tower"
    - "Courtyard Corridor"
  EXT:
    - "Courtyard"
    - "Old Roof"
walls:
  - between: ["Bathroom", "Briefing Room"]
    floor: 2F
    notes: "'Bathroom -> Briefing wall', two or three panels; reinforced in Commander's, Dorms and even 1F Waiting/Cafeteria setups (it sits over the 1F site). Bandit batteries it. One deck calls it 'Bathroom-Flag' (Flag/Meeting = Briefing) and keeps the top panel open."
  - between: ["Briefing Room", "Dormitory"]
    floor: 2F
    notes: "'Briefing -> Dormitory wall', two panels. Sources disagree for the Dorms site: reinforce one panel vs keep fully soft; one plan reinforces only the right panel."
  - between: ["Commander's Office", "Museum"]
    floor: 2F
    notes: "'Commander's -> Horse wall' / 'Command-Horse panel'. Horse is the guides' slang for Museum (the source states Horse = Museum)."
  - between: ["Showers", "Hammam"]
    floor: 1F
    notes: "'Showers -> Hammam wall', two panels, reinforced for Hammam / Sitting Room; Thorn holds Showers."
  - between: ["Sitting Room", "exterior"]
    floor: 1F
    notes: "'Sitting Room outside wall', two panels; Tubarao freezes it ('Freeze the Sitting outside wall'). Keeping it shut is the Hammam win condition. A hallway rotate beside it stays open."
  - between: ["Waiting Room", "Infirmary"]
    floor: 1F
    notes: "'Waiting/Infirmary wall'. Sources disagree: alyttleton keeps it soft with head holes, R6Mint reinforces it."
  - between: ["Cafeteria", "Infirmary"]
    floor: 1F
    notes: "The 'Infirmary wall' r6prep opens ('Cafeteria/Infirmary gap, head holes') so attackers who take Infirmary still have to walk into Cafeteria or breach Waiting."
  - between: ["Kitchen", "Waiting Room"]
    floor: 1F
    notes: "'Kitchen -> Waiting crouch rotate', kept open; a reinforced 'Waiting wall beside Kitchen rotate' sits next to it."
hatches:
  - in: "Briefing Room"
    above: "Waiting Room"
    notes: "The 'Briefing hatch'. Kept open; Melusi holds it over Waiting and drops late; covers the Waiting plant. Also called the Meeting hatch in one deck."
stairs:
  - name: "Central stairs (White / Eagle stairs)"
    connects: ["1F", "2F (near Commander's Office)"]
  - name: "Main stairs"
    connects: ["1F", "2F ('Top Main' near Dormitory / Twin)"]
  - name: "Laundry stairs"
    connects: ["1F Laundry", "2F"]
  - name: "Old Tower"
    connects: ["1F", "2F (Old Tower rotate into Dorms / Commander's)"]
  - name: "New Tower (Renovation stairs)"
    connects: ["1F", "2F (floors not verified)"]
windows_and_doors:
  - name: "Vending window"
    room: "2F near Games Room (Vending hallway, slang)"
    faces: "exterior; Azami Kibas it; attackers hop in"
  - name: "Hammam windows"
    room: "Hammam"
    faces: "exterior; Thorn traps them"
  - name: "Showers windows"
    room: "Showers"
    faces: "exterior"
  - name: "Lobby door"
    room: "1F Lobby (under the Commander's side)"
    faces: "interior; r6prep opens floor holes above it from 2F"
  - name: "Front door"
    room: "1F (room not verified)"
    faces: "exterior"
  - name: "Main hallway window"
    room: "1F main hallway"
    faces: "exterior (not verified)"
