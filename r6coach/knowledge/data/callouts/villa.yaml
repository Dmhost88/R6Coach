uncertain:
  - "No hatch could be tied to both rooms. Named hatches: 'Pantry hatch' (in Pantry, 'down toward the basement'; basement room not named, and timesaver contradicts itself on where it leads), 'Hall hatch' / 'Hallway Hatch' / 'Red Hall hatch' (1F hallway into the new basement site; mobalytics says a hatch above Art Storage was added, siegestrats says the Red Hall/Living Room hatch cuts off Art Hallway), 'Reading Room hatch' (basement site), 'Laundry hatch' (kept open for Dining/Kitchen, 'never reinforce'; rooms not named). siegestrats notes basement hatch names 'may not match final in-game callouts'. The wiki's '6 Hatches' predates the Y11S3 update."
  - "Walls named without both rooms: 'Statuary triple wall' ('decides the site'; right and middle reinforced, left head holes), 'Both Closet walls', 'Deer walls' and 'Boar wall' (creator callouts), 'Study wall', 'Bar wall' (double), 'Main wall' (Aviator/Games, double with feet holes), 'Astro wall', 'Memo walls' (doubled), 'Laundry wall', 'Middle China wall', 'Bikes wall', 'Both Trophy walls', 'Site double wall' and 'Single wall beside site rotate' (basement), 'Garage-side wall'."
  - "Room names not confirmed as in-game text or floor: 'Red Hall', 'Gallery' (timesaver lists both a 1F and a lower Gallery), 'Art Hallway', 'Laundry', 'China Room', 'Closet', 'Vault', '90 Hall', 'Lobby', 'Reading Room', 'Astronomy Room' vs 'Astro'. siegestrats places Garage, Wine Cellar and Crypt in the basement; timesaver also lists Garage under ground/exterior."
  - "Slang spots used by guides (not in-game callouts): Astro, Bricks, Bikes, Memo, Bar, Deer, Boar, Red / Red 90, Top Main, Triple Wall, Vault Wall, Barrels, Study Balcony, White stairs (r6prep)."
  - "siegestrats marks the 1F and 2F strats 'May predate this season's map update' and says the 2F layout was not changed; the basement strat is low confidence (site live since 2026-09-01). No primary Ubisoft Y11S3 patch note was read; the change list comes from third-party guides that partly disagree on the Garage."
