# Callouts for Villa. Grounds exact location names for the coach.
# Built 2026-11-06 (Y11S3). Walls/hatches are listed only when a source names them;
# where a source names the wall/hatch but not both rooms, it is under `uncertain` instead.
map: villa
version_note: "Layout after the Y11S3 targeted map update (reported live 2026-09-01): the 1F Living Room / Library site was replaced by a basement site, B Art Storage / Old Office; the Garage is now interior; the old soft wall between Kitchen Stairs and Garage is now a door; a 1F hallway hatch into the new site replaced the old Living Room hatch. 1F and 2F were reported unchanged. Sites: 2F Aviator Room / Games Room, 2F Trophy Room / Statuary Room, 1F Dining Room / Kitchen, B Art Storage / Old Office. Basement content is new and thin."
rooms:
  B:
    - "Art Storage"
    - "Old Office"
    - "Garage"
    - "Wine Cellar"
    - "Crypt"
  1F:
    - "Dining Room"
    - "Kitchen"
