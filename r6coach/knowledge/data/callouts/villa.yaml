walls:
  - between: ["Old Office", "Garage"]
    floor: B
    notes: "'Old Office -> Garage: both walls'. r6prep: 'The two Old Office walls into Garage are the strongest on the site.' Mira mirrors one facing Garage."
  - between: ["Garage", "exterior"]
    floor: B
    notes: "'Both Garage exterior walls' reinforced for Art Storage / Old Office (r6prep: 'Both outside Garage walls are reinforced'). Since Y11S3 the Garage is interior and one former open lane is a reinforceable soft wall."
  - between: ["Pantry", "Kitchen"]
    floor: 1F
    notes: "'Pantry -> Kitchen wall'; Kaid claws it in a Dining/Kitchen hold. Pulse plays the 2F Bathroom above Pantry."
  - between: ["Aviator Room", "Games Room"]
    floor: 2F
    notes: "'Aviator -> Games wall: right side' reinforced; vault and crouch rotates elsewhere on the site. r6prep: main walls into Games are double reinforced with footholes."
  - between: ["Bathroom", "Master Bedroom"]
    floor: 2F
    notes: "'Bathroom -> Master wall' reinforced for Trophy/Statuary; a Bathroom head hole watches the Master window. r6prep: reinforced Bathroom and closet walls let a defender contest the Master window."
hatches: []
stairs:
  - name: "Main Stairs"
    connects: ["1F", "2F ('Top Main' next to the Aviator/Games site)"]
  - name: "Red Stairs"
    connects: ["1F (Red Hall)", "2F (Red 90 side); basement link not verified"]
  - name: "Pantry Stairs"
    connects: ["1F Pantry", "B (toward Garage; the old soft wall to it is gone)"]
  - name: "Kitchen Stairs"
    connects: ["1F Kitchen side", "B Garage (now through a door)"]
  - name: "Astro stairs"
    connects: ["2F Astronomy Room", "other floor not verified"]
windows_and_doors:
  - name: "Kitchen Stairs door to Garage"
    room: "Garage"
    faces: "interior; was a soft wall before Y11S3"
  - name: "Garage door"
    room: "Garage"
    faces: "exterior / basement approach; Fenrir traps it"
  - name: "Master window"
    room: "Master Bedroom"
    faces: "exterior; contested from Bathroom and Closet on Trophy/Statuary"
  - name: "Closet window"
    room: "Closet (2F, off Master Bedroom; not verified)"
    faces: "exterior"
  - name: "90 rappel window"
    room: "90 Hall (2F)"
    faces: "exterior; a wall facing it is reinforced for Aviator/Games"
  - name: "Astro windows"
    room: "Astronomy Room"
    faces: "exterior"
