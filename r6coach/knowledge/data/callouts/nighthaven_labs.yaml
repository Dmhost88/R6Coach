# Callouts for Nighthaven Labs. Grounds exact location names for the coach.
# Built 2026-11-06 (Y11S3). Walls/hatches are listed only when a source names them;
# where a source names the wall/hatch but not both rooms, it is under `uncertain` instead.
map: nighthaven_labs
version_note: "Launch layout (Operation Solar Raid, Dec 2022; official blueprints dated 2022-12-06). Y10S3 (Sept 2025) modernisation reported by guides as visual plus destructible props. The snowy Nighthaven of the March-April 2026 Metal Gear event was a limited-time variant. No later layout change found. Wall/hatch names checked against Y11S3 guides."
rooms:
  B:
    - "Tank"
    - "Assembly"
    - "Animus"
    - "Exo"
    - "Nano hallway"
  1F:
    - "Kitchen"
    - "Cafeteria"
    - "Control Room"
    - "Storage"
    - "Garage"
    - "Games"
    - "Lobby"
    - "Break"
    - "Freezer"
    - "Fork"
    - "Mud"
  2F:
    - "Command Center"
    - "Servers"
    - "IT"
    - "Rafters"
    - "Electrical"
    - "Connector"
    - "Meeting"
    - "Mezzanine"
    - "Aqua hallway"
walls:
  - between: ["Command Center", "Servers"]
    floor: 2F
    notes: "'Command-Servers wall by the rotate': reinforced next to a rotate, with head holes between the two 2F site rooms."
  - between: ["Servers", "Connector"]
    floor: 2F
    notes: "'Server/Connector wall', panels 1 and 2; both reinforced in Command / Servers and Control / Storage holds (2F delay)."
  - between: ["Rafters", "Electrical"]
    floor: 2F
    notes: "'Wall beside Rafters rotate -> E-box' / 'Wall by Rafters rotate, facing Electrical'; reinforced. Guides call the room E-box."
  - between: ["Control Room", "Storage"]
    floor: 1F
    notes: "Kept open as the 'Storage/Control rotate' in Control Room / Storage holds."
  - between: ["Control Room", "Cargo"]
    floor: 1F
    notes: "'Control -> Cargo rotate, right side'; r6prep: rotations connect Control with Cargo and Storage. Cargo is the area at the Cargo stairs out of Garage (name not verified)."
  - between: ["Storage", "Games"]
    floor: 1F
    notes: "'Games -> Storage wall' reinforced in Kitchen / Cafeteria holds; 'Storage -> Games head holes' kept in Control / Storage holds."
  - between: ["Cafeteria", "Lobby"]
    floor: 1F
    notes: "'Lobby wall (Cafeteria)', two panels, reinforced; it is the Lobby breach into the Kitchen / Cafeteria site."
hatches: []
stairs:
  - name: "Aqua Stairs (also Fish / Water stairs)"
    connects: ["1F Fork", "2F Aqua hallway"]
  - name: "Lobby Stairs"
    connects: ["1F Lobby", "2F Mezzanine"]
  - name: "Exo Stairs"
    connects: ["1F Break", "B Exo"]
  - name: "Cargo Stairs"
    connects: ["1F Garage", "B"]
  - name: "Rafters Stairs"
    connects: ["1F Garage", "2F Rafters (not verified)"]
  - name: "CC Stairs"
    connects: ["1F", "2F Command Center side (Ubisoft patch-note name; floors not verified)"]
windows_and_doors:
  - name: "Kitchen window"
    room: "Kitchen"
    faces: "exterior; the window jump on Kitchen / Cafeteria, covered from the Cafeteria corner and Freezer knee holes"
  - name: "Storage window"
    room: "Storage"
    faces: "exterior; watched late from Garage"
  - name: "Fork window"
    room: "Fork"
    faces: "exterior; sees part of Control Room"
  - name: "90 window"
    room: "Games side ('90' is slang)"
    faces: "exterior"
  - name: "Rafters window"
    room: "Rafters"
    faces: "exterior"
  - name: "E-box window"
    room: "Electrical"
    faces: "exterior (east)"
  - name: "Mud door"
    room: "Mud"
    faces: "interior; barricaded in Control / Storage holds"
  - name: "Aqua door"
    room: "Aqua hallway"
    faces: "interior, toward Command Center"
  - name: "E-box door"
    room: "Electrical"
    faces: "interior"
  - name: "Mezz door"
    room: "Mezzanine"
    faces: "top of the Lobby stairs"
