uncertain:
  - "Site names: '2F Command Center / Servers', '1F Kitchen / Cafeteria', '1F Control Room / Storage', 'B Tank / Assembly'. siegestrats places Command Center as the west site room and Servers as the east room with the angled server stack, but says 'The two site-room names could be swapped'; it says the same for Tank / Assembly (Tank = oval-tank room in the west, Assembly = under 1F Storage, Animus = under Garage, Exo = east room with the stairs)."
  - "Hatches named without both rooms (none qualified for the hatches list): basement-site hatches 'Exo hatch' (1F, by the Exo stairs), 'Cargo hatch, top of Cargo stairs' and 'Animus hatch from 1F' (r6prep: all hatches reinforced for Tank / Assembly; the 1F rooms they sit in are not named); 'Garage hatch' (1F); 'Freezer hatch' (reinforced from outside at the end of prep on Kitchen / Cafeteria); 'Servers hatch' (2F, opened as a roam route); '2F hatch -> Games' (2F room not named)."
  - "Walls named without both rooms: 'IT exterior / outside wall' (2F, two panels, the most contested walls on the map), 'Rafters triple wall' (2F, rotate on the third panel), 'Aqua hallway wall' (2F, feet holes), 'Connector outer walls' (2F), 'Command west wall' (2F), 'Mezzanine walls 1-2' (2F), 'Garage outside walls' and '1F Garage wall by Storage' (1F), 'Freezer wall' with knee holes (1F), 'Wall beside Games rotate' (1F), '1F Fork-Control wall' (Fork is slang), '1F wall by Exo stairs', 'Animus outside wall', 'Assembly outside wall', 'Animus wall' with feet holes, 'Nano hallway wall', 'Cargo wall', 'Left Exo wall' (B)."
  - "Exact in-game spellings not confirmed for: 'IT' (vs IT Room), 'Electrical' (guides say E-box), 'Games' (also 'Lounge'), 'Meeting', 'Break', 'Fork', 'Mud', 'Cargo', 'Nano hallway' (also 'Nanotech hall'), 'Aqua hallway' (also 'Water hallway'), 'Exo' (also 'Exosuit'). Cargo appears both as a 1F rotate target and a basement wall, so its floor is not verified and it is not listed under rooms."
  - "Slang spots used by guides (not in-game callouts): 90 / 90 hall, Pillar, Tetris, Server stack, Back Cargo, Fish stairs. Ubisoft marketing names 'HQ' and 'R&D Lab' are areas, not single rooms."
