uncertain:
  - "Exact in-game spellings not confirmed (guides and wiki vary): 'Office Hallway' (wiki: Open Space Hallway), 'Skylight Stairwell' (guides: Square, Top/Bottom Square), 'Server Room' vs 'Server', 'Janitor Closet' vs 'Janitor', 'Stock Trading Room' vs 'Stock', 'Conference Room' vs 'Meeting', 'Front Desk' vs 'Front Office', 'Admin Office' vs 'Admin', 'Red Hallway' (wiki: Secure Hallway; camera list says Vault Hallway), 'Server Stairs' vs 'Blue Stairs'. Bomb-site callouts are confirmed: B Lockers / B CCTV Room, 1F Open Area / 1F Staff Room, 1F Tellers' Office / 1F Archives, 2F Executive Lounge / 2F CEO Office."
  - "Walls named without both rooms: 'E3 wall' / 'E3 elevator-wall' (2F, near CEO hallway), 'Janitor door wall' and 'Right wall by Janitor' (2F), 'Top-right walls', 'Banana outside walls' and 'Banana-side walls' (2F), 'Kanzen wall' x2 (1F), 'Printer walls' feet holes (1F, Printer vs Open Area or Staff Room not stated), 'Site south wall' (B Lockers/CCTV setups), '2F roam walls', 'lobby desk wall' (1F), 'back Kitchen wall' (r6prep; probably the Staff Room / Skylight Stairwell or Electrical wall), 'Long wall'."
  - "Wiki-only walls (Lockers/Vault Entrance, Lobby/Loan, Loan/Office Hallway, Tellers' Office/Office Hallway/Archives/Tellers, Conference/Janitor/Front Desk, Front Desk/Meeting Hallway, Stock/Stock Hallway) come from prose that may predate the 2021 rebuild; not re-verified in a Y11 guide."
  - "Slang spots used by guides (not in-game callouts): Square / Top Square / Bottom Square, Banana, Sewer, E1/E2/E3 (elevators), Kanzen, Long Desk, Marble, Herds, Quad windows (probably the Top Square or CEO north windows; not verified), Trump, Ebox."
  - "Siegestrats lists 'Electrical' among 1F rooms and also 'Ebox'; the wiki places Electrical Room on 1F east of Staff Room with an Alley door. No basement Electrical room confirmed."
  - "Liquipedia not used (rate-limited and asked not to proceed)."
