# Callouts for Bank. Grounds exact location names for the coach.
# Built 2026-11-06 (Y11S3). Walls/hatches are listed only when a source names them;
# where a source names the wall/hatch but not both rooms, it is under `uncertain` instead.
map: bank
version_note: "Layout of the Y6S3 (Sept 2021, Crystal Guard) rebuild. Strat sources checked are dated 2024 to Aug 2026; wiki room prose partly predates 2021 and is used only where it agrees with the rebuild (e.g. Lobby hatch now drops into B Vault)."
