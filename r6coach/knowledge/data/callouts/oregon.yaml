  - "https://siegestrats.com/strats/oregon-fight-small-tower-own-showers-and-shoot-the"
  - "https://www.r6prep.com/defender/site-setups/oregon"
  - "https://news.ubisoft.com/en-ca/article/7jpjTlTV0IuZAhvGXnYgDW/rainbow-six-siege-operation-void-edge-operator-and-map-guide"
  - "https://static2.cdn.ubi.com/gamesites/rainbow6/blueprints/r6-maps-oregon-blueprints.zip (official blueprints, March 2020; no room labels)"
uncertain:
  - "Basement hatches named by guides: 'Laundry hatch' (into Laundry Room), 'Freezer hatch' (into Freezer), 'Electrical hatch' (into Electric Room). The 1F room each sits in is not verified, so they are not listed under hatches. The Stage hatch may be the same as the Electrical hatch."
  - "Exact in-game spellings not confirmed for: 'Electric Room' (guides say Electrical / E-box), 'Security' (may be 'Security Room'), 'Closet' (may be 'Walk-In'), 'Blue Bunker' (some guides say Bunker)."
  - "Freezer Stairs vs White Stairs: Ubisoft says the Kids' dorm stairs were extended down to the new Freezer section; guides use 'Freezer Stairs' for the lower flight and 'White Stairs' for the upper one."
  - "Walls named without both rooms: 'Split wall' (left/right, 1F, Meeting/Kitchen setups), 'Green wall' (1F), 'Pillar wall' (two panels, B), 'Box wall' and 'Elbow' walls (B), 'walls toward Blue Tarps' (B), 'Armory wall' (2F), 'Kids rotate wall toward Big Window' (2F), 'Pit' and 'Closet' walls (2F), 'Wall beside Security' (1F rotates into Security)."
  - "Slang spots used by guides (not in-game callouts): Pillar, Elbow, Barrels, Box, Blue Tarps (B); Z, Split, Green corridor (1F); Pit, Bunks/Games (2F)."
  - "A March 2026 (Y11S1) Oregon update is reported by guide sites as visual only; no primary patch note checked. Official blueprint zip still dates from March 2020."
  - "Liquipedia was not usable (API rate-limited this session), so its callout maps were not cross-checked."
