# Callouts for Oregon. Grounds exact location names for the coach.
# Built 2026-11-06 (Y11S3). Walls/hatches are listed only when a source names them;
# where a source names the wall/hatch but not both rooms, it is under `uncertain` instead.
map: oregon
version_note: "Layout of the 2020 (Void Edge) rework; Y11S1 (March 2026) update reported as visual/modernisation only. Wall/hatch names checked against Y11S3 guides."
rooms:
  B:
    - "Laundry Room"
    - "Supply Room"
    - "Freezer"
    - "Electric Room"
    - "Blue Bunker"
    - "Laundry Stairs"
    - "Freezer Stairs"
    - "Tower Stairs"
  1F:
    - "Kitchen"
    - "Dining Hall"
    - "Meeting Hall"
    - "Rear Stage"
    - "Security"
    - "Showers"
    - "Small Tower"
    - "Lobby"
    - "Garage"
    - "Big Tower"
    - "White Stairs"
    - "Main Stairs"
  2F:
    - "Kids' Dorms"
    - "Dorms Main Hall"
    - "Trophy Room"
    - "Master Bedroom"
    - "Armory"
    - "Attic"
    - "Closet"
    - "Big Tower"
    - "Small Tower"
  3F:
    - "Big Tower"
  EXT:
    - "Junkyard"
    - "Street"
    - "Construction Site"
    - "Big Window"
walls:
  - between: ["Kitchen", "Meeting Hall"]
    floor: 1F
    notes: "Site wall of Meeting Hall / Kitchen. Guides call the hatch-side half 'hatch-side Kitchen/Meeting wall' and use a crouch rotate on the box side."
  - between: ["Rear Stage", "Meeting Hall"]
    floor: 1F
    notes: "Called the 'Stage wall' (two panels); both panels reinforced in standard Meeting/Kitchen setups; main hard-breach target from Stage."
  - between: ["Meeting Hall", "Garage"]
    floor: 1F
    notes: "Called the 'Meeting Garage wall'; reinforced for Meeting/Kitchen."
  - between: ["Kitchen", "Z corridor"]
    floor: 1F
    notes: "'Z-corridor wall, Kitchen side'. 'Z' is player slang for the zig-zag corridor next to Kitchen, not an in-game callout."
  - between: ["Dining Hall", "Small Tower"]
    floor: 1F
    notes: "Called the 'Small Tower wall' (two panels). Thermite from Small Tower is the main threat to Kitchen / Dining; head holes from Dining watch the Small Tower plant."
  - between: ["Dining Hall", "Showers"]
    floor: 1F
    notes: "'Showers wall': usually reinforced on the right half, left half kept soft with foot holes as the Showers rotate."
  - between: ["Master Bedroom", "Dorms Main Hall"]
    floor: 2F
    notes: "'Master breach wall' (left and right halves): the main hard breach into the 2F site."
  - between: ["Attic", "Big Tower"]
    floor: 2F
    notes: "Two halves; reinforce both so Big Tower cannot open Attic for free."
  - between: ["Master Bedroom", "Attic"]
    floor: 2F
    notes: "'Master/Attic wall'; reinforced in Dorms setups."
  - between: ["Electric Room", "Blue Bunker"]
    floor: B
    notes: "Guides call the room 'Electrical' / 'E-box'. Right half is a common Mira spot watching Blue Bunker."
  - between: ["Supply Room", "Laundry/Freezer corridor"]
    floor: B
    notes: "Right half commonly reinforced for Laundry / Supply."
hatches:
  - in: "Kids' Dorms"
    above: "Kitchen"
    notes: "The 'Kids hatch'. Vertical threat on Kitchen sites; defenders disagree on reinforcing it vs leaving it open as a drop/rotate."
  - in: "Attic"
    above: "Meeting Hall"
    notes: "The 'Meeting hatch'. Defenders often hold it from upstairs during Meeting/Kitchen."
  - in: "Rear Stage"
    above: "Basement (room not verified)"
    notes: "The 'Stage hatch'. Leads down into the basement; which basement room is below is not confirmed (possibly the Electric Room hatch)."
stairs:
  - name: "Laundry Stairs"
    connects: ["B Laundry Room", "1F"]
  - name: "Freezer Stairs"
    connects: ["B Freezer", "1F (continues up as White Stairs)"]
  - name: "White Stairs"
    connects: ["1F", "2F Dorms side"]
  - name: "Tower Stairs (Big Tower)"
    connects: ["B", "1F Big Tower", "2F Big Tower", "3F Big Tower (ladder to the top)"]
  - name: "Main Stairs"
    connects: ["1F Lobby", "2F"]
windows_and_doors:
  - name: "Big Window"
    room: "Kids' Dorms side (2F)"
    faces: "exterior (side not verified)"
  - name: "Small Tower window"
    room: "Small Tower"
    faces: "exterior; used as a jump-out by roamers"
  - name: "Master door"
    room: "Master Bedroom"
    faces: "interior; one of the three main 2F entries with Big Window and Attic"
  - name: "Blue door"
    room: "Blue Bunker"
    faces: "basement entry from outside the Blue Bunker"
  - name: "Freezer door"
    room: "Freezer"
    faces: "interior; barricaded in Kitchen / Dining holds"
  - name: "Split door"
    room: "Split (1F, slang)"
    faces: "interior; barricaded in Meeting/Kitchen holds"
