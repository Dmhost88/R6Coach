# Callouts for Kanal. Grounds exact location names for the coach.
# Built 2026-11-06 (Y11S3). Walls/hatches are listed only when a source names them;
# where a source names the wall/hatch but not both rooms, it is under `uncertain` instead.
map: kanal
version_note: "Layout of the Y4S3 (Sept 2019, Ember Rise) rework: new bridge and stairs, colour-coded stairwells, Security Room / Map Room site, Lounge site, and the basement Supply Room / Kayaks site. No newer structural rework found; guide sources dated 2024 to Aug 2026."
rooms:
  B:
    - "Supply Room"
    - "Kayaks"
    - "Diving Room"
    - "Lockers"
    - "Showers"
  1F:
    - "Security Room"
    - "Map Room"
    - "Coast Guard Meeting Room"
    - "Lounge"
    - "Radio Room"
    - "Kitchen"
    - "Reception"
    - "Printer Hallway"
    - "Radio Hallway"
  2F:
    - "Server Room"
    - "Radar Room"
    - "Control Room"
    - "Skybridge"
  EXT:
    - "Floating Dock"
    - "Old Bridge"
walls:
  - between: ["Kayaks", "Supply Room"]
    floor: B
    notes: "'Middle Kayaks/Supply wall'; one panel reinforced, a crouch rotation kept open between the two site rooms (r6prep puts the rotation on the left with a reinforcement beside it)."
  - between: ["Supply Room / Kayaks site", "Diving Room"]
    floor: B
    notes: "'Diving wall': stairs-side half reinforced, the other half soft with head holes covering Yellow stairs and the hatch drop (r6prep: 'Of the two walls leading into Scuba, the left is reinforced'). Guides call Diving Room 'Scuba'. Which site room the wall belongs to is not stated."
  - between: ["Security Room", "Map Room"]
    floor: 1F
    notes: "'Security/Maps' wall with a head hole and a crouch rotate between the two site rooms."
  - between: ["Coast Guard Meeting Room", "Printer Hallway"]
    floor: 1F
    notes: "'Coast Guard to Printer wall', panels 1 and 2, reinforced; feet holes along the Printer hallway. Source says 'Printer'; read as Printer Hallway (not verified)."
hatches:
  - in: "Lounge"
    above: "Lockers"
    notes: "'Lounge floor hatch to Lockers'. Kept soft in Coast Guard / Lounge holds so a basement player can C4 through it; reinforced in Supply / Kayaks holds ('both hatches'), though some pros leave it soft so a roamer can drop back in."
  - in: "Coast Guard Meeting Room"
    above: "Supply Room / Kayaks site (exact room not stated)"
    notes: "The 'Coast Guard site hatch' / 'Coast Guard floor hatch'. One of 'both hatches' attackers burn (Hibana) for the basement site; reinforced in Supply / Kayaks and Coast Guard holds."
  - in: "Radar Room"
    above: "Security Room / Map Room site (exact room not stated)"
    notes: "'Radar site hatch (2F)'. Reinforced or left open depending on whether defenders hold 2F above Security / Maps."
stairs:
  - name: "Main Stairs"
    connects: ["B (by Supply / Kayaks)", "1F", "2F (not verified)"]
  - name: "Green Stairs"
    connects: ["1F (bottom Green, by Security / Maps)", "2F (top Green, by Server / Radar)"]
  - name: "Red Stairs"
    connects: ["1F (bottom Red)", "2F (top Red, by Server Room)"]
  - name: "Yellow Stairs"
    connects: ["B (by Diving Room)", "1F"]
  - name: "White Stairs"
    connects: ["1F", "2F (top White)"]
  - name: "Printer Stairs"
    connects: ["B (Diving / Scuba side)", "1F Printer Hallway", "2F (top Printer stairs)"]
windows_and_doors:
  - name: "90 windows"
    room: "2F, beside Server Room (the '90' area)"
    faces: "exterior; attackers hop 90 to enter 2F; defenders close walls against them"
  - name: "Printer window"
    room: "Printer Hallway (1F)"
    faces: "exterior; attacker entry"
  - name: "Radio window"
    room: "Radio Room"
    faces: "exterior; rappel entry"
  - name: "Lounge windows"
    room: "Lounge"
    faces: "exterior; Castle-panelled in Lounge holds; one Lounge wall is on the rappel-window side"
  - name: "Diving windows (Scuba window)"
    room: "Diving Room"
    faces: "exterior; Frost mats them"
  - name: "Trench Door"
    room: "Basement, by Pipes"
    faces: "basement entry; Pipes wall faces it"
  - name: "Red door"
    room: "2F, by Server Room"
    faces: "interior; contest-hole wall faces it"
  - name: "Old Bridge barricade"
    room: "1F, by Security / Maps"
    faces: "bridge between buildings"
sources:
  - "https://siegestrats.com/maps/kanal/callouts"
  - "https://siegestrats.com/strats/kanal-sealed-pipes-both-hatches-valkyrie-over-coast"
