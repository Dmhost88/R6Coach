  - "https://siegestrats.com/strats/kanal-take-1f-burn-both-hatches-split-trench-and-yellow"
  - "https://siegestrats.com/strats/kanal-take-the-top-drop-the-hatches-plant-off-the"
  - "https://siegestrats.com/strats/kanal-main-wall-lock-and-skybridge-hold"
  - "https://siegestrats.com/strats/kanal-hold-the-top-until-1-30-then-play-model"
  - "https://siegestrats.com/strats/kanal-burn-the-main-wall-hop-90-take-one-stairwell"
  - "https://siegestrats.com/strats/kanal-radio-take-from-below-open-the-back-wall-chassis"
  - "https://www.r6prep.com/defender/site-setups/kanal"
  - "https://rainbowsix.fandom.com/wiki/Kanal (MediaWiki API; objective list and rework summary)"
uncertain:
  - "Bomb sites: 2F Server Room / 2F Radar Room, 1F Security Room / 1F Map Room, 1F Coast Guard Meeting Room / 1F Lounge, B Supply Room / B Kayaks. Spelling conflict: wiki and some siegestrats pages say 'Maps Room', siegestrats callouts and r6prep say 'Map Room'."
  - "Hatches named without both rooms: 'Killbox site hatch (2F)' and 'Kitchen hatch (2F)' (both over the 1F Security / Map Room side; attackers drop the Kitchen hatch and plant in the Maps corner by the Kitchen door; 2F rooms they sit in are not named). The wiki counts 5 hatches, which matches Coast Guard, Lounge, Radar, Killbox and Kitchen."
  - "Walls named without both rooms: 'Main wall' / 'Outside Server wall' (2F, double-reinforced; attackers burn it 'into Killbox'), 'Walls facing the 90 windows', 'Contest-hole wall facing Red door', 'Wall opposite site rotate' (2F), 'Killbox outside wall' panels 1-2 (2F above Security), 'Maps projector-corner single wall', 'Triple-wall panel', 'Wall to Green' panels 1-2, 'Security vestibule to corridor wall', 'Kitchen wall corner rotate' (1F), 'Lounge wall (rappel-window side)', 'Lounge back wall' and its rotate, 'Radio Room wall' panels 1-2 and the 'back wall' attackers open from Radio (which site room is behind it is not stated), 'Single wall to stairs', 'Wall beside bottom Printer stairs rotation' (1F), 'Pipes wall facing Trench', 'Left shelf wall', 'Right half facing Main stairs', 'soft wall to Yellow stairs' (B), '1F Radio hallway wall'."
  - "Exact in-game spellings not confirmed for: 'Diving Room' (guides: Scuba), 'Lockers', 'Showers', 'Printer Hallway', 'Radio Hallway', 'Control Room' (guides: Control), 'Skybridge', 'Printer Stairs', 'White Stairs'. Main / Green / Red / Yellow stairs are colour-coded in-game per the wiki's rework note."
  - "Slang spots used by guides (not in-game callouts): Killbox, 90 / 90 Hall, Model, Museum, Pipes, Trench, Chassis, Scuba, Top/Bottom Red, Top/Bottom Green."
  - "Liquipedia not used (rate-limited and asked not to proceed)."
