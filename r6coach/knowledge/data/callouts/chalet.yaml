# Callouts for Chalet. Grounds exact location names for the coach.
# Built 2026-11-06 (Y11S3). Walls/hatches are listed only when a source names them;
# where a source names the wall/hatch but not both rooms, it is under `uncertain` instead.
map: chalet
version_note: "Layout of the Y5S3 (Operation Shadow Legacy, 2020) rework. Wall/hatch names checked against Y11S3 guides (siegestrats, r6prep 'verified for Y11S3'). Most siegestrats Chalet strats flag their own room names as approximate, so wall/hatch confidence is lower than on Oregon."
rooms:
  B:
    - "Wine Cellar"
    - "Wine Stock"
    - "Snowmobile Garage"
  1F:
    - "Bar"
    - "Bar Stock"
    - "Gaming Room"
    - "Gaming Room Hallway"
    - "Dining Room"
    - "Kitchen"
    - "Fireplace"
  2F:
    - "Master Bedroom"
    - "Master Bathroom"
    - "Office"
    - "Library"
    - "Library Stairs"
    - "Piano Room"
    - "Solarium"
    - "Mezzanine"
    - "Bedroom Hallway"
  EXT:
    - "Campfire"
    - "Cliffside"
    - "Lakeside"
    - "Front Yard"
    - "Backyard"
walls:
  - between: ["Dining Room", "Fireplace"]
    floor: 1F
    notes: "Two panels ('Dining -> Fireplace, first/second panel'). Bandit tricks both in a siegestrats Kitchen/Dining strat; guides also reinforce a 'third wall in the row' next to them."
  - between: ["Bar", "Fireplace"]
    floor: 1F
    notes: "'Bar -> Fireplace side, two panels', reinforced in a Bar/Gaming hold (siegestrats; panel choice is the strat author's reading of the reworked site)."
  - between: ["Office", "Library"]
    floor: 2F
    notes: "'Office -> Library, first panel'; Kaid claws it and Noor lances through it in a Master/Office strat. Guides call the Office side a half-wall position."
  - between: ["Wine Cellar", "Snowmobile Garage"]
    floor: B
    notes: "'Wine -> Snowmobile, two panels' with a Mira window (siegestrats). r6prep: 'Both Snowmobile walls ... are reinforced' for the basement site."
  - between: ["Snowmobile Garage", "exterior"]
    floor: B
    notes: "'Snowmobile exterior wall, both panels'; Bandit trick spot for the basement site. Ubisoft's rework notes added a window above the Snowmobile Garage door."
  - between: ["Gaming Room", "exterior"]
    floor: 1F
    notes: "'Gaming exterior walls, two panels', reinforced in Bar/Gaming holds; r6prep also reinforces the left Bar Stock wall against the Games window."
hatches:
  - in: "Bar"
    above: "Snowmobile Garage"
    notes: "The 'Bar hatch'. Two siegestrats strats reinforce it ('Bar hatch -> Snowmobile Garage'); one says the hatch is from general map knowledge of reworked Chalet, so the room below is lower confidence."
stairs:
  - name: "Main Stairs"
    connects: ["B", "1F", "2F (exact floors not verified)"]
  - name: "Library Stairs"
    connects: ["1F", "2F Library"]
  - name: "Basement stairs"
    connects: ["B", "1F (exact rooms not verified)"]
windows_and_doors:
  - name: "Big Window"
    room: "2F (Master Bedroom / Office side, not verified)"
    faces: "exterior; attackers swing it on Master/Office; Smoke gasses it on a Solarium hit"
  - name: "Bathroom window"
    room: "Master Bathroom"
    faces: "exterior; r6prep reinforces two Closet walls to protect against it"
  - name: "Games window"
    room: "Gaming Room"
    faces: "exterior"
  - name: "Garage door"
    room: "Snowmobile Garage"
    faces: "exterior; a window above it is a defender pick spot"
  - name: "Office door"
    room: "Office"
    faces: "interior; Kanine attackers play near it"
