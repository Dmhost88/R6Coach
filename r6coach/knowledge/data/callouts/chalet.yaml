uncertain:
  - "Hatches named without both rooms: 'Gaming Room ceiling hatch' (2F room above Gaming not named), 'Kitchen hatch' (siegestrats: 'Kitchen hatch, or soft; never open'; unclear if it is in Kitchen or above it), 'Library hatch' (kept open in a Master/Office strat; room below not named), 'Dining' and 'Connector' hatches (r6prep reinforces them for the basement site; rooms below not named). The wiki says the map has 6 hatches."
  - "Walls named without both rooms: 'Solarium wall' and 'Mezzanine wall' (r6prep, Master/Office), 'Office wall on the Ivy side' (Ivy is a hallway nickname), two 'Closet walls', 'Trophy wall' and 'Two Dining walls' (Kitchen/Dining), 'left Stock wall' (Bar/Gaming), 'Wine -> Main Stairs/Blue' (B), 'Kitchen stairs wall', 'West Main wall', 'Heaven walls', 'Library single wall', 'Library wall facing rappel windows', '1F wall under Master', 'breach wall' and a reinforced 'Stock wall' at the bottom of the Main stairs (basement site), 'Boiler' (r6prep)."
  - "Room names not confirmed as in-game text or floor: 'Trophy Room' (guides say Trophy; floor not verified), 'Mudroom', 'Great Room' (may be another name for Fireplace), 'Basement Corridor', 'Connector', 'Lobby' / 'Main Entrance', 'Master Closet' / 'Closet', 'Kitchen Hallway', '45 Hallway'. 'Gaming Room Hallway', 'Bar Stock' and 'Bedroom Hallway' come from siegestrats plan text, not a verified in-game list."
  - "Slang spots used by guides (not in-game callouts): Kanine, Heaven, Mez, Box, Ivy / Ivy Hallway, Big window, Trophy, Solar, Dark / Dark Corner, Tub, Blue / Blue stairs, West Main, Pickle / Pickle Door, Trench, Short, Half Wall, Vault-up."
  - "Stairs: guides name Main stairs, West Main, Blue stairs, Kitchen stairs, Library Stairs and Basement stairs; which floors and rooms each joins is not verified, so only floor-level connections are given."
  - "Liquipedia was not used (rate-limited / told not to proceed). The Gfinity rework guide returned 403."
