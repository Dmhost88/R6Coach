uncertain:
  - "Site names: '2F Master Office / R6 Room', '1F Bunks / Briefing', '1F Armory / Weapon Maintenance', 'B Lab / Lab Support'. One callout map used by a creator calls Briefing 'Meeting'."
  - "Exact in-game spellings not confirmed for: 'Mask Room' (guides say Masks), 'Operations' (one plan says 'Operational'), 'Server' (vs Server Room / Servers), 'Display', 'Missile' (vs Missile Room), 'Electrical' (guides say Ebox), 'Bridge' (guides also say Skybridge), 'Connector', 'Lab Exit' (slang 'Loaf'), 'Security Terrace', 'Medical'. Floor of Filtration is between B and 1F."
  - "Hatches named without both rooms: 'Reception hatch' (reinforced in Lab holds), '1F Armory hatch' and '1F Lobby hatch' (reinforced in Lab holds; room below not stated). r6prep says Missile (B) and Armory above it 'can't be attacked through the floor', which conflicts with a reinforced '1F Armory hatch'."
  - "Walls named without both rooms: 'Missile wall' (B, kept shut), 'Lockers wall', 'Purple wall: Lockers-door panel', 'Lab Exit wall', 'B Gen/Boiler-Connector wall' (Gen/Boiler is slang), 'B Garage door wall', 'B Missile east wall' (B); '1F Armory wall 1-3' (Armory reinforced on three sides), 'Range Exit wall', 'Medical wall', 'Wall at bottom Blue stairs', 'Back wall -> Filtration-stairs hall', 'Briefing wall at bottom Yellow', 'Briefing north wall', 'Green-pillar walls', 'Bunks-CC Balcony wall', 'Security Terrace outside wall' (1F); 'inner / outer Mask walls', 'Masks north / south wall', 'Operations wall, left panel', 'Server wall, Operations side', 'Server west wall', 'Master east wall', 'Bridge-side walls by Storage', 'R6 Hall wall by Storage door', 'Mezzanine wall by Rocket stairs' (2F)."
  - "Slang spots used by guides (not in-game callouts): Gen/Boiler, Purple, Barrels, Toxin, Loaf (B); Green pillar, CC Balcony, Stone hall, Blue Hall, Med (1F); Cork (R6 Room corner), Masks, Skybridge, gun / boards / tetris verts (2F)."
  - "Several siegestrats Lair plans are read from slide drawings ('Room placement is approximate'), and their walls are named by what they face."
