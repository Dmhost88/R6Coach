# Callouts for Lair. Grounds exact location names for the coach.
# Built 2026-11-06 (Y11S3). Walls/hatches are listed only when a source names them;
# where a source names the wall/hatch but not both rooms, it is under `uncertain` instead.
map: lair
version_note: "Launch layout (Operation Deep Freeze, Dec 2023; official blueprints dated 2023-12-06). Y10S3 (Sept 2025) modernisation reported by guides as visual plus destructible props, not a layout change. No later Lair layout change found in Y11 patch notes. Wall/hatch names checked against Y11S3 guides."
rooms:
  B:
    - "Lab"
    - "Lab Support"
    - "Lockers"
    - "Missile"
    - "Warehouse"
    - "Electrical"
    - "Stock"
    - "Garage"
    - "Connector"
    - "Lab Exit"
  1F:
    - "Bunks"
    - "Briefing"
    - "Armory"
    - "Weapon Maintenance"
    - "Armory Hall"
    - "Security"
    - "Security Terrace"
    - "Lobby"
    - "Medical"
    - "Range"
  2F:
    - "Master Office"
    - "R6 Room"
    - "Mask Room"
    - "Operations"
    - "Server"
    - "Display"
    - "Storage"
    - "Bathroom"
    - "Mezzanine"
    - "Bridge"
walls:
  - between: ["Lab", "Lockers"]
    floor: B
    notes: "'Lab/Lockers site wall' / 'B Lab-Lockers wall'; reinforced in Lab / Lab Support holds."
  - between: ["Electrical", "Lockers"]
    floor: B
    notes: "'B Electrical-Lockers wall' (guides also say Ebox); reinforced in Lab holds."
  - between: ["Bunks", "Briefing"]
    floor: 1F
    notes: "Wall between the two 1F site rooms: kept open as a high crouch rotate with head holes ('Briefing-Bunks rotate', 'three head holes in the Briefing-Bunks wall')."
  - between: ["Armory", "Weapon Maintenance"]
    floor: 1F
    notes: "The 'Armory/Weapon Maintenance triple wall': middle panel reinforced, head holes in the left panel (guides call it the 'Triple wall (Armory rotate)')."
  - between: ["Operations", "Mask Room"]
    floor: 2F
    notes: "'Operations-Masks wall'; reinforced with a Mira window in Master Office / R6 Room holds."
  - between: ["Operations", "Mezzanine"]
    floor: 2F
    notes: "'Operations-Mezzanine wall'; reinforced in Master Office holds."
  - between: ["Server", "Display"]
    floor: 2F
    notes: "'Server-Display wall'; reinforced (often with a Mira window); a 'Display-Server rotate' is also used."
  - between: ["Server", "Master Office"]
    floor: 2F
    notes: "r6prep: head holes from Servers into Master Office stop the plant there from cover."
  - between: ["Server", "Mezzanine"]
    floor: 2F
    notes: "'Mezzanine-Server rotates' kept open in Master Office holds."
  - between: ["Storage", "R6 Room"]
    floor: 2F
    notes: "'Storage-R6 wall' / 'R6 Room -> Storage': reinforced (right panel); Storage rotates and floor holes are kept for vertical play on Bunks."
  - between: ["Bathroom", "Main Stairs"]
    floor: 2F
    notes: "'Bathroom -> Main Stairs wall' 1 and 2 (probably the same as the 'Bathroom west wall'); r6prep: both Bathroom walls reinforced so a trap player can seal it."
hatches:
  - in: "Operations"
    above: "Armory / Weapon Maintenance site (which of the two rooms is not stated)"
    notes: "'Operations hatch into site'; guides describe 'Operations above, a hatch drop and a corner plant' and reinforce it in Armory / Weapon Maintenance holds."
  - in: "R6 Room"
    above: "Bunks / Briefing site (which of the two rooms is not stated)"
    notes: "'R6 Room site hatch', kept open in Bunks holds so a Warden can shoot plants from the R6 Room."
stairs:
  - name: "Main Stairs (guides also say Rocket Stairs)"
    connects: ["1F", "2F (toward Operations and the Bathroom side)"]
  - name: "Yellow Stairs"
    connects: ["B Warehouse", "1F (top of Yellow is a 1F defender spot)"]
  - name: "Filtration Stairs (Filter stairs)"
    connects: ["B Stock side", "1F Armory"]
  - name: "Green Stairs"
    connects: ["1F hall", "2F Green Stairs corridor"]
  - name: "Blue Stairs"
    connects: ["B", "1F (floors not verified)"]
windows_and_doors:
  - name: "Lockers door"
    room: "Lockers"
    faces: "interior; watched from Security above through floor holes"
  - name: "Security door"
    room: "Security"
    faces: "interior, near the Bunks / Briefing breach"
  - name: "Range door (Armory Range door)"
    room: "Range"
    faces: "interior, toward Armory"
  - name: "Storage door"
    room: "Storage"
    faces: "R6 hallway"
  - name: "Master Office double door"
    room: "Master Office"
    faces: "interior"
  - name: "Bathroom / Display windows"
    room: "Bathroom / Display"
    faces: "exterior; trapped in Master Office holds"
  - name: "Green window"
    room: "1F (near Green Stairs, room not verified)"
    faces: "exterior"
