  - "https://rainbowsix.fandom.com/wiki/Lair (via API; stub, room names in trivia only)"
  - "https://siege.gg/news/ubisoft-to-modernize-consulate-lair-and-nighthaven-labs-with-rainbow-six-siege-year-10-season-3"
