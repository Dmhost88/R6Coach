  - "https://siegestrats.com/strats/lair-rio-all-five-upstairs-three-verts-over-bunks"
  - "https://siegestrats.com/strats/lair-lisbon-jager-guards-briefing-four-play-bunks-from"
  - "https://siegestrats.com/strats/lair-three-below-two-above-operations-over-the-plants"
  - "https://siegestrats.com/strats/lair-nobunaga-echo-in-the-lab-warden-in-missile"
  - "https://siegestrats.com/strats/lair-not-guilty-bandit-shocks-masks-aruni-gates-can"
  - "https://siegestrats.com/strats/lair-time-torch-volcans-and-fenrir-mines-burn-time-at"
