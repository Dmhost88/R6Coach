    - "CCTV"
    - "Vault Checkpoint"
    - "Vault"
    - "Servers"
    - "Manager's Office"
    - "Lockers"
    - "Cash Counting"
  1F:
    - "Bar"
    - "Betting"
    - "Blackjack"
    - "Poker"
    - "Roulette"
    - "Bathroom"
    - "Secret"
