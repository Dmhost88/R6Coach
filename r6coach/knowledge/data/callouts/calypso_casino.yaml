uncertain:
  - "Site names agree across siegestrats, r6prep and stratbook: '2F Cigar Room / Pool', '1F Blackjack / Poker', '1F Bar / Betting', 'B CCTV / Vault Checkpoint'. Ubisoft's own material names only the rooftop Crane, the vertical drone vents, the basement Vault and the basement spawn."
  - "Non-site room names come from guide creators, not verified in-game text: Vault, Servers ('Server'), Manager's Office, Lockers, Cash Counting ('Cash'), Roulette, Bathroom, Secret, Janitor, Wine Stock ('Bar Stock'), Lobby, Barista, Kitchen, Aqua, Humidor ('Shop'). Floors were inferred from which site setup names them; Lobby is named from both 1F (Lobby door) and 2F (Pool -> Lobby wall), so it may be a two-storey atrium."
  - "Other guide names with no floor stated: Tequila, Vending, ATMs, Weapon Cache, Break Room (bottom Green Stairs), Garden Ruins, Lockers, North / South Mezzanine, Yellow Hall, Registration hallway, Green Stairs, Aqua 90, Yellow 90."
  - "Hatches named without both rooms: 'Bar hatch on 2F' (above Bar; 2F room not named), 'Weapon Cache hatch' (drop into the basement site; room below not named), r6prep 'both hatches' on CCTV / Vault Checkpoint, and a 'Bar-floor vert over Cash' (floor hole, not a hatch)."
  - "Walls named without both rooms: 'Vault exterior wall' (r6prep: 'the two Vault walls matter most'), 'Manager's Office wall: both halves', 'key Locker wall', 'Lockers stairs -> Janitor double wall', 'Yellow 90 soft wall', 'Server' rotation and head holes, 'wall beside site desk' (B); 'Blackjack exterior breach' / 'two outside walls', 'Bathroom north double wall', 'Roulette double soft wall', 'Wine Stock -> Green wall', 'wall toward the Green stairs', 'Registration hallway wall', 'wall -> bottom Green stairs' (1F); 'Kitchen outside wall' (2F, two panels), 'Upstairs Kitchen walls', 'Aqua rotate'."
  - "Slang spots used by guides (not in-game callouts): Green, Yellow 90, Aqua 90, Pool bar, Cigar desk, Bar pillar, Heaven, Mezza, 2F Bridge."
