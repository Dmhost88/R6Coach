# Callouts for Calypso Casino. Grounds exact location names for the coach.
# Built 2026-11-06 (Y11S3). Walls/hatches are listed only when a source names them;
# where a source names the wall/hatch but not both rooms, it is under `uncertain` instead.
map: calypso_casino
version_note: "New map, launched with Operation System Override (Y11S2, 2 June 2026); official blueprints dated 2026-05-19. No layout change found in Y11S2.x or Y11S3 patch notes. Ubisoft publishes no room labels; names come from Y11S3 guides (siegestrats, r6prep, stratbook) checked to agree on the four sites."
