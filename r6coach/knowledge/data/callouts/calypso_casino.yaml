walls:
  - between: ["Blackjack", "Poker"]
    floor: 1F
    notes: "Wall between the two 1F site rooms: r6prep keeps high holes here for a C4 on the deep plant."
  - between: ["Blackjack", "Secret"]
    floor: 1F
    notes: "'Blackjack/Secret wall: one half' reinforced; r6prep puts a rotation into Secret so attackers can't take it for free."
  - between: ["Blackjack", "Bathroom"]
    floor: 1F
    notes: "'Bathroom -> Blackjack wall', panels 1 and 2, reinforced in Bar / Betting holds; also a Mira spot."
  - between: ["Roulette", "Bathroom"]
    floor: 1F
    notes: "'Roulette/Bathroom wall: right side' reinforced in Blackjack / Poker holds."
  - between: ["Bar", "Janitor"]
    floor: 1F
    notes: "'Bar/Janitor wall', left and right panels (r6prep: 'two walls toward Janitor'); the main breach into the Bar / Betting site. Thermite threat: nobody stands against it."
  - between: ["Bar", "Betting"]
    floor: 1F
    notes: "Kept open as the 'Bar/Betting counter rotate' (the rotate between counters)."
  - between: ["Betting", "Roulette"]
    floor: 1F
    notes: "'Betting -> Roulette rotate, head holes'; defenders extend into Roulette."
  - between: ["Wine Stock", "Janitor"]
    floor: 1F
    notes: "'Wine Stock -> Janitor wall, right half' reinforced, with a Janitor-side Wine Stock rotate as a pocket."
  - between: ["Cigar Room", "Pool"]
    floor: 2F
    notes: "'Cigar/Pool wall, one half' reinforced; 'Cigar/Pool rotate and high holes' kept open (r6prep: rotation plus high holes between the rooms)."
  - between: ["Barista", "Pool"]
    floor: 2F
    notes: "'Barista/Pool wall, Pool bar half' reinforced; the small Barista/Pool rotate stays open."
  - between: ["Pool", "Lobby"]
    floor: 2F
    notes: "'Pool -> Lobby wall', panels 1 and 2 (r6prep: 'double Lobby walls'), reinforced; also a Mira spot. Sources disagree on holing it."
  - between: ["Kitchen", "Cigar Room"]
    floor: 2F
    notes: "'Kitchen/Cigar low holes' kept open; the Kitchen outside wall is the reinforced breach."
  - between: ["Aqua", "Cigar Room"]
    floor: 2F
    notes: "r6prep: 'On the Aqua side, the right wall is reinforced with a rotation on the left and headholes into Cigar'."
  - between: ["Vault Checkpoint", "Yellow Stairs"]
    floor: B
    notes: "'Vault Checkpoint/Yellow stairs wall: left half' reinforced; r6prep adds a rotation onto the Yellow stairs to waste time there."
hatches:
  - in: "Humidor"
    above: "Blackjack"
    notes: "The 'Humidor hatch' (one creator calls the room 'Shop'). Defenders vert Blackjack from Humidor; guides disagree on reinforcing it vs holding it open from above. Also reinforced in Cigar Room / Pool holds."
