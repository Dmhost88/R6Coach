uncertain:
  - "Bomb sites: 3F Cocktail Lounge / 3F Bar, 2F Mining Room / 2F Fireplace Hall, 2F Reading Room / 2F Fireplace Hall, 1F Kitchen Service / 1F Kitchen Cooking (wiki and r6prep agree; siegestrats calls the Mining site 'Fireplace Hall / Mining Room')."
  - "Hatches named without both rooms: 'Freezer hatch' / 'Freezer ceiling hatch' (2F room above 1F Freezer not named; 'Freezer to New Hatch corridor'), 'Piano floor hatch' (3F, over the 2F Mining / Fireplace area; room below not stated), '3F Cocktail hatch' (likely above Reading Room since 'Cocktail sits over the Reading door'; not stated), 'roof hatches' / 'two roof hatches' (into 3F, rooms not stated), 'Bakery roof hatches', 'Red Hatch', 'Laundry Hatch', 'New Hatch'. Wiki says the map has 6 hatches."
  - "Walls named without both rooms: 'Dark walls 1/2' (1F, reached from Coat Check), 'Outer Garage wall' / 'double Garage walls', 'Red Hall walls', 'inside Freezer walls', 'Service-wall head holes', 'Mining back walls', 'Mining north wall', 'Big window wall', 'White double wall (both panels)', '2F Fireplace east wall upper/lower', '2F Fireplace north wall', '2F Reading north wall', '2F Red stairs wall', 'Storage west/east wall', 'Bathroom west wall', 'Cocktail wall by the hatches', 'Cocktail Trash-side wall', 'both top Red walls' (probably Piano / Red Stairs), r6prep's 'C1 wall', 'Stacks walls', 'Ticket walls', '2F hallway wall toward Cave', 'Bakery wall'."
  - "Exact in-game spellings not confirmed for: 'Prep Room', 'Freezer' (1F), 'Coat Check', 'Reception', 'Whiskey Bar', 'Laundry Room', 'Dining Room', 'Bar Storage', 'Bathroom' (3F), 'Garage'. Confirmed by wiki objective list: Kitchen Cooking, Kitchen Service, Mining Room, Train Museum, Fireplace Hall, Reading Room, Cocktail Lounge, Bar, Bar Freezer, Cigar Lounge."
  - "Slang spots used by guides (not in-game callouts): Small Bake, VIP, Pillar, Piano, Top/Bottom Red, Top/Bottom White, Red Hall, Cave, Stacks, Ticket, C1, C3, Cryo, Pixel, Trash, Gold Double, Cocktail Entrance, Cigar Shop, Heaven, Snow window, AC window."
  - "Liquipedia not used (rate-limited and asked not to proceed)."
