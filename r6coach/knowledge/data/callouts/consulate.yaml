uncertain:
  - "Bomb-site naming conflict: siegestrats lists sites 2F Meeting Room / Consul Office, 1F Piano Room / Exposition Room, B Cafeteria / Garage and 'Tellers / B Servers'; one of its pages also writes 'B Archives / 1F Tellers' (the pre-2023 name). r6prep lists 2F Consul Office / 2F Meeting Room, 1F Exposition Room / 1F Piano Room, B Cafeteria / B Garage. Whether the fourth site's basement room is in-game 'Servers' or 'Archives' is not confirmed."
  - "Hatches named without both rooms: 'Piano hatch' (attackers drop it from 2F into 1F Piano Room; 2F room above not named), 'Computer hatch' and 'hatch above Lockers' (r6prep, Garage / Cafeteria), '1F hatch to basement' / 'site hatch' / '1F hatches 1-3' (over Garage / Cafeteria), 'Hatch under Coffin' (2F into 1F, room below not named), 'Break/Visa hatches', 'other two Visa/Tellers hatches'. The wiki's 9-hatch list (e.g. Meeting Room > Lobby, Public Bathroom > Garage) is from the original pre-2023 map."
  - "Walls named without both rooms: 'Garage outer walls 1/2' / 'Garage breach wall' (exterior to Garage), 'Cafeteria east/west/south walls', 'Wall north of Cafeteria', 'Security wall, left half', '1F top Electrical wall', '1F Yellow-side walls' (over Garage site), 'Wall behind Pillar', 'Backside wall', 'Secret wall' / 'Secret single wall' (2F, used to impact onto the Break rappel), 'Brick wall', 'Catering wall', 'Meeting balcony wall', 'Meeting north/east/interior/outside breach walls', 'CO east wall', 'CO wall by window corner', 'Break Room west wall', 'Hallway to Break Room wall', 'Projector wall', 'Whiteboard wall', 'Bathroom wall', 'Expo north walls', 'Expo left wall to Benches window', 'Benches hallway wall', 'Right closet wall outside Piano', '1F Lobby walls 1/2', 'Top of Server stairs wall', r6prep's 'CEO walls' and 'left Bathroom wall' and 'wall into the Locker hallway'."
  - "Exact in-game spellings not confirmed for: 'Exposition Room' (guides say Expo), 'Electrical Room' (guides say Electrical), 'Security Room', 'Storage', 'Kitchen', 'Construction', 'Locker Hallway', 'Servers', 'Spiral Stairs', 'Yellow Stairs', 'Server Stairs', 'Visa Stairs', 'Bathroom', 'Balcony'. Confirmed by Ubisoft patch text: 2F Manager's Office, 2F Administration Office, 2F Break Room."
  - "Slang spots used by guides (not in-game callouts): Connector, Coffin, Secret, Top Yellow, Top Visa hall, Files, Oreo, Vending, Long Desk, Benches, Pillar, Catering, CO (Consul Office), Expo, Admin."
  - "Liquipedia not used (rate-limited and asked not to proceed)."
