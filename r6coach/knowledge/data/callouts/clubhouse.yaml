uncertain:
  - "2026 update: the blueprint zip was re-uploaded 2026-07-08 but no Ubisoft patch note, season page or guide found describes a 2026 Clubhouse layout change (Y11S2 season page, Y11S2.2, Y11S3 launch, Y11S3 addendum and mid-season notes checked). Y11S3 guides say 'no structural changes in Y11S3'. siegestrats marks one Gym strat '(Old Layout)' without saying what changed. Treat the layout as Siege X (June 2025) until confirmed."
  - "Site names: siegestrats lists '1F Bar / Stock Room' and notes 'Ubisoft labels it both Bar/Stock Room and Bar/Stage'; the wiki says 'Bar and Stage'. Other sites: '2F Gym / Bedroom', '2F CCTV Room / Cash Room', 'B Church / Arsenal Room'."
  - "Exact in-game spellings not confirmed for: 'Memorial' (may be 'Memorial Room'), 'Construction' (may be 'Construction Room'), 'Server Room' (guides say Server), 'Garage (Rafters)' (guides say Rafters / Garage Rafters / Catwalk), 'Central Stairs' vs 'Main Stairs', 'Oil Pit', 'Escape Tunnel', 'Lounge'. EXT spawns (Main Gate, Shipping Dock, Warehouse, Construction Site) are from the wiki."
  - "Hatches named without both rooms: 'Bar hatch', 'Stock Room hatch' and 'Moto hatch' (all denied in Church / Arsenal holds, so they drop into the basement; room below not stated); 2F hatches over Bar / Stage: 'Gym-side hatch' and '2F hatch away from Gym' (guides disagree on opening the Gym one). An older siege.gg rework article says the Gym hatch and the Server Room roof hatch were removed, which conflicts with current guides naming a 'Gym-side hatch' and 'two Server roof panels'. Wiki says 7 hatches in total."
  - "Walls named without both rooms: 'Escape Tunnel entrance, both panels' (B), 'Arsenal hallway, panel nearest Central Stairs' (B), 'Church panel behind Blue generator' and 'the Blue wall', 'two Dirt walls', 'middle wall' (B), 'CCTV exterior wall' / 'main wall' (2F; one guide says it faces Garage), 'Trash wall -> Construction Connector' (2F), 'Jacuzzi wall(s)' (2F exterior near Gym / Bedroom), 'Bathroom wall' (2F, reinforced in Gym holds), 'Con wall' / 'Con rotate' and 'Logistics single wall' (2F), 'Rafters wall' (2F), 'middle wall under Red' (2F), 'Stock wall' (1F, opened from outside), 'both Stage walls', 'both Kitchen-hallway walls', 'both outer Strip Club walls', 'Strip -> site rotate' (1F). A low-quality guide claims a Kitchen soft wall into Bar."
  - "Slang spots used by guides (not in-game callouts): Blue, Dirt / Dirt Tunnel, Moto / Bike, Box 3, Pillar (B); Plat, Tub, Highway, Chain, Cage hallway (1F/mixed); Master (= Bedroom), Logi (= Logistic Office), Con (= Construction), Gold, Red / top Red, Trash, Rafters, Catwalk, Jacuzzi (2F)."
  - "Doktor's Curse 2026 (Oct 14 - Nov 2) used a modified Clubhouse ('Doktor's Lab') with different sites; that event layout is not described here."
  - "Liquipedia was not used (rate-limited / bot check), so its Clubhouse balance-change log was not cross-checked."
