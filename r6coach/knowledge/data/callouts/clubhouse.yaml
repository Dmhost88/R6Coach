# Callouts for Clubhouse. Grounds exact location names for the coach.
# Built 2026-11-06 (Y11S3). Walls/hatches are listed only when a source names them;
# where a source names the wall/hatch but not both rooms, it is under `uncertain` instead.
map: clubhouse
version_note: "Layout of the 2018 (Para Bellum) interior rework plus the Crystal Guard minor rework; Ubisoft lists 'Map reworked: Siege X - June 2025' (guides describe it as visual/destructible modernisation). The official blueprint zip was re-uploaded 2026-07-08, but no Y11S2/Y11S3 patch note found mentions a Clubhouse layout change, and Y11S3 guides report no structural change. Names checked against Y11S3 guides."
rooms:
  B:
    - "Church"
    - "Arsenal Room"
    - "Memorial"
    - "Escape Tunnel"
    - "Oil Pit"
    - "Central Stairs"
  1F:
    - "Bar"
    - "Stock Room"
    - "Stage"
    - "Strip Club"
    - "Kitchen"
    - "Lounge"
    - "Garage"
    - "Central Stairs"
  2F:
    - "Gym"
    - "Bedroom"
    - "Bathroom"
    - "Logistic Office"
    - "CCTV Room"
    - "Cash Room"
    - "Server Room"
    - "Construction"
    - "Garage (Rafters)"
  EXT:
    - "Construction Site"
    - "Main Gate"
    - "Shipping Dock"
    - "Warehouse"
walls:
  - between: ["Church", "Memorial"]
    floor: B
    notes: "'Church -> Memorial wall, all 3' panels; the Memorial-side Church wall is the default hard-breach target for the Church / Arsenal site. r6prep: all three Church walls reinforced."
  - between: ["CCTV Room", "Cash Room"]
    floor: 2F
    notes: "The 'Cash-CCTV wall' between the two 2F sites; a Mira window spot in CCTV holds."
  - between: ["Cash Room", "Construction"]
    floor: 2F
    notes: "'Cash -> Construction Connector, both panels' (Breaching Siege 2020 default); guides call it the soft wall from Cash into Construction. 'Construction Connector' is the passage between them."
  - between: ["Server Room", "Garage (Rafters)"]
    floor: 2F
    notes: "'Server panel facing Garage Rafters' / 'Server-rafters panel'; reinforced in the CCTV / Cash default."
  - between: ["Gym", "Bedroom"]
    floor: 2F
    notes: "The Bedroom-Gym wall: feet holes along it and a vault rotate mid-wall in Gym / Bedroom holds."
hatches:
  - in: "Roof"
    above: "Logistic Office"
    notes: "The 'Logistics hatch'. Ubisoft's Y10S4 addendum calls it the '2F Logistic Office hatch' (rooftop access). Attackers drop it with Grim/Kawan pressure on Gym / Bedroom."
  - in: "Kitchen"
    above: "Church / Arsenal Room site (which room is below is contested)"
    notes: "The 'Kitchen hatch'. Main vertical threat on the basement site; denied (reinforced) in standard Church holds. One siegestrats strat says Hibana 'shoot[s] down into Arsenal' through it, another guide says it is above Church."
stairs:
  - name: "Central Stairs (guides also say Main Stairs)"
    connects: ["B", "1F", "2F (not verified for the 2F flight)"]
  - name: "Garage Stairs"
    connects: ["1F Garage", "2F (CCTV / Cash side)"]
  - name: "Eastern Stairs"
    connects: ["1F", "2F CCTV Room side (floors not verified)"]
  - name: "Blue Stairs"
    connects: ["B (Blue, slang)", "1F"]
windows_and_doors:
  - name: "CCTV window"
    room: "CCTV Room"
    faces: "Garage Rafters; attackers who take Rafters can jump it"
  - name: "Gym windows"
    room: "Gym"
    faces: "exterior (south); opened by Hibana / Sledge on Gym attacks"
  - name: "Master window"
    room: "Bedroom ('Master' is slang for Bedroom)"
    faces: "exterior"
  - name: "Strip window"
    room: "Strip Club"
    faces: "exterior; Castle / Smoke gas on Bar holds"
  - name: "Construction window"
    room: "Construction (2F)"
    faces: "down onto the Bar area (vertical play on 1F Bar)"
  - name: "Bar door and window"
    room: "Bar"
    faces: "exterior"
  - name: "Lounge double door"
    room: "Lounge"
    faces: "interior, toward Bar / Stock"
  - name: "Kitchen door"
    room: "Kitchen"
    faces: "interior, held in Bar / Stock Room holds"
  - name: "Stock door"
    room: "Stock Room"
    faces: "interior"
  - name: "Garage door (four panels)"
    room: "Garage"
    faces: "reinforced in the CCTV / Cash default"
