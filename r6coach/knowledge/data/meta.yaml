notes:
  - "Ranked pool is the 15-map list from Ubisoft's Y11S3.2 article: 9 Pro League maps plus Oregon, Coastline, Consulate, Kanal, Outback, Casino. Skyscraper and Theme Park left on 2026-10-15."
  - "Y11S4 is expected around early December 2026 and will change the pool; regenerate then."
  - "Site names use the format '<floor> Room A / <floor> Room B'. Room order and punctuation on the defender selection screen were not verified in-game; aliases include the reversed order."
  - "Calypso Casino: attacker spawn names conflict between sources and were left empty. Site names come from third-party guides; Ubisoft does not publish them."
  - "Fortress was reworked in Y10S4. Site names come from siegestrats; spawn names are pre-rework Liquipedia names and may be outdated."
  - "Villa Y11S3: Living Room / Library site moved to basement as Art Storage / Old Office; Garage is now interior."
  - "Consulate, Nighthaven Labs and Lair were modernized in Y10S3; Coastline, Villa and Oregon in Y11S1. Ubisoft describes these as visual and destructibility updates, not layout changes."
  - "Consulate site '1F Tellers / B Servers' is a split-floor pairing taken from Liquipedia; verify on the selection screen."
  - "Per-site tactical advice (walls, hatches, plant spots) is general coach-level guidance written from common knowledge; specific wall callouts were left out where not verified. Casino, Villa and Fortress have more concrete detail from current guides."
  - "Operator speeds follow timesaver.gg (Oct 2026). Some secondary gadget lists may be out of date after Siege X loadout changes."
  - "Thatcher: E.G.S. Disruptor replaced EMP grenades in Y10S4. Dokkaebi: Jegeo Payload replaced Logic Bomb in Y11S2; in Y11S3 it is a maintained signal that Mute and Tubarao can sever."
  - "Solid Snake gadgets come from On-Site Procurement (collects secondaries from downed operators); exact starting item not verified."
