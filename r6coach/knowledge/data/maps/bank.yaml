id: bank
name: Bank
aliases: ["Bank", "BANK"]
floors: [basement, 1F, 2F, roof]
attacker_spawns:
  - name: "Boulevard"
    notes: "Front street. Near-instant defender runouts from Lobby; fast to Main Lobby, Quad windows and the Lobby rappel."
  - name: "Jewelry Front"
    notes: "Side street with the Sewer manhole into Server. Default spawn for basement Server takes and Square/Tellers-side pressure."
  - name: "Back Alley"
    notes: "Rear of the bank by the Garage ramp, Loading Dock and Terrace. Default for Stock and Top Square takes on 2F and 1F."
sites:
  - id: ceo_executive_lounge
    name: "2F CEO Office / 2F Executive Lounge"
    aliases: ["2F Executive Lounge / 2F CEO Office", "CEO", "Executive Lounge", "CEO Office", "Lounge"]
    floor: 2F
    defender:
      reinforce: ["CEO to Skylight Stairwell (Top Square) wall, both panels, clawed by Kaid", "Lounge to CEO wall, with a Mira window", "Lounge to Front Desk, both panels", "Conference south wall to the hallway, Mira optional", "CEO to Janitor walls if Warden anchors CEO"]
      rotates: ["Keep the Janitor Closet floor hatch open with murder holes so Smoke can gas from below", "Lounge to Conference hallway stays open so the Lounge anchor can swing onto the CEO plant", "Skylight Stairwell railing is destructible; do not rely on it as cover"]
      anchor_spots: ["CEO bookshelf corner off the Top Square wall", "Lounge behind the Mira window watching CEO", "Front Desk behind the counter facing Herds", "Conference corner covering the south hallway"]
      roam_areas: ["Stock Room and Terrace (Vigil), then late flank through Skylight", "Janitor and Top Square to fight the Square wall take", "Herds and Lobby stairs to punish the Lobby rappel"]
      key_utility: ["Kaid claw on the Top Square wall and the Janitor hatch", "Jager ADS in Lounge and Front Desk for Thatcher/Capitao throws", "Castle panels on the Banana doors", "Azami Kiba by Lounge and wire on both stairs"]
      recommended_ops: ["Kaid", "Mira", "Smoke", "Jager", "Vigil", "Castle", "Warden", "Azami"]
      plan_summary: "Deny the Top Square wall with Kaid, put Mira windows on Lounge to CEO, and let Smoke play Janitor from below. One roamer in Stock and Terrace bleeds time, then flanks Skylight."
      setups:
        - name: "Skylight wall deny"
          ops: ["Kaid", "Mira", "Smoke", "Jager", "Vigil"]
          how: "Kaid claws Top Square and the Janitor hatch, Mira windows Lounge to CEO and Conference. Smoke holds Janitor through holes; Vigil roams Stock and Terrace, late Skylight flank."
        - name: "Balance"
          ops: ["Warden", "Wamai", "Castle", "Mira", "Azami"]
          how: "Warden anchors CEO with the Janitor and Stock walls up. Castle panels Banana, Wamai nets throw lanes, Mira anchors Lounge, Azami Kibas Lounge and wires stairs."
        - name: "Ocean Man laser wrap"
          ops: ["Denari", "Clash", "Smoke", "Bandit", "Azami"]
          how: "Denari lasers three lines around CEO, Clash holds Main Stairs, Bandit batteries Banana walls and the Janitor door wall, Azami Kibas the Banana windows."
      counters_to_watch: ["Buck shooting up from Stock and Janitor ceilings below: keep a 1F player or play off the floor", "Thatcher/Ace on Top Square: fight the hard breacher from Janitor, not behind the wall", "Ram and Sledge hot-breaching the Quad windows at round start: hold Banana with a shotgun"]
      retake_tips: ["Retake a CEO bookshelf plant from Lounge and Janitor at once, Smoke gas first", "If they plant Top Square side, swing from Conference while a teammate holds Stock", "Save Kaid or Bandit C4-style damage via holes; electrified walls stay up post-plant"]
    attacker:
      recommended_spawns: ["Back Alley", "Boulevard"]
      drone_paths: ["Back Alley into Stock window, then drone Janitor and Top Square", "Boulevard Lobby stairs up to Herds and the Front Desk", "Roof Quad windows into Lounge and CEO for early anchor pings"]
      entry_points: ["Stock Room window and Terrace", "Top Square (Skylight Stairwell)", "CEO and Lounge Quad windows (rappel)", "Lobby stairs into Herds"]
      hard_breach_targets: ["CEO to Top Square wall (Thatcher plus Ace or Thermite)", "E3 elevator wall as a fallback breach", "Lounge to Front Desk wall"]
      plant_spots: ["CEO bookshelf by the far-right Top Square panel", "Default CEO plant behind the desk under smoke"]
      recommended_ops: ["Ace", "Thatcher", "Buck", "Nomad", "Zero", "Thermite", "Ram"]
      utility_priorities: ["Buck opens the Stock and Janitor ceilings from 1F first", "EMP Top Square claws before Ace's charges", "Zero Argus cams on the Main Stairs and Square flanks"]
      plan_summary: "Win Stock and Janitor with Buck from below, EMP and open the Top Square wall, then plant at the bookshelf with flank cams on Main Stairs."
      executes:
        - name: "Stock from below, Top Square wall, bookshelf plant"
          ops: ["Ace", "Thatcher", "Buck", "Zero", "Nomad"]
          how: "Back Alley. Buck clears Stock and Janitor from the floor below, Thatcher EMPs Top Square and Ace opens it, Nomad jabs Stock hallway and rappels CEO window."
        - name: "Quad window hot breach"
          ops: ["Ram", "Sledge", "Lion", "Zofia", "Nomad"]
          how: "Only after a drone shows Herds empty: Ram and Sledge open both CEO Quad windows at start while Zofia pressures Top Square and Lion holds the Janitor rotate."
      key_kills: ["Stock Room shield or Vigil before entering Janitor", "Janitor Closet player and the Top Square anchor (clear from Square with Buck)", "Herds/Front Desk player watching the Lobby stairs", "Conference corner before planting CEO"]
      post_plant: ["Plant CEO bookshelf, then hold from Top Square and the Stock window", "Keep a flank on Main Stairs and Skylight; roamers come back through Square", "Default plant lets one player hold Lounge through the Quad window"]
    common_mistakes: ["Defenders standing behind the Top Square wall when Ace or Thermite blows it", "Attackers pushing Janitor before clearing Stock and the ceilings below", "Ignoring the late Vigil flank through Skylight Stairwell"]
    uncertain: ["Room names Herds, Banana and Quad come from stratbooks; in-game callouts may say Executive Hallway or Front Desk", "siegestrats setups have no reported rounds yet"]
    video_insights:
      - creator: "Garfieldisdoc"
        url: "https://www.youtube.com/watch?v=1qCEYZwQzes&t=30"
        side: attack
        points:
          - "Hibana rappels to the E3 (Elevator 3) wall and opens it to cut rotates between Janitor, Long Desk, Stock and Marble; she should not carry the bomb."
          - "Pair the E3 open with a Lobby push: drone the Lobby stairs, clear wall utility, cam E2, then fight for Front Desk and Beepers."
          - "Send one or two players to Stock and open the Stock window early; it adds phantom pressure on site."
          - "Stock is usually held with feet holes and an anchor behind the trading table: pre-place a drone in 1F Open Area, clear Beepers, then shoot up from below (Buck)."
          - "From 1F, also open a hole into the Janitor doorway and a line onto the Conference rotate to cut swings."
          - "No vertical? Collapse Stock at once from Top Square, the Stock window and bottom Marble or the Skylight drop."
          - "Quad window rappellers shoot out Castle barricades to cut Janitor and Double Door; keep one player at ATMs or on the rappel watching Lobby swings."
          - "From Top Square, open the soft wall and run in, or open the far-right Square wall and plant on the bookshelf; hold it while one player watches the Beepers rotate."
  - id: open_area_staff_room
    name: "1F Open Area / 1F Staff Room"
    aliases: ["1F Staff Room / 1F Open Area", "Open Area", "Staff Room", "Staff"]
    floor: 1F
    defender:
      reinforce: ["2F Stock hatch and 2F Janitor hatch to Admin first (prep is short)", "Square wall panels 1-3, Kaid claw on panel 1", "Staff Room wall facing Electrical", "Printer panel in line with the window and the Open Area/Staff panel beside the rotate", "Open Area wall by the hallway door"]
      rotates: ["Crouch rotate between Open Area and Staff Room", "Feet holes on the Printer walls", "Head holes above the Square wall for C4", "Head hole from Admin into Archives"]
      anchor_spots: ["Staff Room behind the kitchen counter", "Open Area desks watching the Printer window", "Kanzen (Tachanka DP27 plant denial)"]
      roam_areas: ["2F above site to deny Stock and Janitor hatches (Caveira, Smoke, Aruni)", "Archives and Tellers to fight the Stock hatch and the Square", "Lobby with a fallback to Open Area"]
      key_utility: ["Mira windows on the rotate and Printer panels", "Kaid claw on Square wall panel 1", "Castle panels on Banana entries", "Thorn Razorbloom on the Stock window and the plant"]
      recommended_ops: ["Kaid", "Mira", "Castle", "Smoke", "Caveira", "Tachanka", "Tubarao", "Maestro"]
      plan_summary: "Lock both 2F hatches early, claw the Square wall and put Mira windows on the rotate. Hold the floor above with one or two players and fall back to Staff Room and E2."
      setups:
        - name: "Clawed Square wall bunker"
          ops: ["Kaid", "Castle", "Mira", "Smoke", "Caveira"]
          how: "Hatches first, then Square panels 1-3 with Kaid. Mira windows the rotate and Printer, Smoke gasses through the Square head holes, Caveira roams 2F then Archives."
        - name: "Beacon"
          ops: ["Tachanka", "Smoke", "Aruni", "Mira", "Valkyrie"]
          how: "Tachanka anchors Kanzen and denies plants with the DP27; Smoke and Aruni deny vertical from 2F Janitor; Valkyrie reinforces three 1F site walls and cams."
      counters_to_watch: ["Ram opening the Stock floor to cut off the Mira and anchor: keep someone on 2F", "Ash opening Printer and Electrical early for sightlines", "Brava kludging the claw on the Square wall"]
      retake_tips: ["A Staff Room counter plant is hit from Open Area and the Electrical side together", "Tubarao freezes and C4 through head holes stop the defuser", "Do not all rotate up to 2F late; the floor gets cut by Ram"]
    attacker:
      recommended_spawns: ["Back Alley", "Jewelry Front"]
      drone_paths: ["Pre-place drones in Top Square and Stock from Back Alley", "Drone Archives and Lobby to find the Tellers/Archives player", "Drone Printer window for the Mira"]
      entry_points: ["2F Stock and Janitor for vertical", "Square (Skylight Stairwell)", "Printer and Electrical windows", "Lobby into Open Area"]
      hard_breach_targets: ["Staff Room exterior wall", "Square wall into Open Area", "Stock and Janitor hatches if left reinforced"]
      plant_spots: ["Behind the Staff Room kitchen counter", "Open Area by the Printer side after a Square breach"]
      recommended_ops: ["Ace", "Brava", "Ram", "Ash", "Nomad", "Buck", "Thatcher"]
      utility_priorities: ["Win 2F Stock and Top Square, then Ram the Stock floor", "Brava kludge the claws, Ash opens Printer and Electrical", "Flank watch on Main Stairs, Square and bottom Blue"]
      plan_summary: "Take 2F above site first, Ram the floor to deny the anchors, open Printer for lines and breach the Staff Room wall with Ace. Plant behind the counter."
      executes:
        - name: "Stock and Top Square, Ram the floor, burn Square"
          ops: ["Ace", "Brava", "Ram", "Ash", "Nomad"]
          how: "Back Alley. Clear 2F, Ram opens the Stock floor, Ash opens Printer and Electrical, Brava kludges claws; Ace hits Staff Room and the team plants behind the counter."
        - name: "Janitor rush"
          ops: ["Blitz", "Glaz", "Capitao", "Nomad", "Lion"]
          how: "Capitao smoke bolt on Janitor; Blitz and Glaz take it with thermal, Capitao rappels to Square and breaches, Nomad plays Archives and Lion holds Square."
      key_kills: ["2F Janitor and Stock players before going vertical", "Archives/Tellers player fighting the Stock hatch", "Kanzen Tachanka or the Staff Room anchor (check through Printer)"]
      post_plant: ["Plant behind the Staff Room counter and hold from the Ram hole above", "Keep one on Main Stairs and one on bottom Blue for flanks", "Hold the Printer window line from outside"]
    common_mistakes: ["Defenders forgetting to reinforce both 2F hatches before the Square wall", "Attackers breaching before killing the 2F denial players"]
    uncertain: ["Hatch names (Stock hatch, Janitor hatch to Admin) are stratbook callouts", "Kanzen is a team callout, not an official room name"]
    video_insights:
      - creator: "Garfieldisdoc"
        url: "https://www.youtube.com/watch?v=1qCEYZwQzes&t=428"
        side: attack
        points:
          - "Win 2F first: pre-place drones for Top Square and the CEO rappel; expect a Stock door player, a back-elevator player and a Conference floater."
          - "Bring Gridlock or Nomad to lock the Lobby and Marble flanks while the 2F players work the floor."
          - "Go vertical through the Stock floor onto the Mira and open the Stock hatch so you can drop when needed."
          - "Drone Archives at the same time; if someone is there, open vertical on them from CEO. Open the Janitor hatch for more lines."
          - "Watch the bottom Blue drop, then open the bottom Square wall; the far-side player and the B chassis tuck are what's left."
          - "Open the Printer window at round start for phantom pressure and play it late."
          - "If the Square wall can't be opened, keep the vertical, push the E2 side (expect Tellers' Office feet holes), drop the hatch and plant near it."
          - "Expect this site to take the whole round to reach a plant."
  - id: tellers_archives
    name: "1F Tellers' Office / 1F Archives"
    aliases: ["1F Archives / 1F Tellers' Office", "Tellers", "Archives", "Tellers Office"]
    floor: 1F
    defender:
      reinforce: ["Archives to Square wall, both panels, clawed", "Tellers' Office to hallway, Lobby side and E2 side", "2F Janitor hatch to Admin", "2F CEO to Top Square and CEO to Janitor walls", "Flex: the Lobby hatch into B Vault"]
      rotates: ["Archives / Admin / Open Area rotate stays open", "Feet holes into Tellers' Office and Tellers", "Head hole in the Tellers to Lobby wall", "Noor cuts three floor holes over site from 2F CEO"]
      anchor_spots: ["Archives shelves off the Square wall", "Tellers' Office behind the counters", "Executive Lounge above site (Castle) for vertical"]
      roam_areas: ["Lobby, falling back to Open Area (Caveira)", "2F CEO and Lounge holding vertical", "Square to fight the Archives wall take"]
      key_utility: ["Kaid claws on the Archives Square wall", "Castle panels on the Plaza windows", "Maestro Evil Eyes in Tellers and Archives", "Noor plant denial through the CEO floor"]
      recommended_ops: ["Noor", "Castle", "Kaid", "Maestro", "Caveira", "Mira"]
      plan_summary: "Rare pick: hold vertical from CEO and Lounge over a clawed Archives wall, Maestro cams on both rooms, and a Lobby roamer who falls back to Open Area."
      setups:
        - name: "CEO vertical hold"
          ops: ["Noor", "Castle", "Kaid", "Maestro", "Caveira"]
          how: "Kaid claws Archives to Square, Noor holds CEO and lances through the floor, Castle panels Plaza windows and plays Lounge, Maestro cams both rooms, Caveira holds Lobby."
      counters_to_watch: ["Buck from Executive Lounge shooting down into Tellers' Office", "Ace on the reinforced Tellers' Office wall from Lobby", "Gridlock clearing Admin to cut the rotate"]
      retake_tips: ["There is no rotate next to the default plant; retake from 2F holes and Archives together", "Maestro shoots the planter through bulletproof glass"]
    attacker:
      recommended_spawns: ["Boulevard", "Jewelry Front"]
      drone_paths: ["Drone Lobby, Lobby stairs and E2", "Drone 2F Executive Lounge for the vertical player"]
      entry_points: ["Lobby", "Square side into Archives", "2F Executive Lounge for vertical"]
      hard_breach_targets: ["Tellers' Office wall from Lobby", "Archives to Square wall"]
      plant_spots: ["Behind the bulletproof projector unit in Tellers' Office", "Archives after the Square wall is open"]
      recommended_ops: ["Ace", "Thatcher", "Buck", "Zero", "Gridlock"]
      utility_priorities: ["Take Executive Lounge for vertical early", "Zero cams on Lobby stairs, E2 and Main Stairs", "Gridlock Trax in Admin and Open Area"]
      plan_summary: "Take Lobby and Executive Lounge, play Buck vertical onto Tellers' Office, then Ace opens the Tellers' wall from Lobby and you plant behind the projector."
      executes:
        - name: "Lobby take with Executive Lounge vertical"
          ops: ["Ace", "Thatcher", "Buck", "Zero", "Gridlock"]
          how: "Win Lobby, Buck takes Lounge and opens the floor over Tellers' Office, Thatcher and Ace open the Tellers' wall, Gridlock clears Admin and holds Open Area."
      key_kills: ["Lobby roamer before stepping off Boulevard", "Executive Lounge vertical player", "E2 feet-hole player and Main Stairs defender"]
      post_plant: ["Plant behind the projector, hold from Lobby and the Lounge floor holes", "Watch E2 and Main Stairs for the Open Area rotate"]
    common_mistakes: ["Attackers ignoring the E2 feet holes", "Defenders conceding Executive Lounge vertical for free"]
    uncertain: ["Only one defense and one attack source found; rarely played site", "Projector plant spot comes from a voice-over source"]
    video_insights:
      - creator: "Garfieldisdoc"
        url: "https://www.youtube.com/watch?v=1qCEYZwQzes&t=698"
        side: attack
        points:
          - "Rarely attacked; the two areas that matter are 1F Open Area and Top Square."
          - "Open the Electrical closet and the Printer window early for phantom pressure, then drone how Open Area is held."
          - "A player sitting back in Open Area gets pushed out by a teammate going vertical from above; avoid popping that hatch since it enables late flanks."
          - "After Open Area, go through Admin and open the Archives walls; if they reinforced 2F, often only the last wall is hard."
          - "Hold Top Square during the execute: with bottom Blue it is the only flank. Watch for C4 through the head holes."
          - "Old-school option: win ATMs in Lobby and breach the Lobby desk wall, but the E2 feet holes and a Marble stairs player make it rough; smoke an off-site plant."
  - id: cctv_lockers
    name: "B CCTV Room / B Lockers"
    aliases: ["B Lockers / B CCTV Room", "Lockers", "CCTV", "Basement"]
    floor: basement
    defender:
      reinforce: ["CCTV to Server wall, both panels, clawed by Kaid", "Open Area hatch and Elevator hatch", "Admin hatch (claw it)", "Lockers to Vault Entrance, two panels", "Loading Dock to Lockers Hallway"]
      rotates: ["Lockers to CCTV through Red Hallway stays open", "Lobby hatch into Vault left open but watched", "Hold the CCTV hatch soft for about 20 s, then decide"]
      anchor_spots: ["Deep Lockers watching Red Hallway (Tachanka DP27)", "CCTV behind the desks off the Server wall", "Vault Entrance crossfire onto Lockers"]
      roam_areas: ["Server and Square to delay the Sewer take (Vigil)", "Long Desk and Marble on 1F", "Garage ramp and Tunnel"]
      key_utility: ["Kaid claws on the Server wall and Admin hatch", "Mira windows on Red Hallway to CCTV and the Lockers south wall", "Wamai Mag-NETs in CCTV and Lockers Hallway", "Smoke gas on the CCTV plant"]
      recommended_ops: ["Kaid", "Mira", "Smoke", "Wamai", "Vigil", "Echo", "Mute", "Tachanka"]
      plan_summary: "Claw the Server wall and both hatches, Mira on Red Hallway, Smoke gasses the plant. One roamer delays the Server take; the Lobby hatch is watched, not reinforced."
      setups:
        - name: "Server wall claw"
          ops: ["Kaid", "Mira", "Smoke", "Wamai", "Vigil"]
          how: "Kaid claws CCTV-Server and the Admin hatch, Wamai reinforces Open Area and Elevator hatches and nets CCTV. Mira windows Red Hallway, Vigil delays Server from Square."
        - name: "DZ Tachanka Lockers"
          ops: ["Tachanka", "Smoke", "Fenrir", "Valkyrie", "Tubarao"]
          how: "Tachanka anchors Lockers on Red Hallway; Tubarao denies from Staff Room above with C4; Fenrir mines and Valkyrie cams the rest."
        - name: "Lasagna"
          ops: ["Echo", "Vigil", "Mute", "Smoke", "Kaid"]
          how: "Echo plays Yokai from below, Vigil fakes Long Desk, Mute shoots drones in Marble and jams 1F, Smoke wires the stairs."
      counters_to_watch: ["Server take through the Sewer into the CCTV wall plus Hibana on the Admin hatch", "Thatcher EMP timing on the claws; re-claw the second wall if you can", "Grim and Blitz down the Server stairs with Deimos up Tunnel"]
      retake_tips: ["A CCTV plant tight to the Server wall is retaken from Red Hallway and Lockers with Smoke gas first", "Echo Yokai can deny the defuser from the ceiling", "Wamai nets stop the nade clears on your retake path"]
    attacker:
      recommended_spawns: ["Jewelry Front", "Back Alley"]
      drone_paths: ["Sewer drone into Server and Server Room Stairs", "Garage ramp drone into Tunnel and Vault Entrance", "Lobby drone for the hatch players"]
      entry_points: ["Sewer manhole into Server", "Server Room Stairs from Square", "Garage ramp and Tunnel", "Admin and Lobby hatches from 1F"]
      hard_breach_targets: ["CCTV to Server wall", "Admin hatch over CCTV", "Lockers walls from Vault Entrance"]
      plant_spots: ["CCTV tight to the Server wall", "Lockers after a Red Hallway clear"]
      recommended_ops: ["Ace", "Thatcher", "Hibana", "Nomad", "Iana", "Grim", "Deimos"]
      utility_priorities: ["Thatcher EMP the Server wall, then the Admin hatch", "Nomad Airjabs on Square and Server Room Stairs", "Iana Gemini to clear the plant corner"]
      plan_summary: "Take Server through the Sewer, EMP and open the CCTV wall with Ace while Hibana opens the Admin hatch for vertical. Plant tight to the Server wall."
      executes:
        - name: "Server take into CCTV wall plus Admin hatch"
          ops: ["Ace", "Thatcher", "Hibana", "Nomad", "Iana"]
          how: "Jewelry Front through the Sewer. Thatcher EMPs Server wall then Admin hatch, Ace opens CCTV, Hibana opens the hatch to shoot down, Nomad holds Server stairs, Iana plants."
        - name: "Blue Cheese split"
          ops: ["Blitz", "Grim", "Deimos", "Twitch", "Thatcher"]
          how: "Blitz goes down Server stairs with Grim behind, Deimos pushes up Tunnel at the same time, Twitch opens the back wall, plant behind Blitz."
      key_kills: ["Square and Server stairs roamer (Vigil) before the Sewer take", "Server step and Garage stackers", "Lobby hatch watcher from 1F", "Red Hallway Mira or Tachanka lines before planting"]
      post_plant: ["Plant tight to the Server wall in CCTV and hold from Server and the Admin hatch", "Cross Red Hallway from the breach and keep Square watched"]
    common_mistakes: ["Defenders over-rotating to Garage and leaving Server open", "Attackers forgetting the Lobby hatch drops into Vault"]
    uncertain: ["Lobby hatch into Vault is from a 2021 change; confirm it is still in the current version"]
    video_insights:
      - creator: "Garfieldisdoc"
        url: "https://www.youtube.com/watch?v=1qCEYZwQzes&t=963"
        side: attack
        points:
          - "Bring a hard breacher, a shield and Twitch; Twitch counters the Mira and Goyo setups here."
          - "First win Server; if nobody holds Server or Blue, go straight to opening the Server-side walls and aim to plant tight to the wall."
          - "Against Mira, Tachanka, Smoke or Goyo canisters, start the plant and cancel repeatedly to bait out their utility."
          - "A second group takes Printer, drones it clear, then EMPs and Hibanas the reinforced, barricaded 1F hatches over site."
          - "Those hatch angles pop Goyo canisters, force out the Vault Entrance player and cover the Red Hallway rotate even late in the round."
          - "If the Mira wins, someone drops the hallway hatch to kill it or cut the Garage head-holes player."
          - "With man advantage, walk a player down the Marble stairs to cut defenders off."
          - "Twitch pushes Garage late, after drones pop the utility: defenders leave Garage once nobody attacks it early."
          - "Shoot every cam, not just Garage: from Jewelry Front you can hit the Lobby cam and, from the Sewer corner, the Top Square cam; the E2 cam is bangable from the rappel."
general:
  attack: ["Boulevard and Jewelry Front have near-instant Lobby runouts; drone Lobby and the Quad before walking", "Back Alley for 2F and 1F Stock/Top Square takes; Jewelry Front Sewer for basement", "Win Stock and Top Square on 2F before any 1F or 2F execute", "Roamers to clear: Stock, Terrace, Square, Long Desk, Marble"]
  defense: ["Spawn peeks from Lobby onto Boulevard are fast but known; one rifler only", "Common roams: Vigil Stock-Terrace-Skylight, Caveira 2F then Archives, Vigil fake at Long Desk for basement", "Always watch or reinforce the Lobby hatch into Vault on basement"]
