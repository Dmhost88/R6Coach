general:
  attack:
    - "Two floors only: whoever owns 2F over a 1F site wins it. Clear Office over Mechanic/Kitchen and Dorms over the Bedrooms first."
    - "Three stairs link floors: Garage Stairs, Shark Stairs, Motel Stairs (plus Yellow). Watch whichever you aren't using."
    - "Restaurant, Mezzanine and Garage Lounge are the common roamer spots; drone them before crossing open yard."
    - "Fuel Pumps spawn crosses open forecourt; Restaurant and Convenience Store windows see it."
  defense:
    - "Restaurant and 2F motel windows are the usual spawn-peek spots onto Fuel Pumps and Storage Yard; peek once then reposition."
    - "Games is a 30-second drone-kill roam for 2F sites; fall back through Bull before attackers commit."
    - "Leave rotate holes through the middle of shared walls; reinforce the ends that face breaches."
    - "Wire top of Yellow Stairs: since Y11S3.2 barbed wire also stops Ram BU-GIs."
