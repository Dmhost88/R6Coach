      counters_to_watch:
        - "Reptile Hallway and Reception take."
      retake_tips:
        - "Burn the plant from above."
    attacker:
      recommended_spawns: ["Fuel Pumps"]
      drone_paths:
        - "Drone Reception and Reptile Hallway first."
        - "Drone Office above for Pulse/Noor."
        - "Look for Jäger ADS behind the Restaurant bar."
      entry_points:
        - "Reception, then Waiting."
        - "Reptile Hallway onto the Kitchen side."
        - "Restaurant behind the bar."
        - "Office above for vertical."
      hard_breach_targets:
        - "Mechanic Shop to Waiting walls (Kaid claws)."
        - "Restaurant wall behind the bar."
      plant_spots:
        - "Kitchen by the Waiting crouch rotate."
        - "Mechanic Shop away from the hatch above."
      recommended_ops: ["Thermite", "Hibana", "Thatcher", "Buck", "Sledge", "Kali", "Ash"]
