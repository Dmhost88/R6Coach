id: outback
name: Outback
aliases: ["Outback", "OUTBACK"]
floors: [1F, 2F, roof]
# Layout: June 2026 update was visual only. Checked against Y11S3.2 guides (siegestrats.com, alyttleton/SAS5Y/Garfieldisdoc).
attacker_spawns:
  - name: "Fuel Pumps"
    notes: "Service station front, toward Restaurant, Mechanic Shop and Kitchen. siegestrats lists it as 'Fuel Pumps'."
  - name: "Storage Yard"
    notes: "Storage yard side; good for Garage and the Party/Office side."
  - name: "Camping"
    notes: "Camping side, toward the motel bedrooms and Motel Stairs; name not verified."
sites:
  - id: piano_room_laundry_room
    name: "2F Piano Room / 2F Laundry Room"
    aliases: ["2F Laundry Room / 2F Piano Room", "Piano Room / Laundry", "2F Piano Room / 2F Laundry", "Piano", "Laundry"]
    floor: 2F
    defender:
      reinforce:
        - "Both Dorms breach walls (Tubarão freeze)."
        - "Laundry bomb-side single wall."
        - "Bathroom wall, right side."
        - "Piano wall beside the bomb."
        - "Both Picnic walls."
        - "Games vault wall and second wall."
        - "Bull long-angle wall."
      rotates:
        - "Small middle rotate between Laundry and Piano."
        - "Piano hatch left open as a drop."
      anchor_spots:
        - "Laundry washer (Tubarão)."
        - "Piano box (Fenrir)."
      roam_areas:
        - "Garage early, killing drones (Vigil)."
        - "Bull fallback."
      key_utility:
        - "Thorn wire and Razorbloom at top of Yellow Stairs."
        - "Tubarão freeze on the Dorms breach."
        - "Aruni gates on Bull and Picnic doors."
      recommended_ops: ["Tubarão", "Thorn", "Fenrir", "Aruni", "Vigil", "Kaid", "Mute"]
      plan_summary: "Trap Yellow Stairs, freeze the Dorms breach, and rotate through the middle."
      setups:
        - name: "Yellow Stairs lock"
          ops: ["Tubarão", "Thorn", "Fenrir", "Aruni", "Vigil"]
          how: "Thorn traps top Yellow, Tubarão freezes Dorms breach, Fenrir mines Picnic and Games, Aruni gates Bull and Picnic."
      counters_to_watch:
        - "Ram BU-GIs on Yellow: barbed wire now catches them (Y11S3.2)."
        - "Dorms breach: Tubarão freeze."
      retake_tips:
        - "Retake via the middle rotate and Piano hatch."
    attacker:
      recommended_spawns: ["Camping", "Storage Yard"]
      drone_paths:
        - "Drone Yellow Stairs and Dorms."
        - "Drone Garage."
      entry_points:
        - "Yellow Stairs."
        - "Dorms."
        - "Picnic."
        - "Bull."
      hard_breach_targets:
        - "Dorms breach walls."
      plant_spots:
        - "Laundry."
        - "Piano Room."
      recommended_ops: ["Thermite", "Hibana", "Thatcher", "Ash", "Buck"]
      utility_priorities:
        - "Clear Thorn traps at Yellow."
      plan_summary: "Take Dorms and Yellow, breach and plant."
      executes:
        - name: "Dorms breach"
          ops: ["Thermite", "Thatcher", "Ash", "Buck", "Iana"]
          how: "Take Dorms, Thatcher on walls, Thermite opens."
      key_kills:
        - "Vigil roaming Garage."
      post_plant:
        - "Plant Laundry, hold from Dorms."
    common_mistakes:
      - "Rushing Yellow into traps."
    uncertain:
      - "Room order on selection screen not verified."
  - id: party_room_office
    name: "2F Party Room / 2F Office"
    aliases: ["2F Office / 2F Party Room", "Party Room / Office", "Party Room", "Office"]
    floor: 2F
    defender:
      reinforce:
        - "Middle two walls of Party to Bull."
        - "One wall on the Party/Office quad."
        - "Both walls of the Office Supplies breach (Kaid claw)."
        - "Right wall on Supply to Garage Lounge."
        - "Both lower Garage walls."
        - "Both walls on Bull to Games Room."
      rotates:
        - "Garage rotate."
        - "Outer Party walls left soft for Bull peeks."
      anchor_spots:
        - "Party (Mute)."
        - "Supply corner (Kaid)."
        - "Garage Stairs (Frost)."
      roam_areas:
        - "Games, Showers, Laundry (Vigil)."
      key_utility:
        - "Kaid claws on the Supply breach."
        - "Frost mats on Garage Stairs."
        - "Valkyrie cams in hatch pipes."
      recommended_ops: ["Mute", "Valkyrie", "Kaid", "Frost", "Vigil"]
      plan_summary: "Lock Garage and Supply breaches, leave outer Party walls soft for Bull peeks."
      setups:
        - name: "Ten-wall Garage lock"
          ops: ["Mute", "Valkyrie", "Kaid", "Frost", "Vigil"]
          how: "Kaid claws Supply breach, Frost mats Garage Stairs, Mute holds Party, Vigil roams Games."
      counters_to_watch:
        - "Supply breach: Kaid claws."
        - "Garage Stairs push: Frost mats."
      retake_tips:
        - "Retake via Bull."
    attacker:
      recommended_spawns: ["Storage Yard", "Fuel Pumps"]
      drone_paths:
        - "Drone Garage Stairs for Frost mats, then Garage Lounge."
        - "Drone Games and Showers early; Vigil roams there for the first 30 s."
        - "Find Valkyrie cams in the hatch pipes and Office beam."
      entry_points:
        - "Garage Stairs into Garage Lounge."
        - "Office Supplies breach."
        - "Bull, via Games."
        - "Soft outer Party walls (defenders leave them soft to peek)."
      hard_breach_targets:
        - "Both Office Supplies breach walls (Kaid claws)."
        - "Lower Garage walls."
      plant_spots:
        - "Office by the Supplies breach."
        - "Party Room near the Bull wall."
      recommended_ops: ["Thermite", "Hibana", "Thatcher", "Kali", "Ash", "Buck", "Iana"]
      utility_priorities:
        - "Thatcher or Kali on Supply claws before Thermite."
        - "Clear Frost mats on Garage Stairs with Ash or a frag."
        - "Shoot Mute jammers on the drone hole so drones can enter Party."
      plan_summary: "Kill Vigil and take Garage Lounge, clear claws on the Supply breach, then breach Office while one player pressures Bull."
      executes:
        - name: "Supply breach"
          ops: ["Thermite", "Thatcher", "Ash", "Buck", "Iana"]
          how: "Take Garage Lounge, Thatcher pops claws, Thermite opens the Supplies breach; Buck opens soft Party walls to punish Bull peekers."
        - name: "Bull and Garage pinch"
          ops: ["Hibana", "Kali", "Zofia", "Nomad", "Gridlock"]
          how: "Two push Games to Bull while three hit Garage Stairs; Nomad covers the Garage rotate."
      key_kills:
        - "Vigil in Games/Showers/Laundry."
        - "Frost on Garage Stairs."
        - "Bull peeker through soft Party walls."
      post_plant:
        - "Plant in Office by the breach, hold from Supply and Garage Lounge."
        - "Watch Bull for the late rotate."
    common_mistakes:
      - "Ignoring Bull peeks through the soft Party walls."
      - "Walking Garage Stairs onto Frost mats."
    uncertain: []
  - id: green_bedroom_red_bedroom
    name: "1F Green Bedroom / 1F Red Bedroom"
    aliases: ["1F Red Bedroom / 1F Green Bedroom", "Green Bedroom / Red Bedroom", "Green Bedroom", "Red Bedroom", "Bedrooms"]
    floor: 1F
    defender:
      reinforce:
        - "Both Closet walls to Reptile Hallway."
        - "Both Red Bedroom walls to Yellow Stairs."
        - "Both Red Bedroom walls to Reptile Hallway."
        - "Both upstairs Dorms outer walls."
      rotates:
        - "Site hatch kept open as upstairs escape."
        - "Closet cabinet vault."
      anchor_spots:
        - "Closet (Bandit)."
      roam_areas:
        - "Upstairs above site (Castle, Pulse)."
      key_utility:
        - "Castle barricades upstairs."
        - "Pulse vertical."
        - "Melusi Banshee on Bathroom window."
      recommended_ops: ["Castle", "Pulse", "Bandit", "Smoke", "Melusi"]
      plan_summary: "Own the floor above the site with Castle and deny plants vertically."
      setups:
        - name: "Castle turtle"
          ops: ["Castle", "Pulse", "Bandit", "Smoke", "Melusi"]
          how: "Castle barricades upstairs, Pulse verts, Bandit anchors Closet."
      counters_to_watch:
        - "Bottom breach plus upstairs vertical."
      retake_tips:
        - "Deny from above."
    attacker:
      recommended_spawns: ["Camping"]
      drone_paths:
        - "Drone upstairs Dorms over the site for Pulse and Castle."
        - "Drone Reptile Hallway and the Bathroom window (Banshee)."
        - "Look for the site hatch: if it's open, defenders escape up it."
      entry_points:
        - "Reptile Hallway walls into Closet and Red Bedroom."
        - "Yellow Stairs side of Red Bedroom."
        - "Upstairs Dorms for vertical and the site hatch."
        - "Bathroom window."
      hard_breach_targets:
        - "Closet / Red Bedroom walls to Reptile Hallway."
        - "Red Bedroom walls to Yellow Stairs."
      plant_spots:
        - "Tucked plant beside the Reptile Hallway breach."
        - "Green Bedroom corner away from the vertical holes."
      recommended_ops: ["Thermite", "Hibana", "Thatcher", "Buck", "Sledge", "Ash", "Zofia"]
      utility_priorities:
        - "Break Castle barricades upstairs with Ash or Zofia."
        - "Kill the Pulse before planting; he shoots plants through the floor."
        - "Thatcher on Bandit batteries in Closet."
      plan_summary: "Push the bottom breach from Reptile Hallway while one or two take upstairs to stop the Castle/Pulse vertical."
      executes:
        - name: "Bottom breach, top split"
          ops: ["Thermite", "Thatcher", "Buck", "Ash", "Iana"]
          how: "Ash and Buck break into upstairs Dorms; Thatcher disables batteries, Thermite opens Reptile Hallway wall."
      key_kills:
        - "Castle and Pulse upstairs."
        - "Closet anchor (Bandit)."
      post_plant:
        - "Plant tucked by the breach, hold from Reptile Hallway and the upstairs holes."
    common_mistakes:
      - "Planting before upstairs is cleared."
    uncertain: []
  - id: mechanic_shop_kitchen
