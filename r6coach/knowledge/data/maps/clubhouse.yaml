id: clubhouse
name: Clubhouse
aliases: ["Clubhouse", "CLUBHOUSE", "Club House"]
floors: [basement, 1F, 2F, roof]
attacker_spawns:
  - name: "Main Gate"
    notes: "Front gate toward Garage and Main Entrance. Near-instant runouts from the front lobby. Some lists call it Main Entrance."
  - name: "Shipping Docks"
    notes: "Side spawn by the docks and rear of the building; Bar and Stock Room side."
  - name: "Warehouse"
    notes: "Behind the warehouse; basement and Church side. Defenders peek toward Warehouse top when holding CCTV or Cash."
  - name: "Construction Site"
    notes: "Construction side. Default for roof, Logistic Office, Jacuzzi and the 2F CCTV/Cash and Gym pushes."
sites:
  - id: gym_bedroom
    name: "2F Gym / 2F Bedroom"
    aliases: ["2F Bedroom / 2F Gym", "Gym", "Bedroom"]
    floor: 2F
    defender:
      reinforce: ["Both Jacuzzi exterior walls, clawed", "Construction panel right of the rotate (Mira window)", "Outer Construction single and the Logistic Office single", "Gym panel by the rotate", "Two Cash walls nearest the site and two CCTV walls nearest Cash"]
      rotates: ["Bedroom to Gym feet holes", "Mid-wall vault rotate", "Construction rotate", "Cash to top Red rotate with a shield at top Red"]
      anchor_spots: ["Bedroom from the Construction-side rotate (Tubarao)", "Logistic Office with C4 (Kaid)", "Gym behind the weights"]
      roam_areas: ["Cash extension until 1:30 (Thorn)", "Logistic Office and roof hatch", "Construction and Main stairs"]
      key_utility: ["Kaid claws on the Jacuzzi walls", "Mira window on the Construction panel", "Castle shooting feet through the holes", "Thorn traps in Cash"]
      recommended_ops: ["Kaid", "Tubarao", "Castle", "Thorn", "Mira", "Melusi", "Goyo"]
      plan_summary: "Claw the Jacuzzi walls, Mira the Construction panel, and use the Bedroom-Gym feet holes for crossfires. Extend into Cash until 1:30 and hold Logistic Office with C4."
      setups:
        - name: "Gym feet-hole trap"
          ops: ["Kaid", "Tubarao", "Castle", "Thorn", "Mira"]
          how: "Kaid holds Logistic with C4 and claws Jacuzzi, Tubarao plays Bedroom from the Construction rotate, Castle shoots feet through holes, Thorn extends into Cash, Mira windows Construction."
        - name: "Slim Jim"
          ops: ["Clash", "Melusi", "Goyo", "Mira", "Smoke"]
          how: "Clash in Bedroom on the main door, Melusi Banshees the hallways, Goyo Volcans on doors, Mira window on the Construction side."
      counters_to_watch: ["Grim dropping through the Logistic hatch", "Ace stacking charges on the Jacuzzi wall after Thatcher", "Gridlock opening the roof hatch"]
      retake_tips: ["Retake a Gym half-wall plant from Bedroom feet holes and top Red", "Keep C4 for the weights plant"]
    attacker:
      recommended_spawns: ["Construction Site"]
      drone_paths: ["Drone Logistic Office through the roof hatch", "Drone Jacuzzi and Bedroom from Construction", "Drone Cash for the extender"]
      entry_points: ["Jacuzzi wall", "Logistic Office roof hatch", "Construction rotate", "Main stairs to top Red"]
      hard_breach_targets: ["Jacuzzi exterior wall", "Bathroom wall into Bedroom"]
      plant_spots: ["Gym half wall by the weights"]
      recommended_ops: ["Ace", "Thatcher", "Grim", "Zofia", "Gridlock", "Capitao"]
      utility_priorities: ["Thatcher EMPs the Jacuzzi claws", "Gridlock opens the roof hatch and Traxes Construction and Main", "Zofia impacts the window panels"]
      plan_summary: "Drop Logistic from the roof, EMP and open the Jacuzzi wall then the Bathroom wall, and plant on the Gym half wall."
      executes:
        - name: "Logistics drop, Jacuzzi wall"
          ops: ["Ace", "Thatcher", "Grim", "Zofia", "Gridlock"]
          how: "Construction Site. Thatcher EMPs Jacuzzi, Ace opens it then Bathroom, Grim drops Logistic hatch, Zofia opens window panels, Gridlock Traxes Construction and Main; plant on the half wall."
        - name: "Logi smoke"
          ops: ["Capitao", "Sens", "Hibana", "Ace", "Thatcher"]
          how: "Capitao smokes Logistic, Sens walls into Gym, Hibana and Ace open the south and west walls."
      key_kills: ["Logistic Office anchor", "Cash extender (Thorn)", "Bedroom shield or Tubarao on the rotate"]
      post_plant: ["Hold the half-wall plant from Jacuzzi and Logistic", "Trax on Main stairs for the top Red rotate"]
    common_mistakes: ["Attackers breaching Jacuzzi with Cash still held", "Defenders leaving the roof hatch uncontested"]
    uncertain: ["2F panels have no in-game names; panel references are from stratbooks"]
  - id: cctv_cash_room
    name: "2F CCTV Room / 2F Cash Room"
    aliases: ["2F Cash Room / 2F CCTV Room", "CCTV", "Cash", "Cash Room"]
    floor: 2F
    defender:
      reinforce: ["Two CCTV exterior panels (Bandit trick)", "Cash to Construction Connector, both panels", "All four Garage door panels", "Trash to Connector", "Server panel facing Garage Rafters and the two Server roof panels"]
      rotates: ["Two crouch rotations between CCTV and Cash", "Master/Gym extension rotate stays open"]
      anchor_spots: ["Cash Room deep corner", "CCTV desk off the exterior wall", "Garage Rafters zombie (Jager)"]
      roam_areas: ["Garage Rafters and Garage stairs", "Master/Gym", "Construction and roof"]
      key_utility: ["Bandit batteries on the CCTV exterior", "Mira window on Eastern Stairs", "Lesion mines on both stairs", "Goyo canisters on Garage stairs, top of stairs and the plant"]
      recommended_ops: ["Bandit", "Mira", "Jager", "Lesion", "Valkyrie", "Goyo", "Azami"]
      plan_summary: "Trick the CCTV exterior, reinforce the Garage door panels, and lock Garage Rafters. Lesion and Goyo stall the stairs while Valkyrie cams roof and Construction."
      setups:
        - name: "Wall trick, Rafters lock"
          ops: ["Bandit", "Mira", "Jager", "Lesion", "Valkyrie"]
          how: "Bandit tricks CCTV exterior, Mira windows Eastern Stairs, Jager holds Garage stairs from Rafters, Lesion mines both stairs, Valkyrie cams roof, Construction and Garage."
        - name: "Goyo chain"
          ops: ["Goyo", "Azami", "Melusi", "Mira", "Bandit"]
          how: "Goyo canisters on Garage stairs, top of stairs and the plant, popped in order; Azami holds Rafters, Melusi fights Master, Mira windows the CCTV exterior."
      counters_to_watch: ["Garage floor first, then Thermite on the main Cash wall", "Montagne walking up to Rafters (weak now that Noor burns shields)", "CCTV window hop with a corner plant"]
      retake_tips: ["Retake a breach plant from Lounge and the crouch rotations together", "Save Goyo canister for the tucked breach plant"]
    attacker:
      recommended_spawns: ["Construction Site", "Main Gate"]
      drone_paths: ["Drone the Garage floor and Rafters", "Drone CCTV from the roof", "Drone Construction Connector"]
      entry_points: ["Garage and Garage stairs", "Main Cash wall", "CCTV window", "Construction Connector"]
      hard_breach_targets: ["Main Cash wall", "CCTV exterior panels"]
      plant_spots: ["Tucked beside the Cash breach", "CCTV corner after a window hop"]
      recommended_ops: ["Thermite", "Thatcher", "Capitao", "Zofia", "Glaz", "Striker"]
      utility_priorities: ["Clear the Garage floor first", "EMP the main Cash wall and save one EMP for Rafters", "Capitao opens the bottom of Garage"]
      plan_summary: "Clear the Garage floor, take Rafters, EMP and burn the main Cash wall, then plant tucked beside the breach and hold Lounge."
      executes:
        - name: "Garage first, main wall"
          ops: ["Thermite", "Thatcher", "Capitao", "Zofia", "Montagne"]
          how: "Clear the Garage floor with Capitao, push Rafters, Thatcher EMPs and Thermite burns the main Cash wall; plant tucked by the breach and hold Lounge."
        - name: "Smoked Chedda"
          ops: ["Thermite", "Striker", "Blitz", "Glaz", "Thatcher"]
          how: "Thermite burns the east wall, Striker breaches the top-left wall, Blitz pushes west with Glaz thermal through smokes."
      key_kills: ["Garage Rafters zombie", "Stair Lesion and the Eastern Stairs Mira", "Warehouse-side spawn peekers"]
      post_plant: ["Hold Lounge and the breach; keep one EMP for Rafters", "Watch the Master/Gym rotate"]
    common_mistakes: ["Attackers burning Cash before clearing Rafters", "Defenders peeking Warehouse every round"]
    uncertain: ["Goyo chain source contradicts itself on the bottom Garage walls"]
  - id: bar_stock_room
    name: "1F Bar / 1F Stock Room"
    aliases: ["1F Stock Room / 1F Bar", "Bar", "Stock Room", "Stock", "Bar / Stage"]
    floor: 1F
    defender:
      reinforce: ["Two outer Strip Club walls and the wall by the back-Strip feet holes", "Two Kitchen-hallway walls", "Two Stage walls", "Main Stock exterior wall (clawed)", "2F hatch away from Gym and the Gym wall"]
      rotates: ["Strip Club to site rotate", "Back-Strip feet holes", "Bar head holes", "Gym-side hatch over Stage left open"]
      anchor_spots: ["Behind the bar by the bar machine", "Stock Room shelves", "Gym above for vertical (Pulse)"]
      roam_areas: ["Strip Club extension", "Basement then flank Blue around 1:15 (Caveira)", "Gym and Construction window above"]
      key_utility: ["Kaid claw on the Stock exterior", "Castle panels on Kitchen hallway doors", "Maestro Evil Eyes on the plant", "Pulse C4 through the Gym hatch"]
      recommended_ops: ["Castle", "Kaid", "Maestro", "Pulse", "Caveira"]
      plan_summary: "Extend into Strip Club, claw the Stock wall, and keep one Gym hatch open so Pulse can play vertical. Caveira roams basement and flanks Blue."
      setups:
        - name: "Strip extension with Gym lid"
          ops: ["Castle", "Kaid", "Maestro", "Pulse", "Caveira"]
          how: "Kaid claws Stock, Castle panels Kitchen hallway, Maestro cams the plant, Pulse plays Gym over the open hatch, Caveira roams basement and flanks Blue at 1:15."
      counters_to_watch: ["Buck taking Gym and opening the floor over Bar", "Hibana on the main Stock wall", "Ash breaking the Strip panels"]
      retake_tips: ["Retake the bar-machine plant from Strip and the Gym hatch", "Maestro shoots the defuser through the bar"]
    attacker:
      recommended_spawns: ["Shipping Docks", "Construction Site"]
      drone_paths: ["Pre-place drones in Garage and Lounge", "Drone Gym for the vertical player", "Drone Strip Club"]
      entry_points: ["Gym floor above", "Main Stock wall", "Strip Club", "Blue stairs"]
      hard_breach_targets: ["Main Stock exterior wall", "Floor over Bar from Gym"]
      plant_spots: ["Behind the bar by the bar machine"]
      recommended_ops: ["Hibana", "Thatcher", "Buck", "Ash", "Nomad"]
      utility_priorities: ["Buck takes Gym and opens the floor", "Hibana opens Stock", "Nomad Airjab on Blue"]
      plan_summary: "Take Gym above, open the floor over Bar, Hibana breaches Stock and Ash opens Strip panels. Plant behind the bar."
      executes:
        - name: "Gym first, Stock burn"
          ops: ["Hibana", "Thatcher", "Buck", "Ash", "Nomad"]
          how: "Buck takes Gym and opens the floor over Bar, Hibana opens Stock after Thatcher, Ash breaks Strip panels, Nomad jabs Blue; plant behind the bar."
      key_kills: ["Gym vertical player", "Strip Club extender", "Caveira flanking Blue"]
      post_plant: ["Hold the bar plant from Gym holes and the Stock breach", "If stalled, pinch from Strip"]
    common_mistakes: ["Attackers ignoring the Construction window vertical", "Defenders reinforcing both hatches and losing vertical"]
    uncertain: ["Ubisoft may label this site Bar / Stage", "Sources disagree on the 2F hatches: one reinforced and one open is a compromise"]
