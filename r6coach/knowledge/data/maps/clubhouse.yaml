    name: "B Church / B Arsenal Room"
    aliases: ["B Arsenal Room / B Church", "Church", "Arsenal", "Basement"]
    floor: basement
    defender:
      reinforce: ["Church to Memorial wall, three panels, clawed", "Escape Tunnel, both panels", "Kitchen, Bar and Stock Room hatches", "Arsenal hallway panel nearest Central Stairs", "Church panel behind the Blue generator"]
      rotates: ["Moto hatch left open", "Church to Arsenal door", "Church feet holes"]
      anchor_spots: ["Church behind the table", "Arsenal shelves", "Generator corner"]
      roam_areas: ["Kitchen, Bar and Stock above (Vigil)", "Blue and Dirt", "Garage and Oil Pit"]
      key_utility: ["Kaid claws on the Memorial wall", "Jager ADS on Moto, Central Stairs and Blue", "Smoke gas on the Kitchen hatch", "Mira on the Church wall"]
      recommended_ops: ["Kaid", "Mira", "Smoke", "Jager", "Vigil", "Denari", "Castle"]
      plan_summary: "Claw the Memorial wall, reinforce the Kitchen, Bar and Stock hatches, and keep Blue and Dirt contested. The site collapses if attackers get Blue and open hatches for free."
      setups:
        - name: "Church wall lock"
          ops: ["Kaid", "Mira", "Smoke", "Jager", "Vigil"]
          how: "Kaid claws the Memorial wall, Jager ADS covers Moto, Central Stairs and Blue, Smoke gasses the Kitchen hatch, Vigil roams 1F and flanks Blue late."
        - name: "Final Boss"
          ops: ["Denari", "Goyo", "Castle", "Azami", "Smoke"]
          how: "Denari alone on site with tripwires and Church feet holes; Goyo, Castle and Azami take the Stock, Bar and Kitchen hatches; Castle is first back to site."
