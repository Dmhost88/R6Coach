      drone_paths: ["Drone Garage and Oil Pit", "Drone Blue and Dirt", "Drone 1F Kitchen and Bar for hatch players"]
      entry_points: ["Memorial wall", "Kitchen and Bar hatches", "Blue and Central Stairs", "Escape Tunnel"]
      hard_breach_targets: ["Memorial-side Church wall", "Kitchen hatch over Arsenal"]
      plant_spots: ["Behind the Church table", "Arsenal under the Kitchen hatch"]
      recommended_ops: ["Ace", "Thatcher", "Hibana", "Nomad", "Iana", "Striker"]
      utility_priorities: ["EMP the Memorial wall", "Hibana opens the Kitchen hatch", "Nomad clears Garage and Oil Pit and pressures Blue"]
      plan_summary: "Three lanes: Ace breaches the Memorial wall, Hibana opens the Kitchen hatch, Nomad takes Blue. Iana plants behind the Church table."
      executes:
        - name: "Three-lane basement hit"
          ops: ["Ace", "Thatcher", "Hibana", "Nomad", "Iana"]
          how: "Thatcher EMPs and Ace opens Memorial, Hibana opens Kitchen hatch, Nomad clears Garage, Oil Pit and Blue, Iana plants behind the table."
        - name: "Bar Fish"
          ops: ["Ram", "Hibana", "Striker", "Thatcher", "Nomad"]
