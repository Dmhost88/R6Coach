source: Room boxes located by Claude on Ubisoft's official blueprints (grid percentages, x left->right, y top->bottom). Check against data/maps/<map>/preview/.
# Orientation and features added 2026-11-06 from the blueprints. Room fixes the same day (read off the
# images): B Assembly is the south-east room with the objective marker and the breakable outside wall
# (it sits under 1F Storage), Animus the south-west room under the 1F Garage hatch; 2F Command Center
# and Servers swapped to siegestrats' reading (Command Center west with the desks, Servers east, beside
# Connector and holding the 2F hatch); 2F boxes tightened to the drawn walls. Still low confidence.
