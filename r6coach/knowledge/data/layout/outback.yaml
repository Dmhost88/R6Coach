# Orientation and features added 2026-11-06 from the blueprints. Room fixes the same day (read off the
# images): 1F Kitchen/Restaurant swapped (the tiled room with the stove borders Mechanic Shop and Waiting
# through breakable walls, the room with booths is Restaurant); 1F Closet moved under the 2F Piano hatch;
# 1F Bathroom moved to the small room north of the bedrooms (the narrow west room is the Yellow Stairs);
# 2F Piano Room is the room with the hatch next to Laundry; Mechanical Bull is the room with the oval bull
# mat; Party Room the dance-floor room east of it; Office Supplies the narrow strip with the outside breach.
