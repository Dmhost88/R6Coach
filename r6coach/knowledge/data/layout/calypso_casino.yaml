- floor: ROOF
  image: R6S_Maps_CalypsoCasino_Roof.png
  size: [1600, 900]
  notes: 'Fairly confident: this is the last of 4 images and shows the building top-down with rooftops, AC units and the open-air pool terrace.
    None of the listed callouts belong to the roof level, so no rooms are mapped.'
  rooms: {}
