    Blackjack: {box: [57.4, 51.1, 61.5, 64.5], confidence: 0.35}
    Poker: {box: [61.5, 51.1, 66.6, 60.6], confidence: 0.35}
    Lobby: {box: [66.2, 41.6, 73.0, 58.0], confidence: 0.25}
