map: calypso_casino
source: Room boxes located by Claude on Ubisoft's official blueprints (grid percentages, x left->right, y top->bottom). Check against data/maps/<map>/preview/.
# Floor labels fixed 2026-11-06: R6S_Maps_CalypsoCasino_1F.png is the casino floor (red carpets, card
# tables) = 1F, and R6S_Maps_CalypsoCasino_Basement.png (bare concrete, the drill tunnel) = B. The basement
# rooms that sat on the 1F image were re-read off the Basement image; the 2F duplicates that sat on the
# Basement image were dropped. 2F re-read too: Pool is the billiards room in the middle of 2F (the outdoor
# swimming pool is outside the building), Cigar Room is west of it, Kitchen north of Cigar with the
# breakable outside wall, Barista north of Pool with the hatch over Bar, Humidor the small room in Aqua
# with the hatch over Blackjack. 1F rooms added. All names are from guides, not Ubisoft; low confidence.
sides: {top: "Casino street (facade)", left: "Pool Side"}
floors:
- floor: B
  image: R6S_Maps_CalypsoCasino_Basement.png
  size: [1600, 900]
  notes: Bare concrete rooms and the dug tunnel with the drill on the south-east side, so this is the basement. Room names placed from the
    guides' adjacencies (Cash Counting under Bar beside the site, Servers under Janitor); best guesses.
  rooms:
    Servers: {box: [63.5, 23.8, 69.7, 31.5], confidence: 0.3}
    Cash Counting: {box: [63.5, 31.6, 69.7, 38.0], confidence: 0.3}
    Manager's Office: {box: [63.5, 38.2, 67.3, 46.7], confidence: 0.3}
    Vault Checkpoint: {box: [67.3, 38.2, 71.4, 46.7], confidence: 0.3}
    CCTV: {box: [71.4, 38.2, 76.4, 46.7], confidence: 0.3}
    Lockers: {box: [58.9, 38.2, 63.4, 51.0], confidence: 0.25}
    Vault: {box: [63.5, 46.8, 67.0, 51.1], confidence: 0.15}
  features:
    - {kind: stairs, name: "Stairs to 1F Janitor", at: [66.9, 25.3]}
    - {kind: stairs, name: "West stairs (by Lockers)", at: [61.7, 52.8]}
    - {kind: stairs, name: "East stairs (tunnel side)", at: [76.6, 51.5]}
    - {kind: label, name: "Drill tunnel", at: [71.5, 56.0]}
- floor: 1F
  image: R6S_Maps_CalypsoCasino_1F.png
  size: [1600, 900]
  notes: The casino floor (red carpet, card tables), so this is 1F. Rooms placed from guide adjacencies (Blackjack under the Humidor hatch with
